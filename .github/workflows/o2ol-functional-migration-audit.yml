name: O2OL Functional Migration Audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-functional-migration-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm --prefix worker install --no-audit --no-fund
          npx --yes wrangler@latest deploy --dry-run --config wrangler.toml

      - name: Scan for migration blockers
        shell: bash
        run: |
          set -u
          echo '=== LEGACY BACKEND REFERENCES ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' --exclude='*.txt' '(supabase|base44|legacy backend|Edge Functions implementation)' src worker || true
          echo '=== UNIMPLEMENTED FUNCTIONAL STUBS ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist '(TODO: Implement|requires implementation|external AI service)' src worker || true
          echo '=== LOCAL STORAGE USAGE ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist 'localStorage\.' src || true
          echo '=== SESSION STORAGE USAGE ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist 'sessionStorage\.' src || true
          echo '=== EXTERNAL URL REFERENCES ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'https://' src worker | head -250 || true
          echo '=== SOURCE API REFERENCES ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist '/api/' src | head -350 || true
          echo '=== WORKER API REFERENCES ==='
          grep -RIn --exclude-dir=node_modules '/api/' worker | head -400 || true
