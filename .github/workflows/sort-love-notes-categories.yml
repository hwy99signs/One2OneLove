name: Sort Love Notes Categories

on:
  push:
    branches:
      - love-notes-alphabetical-categories
    paths:
      - .github/alpha-sort-trigger

permissions:
  contents: write

jobs:
  sort-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-alphabetical-categories
          fetch-depth: 0
      - name: Sort categories alphabetically by displayed language
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/LoveNotes.jsx')
          text = p.read_text(encoding='utf-8')
          old_start = "const getCategoriesForLanguage = (t) => ["
          new_start = "const getCategoriesForLanguage = (t, lang = 'en') => {\n  const categories = ["
          if old_start not in text:
              raise SystemExit('Expected category helper signature not found')
          text = text.replace(old_start, new_start, 1)
          marker = "];\n\nconst generateNotes = (lang) => {"
          replacement = "];\n  const [allCategory, ...noteCategories] = categories;\n  return [\n    allCategory,\n    ...noteCategories.sort((a, b) => a.name.localeCompare(b.name, lang, { sensitivity: 'base' }))\n  ];\n};\n\nconst generateNotes = (lang) => {"
          if marker not in text:
              raise SystemExit('Expected category helper closing marker not found')
          text = text.replace(marker, replacement, 1)
          old_call = "const categories = getCategoriesForLanguage(t);"
          new_call = "const categories = getCategoriesForLanguage(t, currentLanguage);"
          if old_call not in text:
              raise SystemExit('Expected category helper call not found')
          text = text.replace(old_call, new_call, 1)
          p.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit sorted categories
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Sort Love Notes categories alphabetically"
          git push origin HEAD:love-notes-alphabetical-categories
