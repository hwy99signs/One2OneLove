name: Relaunch Billing Integrity

on:
  push:
    branches:
      - relaunch-homepage
    paths:
      - 'src/lib/stripeService.js'
      - 'src/lib/membershipConfig.js'
      - 'src/pages/Subscription.jsx'
      - 'src/pages/PremiumFeatures.jsx'
      - 'src/pages/PaymentSuccess.jsx'
      - 'supabase/functions/create-checkout-session/**'
      - 'supabase/functions/create-billing-portal-session/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/migrations/*membership*.sql'
      - 'supabase/migrations/*payment*.sql'
      - 'scripts/relaunch-billing-reconciliation-check.mjs'
      - 'scripts/relaunch-membership-i18n-check.mjs'
      - 'docs/MEMBERSHIP_BILLING_RECONCILIATION.md'
      - 'docs/LIVE_DRIFT_AUDIT_20260820.md'
      - 'docs/RELAUNCH_APPROVAL_QUEUE.md'
      - '.github/workflows/relaunch-billing-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relaunch-billing-integrity
  cancel-in-progress: true

jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout relaunch branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify membership billing boundaries
        run: |
          node scripts/relaunch-production-approval-check.mjs
          node scripts/relaunch-billing-reconciliation-check.mjs
          node scripts/relaunch-membership-i18n-check.mjs

      - name: Compile relaunch application
        run: npm run build
