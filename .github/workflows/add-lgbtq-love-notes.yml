name: Add LGBTQ Love Notes Categories

on:
  push:
    branches:
      - love-notes-add-lgbtq-categories
    paths:
      - .github/lgbtq-love-notes-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-add-lgbtq-categories
          fetch-depth: 0

      - name: Add LGBTQ categories to Love Notes build
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/LoveNotes.jsx')
          text = p.read_text(encoding='utf-8')

          label_sets = {
            'en': ('LGBTQ Romantic', 'LGBTQ Support', 'LGBTQ Milestone'),
            'es': ('Romance LGBTQ', 'Apoyo LGBTQ', 'Hitos LGBTQ'),
            'fr': ('Romance LGBTQ', 'Soutien LGBTQ', 'Étapes LGBTQ'),
            'it': ('Romanticismo LGBTQ', 'Supporto LGBTQ', 'Traguardi LGBTQ'),
            'de': ('LGBTQ Romantik', 'LGBTQ Unterstützung', 'LGBTQ Meilensteine'),
          }

          # Add translated category labels inside each language category map.
          starts = []
          for lang in ['en','es','fr','it','de']:
              token = f'  {lang}: {{'
              idx = text.find(token)
              if idx == -1:
                  raise SystemExit(f'Language block not found: {lang}')
              starts.append((lang, idx))

          for i in range(len(starts)-1, -1, -1):
              lang, start = starts[i]
              end = starts[i+1][1] if i+1 < len(starts) else text.find('\n};', start)
              block = text[start:end]
              if 'lgbtqRomantic:' in block:
                  continue
              marker = '      workplace:'
              pos = block.find(marker)
              if pos == -1:
                  raise SystemExit(f'Workplace category label not found in {lang}')
              line_end = block.find('\n', pos)
              romantic, support, milestone = label_sets[lang]
              addition = (
                  f'\n      lgbtqRomantic: "{romantic}",' 
                  f'\n      lgbtqSupport: "{support}",' 
                  f'\n      lgbtqMilestone: "{milestone}",' 
              )
              block = block[:line_end] + addition + block[line_end:]
              text = text[:start] + block + text[end:]

          # Add selector definitions. Alphabetical sorting already occurs after construction.
          selector_marker = "  { id: 'romantic', name: t.categories.romantic, icon: '🌹' },"
          if "id: 'lgbtqRomantic'" not in text:
              selector_addition = (
                  selector_marker + "\n"
                  "  { id: 'lgbtqRomantic', name: t.categories.lgbtqRomantic, icon: '🏳️‍🌈' },\n"
                  "  { id: 'lgbtqSupport', name: t.categories.lgbtqSupport, icon: '🤝' },\n"
                  "  { id: 'lgbtqMilestone', name: t.categories.lgbtqMilestone, icon: '🎉' },"
              )
              if selector_marker not in text:
                  raise SystemExit('Romantic selector marker not found')
              text = text.replace(selector_marker, selector_addition, 1)

          # Only surface categories that have note data in the selected language.
          old_sort = "  const [allCategory, ...noteCategories] = categories;\n  return [\n    allCategory,\n    ...noteCategories.sort((a, b) => a.name.localeCompare(b.name, lang, { sensitivity: 'base' }))\n  ];"
          new_sort = "  const [allCategory, ...noteCategories] = categories;\n  const baseData = loveNotesData[lang] || loveNotesData.en;\n  const addedData = additionalLoveNotesData[lang] || additionalLoveNotesData.en;\n  const availableData = { ...baseData, ...addedData };\n  const availableCategories = noteCategories.filter(category => availableData[category.id]?.length > 0);\n  return [\n    allCategory,\n    ...availableCategories.sort((a, b) => a.name.localeCompare(b.name, lang, { sensitivity: 'base' }))\n  ];"
          if 'availableCategories = noteCategories.filter' not in text:
              if old_sort not in text:
                  raise SystemExit('Category sort block not found')
              text = text.replace(old_sort, new_sort, 1)

          # Include all three existing LGBTQ arrays in generated English notes.
          old_order = "    'romantic', 'sweet', 'playful', 'deep', 'appreciation',"
          new_order = "    'romantic', 'lgbtqRomantic', 'lgbtqSupport', 'lgbtqMilestone', 'sweet', 'playful', 'deep', 'appreciation',"
          if "'lgbtqRomantic', 'lgbtqSupport', 'lgbtqMilestone'" not in text:
              if old_order not in text:
                  raise SystemExit('Category order marker not found')
              text = text.replace(old_order, new_order, 1)

          p.write_text(text, encoding='utf-8')

      - name: Verify LGBTQ category wiring
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/pages/LoveNotes.jsx').read_text(encoding='utf-8')
          required = [
              "id: 'lgbtqRomantic'",
              "id: 'lgbtqSupport'",
              "id: 'lgbtqMilestone'",
              "'lgbtqRomantic', 'lgbtqSupport', 'lgbtqMilestone'",
              "availableCategories = noteCategories.filter",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing build wiring: {missing}')

          data = Path('src/components/lovenotes/LoveNotesData.jsx').read_text(encoding='utf-8')
          for cat in ['lgbtqRomantic', 'lgbtqSupport', 'lgbtqMilestone']:
              start = data.find(f'    {cat}: [')
              if start == -1:
                  raise SystemExit(f'Missing English data category: {cat}')
              end = data.find('\n    ],', start)
              if end == -1:
                  end = data.find('\n    ]', start)
              chunk = data[start:end]
              count = chunk.count('{ title:')
              if count != 10:
                  raise SystemExit(f'{cat} expected 10 notes, found {count}')
          print('Verified 3 LGBTQ categories x 10 notes = 30 English notes')
          print('Expected English build total: 300')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit build update
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Add LGBTQ Love Notes categories to build"
          git push origin HEAD:love-notes-add-lgbtq-categories
