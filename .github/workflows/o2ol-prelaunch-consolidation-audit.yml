name: O2OL Prelaunch Consolidation Audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-prelaunch-consolidation-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0

      - name: Capture old preview and extract game data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/prelaunch-consolidation-audit
          mkdir -p tools/prelaunch-consolidation-audit/old-assets
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json, re

          targets = {
              "old": "https://one2onelove-preview.hwy99signs.workers.dev/Games",
              "current": "https://one2onelove-prelaunch.hwy99signs.workers.dev/",
          }
          markers = ["What Should They Do","Question Browser","Another Question","Most Popular Answer","Browse Questions","scenario","vote"]

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.styles=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag.lower()=="script" and d.get("src"): self.scripts.append(d["src"])
                  if tag.lower()=="link" and d.get("rel")=="stylesheet" and d.get("href"): self.styles.append(d["href"])

          def get(url):
              req=Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(req,timeout=60) as r:
                  return r.read(), r.geturl()

          out=Path("tools/prelaunch-consolidation-audit")
          report={}
          old_js_text=""

          for label,page_url in targets.items():
              html,final_url=get(page_url)
              (out/f"{label}.html").write_bytes(html)
              p=Assets(); p.feed(html.decode("utf-8","ignore"))
              scripts=[urljoin(final_url,s) for s in p.scripts]
              styles=[urljoin(final_url,s) for s in p.styles]
              info={"requested_url":page_url,"final_url":final_url,"scripts":scripts,"styles":styles,"hits":[]}
              for i,src in enumerate(scripts):
                  try:
                      body,_=get(src); text=body.decode("utf-8","ignore")
                      hit=[m for m in markers if m.lower() in text.lower()]
                      if label=="old" and hit:
                          name=Path(urlparse(src).path).name or f"script-{i}.js"
                          (out/"old-assets"/name).write_bytes(body)
                          old_js_text += "\n" + text
                      if hit:
                          snippets=[]
                          low=text.lower()
                          for m in hit:
                              pos=low.find(m.lower())
                              snippets.append(text[max(0,pos-500):min(len(text),pos+1500)])
                          info["hits"].append({"src":src,"markers":hit,"snippets":snippets})
                  except Exception as e:
                      info["hits"].append({"src":src,"error":str(e)})
              if label=="old":
                  for src in styles:
                      try:
                          body,_=get(src)
                          (out/"old-assets"/Path(urlparse(src).path).name).write_bytes(body)
                      except Exception:
                          pass
              report[label]=info

          def balanced_array(text,start):
              depth=0; quote=None; esc=False
              for i in range(start,len(text)):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=="\\": esc=True
                      elif c==quote: quote=None
                      continue
                  if c in ('"',"'"): quote=c; continue
                  if c=="[": depth+=1
                  elif c=="]":
                      depth-=1
                      if depth==0: return text[start:i+1]
              return None

          candidates=[]
          for m in re.finditer(r"const\s+([A-Za-z_$][\w$]*)=(\[\[)",old_js_text):
              name=m.group(1); start=m.start(2)
              raw=balanced_array(old_js_text,start)
              if not raw: continue
              try: data=json.loads(raw)
              except Exception: continue
              if not isinstance(data,list) or len(data)<5: continue
              shaped=[x for x in data if isinstance(x,list) and len(x)==3 and isinstance(x[0],str) and isinstance(x[1],str) and isinstance(x[2],list)]
              if len(shaped)>=5:
                  score=sum(1 for x in shaped if "what should" in x[1].lower())
                  candidates.append({"name":name,"count":len(data),"score":score,"data":data})

          candidates.sort(key=lambda x:(x["score"],x["count"]),reverse=True)
          summary=[{"name":x["name"],"count":x["count"],"score":x["score"]} for x in candidates]
          (out/"question-array-summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          if candidates:
              best=candidates[0]
              (out/"what-should-they-do-questions.json").write_text(json.dumps(best["data"],indent=2,ensure_ascii=False),encoding="utf-8")
          marker_chunks=[]
          for key in ["const Ehe=","const Mhe=","D1=[...Ehe,...Mhe]","function PW()","function Qhe"]:
              p=old_js_text.find(key)
              marker_chunks.append("\\n===== "+key+" @ "+str(p)+" =====\\n")
              if p>=0:
                  marker_chunks.append(old_js_text[max(0,p-2500):min(len(old_js_text),p+10000)])
          (out/"bundle-markers.txt").write_text("".join(marker_chunks),encoding="utf-8")
          (out/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          PY

      - name: Commit audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prelaunch-consolidation-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract old preview game data for consolidation"
          git push origin HEAD:o2ol-password-reset-preview
