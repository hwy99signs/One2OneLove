name: O2OL Prelaunch Consolidation Audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-prelaunch-consolidation-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0

      - name: Compare old preview and current prelaunch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/prelaunch-consolidation-audit
          mkdir -p tools/prelaunch-consolidation-audit/old-assets
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json, re

          targets = {
              "old": "https://one2onelove-preview.hwy99signs.workers.dev/Games",
              "current": "https://one2onelove-prelaunch.hwy99signs.workers.dev/",
          }
          markers = [
              "What Should They Do",
              "Question Browser",
              "Another Question",
              "Most Popular Answer",
              "Browse Questions",
              "scenario",
              "vote",
          ]

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.srcs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      d = dict(attrs)
                      if d.get("src"):
                          self.srcs.append(d["src"])

          out = Path("tools/prelaunch-consolidation-audit")
          report = {}

          for label, page_url in targets.items():
              req = Request(page_url, headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(req, timeout=60) as r:
                  html = r.read()
                  final_url = r.geturl()
              (out / f"{label}.html").write_bytes(html)
              parser = Scripts()
              parser.feed(html.decode("utf-8", "ignore"))
              scripts = [urljoin(final_url, s) for s in parser.srcs]
              info = {"requested_url": page_url, "final_url": final_url, "scripts": scripts, "hits": []}
              for i, src in enumerate(scripts):
                  try:
                      req = Request(src, headers={"User-Agent":"Mozilla/5.0"})
                      with urlopen(req, timeout=60) as r:
                          body = r.read()
                      text = body.decode("utf-8", "ignore")
                      hit_markers = [m for m in markers if m.lower() in text.lower()]
                      if hit_markers:
                          name = Path(urlparse(src).path).name or f"script-{i}.js"
                          if label == "old":
                              (out / "old-assets" / name).write_bytes(body)
                          snippets = []
                          low = text.lower()
                          for m in hit_markers:
                              p = low.find(m.lower())
                              snippets.append(text[max(0,p-500):min(len(text),p+1500)])
                          info["hits"].append({"src": src, "markers": hit_markers, "snippets": snippets})
                  except Exception as e:
                      info["hits"].append({"src": src, "error": str(e)})
              report[label] = info

          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY

      - name: Commit audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prelaunch-consolidation-audit
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Capture old preview for prelaunch consolidation audit"
          git push origin HEAD:o2ol-password-reset-preview
