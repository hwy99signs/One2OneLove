name: Validate Tier Click Hotfix

on:
  push:
    branches:
      - fix/tier-click-hotfix-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Static guards
        run: |
          grep -q "if(!isAuthenticated)" src/pages/Subscription.jsx
          grep -q "source=subscription-plan" src/pages/Subscription.jsx
          grep -q "source=founding-offer" src/pages/Subscription.jsx
          grep -q "bg-white py-6 text-base font-black text-slate-900" src/pages/Subscription.jsx
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser verify anonymous tier clicks
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cat > tier-click-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const page=await context.newPage();
            let checkoutCalls=0;
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            await page.route('**/api/auth/get-session', route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({user:null,session:null})
            }));
            await page.route('**/api/billing/founding-offer', route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({offer:{available:true,plan:'Exclusive',cohort:'first100',recurringPriceCents:1599}})
            }));
            await page.route('**/api/billing/checkout', route=>{
              checkoutCalls++;
              return route.fulfill({status:500,contentType:'application/json',body:'{}'});
            });
            await page.route('**/api/interaction-events', route=>route.fulfill({status:204,body:''}));

            async function openSubscription(){
              await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>{
                const b=[...document.querySelectorAll('button')].find(x=>(x.textContent||'').includes('Create Account for Premiere'));
                return b && !b.disabled;
              },null,{timeout:5000});
            }

            await openSubscription();
            const premiere=page.getByRole('button',{name:'Create Account for Premiere'});
            if(await premiere.isDisabled()) throw new Error('Premiere still disabled');
            await premiere.click();
            await page.waitForURL(/\/SignUp\?plan=Premiere&source=subscription-plan/,{timeout:5000});

            await openSubscription();
            const exclusive=page.getByRole('button',{name:'Create Account for Exclusive'});
            if(await exclusive.isDisabled()) throw new Error('Exclusive still disabled');
            await exclusive.click();
            await page.waitForURL(/\/SignUp\?plan=Exclusive&source=subscription-plan/,{timeout:5000});

            await openSubscription();
            const founding=page.getByRole('button',{name:'Activate Founding Offer'});
            if(await founding.isDisabled()) throw new Error('Founding offer still disabled');
            await founding.click();
            await page.waitForURL(/\/SignUp\?plan=Exclusive&founding=1&source=founding-offer/,{timeout:5000});

            if(checkoutCalls!==0) throw new Error('Anonymous tier clicks still called billing checkout '+checkoutCalls+' time(s)');
            if(errors.length) throw new Error(errors.join(' | '));
            console.log('Anonymous tier buttons active and direct-to-signup; checkout calls:',checkoutCalls);
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
          node tier-click-audit.cjs
