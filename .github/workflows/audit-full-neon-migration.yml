name: Audit Full Neon Migration

on:
  push:
    branches:
      - full-neon-migration-2026-09-13
    paths:
      - .github/workflows/audit-full-neon-migration.yml
      - .github/audit-full-neon-trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-neon-migration-2026-09-13
          fetch-depth: 0

      - name: Supabase reference audit
        shell: bash
        run: |
          set +e
          echo '=== SOURCE REFERENCES TO SUPABASE ==='
          grep -RInE 'supabase|SUPABASE|supabase\.co|@supabase' src worker package.json package-lock.json public 2>/dev/null | grep -vE 'node_modules|dist' || true
          echo '=== IMPORTS OF LEGACY SUPABASE CLIENT ==='
          grep -RInE "from ['\"].*(supabase|supabaseClient)|import.*supabase" src 2>/dev/null || true
          echo '=== PACKAGE DEPENDENCY ==='
          grep -n '@supabase' package.json package-lock.json 2>/dev/null || true

      - name: Build migration branch
        run: |
          npm ci
          npm run build
