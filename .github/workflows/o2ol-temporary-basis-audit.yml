name: O2OL temporary Basis tier audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-temporary-basis-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find tier-related Basis references
        shell: bash
        run: |
          set -euo pipefail
          echo "=== EXACT Basis ==="
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' 'Basis' . || true
          echo "=== LOWERCASE basis WITH TIER CONTEXT ==="
          grep -RInEi --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' '(subscription|plan|tier|price|billing).{0,80}basis|basis.{0,80}(subscription|plan|tier|price|billing)' . || true
