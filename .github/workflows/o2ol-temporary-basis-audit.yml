name: O2OL temporary Basic normalization audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-temporary-basis-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find remaining legacy tier spelling
        shell: bash
        run: |
          set -euo pipefail
          echo "=== EXACT OLD TIER SPELLING ==="
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' 'Bas''is' . || true
          echo "=== LOWERCASE LEGACY TIER WITH CONTEXT ==="
          grep -RInEi --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' '(subscription|plan|tier|price|billing).{0,80}bas''is|bas''is.{0,80}(subscription|plan|tier|price|billing)' . || true
