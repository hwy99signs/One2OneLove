name: O2OL Core Signup Repair

on:
  push:
    branches:
      - o2ol/launch-hardening-20260906
    paths:
      - .github/workflows/o2ol-core-signup-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: o2ol/launch-hardening-20260906

      - name: Repair regular signup flow for Neon
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/contexts/AuthContext.jsx')
          auth = auth_path.read_text()
          for line in [
              "            subscription_plan: subscriptionPlan || 'Basic',\n",
              "            subscription_price: subscriptionPrice !== undefined ? subscriptionPrice : 0, // Basic is now free\n",
              "            subscription_status: 'active',\n",
              "            email_verified: isEmailConfirmed, // Track email verification status\n",
          ]:
              if line not in auth:
                  raise SystemExit('Expected signup insert line not found: ' + line.strip())
              auth = auth.replace(line, '', 1)
          auth_path.write_text(auth)

          form_path = Path('src/components/signup/RegularUserForm.jsx')
          form = form_path.read_text()
          old_success = (
              '      if (result.success) {\n'
              '        // Store the email and show dialog\n'
              '        setRegisteredEmail(formData.email);\n'
              '        setShowEmailDialog(true);\n'
              '        \n'
              '        // Also show a toast for good measure\n'
              '        toast.success("Account created successfully! Please check your email.");\n'
              '      } else {\n'
          )
          new_success = (
              '      if (result.success) {\n'
              '        // Neon Auth allows immediate access on the migration branch.\n'
              '        toast.success("Account created successfully!");\n'
              '        navigate(createPageUrl("Profile"));\n'
              '      } else {\n'
          )
          if old_success not in form:
              raise SystemExit('Expected regular-user signup success block not found')
          form = form.replace(old_success, new_success, 1)
          form_path.write_text(form)
          PY

      - name: Commit core signup repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contexts/AuthContext.jsx src/components/signup/RegularUserForm.jsx
          git commit -m "Make regular signup operational on Neon"
          git push origin HEAD:o2ol/launch-hardening-20260906
