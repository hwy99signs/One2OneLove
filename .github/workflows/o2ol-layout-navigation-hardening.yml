name: O2OL Layout Navigation Hardening

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-layout-navigation-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current O2OL branch
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Harden multilingual global navigation and browser privacy
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/pages/Layout.jsx')
          s = p.read_text()

          replacements = {
            'nav: { home: "Home", action: "Action", profile: "Profile", signIn: "Sign In", signUp: "Sign Up", invite: "Invite", community: "Community", aiCreator: "AI Content Creator", lgbtq: "LGBTQ+ Support", developer: "Dev", requests: "Requests", chat: "Chat", signOut: "Sign Out" },':
            'nav: { home: "Home", action: "Action", globalRoom: "Global Relationship Room", profile: "Profile", signIn: "Sign In", signUp: "Sign Up", invite: "Invite", community: "Community", aiCreator: "AI Content Creator", lgbtq: "LGBTQ+ Support", developer: "Dev", requests: "Requests", chat: "Chat", signOut: "Sign Out", menu: "Open navigation menu" },',
            'actionMenu: { sendLoveNote: "Send A Love Note", coupleSupport: "Relationship Support", lgbtqSupport: "LGBTQ+ Support", relationshipQuizzes: "Relationship Quizzes", relationshipMilestones: "Milestones & Anniversaries", relationshipGoals: "Relationship Goals", dateIdeas: "Date Ideas", memoryLane: "Memory Lane", aiCreator: "AI Content Creator", winCruise: "Win Prizes!" }':
            'actionMenu: { sendLoveNote: "Send A Love Note", relationshipCoach: "AI Relationship Coach", relationshipLibrary: "Relationship Library", couplesDashboard: "Couples Dashboard", coupleSupport: "Relationship Support", lgbtqSupport: "LGBTQ+ Support", relationshipQuizzes: "Relationship Quizzes", relationshipMilestones: "Milestones & Anniversaries", relationshipGoals: "Relationship Goals", dateIdeas: "Date Ideas", memoryLane: "Memory Lane", aiCreator: "AI Content Creator", winCruise: "Win Prizes!" }',
            'nav: { home: "Inicio", action: "Acción", profile: "Perfil", signIn: "Iniciar Sesión", signUp: "Registrarse", invite: "Invitar", community: "Comunidad", aiCreator: "Creador de Contenido IA", lgbtq: "Apoyo LGBTQ+", developer: "Dev", requests: "Solicitudes", chat: "Chat", signOut: "Cerrar Sesión" },':
            'nav: { home: "Inicio", action: "Acción", globalRoom: "Sala Global de Relaciones", profile: "Perfil", signIn: "Iniciar Sesión", signUp: "Registrarse", invite: "Invitar", community: "Comunidad", aiCreator: "Creador de Contenido IA", lgbtq: "Apoyo LGBTQ+", developer: "Dev", requests: "Solicitudes", chat: "Chat", signOut: "Cerrar Sesión", menu: "Abrir menú de navegación" },',
            'actionMenu: { sendLoveNote: "Enviar una Nota de Amor", coupleSupport: "Apoyo para Relaciones", lgbtqSupport: "Apoyo LGBTQ+", relationshipQuizzes: "Cuestionarios de Relaciones", relationshipMilestones: "Hitos y Aniversarios", relationshipGoals: "Metas de Relación", dateIdeas: "Ideas para Citas", memoryLane: "Carril de Recuerdos", aiCreator: "Creador de Contenido IA", winCruise: "¡Gana Premios!" }':
            'actionMenu: { sendLoveNote: "Enviar una Nota de Amor", relationshipCoach: "Coach de Relaciones con IA", relationshipLibrary: "Biblioteca de Relaciones", couplesDashboard: "Panel de Pareja", coupleSupport: "Apoyo para Relaciones", lgbtqSupport: "Apoyo LGBTQ+", relationshipQuizzes: "Cuestionarios de Relaciones", relationshipMilestones: "Hitos y Aniversarios", relationshipGoals: "Metas de Relación", dateIdeas: "Ideas para Citas", memoryLane: "Carril de Recuerdos", aiCreator: "Creador de Contenido IA", winCruise: "¡Gana Premios!" }',
            'nav: { home: "Accueil", action: "Action", profile: "Profil", signIn: "Se Connecter", signUp: "S\'inscrire", invite: "Inviter", community: "Communauté", aiCreator: "Créateur de Contenu IA", lgbtq: "Soutien LGBTQ+", developer: "Dev", requests: "Demandes", chat: "Chat", signOut: "Se Déconnecter" },':
            'nav: { home: "Accueil", action: "Action", globalRoom: "Salle Mondiale des Relations", profile: "Profil", signIn: "Se Connecter", signUp: "S\'inscrire", invite: "Inviter", community: "Communauté", aiCreator: "Créateur de Contenu IA", lgbtq: "Soutien LGBTQ+", developer: "Dev", requests: "Demandes", chat: "Chat", signOut: "Se Déconnecter", menu: "Ouvrir le menu de navigation" },',
            'actionMenu: { sendLoveNote: "Envoyer une Note d\'Amour", coupleSupport: "Soutien aux Relations", lgbtqSupport: "Soutien LGBTQ+", relationshipQuizzes: "Quiz sur les Relations", relationshipMilestones: "Jalons et Anniversaires", relationshipGoals: "Objectifs de Relation", dateIdeas: "Idées de Rendez-vous", memoryLane: "Allée des Souvenirs", aiCreator: "Créateur de Contenu IA", winCruise: "Gagnez des Prix!" }':
            'actionMenu: { sendLoveNote: "Envoyer une Note d\'Amour", relationshipCoach: "Coach Relationnel IA", relationshipLibrary: "Bibliothèque Relationnelle", couplesDashboard: "Tableau de Bord du Couple", coupleSupport: "Soutien aux Relations", lgbtqSupport: "Soutien LGBTQ+", relationshipQuizzes: "Quiz sur les Relations", relationshipMilestones: "Jalons et Anniversaires", relationshipGoals: "Objectifs de Relation", dateIdeas: "Idées de Rendez-vous", memoryLane: "Allée des Souvenirs", aiCreator: "Créateur de Contenu IA", winCruise: "Gagnez des Prix!" }',
            'nav: { home: "Home", action: "Azione", profile: "Profilo", signIn: "Accedi", signUp: "Iscriviti", invite: "Invita", community: "Comunità", aiCreator: "Creatore de Contenuti IA", lgbtq: "Supporto LGBTQ+", developer: "Dev", requests: "Richieste", chat: "Chat", signOut: "Esci" },':
            'nav: { home: "Home", action: "Azione", globalRoom: "Sala Globale delle Relazioni", profile: "Profilo", signIn: "Accedi", signUp: "Iscriviti", invite: "Invita", community: "Comunità", aiCreator: "Creatore de Contenuti IA", lgbtq: "Supporto LGBTQ+", developer: "Dev", requests: "Richieste", chat: "Chat", signOut: "Esci", menu: "Apri menu di navigazione" },',
            'actionMenu: { sendLoveNote: "Invia una Nota d\'Amore", coupleSupport: "Supporto per Relazioni", lgbtqSupport: "Supporto LGBTQ+", relationshipQuizzes: "Quiz sulle Relazioni", relationshipMilestones: "Traguardi e Anniversari", relationshipGoals: "Obiettivi di Relazione", dateIdeas: "Idee per Appuntamenti", memoryLane: "Viale dei Ricordi", aiCreator: "Creatore de Contenuti IA", winCruise: "Vinci Premi!" }':
            'actionMenu: { sendLoveNote: "Invia una Nota d\'Amore", relationshipCoach: "Coach Relazionale IA", relationshipLibrary: "Biblioteca delle Relazioni", couplesDashboard: "Dashboard di Coppia", coupleSupport: "Supporto per Relazioni", lgbtqSupport: "Supporto LGBTQ+", relationshipQuizzes: "Quiz sulle Relazioni", relationshipMilestones: "Traguardi e Anniversari", relationshipGoals: "Obiettivi di Relazione", dateIdeas: "Idee per Appuntamenti", memoryLane: "Viale dei Ricordi", aiCreator: "Creatore de Contenuti IA", winCruise: "Vinci Premi!" }',
            'nav: { home: "Startseite", action: "Aktion", profile: "Profil", signIn: "Anmelden", signUp: "Registrieren", invite: "Einladen", community: "Gemeinschaft", aiCreator: "KI-Content-Ersteller", lgbtq: "LGBTQ+ Unterstützung", developer: "Dev", requests: "Anfragen", chat: "Chat", signOut: "Abmelden" },':
            'nav: { home: "Startseite", action: "Aktion", globalRoom: "Globaler Beziehungsraum", profile: "Profil", signIn: "Anmelden", signUp: "Registrieren", invite: "Einladen", community: "Gemeinschaft", aiCreator: "KI-Content-Ersteller", lgbtq: "LGBTQ+ Unterstützung", developer: "Dev", requests: "Anfragen", chat: "Chat", signOut: "Abmelden", menu: "Navigationsmenü öffnen" },',
            'actionMenu: { sendLoveNote: "Eine Liebesbotschaft Senden", coupleSupport: "Beziehungsunterstützung", lgbtqSupport: "LGBTQ+ Unterstützung", relationshipQuizzes: "Beziehungsquiz", relationshipMilestones: "Meilensteine & Jahrestage", relationshipGoals: "Beziehungsziele", dateIdeas: "Date-Ideen", memoryLane: "Erinnerungsgasse", aiCreator: "KI-Content-Ersteller", winCruise: "Gewinne Preise!" }':
            'actionMenu: { sendLoveNote: "Eine Liebesbotschaft Senden", relationshipCoach: "KI-Beziehungscoach", relationshipLibrary: "Beziehungsbibliothek", couplesDashboard: "Paar-Dashboard", coupleSupport: "Beziehungsunterstützung", lgbtqSupport: "LGBTQ+ Unterstützung", relationshipQuizzes: "Beziehungsquiz", relationshipMilestones: "Meilensteine & Jahrestage", relationshipGoals: "Beziehungsziele", dateIdeas: "Date-Ideen", memoryLane: "Erinnerungsgasse", aiCreator: "KI-Content-Ersteller", winCruise: "Gewinne Preise!" }',
          }

          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected translation anchor not found: {old[:70]}')
            s = s.replace(old, new, 1)

          s = s.replace('<span>AI Relationship Coach</span>', '<span>{t.actionMenu.relationshipCoach}</span>')
          s = s.replace('AI Relationship Coach\n                      </Link>', '{t.actionMenu.relationshipCoach}\n                      </Link>')

          desktop_anchor = '''              <Link
                to={createPageUrl("Community")}
                className="flex items-center gap-1 text-white/80 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg transition-all font-medium text-sm"
              >'''
          desktop_insert = '''              <Link
                to={createPageUrl("GlobalRelationshipRoom")}
                className="flex items-center gap-1 text-white/80 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg transition-all font-medium text-sm"
              >
                <MessageCircle className="w-4 h-4" />
                {t.nav.globalRoom}
              </Link>

''' + desktop_anchor
          if desktop_anchor not in s:
            raise SystemExit('Desktop Community navigation anchor not found')
          s = s.replace(desktop_anchor, desktop_insert, 1)

          desktop_support = '''                    <Link
                      to={createPageUrl("CoupleSupport")}
                      className="w-full px-6 py-3 text-left text-gray-700 hover:bg-purple-50 hover:text-purple-700 transition-colors flex items-center gap-3 border-b border-gray-100"
                      onClick={() => setActionOpen(false)}
                    >'''
          desktop_extra = '''                    <Link
                      to={createPageUrl("RelationshipLibrary")}
                      className="w-full px-6 py-3 text-left text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors flex items-center gap-3 border-b border-gray-100"
                      onClick={() => setActionOpen(false)}
                    >
                      <Sparkles className="w-5 h-5 text-indigo-600" />
                      <span>{t.actionMenu.relationshipLibrary}</span>
                    </Link>

                    <Link
                      to={createPageUrl("CouplesDashboard")}
                      className="w-full px-6 py-3 text-left text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors flex items-center gap-3 border-b border-gray-100"
                      onClick={() => setActionOpen(false)}
                    >
                      <Users className="w-5 h-5 text-indigo-600" />
                      <span>{t.actionMenu.couplesDashboard}</span>
                    </Link>

''' + desktop_support
          if desktop_support not in s:
            raise SystemExit('Desktop support action anchor not found')
          s = s.replace(desktop_support, desktop_extra, 1)

          mobile_home_end = '''                  {t.nav.home}
                </Link>

                {/* Action Dropdown for Mobile */}'''
          mobile_room = '''                  {t.nav.home}
                </Link>

                <Link
                  to={createPageUrl("GlobalRelationshipRoom")}
                  className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-3 rounded-lg transition-all"
                  onClick={() => setMobileMenuOpen(false)}
                >
                  <MessageCircle className="w-5 h-5" />
                  {t.nav.globalRoom}
                </Link>

                {/* Action Dropdown for Mobile */}'''
          if mobile_home_end not in s:
            raise SystemExit('Mobile Home navigation anchor not found')
          s = s.replace(mobile_home_end, mobile_room, 1)

          mobile_support = '''                      <Link
                        to={createPageUrl("CoupleSupport")}
                        className="flex items-center gap-2 text-white hover:bg-white/20 px-4 py-3 transition-all"
                        onClick={() => {
                          setMobileMenuOpen(false);
                          setMobileActionOpen(false);
                        }}
                      >'''
          mobile_extra = '''                      <Link
                        to={createPageUrl("RelationshipLibrary")}
                        className="flex items-center gap-2 text-white hover:bg-white/20 px-4 py-3 transition-all"
                        onClick={() => {
                          setMobileMenuOpen(false);
                          setMobileActionOpen(false);
                        }}
                      >
                        <Sparkles className="w-5 h-5" />
                        {t.actionMenu.relationshipLibrary}
                      </Link>
                      <Link
                        to={createPageUrl("CouplesDashboard")}
                        className="flex items-center gap-2 text-white hover:bg-white/20 px-4 py-3 transition-all"
                        onClick={() => {
                          setMobileMenuOpen(false);
                          setMobileActionOpen(false);
                        }}
                      >
                        <Users className="w-5 h-5" />
                        {t.actionMenu.couplesDashboard}
                      </Link>
''' + mobile_support
          if mobile_support not in s:
            raise SystemExit('Mobile support action anchor not found')
          s = s.replace(mobile_support, mobile_extra, 1)

          mobile_button = '''              <button
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="lg:hidden text-white p-2 hover:bg-white/10 rounded-lg transition-colors"
              >'''
          mobile_button_new = '''              <button
                type="button"
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="lg:hidden text-white p-2 hover:bg-white/10 rounded-lg transition-colors"
                aria-label={t.nav.menu}
                aria-expanded={mobileMenuOpen}
              >'''
          if mobile_button not in s:
            raise SystemExit('Mobile menu button anchor not found')
          s = s.replace(mobile_button, mobile_button_new, 1)

          # Remove browser diagnostics from this global shell. Errors still affect UI/control flow;
          # they are simply no longer dumped with user/session identifiers in the browser console.
          s = re.sub(r'^\s*console\.(?:log|debug|info|trace|warn|error)\([^\n]*\);\s*\n', '', s, flags=re.MULTILINE)

          p.write_text(s)

      - name: Verify shell invariants
        shell: bash
        run: |
          set -euo pipefail
          for lang in en es fr it de; do grep -q "${lang}:" src/pages/Layout.jsx; done
          grep -q 'globalRoom:' src/pages/Layout.jsx
          grep -q 'relationshipLibrary:' src/pages/Layout.jsx
          grep -q 'couplesDashboard:' src/pages/Layout.jsx
          grep -q 'createPageUrl("GlobalRelationshipRoom")' src/pages/Layout.jsx
          grep -q 'createPageUrl("RelationshipLibrary")' src/pages/Layout.jsx
          grep -q 'createPageUrl("CouplesDashboard")' src/pages/Layout.jsx
          grep -q 'aria-expanded={mobileMenuOpen}' src/pages/Layout.jsx
          if grep -Eq 'console\.(log|debug|info|trace|warn|error)' src/pages/Layout.jsx; then
            echo 'Global Layout must not log user, chat, auth, or navigation diagnostics.'
            exit 1
          fi
          if grep -q '>AI Relationship Coach<' src/pages/Layout.jsx; then
            echo 'Global navigation must not restore hard-coded English AI coach text.'
            exit 1
          fi

      - name: Lint Layout
        run: npx eslint src/pages/Layout.jsx --rule 'react/prop-types: off'

      - name: Verify O2OL source
        run: node scripts/verify-o2ol-launch.mjs

      - name: Production build
        run: npm run build

      - name: Commit verified shell hardening and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-layout-navigation-hardening.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/Layout.jsx .github/workflows/o2ol-layout-navigation-hardening.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden multilingual global navigation shell'
          git push origin HEAD:o2ol-build-branch-2026-08-18
