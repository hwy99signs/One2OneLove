name: Bootstrap O2OL Token Passwordless Hyperdrive

on:
  push:
    branches:
      - prelaunch/o2ol-token-economy-20261003
    paths:
      - ".github/workflows/o2ol-token-passwordless-hyperdrive-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HD_NAME: one2onelove-token-prelaunch
      HD_HOST: ep-super-silence-arbl98ls-pooler.c-4.us-west-2.aws.neon.tech
      HD_DATABASE: one2onelove
      HD_USER: one2onelove_owner
      PRODUCTION_HD_ID: ef44564dbfca4e1bb13176ee568aaddf
    steps:
      - name: Require Cloudflare management access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Reuse or create isolated passwordless Hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          curl -fsS -H "$AUTH"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"             -o /tmp/list.json
          jq -e '.success == true' /tmp/list.json >/dev/null

          EXISTING=$(jq -r --arg n "$HD_NAME" --arg prod "$PRODUCTION_HD_ID"             '.result[]? | select(.name==$n and .id!=$prod) | .id' /tmp/list.json | head -n1)

          if [ -n "$EXISTING" ]; then
            ID="$EXISTING"
            echo "Reusing isolated Hyperdrive."
          else
            jq -n               --arg name "$HD_NAME"               --arg db "$HD_DATABASE"               --arg host "$HD_HOST"               --arg user "$HD_USER"               '{
                name:$name,
                origin:{
                  database:$db,
                  host:$host,
                  password:"",
                  port:5432,
                  scheme:"postgresql",
                  user:$user
                },
                caching:{disabled:true},
                origin_connection_limit:10
              }' > /tmp/create.json

            CODE=$(curl -sS -o /tmp/create-response.json -w '%{http_code}'               -X POST               -H "$AUTH"               -H 'Content-Type: application/json'               --data @/tmp/create.json               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs")

            if [ "$CODE" != "200" ]; then
              echo "Passwordless Hyperdrive bootstrap was not accepted; no database password was exposed."
              jq '{success,errors,messages}' /tmp/create-response.json
              exit 2
            fi
            jq -e '.success == true' /tmp/create-response.json >/dev/null
            ID=$(jq -r '.result.id' /tmp/create-response.json)
          fi

          test -n "$ID"
          test "$ID" != "$PRODUCTION_HD_ID"

          curl -fsS -H "$AUTH"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$ID"             -o /tmp/verify.json
          jq -e --arg host "$HD_HOST" --arg db "$HD_DATABASE"             '.success == true and .result.origin.host == $host and .result.origin.database == $db'             /tmp/verify.json >/dev/null

          echo "TOKEN_PRELAUNCH_HYPERDRIVE_ID=$ID"
          echo "TOKEN_PRELAUNCH_HYPERDRIVE_HOST=$(jq -r '.result.origin.host' /tmp/verify.json)"
          echo "TOKEN_PRELAUNCH_HYPERDRIVE_DATABASE=$(jq -r '.result.origin.database' /tmp/verify.json)"
