name: Retire Legacy O2OL Preview

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-retire-legacy-preview.yml"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0

      - name: Verify retirement credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dispose retired Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/one2onelove-preview"
          CODE=$(curl -sS -o /tmp/legacy-worker.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" || true)
          echo "legacy worker lookup -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            DELETE_CODE=$(curl -sS -o /tmp/legacy-worker-delete.json -w '%{http_code}'               -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" || true)
            echo "legacy worker delete -> HTTP $DELETE_CODE"
            case "$DELETE_CODE" in
              200|204) ;;
              *) cat /tmp/legacy-worker-delete.json || true; exit 1 ;;
            esac
          elif [ "$CODE" = "404" ]; then
            echo "Legacy Worker is already absent."
          else
            cat /tmp/legacy-worker.json || true
            exit 1
          fi

          VERIFY=$(curl -sS -o /tmp/legacy-worker-verify.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" || true)
          echo "legacy worker verify -> HTTP $VERIFY"
          test "$VERIFY" = "404"

      - name: Delete old active preview and prelaunch branches
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="o2ol-password-reset-preview"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t BRANCHES < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}')
          for branch in "${BRANCHES[@]}"; do
            [ "$branch" = "$CURRENT" ] && continue
            [ "$branch" = "master" ] && continue

            # Preserve all explicit restore/archive snapshots.
            case "$branch" in
              restore/*|*restore*) continue ;;
            esac

            case "$branch" in
              *prelaunch*|*preview*)
                echo "Deleting obsolete active branch: $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done

      - name: Verify only canonical active prelaunch remains
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="o2ol-password-reset-preview"
          bad=0
          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            [ "$branch" = "$CURRENT" ] && continue
            [ "$branch" = "master" ] && continue
            case "$branch" in
              restore/*|*restore*) continue ;;
            esac
            case "$branch" in
              *prelaunch*|*preview*)
                echo "Legacy active preview/prelaunch branch still exists: $branch" >&2
                bad=1
                ;;
            esac
          done < <(git ls-remote --heads origin)
          test "$bad" = 0

      - name: Verify canonical Prelaunch Worker remains live
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/current-health.json -w '%{http_code}'             https://one2onelove-prelaunch.hwy99signs.workers.dev/api/health || true)
          echo "canonical prelaunch health -> HTTP $CODE"
          test "$CODE" = "200"
          grep -F '"service":"one2onelove-api"' /tmp/current-health.json >/dev/null
