name: One2OneLove Cloudflare Launch Preview

on:
  push:
    branches:
      - migration/cloudflare-launch-20260911
    paths:
      - "src/**"
      - "public/**"
      - "worker/**"
      - "cloudflare/wrangler.preview-migration.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-preview-launch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://one2onelove-preview-migration.hwy99signs.workers.dev
      MEDIA_BUCKET: one2onelove-media-migration
    steps:
      - name: Checkout launch migration branch
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Install frontend dependencies
        run: npm ci

      - name: Build approved launch frontend
        run: npm run build

      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund

      - name: Materialize approved homepage assets from Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          npx --yes wrangler@latest r2 object get \
            "$MEDIA_BUCKET/brand/one2onelove-logo.png" \
            --file=dist/assets/one2onelove-logo.png \
            --remote
          npx --yes wrangler@latest r2 object get \
            "$MEDIA_BUCKET/brand/one2onelove-home-hero.png" \
            --file=dist/assets/one2onelove-home-hero.png \
            --remote
          test -s dist/assets/one2onelove-logo.png
          test -s dist/assets/one2onelove-home-hero.png

      - name: Remove legacy Supabase asset dependencies from launch build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/19ffc2fa2_ONE2ONELOVELOGO.png": "/assets/one2onelove-logo.png",
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/bd7450758_-appbackgroundphoto.png": "/assets/one2onelove-home-hero.png",
          }
          for path in Path("dist").rglob("*"):
              if not path.is_file() or path.suffix not in {".js", ".css", ".html"}:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          leftovers = []
          for path in Path("dist").rglob("*"):
              if path.is_file() and path.suffix in {".js", ".css", ".html"}:
                  if "qtrypzzcjebvfcihiynt.supabase.co" in path.read_text(encoding="utf-8"):
                      leftovers.append(str(path))
          if leftovers:
              raise SystemExit("Legacy launch asset URL remains in: " + ", ".join(leftovers))
          PY

      - name: Deploy full-stack Cloudflare preview
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.preview-migration.jsonc

      - name: Verify approved landing page shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --output /tmp/home.html --write-out '%{http_code}' "$PREVIEW_URL/")" && [ "$STATUS" = "200" ] && break
            sleep 2
          done
          test "$STATUS" = "200"
          test -s /tmp/home.html
          grep -qi '<html' /tmp/home.html

      - name: Verify Cloudflare-served homepage assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PREVIEW_URL/assets/one2onelove-logo.png" --output /tmp/launch-logo.png
          curl --fail --silent --show-error "$PREVIEW_URL/assets/one2onelove-home-hero.png" --output /tmp/launch-hero.png
          test -s /tmp/launch-logo.png
          test -s /tmp/launch-hero.png
          file /tmp/launch-logo.png
          file /tmp/launch-hero.png

      - name: Verify SPA fallback route
        shell: bash
        run: |
          STATUS="$(curl --silent --output /tmp/fallback.html --write-out '%{http_code}' "$PREVIEW_URL/RelationshipGoals")"
          test "$STATUS" = "200"
          grep -qi '<html' /tmp/fallback.html

      - name: Verify API health
        shell: bash
        run: |
          BODY="$(curl --fail --silent --show-error "$PREVIEW_URL/api/health")"
          echo "$BODY"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.ok || d.database!=="one2onelove") process.exit(1)' "$BODY"

      - name: Verify Neon Auth proxy
        shell: bash
        run: |
          STATUS="$(curl --silent --output /tmp/session.json --write-out '%{http_code}' "$PREVIEW_URL/api/auth/get-session")"
          cat /tmp/session.json
          test "$STATUS" -ge 200
          test "$STATUS" -lt 500

      - name: Verify official logo from R2 API
        shell: bash
        run: |
          curl --fail --silent --show-error "$PREVIEW_URL/api/assets/brand/logo" --output /tmp/logo.png
          test -s /tmp/logo.png
          file /tmp/logo.png
