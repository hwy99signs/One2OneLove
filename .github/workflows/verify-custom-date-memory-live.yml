name: Verify Custom Date and Memory Live

on:
  push:
    branches:
      - verify-missing-you-worker-2026-09-13
    paths:
      - .github/verify-custom-date-memory-live-trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Memories and Date Ideas APIs are live
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://one2onelove-launch.hwy99signs.workers.dev"
          for PATHNAME in /api/memories /api/date-ideas; do
            OUT="/tmp/$(echo "$PATHNAME" | tr '/' '_').json"
            STATUS=$(curl --silent --show-error --output "$OUT" --write-out '%{http_code}' "$ROOT$PATHNAME")
            cat "$OUT"
            test "$STATUS" = "401"
            grep -F 'Authentication required' "$OUT" >/dev/null
          done
          echo "CUSTOM_DATE_MEMORY_APIS_LIVE=yes"

      - name: Verify deployed frontend contains functional service wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://one2onelove-launch.hwy99signs.workers.dev"
          curl --fail --silent --show-error "$ROOT/" -o /tmp/index.html
          JS=$(grep -oE 'src="[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"//')
          test -n "$JS"
          curl --fail --silent --show-error "$ROOT$JS" -o /tmp/app.js
          grep -F 'o2ol_memories_local_v1' /tmp/app.js >/dev/null
          grep -F 'o2ol_date_ideas_local_v1' /tmp/app.js >/dev/null
          grep -F '/api/memories' /tmp/app.js >/dev/null
          grep -F '/api/date-ideas' /tmp/app.js >/dev/null
          echo "CUSTOM_DATE_MEMORY_FRONTEND_WIRING_DEPLOYED=yes"
