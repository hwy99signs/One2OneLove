name: Relaunch Member Discovery Integrity

on:
  push:
    branches:
      - relaunch-homepage
    paths:
      - 'src/lib/memberDiscoveryService.js'
      - 'src/lib/presenceService.js'
      - 'src/components/presence/UserPresenceIndicator.jsx'
      - 'supabase/functions/discover-members/**'
      - 'supabase/migrations/20260819_member_block_connection_enforcement.sql'
      - 'scripts/relaunch-member-blocking-discovery-check.mjs'
      - 'scripts/relaunch-presence-privacy-check.mjs'
      - '.github/workflows/relaunch-member-discovery-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relaunch-member-discovery-integrity
  cancel-in-progress: true

jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout relaunch branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify block-aware discovery, connections and shared presence
        run: |
          node scripts/relaunch-member-blocking-foundation-check.mjs
          node scripts/relaunch-member-blocking-discovery-check.mjs
          node scripts/relaunch-presence-privacy-check.mjs

      - name: Compile relaunch application
        run: npm run build
