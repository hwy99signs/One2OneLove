name: O2OL Old Preview Feature Audit
# historical-bundle audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-old-preview-feature-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0

      - name: Compare preserved old bundle with current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/old-preview-feature-audit
          mkdir -p tools/old-preview-feature-audit
          git show 64a414fc8a1af3b991076a35568f2c44cf4cf2d7:public/Games/assets/index-ulfuWNhj.js > /tmp/old.js
          git show 64a414fc8a1af3b991076a35568f2c44cf4cf2d7:public/Games/assets/index-Du4W04xP.css > /tmp/old.css
          python - <<'PY'
          from pathlib import Path
          import json, re

          old_js=Path("/tmp/old.js").read_text(encoding="utf-8",errors="ignore")
          old_css=Path("/tmp/old.css").read_text(encoding="utf-8",errors="ignore")
          out=Path("tools/old-preview-feature-audit")

          current_parts=[]
          for p in Path("src").rglob("*"):
              if p.is_file() and p.suffix.lower() in {".js",".jsx",".ts",".tsx",".json",".css",".html"}:
                  try: current_parts.append(p.read_text(encoding="utf-8"))
                  except Exception: pass
          current_text="\n".join(current_parts)
          current_lower=current_text.lower()

          # Extract likely application routes, API endpoints, external service URLs and page labels.
          route_rx=re.compile(r'/(?:[A-Za-z][A-Za-z0-9_-]{2,})(?:/[A-Za-z0-9_.?=&%-]+)*')
          old_routes=sorted(set(route_rx.findall(old_js)))
          cur_routes=sorted(set(route_rx.findall(current_text)))
          cur_route_lower={x.lower() for x in cur_routes}
          old_only_routes=[r for r in old_routes if r.lower() not in cur_route_lower]

          api_old=sorted(set(r for r in old_routes if r.startswith("/api/")))
          api_cur=sorted(set(r for r in cur_routes if r.startswith("/api/")))
          api_cur_lower={x.lower() for x in api_cur}
          old_only_api=[r for r in api_old if r.lower() not in api_cur_lower]

          url_rx=re.compile(r'https?://[^"\'\s<>]+')
          old_urls=sorted(set(url_rx.findall(old_js)))
          cur_urls=sorted(set(url_rx.findall(current_text)))
          cur_url_lower={x.lower() for x in cur_urls}
          old_only_urls=[u for u in old_urls if u.lower() not in cur_url_lower]

          # Extract quoted strings and keep old-only feature/user-facing candidates.
          qrx=re.compile(r'"((?:\\.|[^"\\]){3,180})"|\'((?:\\.|[^\'\\]){3,180})\'')
          vals=[]
          for m in qrx.finditer(old_js):
              s=(m.group(1) if m.group(1) is not None else m.group(2)).strip()
              if s: vals.append(s)

          junk=("bg-","text-","rounded","px-","py-","flex ","grid ","items-","justify-","shadow","border-",
                "hover:","focus:","sm:","md:","lg:","xl:","transition","absolute","relative","linear-gradient",
                "data:image","rgba(","rgb(","var(--","translate","rotate","scale","font-","stroke-","fill-",
                "M0 ","path","viewBox","xmlns","node_modules","react","lucide")
          feature_words=("game","question","vote","result","relationship","couple","journal","calendar","goal","memory",
                         "note","quiz","podcast","article","support","review","suggest","invite","profile","chat","language",
                         "subscription","payment","milestone","communication","date","scratch","friend","therap","coach",
                         "leaderboard","achievement","premium","cruise","influencer","developer","meditation","country",
                         "worldwide","category","search","share","filter","sign in","sign up","account","community")
          def candidate(s):
              if not (3<=len(s)<=180): return False
              if not re.search(r"[A-Za-z]",s): return False
              if any(x in s for x in junk): return False
              if s.count("{")+s.count("}")>2 or s.count(";")>2 or s.count("=")>2: return False
              return any(w in s.lower() for w in feature_words)

          seen=set(); old_only_strings=[]
          for s in vals:
              low=s.lower()
              if low in seen: continue
              seen.add(low)
              if candidate(s) and low not in current_lower:
                  old_only_strings.append(s)

          snippets=[]
          for s in old_only_strings[:300]:
              p=old_js.lower().find(s.lower())
              snippets.append({"string":s,"snippet":old_js[max(0,p-450):min(len(old_js),p+1250)]})

          # Explicit markers for known old-game capabilities.
          markers=[
              "What Should They Do","Question Browser","Another Question","See All","Cast Your Vote",
              "Worldwide","United States","United Kingdom","Canada","Australia",
              "Suggest a Question","Real People.","Real Dilemmas.","Real Opinions.",
              "Most Popular","countryMinimumVotes","preview"
          ]
          marker_status=[]
          for m in markers:
              marker_status.append({
                  "marker":m,
                  "old":m.lower() in old_js.lower(),
                  "current":m.lower() in current_lower
              })

          report={
              "source_commit":"64a414fc8a1af3b991076a35568f2c44cf4cf2d7",
              "old_bundle_bytes":len(old_js.encode("utf-8")),
              "old_routes":old_routes,
              "current_source_routes":cur_routes,
              "old_only_routes":old_only_routes,
              "old_api":api_old,
              "current_api":api_cur,
              "old_only_api":old_only_api,
              "old_only_urls":old_only_urls,
              "old_only_feature_strings":old_only_strings[:800],
              "marker_status":marker_status,
              "snippets":snippets,
          }
          (out/"report.json").write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          (out/"SUMMARY.md").write_text(
              "# Old Preview Feature Audit\n\n"
              f"- Preserved old bundle bytes: {report['old_bundle_bytes']}\n"
              f"- Old routes/tokens: {len(old_routes)}\n"
              f"- Old-only route/tokens: {len(old_only_routes)}\n"
              f"- Old-only API endpoints: {len(old_only_api)}\n"
              f"- Old-only feature strings: {len(old_only_strings)}\n",
              encoding="utf-8"
          )
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/old-preview-feature-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit preserved old O2OL features against current prelaunch"
          git push origin HEAD:o2ol-password-reset-preview
