name: O2OL Old Preview Feature Audit
# retrigger 2026-09-24

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-old-preview-feature-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 1

      - name: Compare old deployed preview with current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/old-preview-feature-audit
          mkdir -p tools/old-preview-feature-audit
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json, re

          OLD="https://one2onelove-preview.hwy99signs.workers.dev/Games"
          CUR="https://one2onelove-prelaunch.hwy99signs.workers.dev/"
          out=Path("tools/old-preview-feature-audit")

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.scripts=[]; self.styles=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="script" and d.get("src"): self.scripts.append(d["src"])
                  if tag=="link" and d.get("rel")=="stylesheet" and d.get("href"): self.styles.append(d["href"])

          def get(url):
              req=Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(req,timeout=90) as r: return r.read(),r.geturl()

          def bundle(page):
              html,final=get(page)
              p=P(); p.feed(html.decode("utf-8","ignore"))
              js=[]
              css=[]
              for s in p.scripts:
                  body,_=get(urljoin(final,s)); js.append(body.decode("utf-8","ignore"))
              for s in p.styles:
                  body,_=get(urljoin(final,s)); css.append(body.decode("utf-8","ignore"))
              return "\n".join(js),"\n".join(css),html.decode("utf-8","ignore")

          old_js,old_css,old_html=bundle(OLD)
          cur_js,cur_css,cur_html=bundle(CUR)

          current_src=[]
          for p in Path("src").rglob("*"):
              if p.is_file() and p.suffix.lower() in {".js",".jsx",".ts",".tsx",".json",".css",".html"}:
                  try: current_src.append(p.read_text(encoding="utf-8"))
                  except Exception: pass
          current_text="\n".join(current_src)
          current_lower=current_text.lower()

          def strings(text):
              vals=[]
              rx=re.compile(r'(?:"((?:\\.|[^"\\]){2,160})"|\'((?:\\.|[^\'\\]){2,160})\')')
              for m in rx.finditer(text):
                  s=m.group(1) if m.group(1) is not None else m.group(2)
                  try: s=bytes(s,"utf-8").decode("unicode_escape")
                  except Exception: pass
                  s=s.strip()
                  if s: vals.append(s)
              return vals

          old_strings=strings(old_js)
          cur_strings=strings(cur_js)

          route_rx=re.compile(r'/(?:[A-Za-z][A-Za-z0-9_-]{2,})(?:/[A-Za-z0-9_-]+)*')
          old_routes=sorted(set(route_rx.findall(old_js)))
          cur_routes=sorted(set(route_rx.findall(current_text)))

          api_old=sorted(set(x for x in old_routes if x.startswith("/api/")))
          api_cur=sorted(set(x for x in cur_routes if x.startswith("/api/")))

          # User-facing / feature-ish old strings absent from current source.
          junk_tokens=("bg-","text-","rounded","px-","py-","flex ","grid ","items-","justify-","shadow","border-",
                       "hover:","focus:","sm:","md:","lg:","xl:","transition","absolute","relative","https://","http://",
                       "linear-gradient","data:image","rgba(","rgb(","var(--","translate","rotate","scale","font-")
          def candidate(s):
              if not (3 <= len(s) <= 140): return False
              if not re.search(r"[A-Za-z]",s): return False
              if any(t in s for t in junk_tokens): return False
              if s.count("{")+s.count("}")>2: return False
              if s.count(";")>2 or s.count("=")>2: return False
              if re.fullmatch(r"[A-Za-z0-9_./:@+-]+",s) and " " not in s and not re.search(r"[A-Z].*[A-Z]",s):
                  return False
              return True

          old_unique=[]
          seen=set()
          for s in old_strings:
              key=s.strip()
              low=key.lower()
              if low in seen or not candidate(key): continue
              seen.add(low)
              if low not in current_lower:
                  old_unique.append(key)

          # Prioritize likely features/actions/pages.
          feature_words=("game","question","vote","result","relationship","couple","journal","calendar","goal","memory",
                         "note","quiz","podcast","article","support","review","suggest","invite","profile","chat","language",
                         "subscription","payment","milestone","communication","date","scratch","friend","therap","coach",
                         "leaderboard","achievement","premium","cruise","influencer","developer","meditation")
          prioritized=[s for s in old_unique if any(w in s.lower() for w in feature_words)]

          # Snippets around old-only prioritized strings, capped.
          snippets=[]
          for s in prioritized[:220]:
              p=old_js.lower().find(s.lower())
              if p>=0:
                  snippets.append({"string":s,"snippet":old_js[max(0,p-500):min(len(old_js),p+1200)]})

          report={
            "old_url":OLD,"current_url":CUR,
            "old_routes":old_routes,
            "current_source_routes":cur_routes,
            "old_only_routes":[r for r in old_routes if r.lower() not in {x.lower() for x in cur_routes}],
            "old_api":api_old,
            "current_api":api_cur,
            "old_only_api":[r for r in api_old if r.lower() not in {x.lower() for x in api_cur}],
            "prioritized_old_only_strings":prioritized[:400],
            "all_old_only_strings":old_unique[:1500],
            "snippets":snippets,
          }
          (out/"report.json").write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          (out/"SUMMARY.md").write_text(
              "# Old Preview Feature Audit\n\n"
              f"- Old routes: {len(old_routes)}\n"
              f"- Current source routes: {len(cur_routes)}\n"
              f"- Old-only routes: {len(report['old_only_routes'])}\n"
              f"- Old-only API routes: {len(report['old_only_api'])}\n"
              f"- Prioritized old-only strings: {len(prioritized)}\n",
              encoding="utf-8"
          )
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/old-preview-feature-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit old O2OL preview features against current prelaunch"
          git push origin HEAD:o2ol-password-reset-preview
