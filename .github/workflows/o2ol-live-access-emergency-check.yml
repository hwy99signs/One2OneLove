name: O2OL Live Open House Access Check

on:
  workflow_run:
    workflows:
      - Deploy O2OL Production Neon
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  verify-live-open-house:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Prepare Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Verify anonymous Open House browsing is available
        shell: bash
        env:
          LIVE_URL: https://one2onelove.com
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright-core';

          const BASE=process.env.LIVE_URL.replace(/\/$/,'');
          const browseRoutes=[
            '/',
            '/LoveNotes',
            '/DateIdeas',
            '/Community',
            '/MemoryLane',
            '/CoupleSupport',
            '/Games',
            '/SharedJournals',
            '/O2OLStudio',
            '/Chat',
            '/MyMatchIQ',
            '/Subscription',
            '/HelpCenter',
            '/TermsOfService'
          ];

          const browser=await chromium.launch({
            headless:true,
            executablePath:process.env.CHROME_BIN,
            args:['--no-sandbox']
          });

          try {
            for (const route of browseRoutes) {
              const context=await browser.newContext({
                viewport:{width:390,height:844},
                ignoreHTTPSErrors:false
              });
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
              const response=await page.goto(BASE+route,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(900);
              const finalPath=new URL(page.url()).pathname.toLowerCase();
              const text=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
              console.log(JSON.stringify({requested:route,status:response?.status()??null,finalPath,body:text.slice(0,500),pageErrors}));
              if (response?.status() !== 200) throw new Error(route+' returned '+response?.status());
              if (['/signin','/login'].includes(finalPath)) throw new Error(route+' incorrectly redirected to Sign In');
              if (text.length < 20) throw new Error(route+' rendered an empty page');
              if (pageErrors.length) throw new Error(route+' page errors: '+pageErrors.join(' | '));
              await context.close();
            }

            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:30000});
            const explore=page.getByRole('button',{name:/Explore Free/i}).first();
            await explore.click();
            await page.waitForTimeout(350);
            const toolsVisible=await page.locator('#open-house-tools').evaluate(el=>{
              const r=el.getBoundingClientRect();
              return r.top < innerHeight && r.bottom > 0;
            });
            if(!toolsVisible) throw new Error('Explore FREE did not reveal the tools area.');
            await context.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify anonymous protected APIs remain locked
        shell: bash
        env:
          LIVE_URL: https://one2onelove.com
        run: |
          set -euo pipefail

          check_unauthorized () {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local out
            out="$(mktemp)"
            if [ "$method" = "GET" ]; then
              code="$(curl -sS -o "$out" -w '%{http_code}' "$LIVE_URL$path")"
            else
              code="$(curl -sS -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' -X "$method" "$LIVE_URL$path" --data "$body")"
            fi
            cat "$out"
            echo
            echo "$method $path HTTP=$code"
            test "$code" = "401"
          }

          check_unauthorized GET /api/profile
          check_unauthorized POST /api/billing/checkout '{"planName":"Premiere"}'
          check_unauthorized POST /api/love-notes/send-sms '{"note_title":"Access test","note_content":"Access test","recipient_phone":"+15555550123"}'

      - name: Verify current Open House information
        shell: bash
        env:
          LIVE_URL: https://one2onelove.com
        run: |
          set -euo pipefail
          curl -fsS "$LIVE_URL/TermsOfService" | grep -F "root" >/dev/null
          curl -fsS "$LIVE_URL/Subscription" | grep -F "root" >/dev/null
