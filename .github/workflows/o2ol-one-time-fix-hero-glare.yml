name: One-time remove O2OL hero glare

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/o2ol-one-time-fix-hero-glare.yml"

permissions:
  contents: write

jobs:
  fix-hero-glare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image repair dependency
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.10.0.84

      - name: Remove only the small sun glare from the existing hero image
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path

          path = Path("public/assets/o2ol-hero.png")
          img = cv2.imread(str(path), cv2.IMREAD_COLOR)
          if img is None:
              raise SystemExit("Could not read O2OL hero image")
          if img.shape[:2] != (512, 512):
              raise SystemExit(f"Unexpected hero dimensions: {img.shape[:2]}")

          original = img.copy()

          # Tight region containing only the unwanted glare on the woman's dress/arm area.
          x0, x1 = 220, 260
          y0, y1 = 195, 235
          roi = img[y0:y1, x0:x1]
          b, g, r = cv2.split(roi)

          # Select the bright yellow/orange flare pixels, not the blue dress or normal skin.
          raw = ((r > 200) & (g > 125) & (b < 125)).astype(np.uint8) * 255

          count, labels, stats, centroids = cv2.connectedComponentsWithStats(raw, 8)
          target_x, target_y = 242 - x0, 214 - y0
          best = None
          best_dist = None
          for idx in range(1, count):
              area = stats[idx, cv2.CC_STAT_AREA]
              if area < 2:
                  continue
              cx, cy = centroids[idx]
              dist = (cx - target_x) ** 2 + (cy - target_y) ** 2
              if best is None or dist < best_dist:
                  best = idx
                  best_dist = dist

          if best is None:
              raise SystemExit("Expected glare highlight was not found; image left unchanged")

          selected = np.where(labels == best, 255, 0).astype(np.uint8)
          kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
          selected = cv2.dilate(selected, kernel, iterations=2)

          mask = np.zeros(img.shape[:2], dtype=np.uint8)
          mask[y0:y1, x0:x1] = selected

          # Repair only the selected glare area from surrounding native image pixels.
          edited = cv2.inpaint(img, mask, 3, cv2.INPAINT_TELEA)

          # Enforce pixel-for-pixel identity everywhere outside the tiny glare mask.
          edited[mask == 0] = original[mask == 0]

          changed = int(np.count_nonzero(np.any(edited != original, axis=2)))
          if changed == 0 or changed > 900:
              raise SystemExit(f"Unexpected changed-pixel count: {changed}")

          ok = cv2.imwrite(str(path), edited, [cv2.IMWRITE_PNG_COMPRESSION, 9])
          if not ok:
              raise SystemExit("Failed to save repaired hero image")

          print(f"Hero glare repaired. Dimensions unchanged at 512x512; changed pixels: {changed}")
          PY

      - name: Commit only repaired hero image and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/o2ol-one-time-fix-hero-glare.yml
          git add public/assets/o2ol-hero.png
          git commit -m "Remove sun glare from O2OL hero image"
          git push origin HEAD:master
