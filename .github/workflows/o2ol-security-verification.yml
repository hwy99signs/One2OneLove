name: O2OL Security Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify current O2OL security invariants
        run: node scripts/verify-o2ol-security-current.mjs
