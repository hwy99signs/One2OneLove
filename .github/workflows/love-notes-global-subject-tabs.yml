name: Love Notes Global Subject Tabs

on:
  push:
    branches:
      - love-notes-global-subject-tabs
    paths:
      - .github/love-notes-global-subject-tabs-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-global-subject-tabs
          fetch-depth: 0

      - name: Apply global subject tabs
        run: node scripts/standardize_love_notes_subject_tabs.cjs

      - name: Verify subject counts in every language and category
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const langs = ['en','es','fr','it','de'];
          const categoryOrder = [
            'romantic','lgbtqRomantic','lgbtqSupport','lgbtqMilestone','sweet','playful','deep','appreciation',
            'memories','future','morning','night','daily','special','dateIdeas','milestone','justBecause','encouragement','apology',
            'family','friends','heartBroken','sick','goodLuck','holiday','missingYou','religious','service','workplace'
          ];
          const dominant = { romantic:'romantic', lgbtqRomantic:'romantic', family:'family', friends:'casual', dateIdeas:'romantic' };
          const standard = ['romantic','romantic','romantic','romantic','romantic','family','family','family','family','family','casual','casual','casual','casual','casual'];
          const holiday = [
            'romantic','romantic','romantic','family','family','romantic','romantic','family','casual','romantic',
            'romantic','romantic','casual','family','casual','romantic','family','casual','family','romantic',
            'romantic','romantic','romantic','romantic','romantic',
            'family','family','family','family','family','family','family','family','family',
            'casual','casual','casual','casual','casual','casual','casual','casual','casual','casual','casual'
          ];
          const missing = ['romantic','romantic','romantic','romantic','romantic','family','family','family','family','family','casual','casual','casual','casual','casual'];
          const subjectFor = (category, index, note) => {
            if (note?.subject && ['romantic','family','casual'].includes(note.subject)) return note.subject;
            if (category === 'holiday') return holiday[index] || standard[index % standard.length];
            if (category === 'missingYou') return missing[index] || standard[index % standard.length];
            if (dominant[category]) return dominant[category];
            return standard[index % standard.length];
          };

          let mainSrc = fs.readFileSync('src/components/lovenotes/LoveNotesData.jsx','utf8');
          mainSrc = mainSrc.replace('export const loveNotesData =', 'globalThis.loveNotesData =');
          const mainCtx = { globalThis: {} }; vm.createContext(mainCtx); vm.runInContext(mainSrc, mainCtx);
          const main = mainCtx.globalThis.loveNotesData;

          let supplementSrc = fs.readFileSync('src/components/lovenotes/additional/LoveNotesSubjectSupplemental.js','utf8');
          supplementSrc = supplementSrc.replace('export const subjectSupplementalNotes =', 'globalThis.subjectSupplementalNotes =').replace('export default subjectSupplementalNotes;', '');
          const supplementCtx = { globalThis: {} }; vm.createContext(supplementCtx); vm.runInContext(supplementSrc, supplementCtx);
          const supplements = supplementCtx.globalThis.subjectSupplementalNotes;

          for (const lang of langs) {
            let addSrc = fs.readFileSync(`src/components/lovenotes/additional/LoveNotesAdditional.${lang}.js`,'utf8');
            addSrc = addSrc.replace('export default', 'globalThis.additional =');
            const addCtx = { globalThis: {} }; vm.createContext(addCtx); vm.runInContext(addSrc, addCtx);
            const added = addCtx.globalThis.additional;
            const base = main[lang] || main.en;
            const data = { ...base, ...added, holiday: [...(base.holiday || []), ...(added.holiday || [])] };
            let total = 0;
            for (const category of categoryOrder) {
              const counts = { romantic:0, family:0, casual:0 };
              const notes = data[category] || [];
              notes.forEach((note, index) => counts[subjectFor(category, index, note)]++);
              const bySubject = (supplements[lang] || supplements.en)[category] || {};
              for (const subject of ['romantic','family','casual']) {
                counts[subject] += (bySubject[subject] || []).length;
              }
              const categoryTotal = counts.romantic + counts.family + counts.casual;
              total += categoryTotal;
              if (counts.romantic < 5 || counts.family < 5 || counts.casual < 5) {
                throw new Error(`${lang}/${category}: below minimum subject count ${JSON.stringify(counts)}`);
              }
              if (category === 'holiday' && (counts.romantic !== 15 || counts.family !== 15 || counts.casual !== 15)) {
                throw new Error(`${lang}/holiday expected 15/15/15, got ${JSON.stringify(counts)}`);
              }
              if (category === 'missingYou' && (counts.romantic !== 5 || counts.family !== 5 || counts.casual !== 5)) {
                throw new Error(`${lang}/missingYou expected 5/5/5, got ${JSON.stringify(counts)}`);
              }
            }
            if (total !== 515) throw new Error(`${lang}: expected 515 total notes after subject-safe supplements, got ${total}`);
            console.log(`${lang}: ${total} notes; every category has >=5 Romantic, >=5 Family, >=5 Casual`);
          }

          const page = fs.readFileSync('src/pages/LoveNotes.jsx','utf8');
          for (const marker of ["id: 'casual'", 'Love note subjects', 'note.subject === selectedSubject', 'subjectSupplementalNotes']) {
            if (!page.includes(marker)) throw new Error(`Missing page marker: ${marker}`);
          }
          if (page.includes('Holiday note subcategories')) throw new Error('Holiday-only tab label still present');
          if (page.includes('holidaySubcategory')) throw new Error('Holiday-only subcategory data still present');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify only intended feature files changed from master
        run: |
          git diff --name-only origin/master...HEAD
          node <<'NODE'
          const { execSync } = require('child_process');
          const files = execSync('git diff --name-only origin/master...HEAD', {encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowed = new Set([
            'src/pages/LoveNotes.jsx',
            'src/components/lovenotes/additional/LoveNotesSubjectSupplemental.js',
            'scripts/standardize_love_notes_subject_tabs.cjs',
            '.github/workflows/love-notes-global-subject-tabs.yml',
            '.github/love-notes-global-subject-tabs-trigger'
          ]);
          for (const file of files) if (!allowed.has(file)) throw new Error(`Unexpected changed file: ${file}`);
          NODE

      - name: Commit generated Love Notes page change
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Standardize Love Notes subject tabs across collection"
          git push origin HEAD:love-notes-global-subject-tabs
