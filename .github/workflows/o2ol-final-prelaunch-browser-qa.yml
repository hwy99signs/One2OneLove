name: O2OL Final Credit Prelaunch Browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - prelaunch/final-consolidated-20261009
    paths:
      - ".github/o2ol-final-prelaunch-browser-qa-trigger"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://one2onelove-token-prelaunch.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prelaunch/final-consolidated-20261009
          fetch-depth: 0

      - name: Synchronize exact certified source
        shell: bash
        run: |
          set -euo pipefail
          TRIGGER_FILE=".github/o2ol-final-prelaunch-browser-qa-trigger"
          test -s "$TRIGGER_FILE" || { echo "Browser QA trigger is missing." >&2; exit 1; }
          SOURCE_SHA=$(awk -F= '$1=="certified_source"{print $2}' "$TRIGGER_FILE" | tr -d '[:space:]')
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Certified source SHA is invalid." >&2; exit 1; }
          echo "CERTIFIED_BROWSER_SOURCE_SHA=$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build exact final-prelaunch source
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Prepare browser
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run final-prelaunch responsive and role QA
        run: |
          set -euo pipefail
          node qa/o2ol-final-prelaunch-certification.mjs | tee /tmp/o2ol-final-prelaunch-browser-qa.txt
      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2ol-final-credit-prelaunch-browser-qa
          path: /tmp/o2ol-final-prelaunch-browser-qa.txt
          if-no-files-found: warn
