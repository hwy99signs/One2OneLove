name: O2OL Like Minded Launch Regression

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - "src/pages/LikeMinded.jsx"
      - "src/lib/likeMindedGame.js"
      - "src/lib/likeMindedQuestionVariants.js"
      - "src/lib/activityService.js"
      - "worker/like-minded.ts"
      - "worker/mymatchiq-functional-prelaunch.ts"
      - "neon-migrations/2026-10-01-like-minded-launch-hardening.sql"
      - ".github/workflows/o2ol-like-minded-launch-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  like-minded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Browser interaction QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 >/tmp/like-minded-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/LikeMinded >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/LikeMinded >/dev/null

          CHROME_BIN="$CHROME_BIN" node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const BASE='http://127.0.0.1:4173/LikeMinded';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          try{
            // Anonymous 5-question preview on a mobile viewport.
            {
              const context=await browser.newContext({viewport:{width:390,height:844}});
              await context.route('**/api/auth/get-session',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({user:null,session:null})}));
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
              const res=await page.goto(BASE,{waitUntil:'domcontentloaded',timeout:30000});
              if(res?.status()!==200)throw new Error('Anonymous Like Minded page status '+res?.status());
              await page.getByRole('button',{name:/Solo Self-Check/i}).first().click();
              const prompts=[];
              for(let i=0;i<5;i++){
                const prompt=(await page.locator('[data-testid="like-minded-prompt"]').textContent())?.trim();
                if(!prompt)throw new Error('Missing Solo prompt '+(i+1));
                prompts.push(prompt);
                const body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
                if(!body.includes('Depth: Real'))throw new Error('Selected Real depth drifted during Solo preview');
                await page.locator('[data-testid="like-minded-answer-0"]').click();
                await page.locator('[data-testid="like-minded-lock"]').click();
                await page.locator('[data-testid="like-minded-next"]').waitFor({state:'visible'});
                await page.locator('[data-testid="like-minded-next"]').click();
              }
              if(new Set(prompts).size!==5)throw new Error('Anonymous Solo preview repeated a prompt');
              await page.locator('[data-testid="like-minded-answer-0"]').click();
              await page.locator('[data-testid="like-minded-lock"]').click();
              const alert=page.locator('[role="alert"]');
              await alert.waitFor({state:'visible'});
              const alertText=(await alert.innerText()).trim();
              if(!/preview|sign in/i.test(alertText))throw new Error('Preview-limit message is not actionable: '+alertText);
              const used=await page.evaluate(()=>localStorage.getItem('o2ol_like_minded_preview_used'));
              if(used!=='5')throw new Error('Preview meter expected 5, got '+used);
              const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);
              if(overflow>6)throw new Error('Mobile horizontal overflow '+overflow+'px');
              if(errors.length)throw new Error('Anonymous page errors: '+errors.join(' | '));
              await context.close();
            }

            // Signed-in resume/safety state.
            {
              const context=await browser.newContext({viewport:{width:390,height:844}});
              const self='00000000-0000-4000-8000-000000000001';
              const other='00000000-0000-4000-8000-000000000002';
              const room={
                id:'00000000-0000-4000-8000-000000000010',code:'ABC123',
                host_user_id:self,guest_user_id:other,invited_user_id:null,
                category:'Relationship Goals',depth:'Deep',status:'active',
                set_number:1,current_question_no:2,my_locked:false,other_locked:false,both_locked:false,
                my_answer_id:null,other_answer_id:null,current_match:null,question_id:null,
                matches:0,total_answered:1,category_scores:{},
                opponent_user_id:other,opponent_first_name:'Jordan',
                created_at:new Date().toISOString(),updated_at:new Date().toISOString()
              };
              let authHits=0,likeHits=0;
              await context.route(/\/api\/auth\/get-session(?:\?|$)/,r=>{authHits++;return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                user:{id:self,email:'qa@example.invalid',emailVerified:true,name:'QA Member',role:'user',subscription_plan:'Exclusive',subscription_status:'active',phoneNumberVerified:true},
                session:{id:'qa-session',userId:self}
              })})});
              await context.route(/\/api\/profile(?:\?|$)/,r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profile:{
                id:self,email:'qa@example.invalid',name:'QA Member',role:'user',
                subscription_plan:'Exclusive',subscription_status:'active',subscription_price:19.99,
                stripe_customer_id:'cus_like_minded_qa',stripe_subscription_id:'sub_like_minded_qa',
                phone_number_verified:true,phoneNumberVerified:true,phone_verification_required:true,
                preferred_language:'en',created_at:'2026-09-01T00:00:00.000Z'
              }})}));
              await context.route(/\/api\/like-minded(?:\/|$)/,r=>{
                likeHits++;
                const p=new URL(r.request().url()).pathname;
                let body={ok:true};
                if(p==='/api/like-minded/access')body={ok:true,access:{plan:'Exclusive',dailyLimit:null,usedToday:3,remaining:null}};
                else if(p==='/api/like-minded/rooms/active')body={ok:true,room};
                else if(p==='/api/like-minded/history')body={ok:true,games:[room]};
                else if(p==='/api/like-minded/settings')body={ok:true,settings:{available:false,in_lobby:false,language:'en'}};
                else if(p==='/api/like-minded/rooms/ABC123')body={ok:true,room,access:{plan:'Exclusive',dailyLimit:null,usedToday:3,remaining:null}};
                return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
              });
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto(BASE,{waitUntil:'domcontentloaded',timeout:30000});
              try{
                await page.getByText(/Unlimited play/i).first().waitFor({state:'visible',timeout:10000});
              }catch{
                const debug=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,3000);
                throw new Error('Authenticated Like Minded state did not load; authHits='+authHits+' likeHits='+likeHits+' errors='+errors.join(' | ')+' body='+debug);
              }
              const resume=page.getByRole('button',{name:/Resume game/i}).first();
              await resume.waitFor({state:'visible',timeout:10000});
              await resume.click();
              await page.getByRole('button',{name:'Block',exact:true}).waitFor({state:'visible'});
              await page.getByRole('button',{name:'Report',exact:true}).waitFor({state:'visible'});
              const body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
              if(!body.includes('Jordan'))throw new Error('Opponent name missing after resume');
              if(!body.includes('Deep'))throw new Error('Deep room depth missing after resume');
              const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);
              if(overflow>6)throw new Error('Signed-in room horizontal overflow '+overflow+'px');
              if(errors.length)throw new Error('Signed-in page errors: '+errors.join(' | '));
              await context.close();
            }
          } finally { await browser.close(); }
          console.log('LIKE_MINDED_BROWSER_INTERACTION=PASS');
          NODE

      - name: Verify launch rules and non-repeating sequence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            LIKE_MINDED_PREVIEW_LIMIT,
            LIKE_MINDED_DAILY_LIMITS,
            LIKE_MINDED_MAX_ROOM_QUESTIONS,
            buildLikeMindedSlot,
            getLikeMindedAnswerChoices
          } from './src/lib/likeMindedGame.js';
          import { LIKE_MINDED_EXTRA_QUESTIONS } from './src/lib/likeMindedQuestionVariants.js';

          const categories=['Relationship Goals','Communication','Values','Family','Lifestyle','Money & Ambition','Boundaries','Future Priorities','Fun Scenarios','Humor','Activities','Food & Travel','Entertainment','Daily Preferences','Wild Card'];
          if(LIKE_MINDED_PREVIEW_LIMIT!==5) throw new Error('Anonymous preview limit changed');
          if(LIKE_MINDED_DAILY_LIMITS.Free!==10) throw new Error('Free limit changed');
          if(LIKE_MINDED_DAILY_LIMITS.Premiere!==63) throw new Error('Premiere limit changed');
          if(LIKE_MINDED_DAILY_LIMITS.Exclusive!==null) throw new Error('Exclusive must remain unlimited');
          if(LIKE_MINDED_MAX_ROOM_QUESTIONS!==42) throw new Error('Room question cap changed');

          for(const startingDepth of ['Easy','Real','Deep']){
            const slots=[];
            for(let setNo=1;setNo<=2;setNo++){
              for(let questionNo=1;questionNo<=21;questionNo++){
                slots.push(buildLikeMindedSlot(categories,'Relationship Goals',startingDepth,setNo,questionNo));
              }
            }
            if(new Set(slots.map(s=>s.questionId)).size!==42) throw new Error('Repeated question slot for '+startingDepth);
            if(slots.some(s=>s.depth!==startingDepth)) throw new Error('Selected depth drifted for '+startingDepth);
            if(slots.some(s=>s.variant<0||s.variant>2)) throw new Error('Invalid question variant for '+startingDepth);
          }

          for(const lang of ['en','es','fr','it','de']){
            for(const category of categories){
              for(const depth of ['Easy','Real','Deep']){
                const choices=getLikeMindedAnswerChoices(category,depth,lang);
                if(!Array.isArray(choices)||choices.length!==4||choices.some(x=>!String(x).trim())) throw new Error('Bad answer set '+lang+' '+category+' '+depth);
              }
            }
          }
          for(const lang of ['en','es','fr','it','de']){
            for(const category of categories){
              for(const depth of ['easy','real','deep']){
                const variants=LIKE_MINDED_EXTRA_QUESTIONS?.[category]?.[depth];
                if(!Array.isArray(variants)||variants.length!==2) throw new Error('Missing extra prompts '+category+' '+depth);
                for(const prompt of variants){
                  if(!String(prompt?.[lang]||'').trim()) throw new Error('Missing localized prompt '+lang+' '+category+' '+depth);
                }
              }
            }
          }
          console.log('LIKE_MINDED_SEQUENCE=PASS');
          console.log('LIKE_MINDED_ANSWER_LOCALIZATION=PASS');
          console.log('LIKE_MINDED_EXTRA_PROMPTS=PASS');
          NODE

      - name: Verify all 135 prompts are localized
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          page=Path('src/pages/LikeMinded.jsx').read_text(encoding='utf-8')
          start=page.index('const QUESTIONS = {')
          end=page.index('function ModeCard',start)
          block=page[start:end]
          rows=[
              line.strip() for line in block.splitlines()
              if line.strip().startswith(('easy:{en:', 'real:{en:', 'deep:{en:'))
          ]
          assert len(rows)==45, len(rows)
          for i,row in enumerate(rows,1):
              for lang in ['es','fr','it','de']:
                  assert f",{lang}:'" in row, (i,lang,row)
          assert 'const ANSWERS =' not in page

          extra=Path('src/lib/likeMindedQuestionVariants.js').read_text(encoding='utf-8')
          prompt_calls=sum(1 for line in extra.splitlines() if line.strip().startswith('q('))
          assert prompt_calls==90, prompt_calls
          for lang in ['en','es','fr','it','de']:
              assert f'{lang}' in extra
          print('LIKE_MINDED_135_PROMPTS_X_5_LANGUAGES=PASS')
          PY

      - name: Verify backend launch controls
        shell: bash
        run: |
          set -euo pipefail
          grep -F "phone_verified!==true" worker/like-minded.ts
          grep -F "DAILY_LIMITS={Free:10,Premiere:63,Exclusive:null}" worker/like-minded.ts
          grep -F "/api/like-minded/solo/use" worker/like-minded.ts
          grep -F "/api/like-minded/rooms/active" worker/like-minded.ts
          grep -F "/api/like-minded/history" worker/like-minded.ts
          grep -F "/finish" worker/like-minded.ts
          grep -F "status='blocked'" worker/like-minded.ts
          grep -F "status='abandoned'" worker/like-minded.ts
          grep -F "MAX_ROOM_QUESTIONS=42" worker/like-minded.ts
          grep -F "UNIQUE(user_id,usage_key)" worker/like-minded.ts
          grep -F "expectedQuestionId(room)" worker/like-minded.ts
          grep -F "question_mismatch" worker/like-minded.ts
          grep -F "general_location_required" worker/like-minded.ts
          grep -F "enforceRoomCreateRate" worker/like-minded.ts

      - name: Verify UI launch controls
        shell: bash
        run: |
          set -euo pipefail
          grep -F "LIKE_MINDED_PREVIEW_LIMIT" src/pages/LikeMinded.jsx
          grep -F "resumeRoom" src/pages/LikeMinded.jsx
          grep -F "recentGames" src/pages/LikeMinded.jsx
          grep -F "blockOpponent" src/pages/LikeMinded.jsx
          grep -F "reportOpponent" src/pages/LikeMinded.jsx
          grep -F "activeSlot.questionId" src/pages/LikeMinded.jsx
          grep -F "getLikeMindedPrompt" src/pages/LikeMinded.jsx
          grep -F "/api/like-minded/history" src/lib/activityService.js
          grep -F "url.pathname.startsWith('/api/auth/')" worker/mymatchiq-functional-prelaunch.ts
          grep -F "url.pathname==='/api/profile'" worker/mymatchiq-functional-prelaunch.ts
          grep -F "url.pathname==='/api/feature-usage'" worker/mymatchiq-functional-prelaunch.ts
          grep -F "prelaunch_api_blocked" worker/mymatchiq-functional-prelaunch.ts
