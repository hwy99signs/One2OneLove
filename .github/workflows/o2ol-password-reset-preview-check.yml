name: O2OL Password Reset Preview Check

on:
  push:
    branches:
      - o2ol-password-reset-preview

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund

      - name: Verify password reset code is bundled
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl '/api/auth/request-password-reset' dist >/dev/null
          grep -RIl '/api/auth/reset-password' dist >/dev/null

      - name: Wrangler dry run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
