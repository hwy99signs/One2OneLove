name: O2OL Password Reset Preview Check

on:
  push:
    branches:
      - o2ol-password-reset-preview

permissions:
  contents: read

# Only the newest Prelaunch validation may deploy/test the shared Preview Worker.
# This prevents overlapping pushes from replacing the Worker during browser QA.
concurrency:
  group: o2ol-prelaunch-validation
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://one2onelove-prelaunch.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deep static launch integrity audit
        run: node scripts/deep-launch-static-audit.mjs

      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund

      - name: Audit frontend dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit Worker dependencies for high-severity vulnerabilities
        run: npm --prefix worker audit --audit-level=high

      - name: Verify no stale launch placeholders or legacy pricing assumptions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules 'Promise\.resolve\(|Base44 removed' src worker 2>/dev/null; then
            echo 'Legacy migration placeholder found in active O2OL code.' >&2
            exit 1
          fi
          if grep -RInE 'isFree:[[:space:]]*true|price:[[:space:]]*0([,}]|$)|34\.99' src/components/subscriptions src/pages/Subscription.jsx 2>/dev/null; then
            echo 'Stale O2OL subscription pricing/free-plan assumption found.' >&2
            exit 1
          fi
          if grep -RInE 'Bas[i]s|bas[i]s' worker src/hooks src/lib/stripeService.js src/pages/Subscription.jsx src/pages/PaymentSuccess.jsx src/components/profile src/components/dateideas src/components/launch supabase supabase-add-subscription-fields.sql ENV_SETUP_INSTRUCTIONS.txt neon-migrations 2>/dev/null; then
            echo 'Legacy spelling of the O2OL Basic tier found.' >&2
            exit 1
          fi
          if grep -InE '3 SMS|limit of 3 SMS|>= 3' src/pages/LoveNotes.jsx 2>/dev/null; then
            echo 'Legacy three-SMS Love Notes client limit found.' >&2
            exit 1
          fi

      - name: Verify active O2OL stack stays Neon and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInEi 'supabase|supabase\.co|@supabase' src worker package.json package-lock.json public 2>/dev/null; then
            echo 'Legacy Supabase reference found in active O2OL application.' >&2
            exit 1
          fi
          if grep -RInEi '@base44|base44\.app|firebaseio\.com|@firebase/' src worker public 2>/dev/null \
             || grep -En '"(firebase|base44|@base44/[^"]+)"[[:space:]]*:' package.json package-lock.json 2>/dev/null; then
            echo 'Legacy Base44/Firebase dependency found in active O2OL application.' >&2
            exit 1
          fi
          if grep -RInEi 'vercel\.app|VERCEL_URL|@vercel/' src worker package.json package-lock.json public 2>/dev/null; then
            echo 'Vercel runtime reference found in active O2OL application.' >&2
            exit 1
          fi

      - name: Verify active code has no unsafe HTML execution primitives or plaintext runtime keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'dangerouslySetInnerHTML|new Function\(|(^|[^A-Za-z0-9_])eval\(' src worker 2>/dev/null; then
            echo 'Unsafe dynamic HTML/code execution primitive found in active O2OL code.' >&2
            exit 1
          fi
          if grep -RInE 'sk_(live|test)_[A-Za-z0-9]|sk-proj-[A-Za-z0-9]|whsec_[A-Za-z0-9]|re_[A-Za-z0-9]{20,}' src worker wrangler.toml cloudflare/wrangler.production.jsonc 2>/dev/null; then
            echo 'Plaintext runtime credential pattern found in active O2OL code/config.' >&2
            exit 1
          fi

      - name: Verify Twilio phone verification is the canonical entitlement gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git "plugin_configs->'phoneNumber'\|auth\.user\.phoneNumberVerified" worker/api-entitlements.ts; then
            echo "Legacy Neon phone-verification authority found in API entitlements."
            exit 1
          fi
          grep -q "TWILIO_VERIFY_SERVICE_SID" worker/api-entitlements.ts
          grep -q "phone_number_verified" worker/api-entitlements.ts

      - name: Verify Love Notes launch entitlements are present
        shell: bash
        run: |
          set -euo pipefail
          grep -F "/api/love-notes/categories" worker/love-note-entitlements.ts >/dev/null
          grep -F "function categoryLimit(plan)" worker/love-note-entitlements.ts >/dev/null
          grep -F "return 6;" worker/love-note-entitlements.ts >/dev/null
          grep -F "return 18;" worker/love-note-entitlements.ts >/dev/null
          grep -F "aiPersonalizationReady" src/pages/LoveNotes.jsx >/dev/null
          grep -F "effectivePlan === 'Exclusive'" src/pages/LoveNotes.jsx >/dev/null
          grep -F "['trial', 'trialing'].includes(status) ? 'Exclusive'" worker/ai.ts >/dev/null

      - name: Verify launch code is bundled
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl '/api/auth/request-password-reset' dist >/dev/null
          grep -RIl '/api/auth/reset-password' dist >/dev/null
          grep -RIl '/api/launch-signup/verify' dist >/dev/null
          grep -RIl '/api/community-chat/rooms' dist >/dev/null
          grep -RIl 'Get More Love Note Sends' dist >/dev/null
          grep -RIl '/api/love-notes/usage' dist >/dev/null
          grep -RIl 'Admin Verification' dist >/dev/null
          grep -RIl '/api/admin/mfa/status' dist >/dev/null
          grep -RIl '/api/phone-verification/send' dist >/dev/null
          grep -RIl '/api/phone-verification/verify' dist >/dev/null
          grep -RIl 'VerifyPhone' dist >/dev/null

      - name: Verify preview and production Worker isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name = "one2onelove-prelaunch"$' wrangler.toml
          grep -F '"name": "one2onelove-launch"' cloudflare/wrangler.production.jsonc >/dev/null
          ! grep -Eq '^name = "one2onelove-launch"$' wrangler.toml
          grep -F "branding_settings[display_name]" worker/billing.ts >/dev/null
          grep -F "branding_settings[display_name]" worker/send-credits.ts >/dev/null
          grep -F "one2onelove-prelaunch.hwy99signs.workers.dev" worker/launch-auth.ts >/dev/null
          grep -F "enforceLaunchIdentity" worker/index-v2.ts >/dev/null
          grep -F "phone_verification_required" src/components/launch/LaunchAccessGate.jsx >/dev/null

      - name: Enforce single canonical O2OL Prelaunch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "o2ol-password-reset-preview"
          grep -Eq '^name = "one2onelove-prelaunch"
      - name: Wrangler production-config dry run
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.production.jsonc

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Report production launch prerequisites without changing production
        shell: bash
        run: |
          set -u

          PREVIEW_SECRETS_JSON=$(npx --yes wrangler@latest secret list --name one2onelove-prelaunch --format json 2>/tmp/o2ol-prelaunch-secret-list.err || true)
          if printf '%s' "$PREVIEW_SECRETS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OPENAI_API_KEY RESEND_API_KEY RESEND_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
              if printf '%s' "$PREVIEW_SECRETS_JSON" | jq -e --arg name "$REQUIRED" '.[] | select(.name == $name)' >/dev/null; then
                echo "O2OL_PRELAUNCH_SECRET_$REQUIRED=yes"
              else
                echo "O2OL_PRELAUNCH_SECRET_$REQUIRED=no"
              fi
            done
          else
            echo "O2OL_PRELAUNCH_SECRET_LIST_READ=no"
            cat /tmp/o2ol-prelaunch-secret-list.err || true
          fi

          SECRETS_JSON=$(npx --yes wrangler@latest secret list --name one2onelove-launch --format json 2>/tmp/o2ol-secret-list.err || true)
          if printf '%s' "$SECRETS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OPENAI_API_KEY RESEND_API_KEY RESEND_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
              if printf '%s' "$SECRETS_JSON" | jq -e --arg name "$REQUIRED" '.[] | select(.name == $name)' >/dev/null; then
                echo "O2OL_PROD_SECRET_$REQUIRED=yes"
              else
                echo "O2OL_PROD_SECRET_$REQUIRED=no"
              fi
            done
          else
            echo "O2OL_PROD_SECRET_LIST_READ=no"
            cat /tmp/o2ol-secret-list.err || true
          fi

          ZONES_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=one2onelove.com' || true)
          if printf '%s' "$ZONES_JSON" | jq -e '.success == true and (.result | length) == 1' >/dev/null 2>&1; then
            echo "O2OL_CF_ZONE_READ=yes"
            ZONE_ID=$(printf '%s' "$ZONES_JSON" | jq -r '.result[0].id')
            ROUTES_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" || true)
            if printf '%s' "$ROUTES_JSON" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "O2OL_CF_ROUTE_READ=yes"
            else
              echo "O2OL_CF_ROUTE_READ=no"
            fi
          else
            echo "O2OL_CF_ZONE_READ=no"
            echo "O2OL_CF_ROUTE_READ=no"
          fi

      - name: Deploy workers.dev preview only
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Preview deploy attempt $attempt"
            if npx --yes wrangler@latest deploy --config wrangler.toml; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Preview deployment failed after 3 attempts." >&2
          exit 1

      - name: Verify preview API and password-reset endpoint
        shell: bash
        run: |
          set -euo pipefail
          READY=no
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PREVIEW_URL/api/health" || true)
            echo "health attempt $attempt -> $CODE"
            if [ "$CODE" = "200" ] && grep -F '"service":"one2onelove-api"' /tmp/health.json >/dev/null 2>&1; then
              READY=yes
              break
            fi
            sleep 5
          done
          test "$READY" = yes

          CODE=$(curl -sS --max-time 20 -o /tmp/reset.json -w '%{http_code}' \
            -X POST "$PREVIEW_URL/api/auth/request-password-reset" \
            -H 'content-type: application/json' \
            -H "origin: $PREVIEW_URL" \
            --data "{\"email\":\"o2ol-reset-preview-check@example.com\",\"redirectTo\":\"$PREVIEW_URL/ForgotPassword\"}")
          echo "password reset request -> $CODE"
          case "$CODE" in
            2*) ;;
            *) cat /tmp/reset.json; exit 1 ;;
          esac

      - name: Verify public API privacy and availability
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS --max-time 20 "$PREVIEW_URL/api/reviews" -o /tmp/reviews.json
          jq -e 'all(.reviews[]?; (has("user_id") | not) and (has("email") | not))' /tmp/reviews.json >/dev/null

          curl -fsS --max-time 20 "$PREVIEW_URL/api/stories" -o /tmp/stories.json
          jq -e 'all(.stories[]?; (has("user_id") | not) and (has("moderation_notes") | not) and (has("moderated_by") | not))' /tmp/stories.json >/dev/null

          CONTEST_URL="$PREVIEW_URL/api/contests/leaderboard?type=monthly_love_notes&period=2026-09&limit=1"
          curl -fsS --max-time 20 "$CONTEST_URL" -o /tmp/contest.json
          jq -e 'all(.participants[]?; (has("user_email") | not) and (has("email") | not))' /tmp/contest.json >/dev/null

          LEGACY_CONTEST_URL="$PREVIEW_URL/api/engagement/contests/leaderboard?type=monthly_love_notes&period=2026-09&limit=1"
          curl -fsS --max-time 20 "$LEGACY_CONTEST_URL" -o /tmp/legacy-contest.json
          jq -e 'all(.participants[]?; (has("user_email") | not) and (has("email") | not))' /tmp/legacy-contest.json >/dev/null

      - name: Report Suggestions storage readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PREVIEW_URL/api/suggestions/readiness" -o /tmp/suggestions-readiness.json
          cat /tmp/suggestions-readiness.json
          jq -e '.ok == true and (.ready | type == "boolean")' /tmp/suggestions-readiness.json >/dev/null

      - name: Report canonical O2OL launch readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PREVIEW_URL/api/launch-readiness" -o /tmp/o2ol-launch-readiness.json
          cat /tmp/o2ol-launch-readiness.json
          jq -e '
            .ok == true and
            (.readiness.requiredLaunchReady | type == "boolean") and
            (.readiness.database.requiredDatabaseReady | type == "boolean") and
            (.readiness.identity.requiredIdentityReady | type == "boolean") and
            (.readiness.billing.billingProviderReady | type == "boolean") and
            (.readiness.optionalProviders.aiProviderReady | type == "boolean") and
            (.readiness.optionalProviders.scheduledSmsReady | type == "boolean")
          ' /tmp/o2ol-launch-readiness.json >/dev/null

      - name: Verify launch identity readiness signal
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 20 -o /tmp/readiness.json -w '%{http_code}' "$PREVIEW_URL/api/launch-signup/readiness")
          echo "launch readiness -> $CODE"
          cat /tmp/readiness.json
          test "$CODE" = "200"
          jq -e '
            .ok == true and
            .readiness.consentTableReady == true and
            .readiness.emailVerificationReady == true and
            (.readiness.emailDeliveryReady | type == "boolean") and
            (.readiness.phoneVerificationReady | type == "boolean") and
            (.readiness.publicLaunchIdentityGateReady | type == "boolean") and
            (.readiness.billingDataReady | type == "boolean") and
            (.readiness.legacyEntitlementRows | type == "number")
          ' /tmp/readiness.json >/dev/null

      - name: Verify launch API route surface
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /api/goals
            /api/journals
            /api/milestones
            /api/date-ideas
            /api/memories
            /api/calendar-events
            /api/community-chat/rooms
            /api/billing/config
            /api/billing/change-plan
            /api/send-credits/balance
            /api/send-credits/config
            /api/love-notes/usage
            /api/launch-signup/readiness
            /api/launch-signup/verify
            /api/admin/mfa/status
            /api/admin/dashboard
            /api/admin/analytics
          )
          failed=0
          for route in "${routes[@]}"; do
            code=$(curl -sS --max-time 20 -o /tmp/route.json -w '%{http_code}' "$PREVIEW_URL$route" || true)
            echo "$route -> $code"
            case "$code" in
              200|201|204|400|401|402|403|405|409|428|429) ;;
              *) echo "Unexpected response for $route"; cat /tmp/route.json || true; failed=1 ;;
            esac
          done
          test "$failed" = 0

      - name: Verify launch SPA routes render
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            /
            /SignIn
            /SignUp
            /ForgotPassword
            /Subscription
            /VerifyPhone
            /Profile
            /LoveNotes
            /SendCredits
            /DateIdeas
            /MemoryLane
            /AnniversaryTracker
            /RelationshipGoals
            /RelationshipMilestones
            /SharedJournals
            /CouplesCalendar
            /RelationshipQuizzes
            /LoveLanguageQuiz
            /CommunicationPractice
            /CoupleSupport
            /CooperativeGames
            /WhatShouldTheyDo
            /Games
            /ScratchGame
            /ArticlesSupport
            /PodcastsSupport
            /LGBTQSupport
            /Chat
            /Invite
            /AdminAccess
            /Admin
            /Analytics
          )
          for page in "${pages[@]}"; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$PREVIEW_URL$page" || true)
            echo "$page -> $code"
            test "$code" = "200"
          done

      - name: Prepare system Chrome for deep UX audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run deep five-language UX and live-browser audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m node scripts/deep-launch-browser-audit.mjs

      - name: Upload deep launch audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2ol-deep-launch-audit
          path: audit-artifacts/
          if-no-files-found: ignore
 wrangler.toml
          if grep -RIn --exclude-dir=.git --exclude='*.md' 'one2onelove-preview' .github src worker wrangler.toml cloudflare 2>/dev/null; then
            echo "Retired one2onelove-preview deployment reference found in active O2OL configuration." >&2
            exit 1
          fi

          bad=0
          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            [ "$branch" = "o2ol-password-reset-preview" ] && continue
            [ "$branch" = "master" ] && continue
            case "$branch" in
              restore/*|*restore*) continue ;;
            esac
            case "$branch" in
              *prelaunch*|*preview*)
                echo "Unexpected active O2OL preview/prelaunch branch: $branch" >&2
                bad=1
                ;;
            esac
          done < <(git ls-remote --heads origin)
          test "$bad" = 0

      - name: Wrangler preview dry run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml

      - name: Wrangler production-config dry run
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.production.jsonc

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Report production launch prerequisites without changing production
        shell: bash
        run: |
          set -u

          PREVIEW_SECRETS_JSON=$(npx --yes wrangler@latest secret list --name one2onelove-prelaunch --format json 2>/tmp/o2ol-prelaunch-secret-list.err || true)
          if printf '%s' "$PREVIEW_SECRETS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OPENAI_API_KEY RESEND_API_KEY RESEND_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
              if printf '%s' "$PREVIEW_SECRETS_JSON" | jq -e --arg name "$REQUIRED" '.[] | select(.name == $name)' >/dev/null; then
                echo "O2OL_PRELAUNCH_SECRET_$REQUIRED=yes"
              else
                echo "O2OL_PRELAUNCH_SECRET_$REQUIRED=no"
              fi
            done
          else
            echo "O2OL_PRELAUNCH_SECRET_LIST_READ=no"
            cat /tmp/o2ol-prelaunch-secret-list.err || true
          fi

          SECRETS_JSON=$(npx --yes wrangler@latest secret list --name one2onelove-launch --format json 2>/tmp/o2ol-secret-list.err || true)
          if printf '%s' "$SECRETS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OPENAI_API_KEY RESEND_API_KEY RESEND_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
              if printf '%s' "$SECRETS_JSON" | jq -e --arg name "$REQUIRED" '.[] | select(.name == $name)' >/dev/null; then
                echo "O2OL_PROD_SECRET_$REQUIRED=yes"
              else
                echo "O2OL_PROD_SECRET_$REQUIRED=no"
              fi
            done
          else
            echo "O2OL_PROD_SECRET_LIST_READ=no"
            cat /tmp/o2ol-secret-list.err || true
          fi

          ZONES_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=one2onelove.com' || true)
          if printf '%s' "$ZONES_JSON" | jq -e '.success == true and (.result | length) == 1' >/dev/null 2>&1; then
            echo "O2OL_CF_ZONE_READ=yes"
            ZONE_ID=$(printf '%s' "$ZONES_JSON" | jq -r '.result[0].id')
            ROUTES_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" || true)
            if printf '%s' "$ROUTES_JSON" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "O2OL_CF_ROUTE_READ=yes"
            else
              echo "O2OL_CF_ROUTE_READ=no"
            fi
          else
            echo "O2OL_CF_ZONE_READ=no"
            echo "O2OL_CF_ROUTE_READ=no"
          fi

      - name: Deploy workers.dev preview only
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Preview deploy attempt $attempt"
            if npx --yes wrangler@latest deploy --config wrangler.toml; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Preview deployment failed after 3 attempts." >&2
          exit 1

      - name: Verify preview API and password-reset endpoint
        shell: bash
        run: |
          set -euo pipefail
          READY=no
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PREVIEW_URL/api/health" || true)
            echo "health attempt $attempt -> $CODE"
            if [ "$CODE" = "200" ] && grep -F '"service":"one2onelove-api"' /tmp/health.json >/dev/null 2>&1; then
              READY=yes
              break
            fi
            sleep 5
          done
          test "$READY" = yes

          CODE=$(curl -sS --max-time 20 -o /tmp/reset.json -w '%{http_code}' \
            -X POST "$PREVIEW_URL/api/auth/request-password-reset" \
            -H 'content-type: application/json' \
            -H "origin: $PREVIEW_URL" \
            --data "{\"email\":\"o2ol-reset-preview-check@example.com\",\"redirectTo\":\"$PREVIEW_URL/ForgotPassword\"}")
          echo "password reset request -> $CODE"
          case "$CODE" in
            2*) ;;
            *) cat /tmp/reset.json; exit 1 ;;
          esac

      - name: Verify public API privacy and availability
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS --max-time 20 "$PREVIEW_URL/api/reviews" -o /tmp/reviews.json
          jq -e 'all(.reviews[]?; (has("user_id") | not) and (has("email") | not))' /tmp/reviews.json >/dev/null

          curl -fsS --max-time 20 "$PREVIEW_URL/api/stories" -o /tmp/stories.json
          jq -e 'all(.stories[]?; (has("user_id") | not) and (has("moderation_notes") | not) and (has("moderated_by") | not))' /tmp/stories.json >/dev/null

          CONTEST_URL="$PREVIEW_URL/api/contests/leaderboard?type=monthly_love_notes&period=2026-09&limit=1"
          curl -fsS --max-time 20 "$CONTEST_URL" -o /tmp/contest.json
          jq -e 'all(.participants[]?; (has("user_email") | not) and (has("email") | not))' /tmp/contest.json >/dev/null

          LEGACY_CONTEST_URL="$PREVIEW_URL/api/engagement/contests/leaderboard?type=monthly_love_notes&period=2026-09&limit=1"
          curl -fsS --max-time 20 "$LEGACY_CONTEST_URL" -o /tmp/legacy-contest.json
          jq -e 'all(.participants[]?; (has("user_email") | not) and (has("email") | not))' /tmp/legacy-contest.json >/dev/null

      - name: Report Suggestions storage readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PREVIEW_URL/api/suggestions/readiness" -o /tmp/suggestions-readiness.json
          cat /tmp/suggestions-readiness.json
          jq -e '.ok == true and (.ready | type == "boolean")' /tmp/suggestions-readiness.json >/dev/null

      - name: Report canonical O2OL launch readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PREVIEW_URL/api/launch-readiness" -o /tmp/o2ol-launch-readiness.json
          cat /tmp/o2ol-launch-readiness.json
          jq -e '
            .ok == true and
            (.readiness.requiredLaunchReady | type == "boolean") and
            (.readiness.database.requiredDatabaseReady | type == "boolean") and
            (.readiness.identity.requiredIdentityReady | type == "boolean") and
            (.readiness.billing.billingProviderReady | type == "boolean") and
            (.readiness.optionalProviders.aiProviderReady | type == "boolean") and
            (.readiness.optionalProviders.scheduledSmsReady | type == "boolean")
          ' /tmp/o2ol-launch-readiness.json >/dev/null

      - name: Verify launch identity readiness signal
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 20 -o /tmp/readiness.json -w '%{http_code}' "$PREVIEW_URL/api/launch-signup/readiness")
          echo "launch readiness -> $CODE"
          cat /tmp/readiness.json
          test "$CODE" = "200"
          jq -e '
            .ok == true and
            .readiness.consentTableReady == true and
            .readiness.emailVerificationReady == true and
            (.readiness.emailDeliveryReady | type == "boolean") and
            (.readiness.phoneVerificationReady | type == "boolean") and
            (.readiness.publicLaunchIdentityGateReady | type == "boolean") and
            (.readiness.billingDataReady | type == "boolean") and
            (.readiness.legacyEntitlementRows | type == "number")
          ' /tmp/readiness.json >/dev/null

      - name: Verify launch API route surface
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /api/goals
            /api/journals
            /api/milestones
            /api/date-ideas
            /api/memories
            /api/calendar-events
            /api/community-chat/rooms
            /api/billing/config
            /api/billing/change-plan
            /api/send-credits/balance
            /api/send-credits/config
            /api/love-notes/usage
            /api/launch-signup/readiness
            /api/launch-signup/verify
            /api/admin/mfa/status
            /api/admin/dashboard
            /api/admin/analytics
          )
          failed=0
          for route in "${routes[@]}"; do
            code=$(curl -sS --max-time 20 -o /tmp/route.json -w '%{http_code}' "$PREVIEW_URL$route" || true)
            echo "$route -> $code"
            case "$code" in
              200|201|204|400|401|402|403|405|409|428|429) ;;
              *) echo "Unexpected response for $route"; cat /tmp/route.json || true; failed=1 ;;
            esac
          done
          test "$failed" = 0

      - name: Verify launch SPA routes render
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            /
            /SignIn
            /SignUp
            /ForgotPassword
            /Subscription
            /VerifyPhone
            /Profile
            /LoveNotes
            /SendCredits
            /DateIdeas
            /MemoryLane
            /AnniversaryTracker
            /RelationshipGoals
            /RelationshipMilestones
            /SharedJournals
            /CouplesCalendar
            /RelationshipQuizzes
            /LoveLanguageQuiz
            /CommunicationPractice
            /CoupleSupport
            /CooperativeGames
            /WhatShouldTheyDo
            /Games
            /ScratchGame
            /ArticlesSupport
            /PodcastsSupport
            /LGBTQSupport
            /Chat
            /Invite
            /AdminAccess
            /Admin
            /Analytics
          )
          for page in "${pages[@]}"; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$PREVIEW_URL$page" || true)
            echo "$page -> $code"
            test "$code" = "200"
          done

      - name: Prepare system Chrome for deep UX audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run deep five-language UX and live-browser audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m node scripts/deep-launch-browser-audit.mjs

      - name: Upload deep launch audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2ol-deep-launch-audit
          path: audit-artifacts/
          if-no-files-found: ignore
