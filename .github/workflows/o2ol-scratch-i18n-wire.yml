name: Wire Scratch Game I18N

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - ".github/workflows/o2ol-scratch-i18n-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-scratch-game-pwa

      - name: Load language layer before auth and app boot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("scratch-game/public/index.html")
          s=p.read_text(encoding="utf-8")
          old='<script defer src="/auth-gate.js"></script>'
          new='<script defer src="/i18n.js"></script>\n<script defer src="/auth-gate.js"></script>'
          if new not in s:
              if old not in s:
                  raise SystemExit("auth-gate script anchor not found")
              s=s.replace(old,new,1)
              p.write_text(s,encoding="utf-8")
          PY
          grep -Fq '<script defer src="/i18n.js"></script>' scratch-game/public/index.html
          grep -Fq '<script defer src="/auth-gate.js"></script>' scratch-game/public/index.html

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch-game/public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire five-language layer into Scratch Game"
          git push origin HEAD:o2ol-scratch-game-pwa
