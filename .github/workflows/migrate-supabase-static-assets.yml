name: Migrate Supabase Static Assets

on:
  push:
    branches:
      - full-neon-migration-2026-09-13

permissions:
  contents: write

jobs:
  migrate-assets:
    if: "!contains(github.event.head_commit.message, 'Migrate O2OL static assets off Supabase')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-neon-migration-2026-09-13
          fetch-depth: 0
      - name: Download currently approved public assets into repository
        shell: bash
        run: |
          mkdir -p public/assets
          curl -fL --retry 3 'https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/19ffc2fa2_ONE2ONELOVELOGO.png' -o public/assets/o2ol-logo.png
          curl -fL --retry 3 'https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/bd7450758_-appbackgroundphoto.png' -o public/assets/o2ol-hero.png
      - name: Replace Supabase asset URLs
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/19ffc2fa2_ONE2ONELOVELOGO.png': '/assets/o2ol-logo.png',
            'https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/bd7450758_-appbackgroundphoto.png': '/assets/o2ol-hero.png',
            'https://hphhmjcutesqsdnubnnw.supabase.co/storage/v1/object/public/app-assets/logo.png': '/assets/o2ol-logo.png',
          }
          for path in Path('src').rglob('*'):
            if path.suffix not in {'.js','.jsx','.ts','.tsx'}: continue
            text = path.read_text(encoding='utf-8')
            new = text
            for old, value in replacements.items(): new = new.replace(old, value)
            if new != text: path.write_text(new, encoding='utf-8')
      - name: Commit migrated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Migrate O2OL static assets off Supabase'
          git push origin HEAD:full-neon-migration-2026-09-13
