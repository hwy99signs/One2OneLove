name: Patch Love Notes Categories

on:
  push:
    branches:
      - love-notes-holiday-religious-service-workplace

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-holiday-religious-service-workplace
      - name: Count Love Notes library
        shell: python
        run: |
          from pathlib import Path
          import re
          files = [Path('src/components/lovenotes/LoveNotesData.jsx')] + sorted(Path('src/components/lovenotes/additional').glob('LoveNotesAdditional.*.js'))
          total = 0
          print('LOVE_NOTES_COUNT_START')
          for p in files:
              text = p.read_text(encoding='utf-8')
              count = len(re.findall(r'\{\s*title\s*:', text))
              total += count
              print(f'{p}: {count}')
          print(f'TOTAL_STORED_NOTE_OBJECTS={total}')
          print('LOVE_NOTES_COUNT_END')
