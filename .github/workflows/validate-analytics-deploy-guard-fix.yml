name: Validate Analytics Deploy Guard Fix

on:
  push:
    branches:
      - fix/site-language-analytics-deploy-guard-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npx wrangler deploy --dry-run --config ../cloudflare/wrangler.production.jsonc
      - name: Run production placeholder guard
        run: |
          if grep -RInE --exclude-dir=node_modules 'Promise\.resolve\(|Base44 removed' src worker 2>/dev/null; then
            echo 'Legacy migration placeholder found in active O2OL code.' >&2
            exit 1
          fi
