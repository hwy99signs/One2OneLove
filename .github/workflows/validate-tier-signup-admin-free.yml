name: Validate Tier Signup and Free Account Admin

on:
  push:
    branches:
      - fix/tier-signup-admin-free-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npx wrangler deploy --dry-run --config ../cloudflare/wrangler.production.jsonc

      - name: Static signup/admin guards
        run: |
          grep -q "subscription-tier-free" src/pages/Subscription.jsx
          grep -q "subscription-tier-premiere" src/pages/Subscription.jsx
          grep -q "subscription-tier-exclusive" src/pages/Subscription.jsx
          grep -q "subscription-card-" src/pages/Subscription.jsx
          grep -q "Signup & Free Account Funnel" src/pages/Admin.jsx
          grep -q "auth_only_no_profile" worker/admin.ts
          grep -q "registered_free" worker/admin.ts
          grep -q "pending_verification" worker/admin.ts

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser verify all signup entry points
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cat > tier-signup-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const tests=[
              {selector:'[data-analytics-id="subscription-tier-free"]', expect:'/SignUp?account=free&type=individual&source=tier-selector'},
              {selector:'[data-analytics-id="subscription-tier-premiere"]', contains:'/SignUp?plan=Premiere&type=individual&source=subscription-plan'},
              {selector:'[data-analytics-id="subscription-tier-exclusive"]', contains:'/SignUp?plan=Exclusive&type=individual&source=subscription-plan'},
              {selector:'[data-analytics-id="subscription-card-premiere"]', contains:'/SignUp?plan=Premiere&type=individual&source=subscription-plan'},
              {selector:'[data-analytics-id="subscription-card-exclusive"]', contains:'/SignUp?plan=Exclusive&type=individual&source=subscription-plan'},
            ];
            for(const t of tests){
              const context=await browser.newContext();
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/api/subscription/founding-offer', route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({available:false})}));
              await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(300);
              const el=page.locator(t.selector);
              if(!(await el.isVisible())) throw new Error('Missing visible selector '+t.selector);
              if(await el.isDisabled?.()) throw new Error('Selector disabled '+t.selector);
              await el.click();
              await page.waitForTimeout(150);
              const current=new URL(page.url());
              const actual=current.pathname+current.search;
              if(t.expect && actual!==t.expect) throw new Error(t.selector+' => '+actual+' expected '+t.expect);
              if(t.contains && actual!==t.contains) throw new Error(t.selector+' => '+actual+' expected '+t.contains);
              if(errors.length) throw new Error(t.selector+' page errors: '+errors.join(' | '));
              console.log(t.selector+' => '+actual);
              await context.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node tier-signup-audit.cjs
