name: O2OL Launch Trust Surfaces

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-launch-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify five-language trust surfaces
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/pages/TherapistSignup.jsx \
            src/pages/ProfessionalSignup.jsx \
            src/pages/InfluencerSignup.jsx \
            src/pages/InfluencersSupport.jsx \
            src/pages/Reviews.jsx \
            src/pages/Blog.jsx \
            src/pages/ArticlesSupport.jsx \
            src/pages/Leaderboard.jsx \
            src/pages/Achievements.jsx \
            src/pages/PremiumFeatures.jsx \
            src/pages/Suggestions.jsx \
            src/pages/LGBTQSupport.jsx \
            src/pages/Subscription.jsx \
            src/pages/PaymentSuccess.jsx; do
            for lang in en es fr it de; do grep -q "${lang}:" "$file"; done
          done
          grep -q '/RoomCreatorAccess' src/pages/InfluencerSignup.jsx
          grep -q '/RoomCreatorAccess' src/pages/InfluencersSupport.jsx
          grep -q '/Community' src/pages/Reviews.jsx
          grep -q '/RelationshipLibrary' src/pages/Blog.jsx
          grep -q '/RelationshipLibrary' src/pages/ArticlesSupport.jsx
          grep -q '/RelationshipGoals' src/pages/Leaderboard.jsx
          grep -q '/RelationshipRituals' src/pages/Achievements.jsx
          grep -q '/RelationshipLibrary' src/pages/PremiumFeatures.jsx
          grep -q '/ContactUs' src/pages/Suggestions.jsx
          grep -q '/CommunicationPractice' src/pages/LGBTQSupport.jsx
          grep -q '/ContactUs' src/pages/Subscription.jsx
          grep -q '/ContactUs' src/pages/PaymentSuccess.jsx

      - name: Reject fabricated or inactive-program behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '123456|registerTherapist|therapist-photos|licensedCountries|consultationFee|tempPassword|<form|<Input|<Textarea|supabase|useAuth' src/pages/TherapistSignup.jsx; then
            echo 'Therapist intake must remain inactive until verified professional onboarding launches.'
            exit 1
          fi
          if grep -Eq 'registerProfessional|professional-photos|<form|<Input|<Textarea|supabase|useAuth' src/pages/ProfessionalSignup.jsx; then
            echo 'General professional intake must remain inactive for launch.'
            exit 1
          fi
          if grep -Eq 'registerInfluencer|influencer-photos|followerCount|<form|<Input|<Textarea|supabase|useAuth' src/pages/InfluencerSignup.jsx; then
            echo 'Legacy influencer intake must route to Global Room creator access instead.'
            exit 1
          fi
          if grep -Eq 'Sarah & Mike Johnson|Dr\. Emily Chen|The Love Lab|2\.5M|1\.8M|950K' src/pages/InfluencersSupport.jsx; then
            echo 'Fabricated influencer directory data must not return.'
            exit 1
          fi
          if grep -Eq 'Sarah & James|Maria & Carlos|Emma & Lisa|4\.9|Average Rating' src/pages/Reviews.jsx; then
            echo 'Fabricated reviews or ratings must not return.'
            exit 1
          fi
          if grep -Eq 'Dr\. Sarah Johnson|Emily Chen|Michael Brown|Dr\. Lisa Martinez|Nov 10, 2025' src/pages/Blog.jsx; then
            echo 'Fabricated blog authors/posts must not return.'
            exit 1
          fi
          if grep -Eq 'Dr\. Sarah Mitchell|Join thousands|<form|<Input|subscribe|subscribed' src/pages/ArticlesSupport.jsx; then
            echo 'Fabricated article or audience-capture behavior must not return.'
            exit 1
          fi
          if grep -Eq 'Emma & James|Sofia & Lucas|mockLeaderboard|gamification_points|Your Rank|Top Couples' src/pages/Leaderboard.jsx; then
            echo 'Mock public relationship rankings must not return.'
            exit 1
          fi
          if grep -Eq 'earned:[[:space:]]*true|gamification_points|Romantic Streak|Power Couple|pointsActivities' src/pages/Achievements.jsx; then
            echo 'Pretend earned achievements or point rewards must not return.'
            exit 1
          fi
          if grep -Eq 'gamification_points|unlockPoints|unlockLevel|Advanced AI Relationship Coach|Unlimited Love Notes|Activate Now|supabase|useAuth' src/pages/PremiumFeatures.jsx; then
            echo 'Fake premium unlocks or inactive paid benefits must not return.'
            exit 1
          fi
          if grep -Eq '<form|<Input|<Textarea|toast\.success|successMessage|setFormData' src/pages/Suggestions.jsx; then
            echo 'Suggestions must not claim persistence until a real backend exists.'
            exit 1
          fi
          if grep -Eq '1-866-488-7386|1-877-565-8860|1-888-843-4564|Finding LGBTQ\+ Affirming Therapists|Legal Rights & Marriage Equality|Connect with therapists' src/pages/LGBTQSupport.jsx; then
            echo 'Unverified location-sensitive LGBTQ resources must not return.'
            exit 1
          fi
          if grep -Eq 'redirectToCheckout|createBillingPortalSession|19\.99|34\.99|Basic: \{|Premiere: \{|Exclusive: \{' src/pages/Subscription.jsx; then
            echo 'Paid membership checkout or legacy prices must not be active at launch.'
            exit 1
          fi
          if grep -Eq 'verifyCheckoutSession|payment.*success|subscription.*activated|checkout_session|stripe' src/pages/PaymentSuccess.jsx; then
            echo 'Legacy payment-success route must not imply payment confirmation before paid launch.'
            exit 1
          fi

      - name: Lint trust surfaces
        run: >-
          npx eslint
          src/pages/TherapistSignup.jsx
          src/pages/ProfessionalSignup.jsx
          src/pages/InfluencerSignup.jsx
          src/pages/InfluencersSupport.jsx
          src/pages/Reviews.jsx
          src/pages/Blog.jsx
          src/pages/ArticlesSupport.jsx
          src/pages/Leaderboard.jsx
          src/pages/Achievements.jsx
          src/pages/PremiumFeatures.jsx
          src/pages/Suggestions.jsx
          src/pages/LGBTQSupport.jsx
          src/pages/Subscription.jsx
          src/pages/PaymentSuccess.jsx
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
