name: Reduce Header Height 15 Percent

on:
  push:
    branches:
      - master
    paths:
      - .github/reduce-header-height-15-trigger

permissions:
  contents: write

jobs:
  header-height-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Reduce only blue header banner height by 15 percent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Layout.jsx')
          text = path.read_text()
          old = '<div className="max-w-[1400px] mx-auto px-5 py-3 flex items-center justify-between gap-5">'
          new = '<div className="max-w-[1400px] mx-auto px-5 py-[0.225rem] flex items-center justify-between gap-5">'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exact header container once on master, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff -- src/pages/Layout.jsx
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/pages/Layout.jsx"

      - name: Build master
        run: npm ci && npm run build

      - name: Commit master header-height change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/Layout.jsx
          git commit -m "Reduce only blue header banner height by 15 percent"
          git push origin master

      - name: Mirror exact header-height change to active Neon migration
        shell: bash
        run: |
          set -euo pipefail
          git checkout full-neon-migration-2026-09-13
          git pull --ff-only origin full-neon-migration-2026-09-13
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Layout.jsx')
          text = path.read_text()
          old = '<div className="max-w-[1400px] mx-auto px-5 py-3 flex items-center justify-between gap-5">'
          new = '<div className="max-w-[1400px] mx-auto px-5 py-[0.225rem] flex items-center justify-between gap-5">'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exact header container once on migration branch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/pages/Layout.jsx"
          git add src/pages/Layout.jsx
          git commit -m "Mirror 15 percent header-height reduction into Neon migration"
          git push origin full-neon-migration-2026-09-13

      - name: Remove temporary workflow and trigger from master
        shell: bash
        run: |
          set -euo pipefail
          git checkout master
          git pull --ff-only origin master
          rm -f .github/workflows/reduce-header-height-15.yml .github/reduce-header-height-15-trigger
          git add -A .github/workflows/reduce-header-height-15.yml .github/reduce-header-height-15-trigger
          git commit -m "Remove temporary header-height workflow [skip ci]"
          git push origin master
