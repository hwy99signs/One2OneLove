name: Holiday Neon Tabs Build

on:
  push:
    branches:
      - love-notes-holiday-neon-tabs
    paths:
      - .github/holiday-neon-tabs-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-holiday-neon-tabs
          fetch-depth: 0

      - name: Add neon flashing Holiday tabs
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/LoveNotes.jsx')
          text = p.read_text(encoding='utf-8')

          old_tabs = """  const holidaySubcategories = [
    { id: 'all', name: allHolidayLabels[currentLanguage] || allHolidayLabels.en, icon: '🎉' },
    { id: 'romantic', name: t.categories.romantic, icon: '🌹' },
    { id: 'family', name: t.categories.family, icon: '👨‍👩‍👧‍👦' },
    { id: 'friends', name: t.categories.friends, icon: '👫' },
  ];"""

          new_tabs = """  const holidaySubcategories = [
    {
      id: 'all',
      name: allHolidayLabels[currentLanguage] || allHolidayLabels.en,
      neonClass: 'border-cyan-300 bg-cyan-50 text-cyan-700 shadow-[0_0_8px_rgba(34,211,238,0.95),0_0_18px_rgba(34,211,238,0.65)]',
      activeClass: 'border-cyan-200 bg-cyan-400 text-slate-950 shadow-[0_0_12px_rgba(34,211,238,1),0_0_26px_rgba(34,211,238,0.9)]',
    },
    {
      id: 'romantic',
      name: t.categories.romantic,
      neonClass: 'border-fuchsia-300 bg-fuchsia-50 text-fuchsia-700 shadow-[0_0_8px_rgba(232,121,249,0.95),0_0_18px_rgba(217,70,239,0.65)]',
      activeClass: 'border-fuchsia-200 bg-fuchsia-400 text-slate-950 shadow-[0_0_12px_rgba(232,121,249,1),0_0_26px_rgba(217,70,239,0.9)]',
    },
    {
      id: 'family',
      name: t.categories.family,
      neonClass: 'border-lime-300 bg-lime-50 text-lime-700 shadow-[0_0_8px_rgba(163,230,53,0.95),0_0_18px_rgba(132,204,22,0.65)]',
      activeClass: 'border-lime-200 bg-lime-400 text-slate-950 shadow-[0_0_12px_rgba(163,230,53,1),0_0_26px_rgba(132,204,22,0.9)]',
    },
    {
      id: 'friends',
      name: t.categories.friends,
      neonClass: 'border-violet-300 bg-violet-50 text-violet-700 shadow-[0_0_8px_rgba(196,181,253,0.95),0_0_18px_rgba(139,92,246,0.65)]',
      activeClass: 'border-violet-200 bg-violet-400 text-white shadow-[0_0_12px_rgba(196,181,253,1),0_0_26px_rgba(139,92,246,0.9)]',
    },
  ];"""

          if old_tabs not in text:
              raise SystemExit('Holiday subcategory definition block not found')
          text = text.replace(old_tabs, new_tabs, 1)

          old_class = """                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${
                    selectedHolidaySubcategory === subcategory.id
                      ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-sm'
                      : 'bg-transparent text-gray-600 hover:bg-pink-50 hover:text-pink-700'
                  }`}
                >"""

          new_class = """                  className={`px-3 py-1.5 rounded-lg border text-xs sm:text-sm font-extrabold tracking-wide transition-all animate-pulse motion-reduce:animate-none hover:scale-105 ${
                    selectedHolidaySubcategory === subcategory.id
                      ? subcategory.activeClass
                      : subcategory.neonClass
                  }`}
                  style={{ animationDuration: '0.9s' }}
                >"""

          if old_class not in text:
              raise SystemExit('Holiday subcategory tab styling block not found')
          text = text.replace(old_class, new_class, 1)

          p.write_text(text, encoding='utf-8')

      - name: Verify neon Holiday tabs
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/pages/LoveNotes.jsx').read_text(encoding='utf-8')
          required = [
            "animate-pulse motion-reduce:animate-none",
            "style={{ animationDuration: '0.9s' }}",
            "shadow-[0_0_8px_rgba(34,211,238,0.95)",
            "shadow-[0_0_8px_rgba(232,121,249,0.95)",
            "shadow-[0_0_8px_rgba(163,230,53,0.95)",
            "shadow-[0_0_8px_rgba(196,181,253,0.95)",
            "note.holidaySubcategory === selectedHolidaySubcategory",
            'aria-label="Holiday note subcategories"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Holiday neon tab wiring: {missing}')
          print('Verified neon flashing Holiday subcategory tabs and preserved filtering.')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Holiday neon tabs
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Style Holiday subcategory tabs with neon pulse"
          git push origin HEAD:love-notes-holiday-neon-tabs
