name: Holiday Neon Tabs Build

on:
  push:
    branches:
      - love-notes-holiday-neon-tabs
    paths:
      - .github/holiday-neon-tabs-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-holiday-neon-tabs
          fetch-depth: 0

      - name: Patch Holiday neon tabs
        run: python scripts/patch_holiday_neon_tabs.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Holiday neon tabs
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Style Holiday subcategory tabs with neon pulse"
          git push origin HEAD:love-notes-holiday-neon-tabs
