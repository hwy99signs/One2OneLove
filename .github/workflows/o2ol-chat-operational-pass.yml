name: O2OL Chat Operational Pass

on:
  push:
    branches:
      - o2ol/launch-hardening-20260906
    paths:
      - .github/workflows/o2ol-chat-operational-pass.yml

permissions:
  contents: write

jobs:
  chat-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: o2ol/launch-hardening-20260906

      - name: Repair buddy-to-chat handoff and message ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          chat_page = Path('src/pages/Chat.jsx')
          text = chat_page.read_text()
          old = "    const userId = searchParams.get('userId');"
          new = "    const userId = searchParams.get('userId') || searchParams.get('user');"
          if old not in text:
              raise SystemExit('Expected Chat URL parameter line not found')
          chat_page.write_text(text.replace(old, new, 1))

          friends = Path('src/pages/FindFriends.jsx')
          text = friends.read_text()
          old = "navigate(`${createPageUrl('Chat')}?user=${userData.id}&name=${encodeURIComponent(userData.name)}`);"
          new = "navigate(`${createPageUrl('Chat')}?userId=${userData.id}&name=${encodeURIComponent(userData.name)}`);"
          if old not in text:
              raise SystemExit('Expected FindFriends chat link not found')
          friends.write_text(text.replace(old, new, 1))

          service = Path('src/lib/chatService.js')
          text = service.read_text()

          edit_start = text.index('export const editMessage = async')
          delete_start = text.index('export const deleteMessage = async')
          edit_segment = text[edit_start:delete_start]
          auth_anchor = "    console.log('✏️ Editing message:', messageId);\n"
          if auth_anchor not in edit_segment:
              raise SystemExit('Expected edit auth anchor not found')
          edit_segment = edit_segment.replace(auth_anchor, auth_anchor + "\n    const { data: { user } } = await supabase.auth.getUser();\n    if (!user) throw new Error('User not authenticated');\n", 1)
          edit_filter = "      .eq('id', messageId)\n      .select()"
          if edit_filter not in edit_segment:
              raise SystemExit('Expected edit sender filter anchor not found')
          edit_segment = edit_segment.replace(edit_filter, "      .eq('id', messageId)\n      .eq('sender_id', user.id)\n      .select()", 1)
          text = text[:edit_start] + edit_segment + text[delete_start:]

          delete_start = text.index('export const deleteMessage = async')
          settings_start = text.index('export const updateConversationSettings = async')
          delete_segment = text[delete_start:settings_start]
          delete_anchor = "    console.log('🗑️ Deleting message:', messageId);\n"
          if delete_anchor not in delete_segment:
              raise SystemExit('Expected delete auth anchor not found')
          delete_segment = delete_segment.replace(delete_anchor, delete_anchor + "\n    const { data: { user } } = await supabase.auth.getUser();\n    if (!user) throw new Error('User not authenticated');\n", 1)
          delete_filter = "      .eq('id', messageId);"
          if delete_filter not in delete_segment:
              raise SystemExit('Expected delete sender filter anchor not found')
          delete_segment = delete_segment.replace(delete_filter, "      .eq('id', messageId)\n      .eq('sender_id', user.id);", 1)
          text = text[:delete_start] + delete_segment + text[settings_start:]
          service.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build operational preview
        env:
          VITE_NEON_AUTH_URL: https://ep-snowy-field-arynp1lg.neonauth.c-4.us-west-2.aws.neon.tech/one2onelove/auth
          VITE_NEON_DATA_API_URL: https://ep-snowy-field-arynp1lg.apirest.c-4.us-west-2.aws.neon.tech/one2onelove/rest/v1
        run: npm run build

      - name: Deploy operational preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc

      - name: Commit chat operational fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Chat.jsx src/pages/FindFriends.jsx src/lib/chatService.js
          git commit -m "Make buddy-to-chat flow operational on Neon"
          git push origin HEAD:o2ol/launch-hardening-20260906
