name: O2OL Memory Form One-Time Migration Fix

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-memory-form-migration-fix.yml

permissions:
  contents: write

jobs:
  patch-memory-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Connect memory media upload to Cloudflare R2
        env:
          REPLACEMENT_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('src/components/memories/MemoryForm.jsx')
          text = path.read_text()
          import_anchor = 'import { useLanguage } from "@/Layout";\n'
          import_line = 'import { uploadMemoryMedia } from "@/lib/memoryService";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('MemoryForm import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          start = text.index('  const handleFileUpload = async (files) => {')
          end = text.index('\n  const handleRemoveMedia = (index) => {', start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit memory form migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/memories/MemoryForm.jsx
          git commit -m "Connect Memory Lane uploads to Cloudflare R2"
          git push origin HEAD:o2ol-password-reset-preview
