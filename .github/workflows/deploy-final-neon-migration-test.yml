name: Deploy Final Neon Migration Test

on:
  push:
    branches:
      - full-neon-migration-2026-09-13
    paths:
      - .github/deploy-final-neon-migration-trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://one2onelove-launch.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-neon-migration-2026-09-13
          fetch-depth: 0

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build migrated frontend
        run: |
          npm ci
          npm run build
          npm --prefix worker install --no-audit --no-fund

      - name: Make workers.dev-only config from migrated runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('cloudflare/wrangler.production.jsonc')
          data=json.loads(src.read_text())
          data.pop('routes',None)
          data['workers_dev']=True
          Path('cloudflare/wrangler.final-migration-test.jsonc').write_text(json.dumps(data,indent=2)+'\n')
          PY
          grep -F '"main": "../worker/index-v2.ts"' cloudflare/wrangler.final-migration-test.jsonc
          grep -F '"run_worker_first"' cloudflare/wrangler.final-migration-test.jsonc
          ! grep -F 'one2onelove.com' cloudflare/wrangler.final-migration-test.jsonc

      - name: Deploy full migrated Worker runtime and assets
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.final-migration-test.jsonc

      - name: Verify migrated frontend bundle is live
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_JS=$(grep -oE 'src="[^"]+\.js"' dist/index.html | head -1 | sed 's/src="//;s/"//')
          MATCHED=no
          for attempt in $(seq 1 12); do
            REMOTE_JS=$(curl -fsS "$WORKER_URL/" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
            echo "Attempt $attempt: local=$LOCAL_JS remote=$REMOTE_JS"
            if [ "$LOCAL_JS" = "$REMOTE_JS" ]; then MATCHED=yes; break; fi
            sleep 5
          done
          test "$MATCHED" = yes
          curl -fsS "$WORKER_URL$LOCAL_JS" -o /tmp/app.js
          grep -F '/api/consents/adult-sensitive' /tmp/app.js >/dev/null
          grep -F '/api/contests/leaderboard' /tmp/app.js >/dev/null
          if grep -Fi 'supabase' /tmp/app.js; then echo 'Legacy Supabase marker in live bundle' >&2; exit 1; fi

      - name: Verify Worker API routing is JSON not SPA HTML
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            URL="$1"; EXPECT="$2"; OUT="$3"
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$URL")
            TYPE=$(curl -sSI "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')
            echo "$URL -> $CODE $TYPE"
            cat "$OUT"
            test "$CODE" = "$EXPECT"
            grep -qi '^{' "$OUT"
            ! grep -qi '<!doctype html' "$OUT"
          }
          check_json "$WORKER_URL/api/health" 200 /tmp/health.json
          grep -F '"service":"one2onelove-api"' /tmp/health.json
          check_json "$WORKER_URL/api/reviews" 200 /tmp/reviews.json
          check_json "$WORKER_URL/api/memories" 401 /tmp/memories.json
          check_json "$WORKER_URL/api/consents/adult-sensitive" 401 /tmp/consent.json
          check_json "$WORKER_URL/api/contests/my-rank?type=monthly_love_notes&period=2026-09" 401 /tmp/rank.json
          echo 'FINAL_NEON_WORKER_TEST_VERIFIED=yes'
