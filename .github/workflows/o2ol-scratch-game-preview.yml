name: O2OL Scratch Game Cloudflare Preview

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - "scratch-game/**"
      - ".github/workflows/o2ol-scratch-game-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2ol-scratch-game-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://one2onelove-scratch-game-preview.hwy99signs.workers.dev
    defaults:
      run:
        working-directory: scratch-game
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Verify browser has no embedded bank
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "const questionBank" public worker 2>/dev/null
      - name: Wrangler dry run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
      - name: Deploy Cloudflare preview
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Seed Neon question library once
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 180 "$PREVIEW_URL/api/internal-seed?blob=5f840f8c90991d7c47258a29cba006a1470242bb" -o /tmp/seed.json
          cat /tmp/seed.json
          jq -e '.ok == true and .count == 3200' /tmp/seed.json >/dev/null

      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PREVIEW_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              jq -e '.ok == true and .stack == "cloudflare-worker-neon-hyperdrive"' /tmp/health.json >/dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1
