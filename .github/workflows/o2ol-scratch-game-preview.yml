name: O2OL Scratch Game Cloudflare Preview

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - "scratch-game/**"
      - ".github/workflows/o2ol-scratch-game-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2ol-scratch-game-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://one2onelove-scratch-game-preview.hwy99signs.workers.dev
    defaults:
      run:
        working-directory: scratch-game
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Verify browser has no embedded bank
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "const questionBank" public worker 2>/dev/null
      - name: Wrangler dry run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
      - name: Deploy Cloudflare preview
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PREVIEW_URL/api/health" || true)
            echo "health attempt $attempt -> HTTP $code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ]; then
              jq -e '.ok == true and .stack == "cloudflare-worker-neon-hyperdrive" and .questionCount == 3200' /tmp/health.json >/dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify real card draw from Neon
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/card.json -w '%{http_code}'             -X POST "$PREVIEW_URL/api/draw-question"             -H 'content-type: application/json'             --data '{"relationship":"Married","category":"Communication","exclude":[],"avoidId":null}')
          cat /tmp/card.json
          test "$code" = "200"
          jq -e '.card.id and .card.question and .card.category == "Communication"' /tmp/card.json >/dev/null

      - name: Dry run production custom domain
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.production.toml

      - name: Deploy production custom domain
        run: npx --yes wrangler@latest deploy --config wrangler.production.toml

      - name: Verify play.one2onelove.com
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL="https://play.one2onelove.com"
          ready=no
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/live-health.json -w '%{http_code}' "$LIVE_URL/api/health" || true)
            echo "live health attempt $attempt -> HTTP $code"
            cat /tmp/live-health.json || true
            if [ "$code" = "200" ] && jq -e '.ok == true and .questionCount == 3200' /tmp/live-health.json >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 5
          done
          test "$ready" = yes

          code=$(curl -sS --max-time 30 -o /tmp/live-card.json -w '%{http_code}'             -X POST "$LIVE_URL/api/draw-question"             -H 'content-type: application/json'             --data '{"relationship":"Dating","category":"Trust","exclude":[],"avoidId":null}')
          cat /tmp/live-card.json
          test "$code" = "200"
          jq -e '.card.id and .card.question and .card.category == "Trust"' /tmp/live-card.json >/dev/null
