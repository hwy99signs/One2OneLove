name: O2OL Scratch Game Cloudflare Preview
# Public launch auth/analytics verification

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - "scratch-game/**"
      - ".github/workflows/o2ol-scratch-game-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2ol-scratch-game-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://one2onelove-scratch-game-launch-preview.hwy99signs.workers.dev
    defaults:
      run:
        working-directory: scratch-game
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Verify browser has no embedded bank and solo mode is present
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "const questionBank" public worker 2>/dev/null
          grep -Fq 'data-players="1"' public/index.html
          grep -Fq 'Self Evaluation' public/index.html
          grep -Fq 'maxlength="12"' public/auth-gate.js
          grep -Fq '<script defer src="/i18n.js"></script>' public/index.html
          grep -Fq "const SUPPORTED = ['en','es','fr','it','de']" public/i18n.js
          grep -Fq 'AI: any' worker/index.ts
          grep -Fq 'o2ol_scratch_question_translations' worker/index.ts
      - name: Wrangler dry run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
      - name: Deploy Cloudflare preview
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PREVIEW_URL/api/health" || true)
            echo "health attempt $attempt -> HTTP $code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ]; then
              jq -e '.ok == true and .stack == "cloudflare-worker-neon-hyperdrive" and .questionCount == 4800' /tmp/health.json >/dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify account gate, analytics, and 12-category card draw
        shell: bash
        run: |
          set -euo pipefail

          unauth=$(curl -sS --max-time 20 -o /tmp/unauth.json -w '%{http_code}'             -X POST "$PREVIEW_URL/api/draw-question"             -H 'content-type: application/json'             --data '{"relationship":"Married","category":"Communication","exclude":[],"avoidId":null}')
          test "$unauth" = "401"

          stamp=$(date +%s)-$RANDOM
          email="preview-check-$stamp@example.invalid"
          username="preview$RANDOM"
          password="Beta9!Pass12"
          signup=$(jq -nc --arg username "$username" --arg email "$email" --arg password "$password"             '{username:$username,email:$email,password:$password,marketingOptIn:false,acceptTerms:true}')
          code=$(curl -sS --max-time 45 -c /tmp/cookie.txt -o /tmp/signup.json -w '%{http_code}'             -X POST "$PREVIEW_URL/api/auth/signup"             -H 'content-type: application/json'             --data "$signup")
          cat /tmp/signup.json
          test "$code" = "201"

          logout_code=$(curl -sS --max-time 20 -b /tmp/cookie.txt -o /tmp/logout.json -w '%{http_code}' -X POST "$PREVIEW_URL/api/auth/logout")
          test "$logout_code" = "200"

          login_payload=$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')
          login_code=$(curl -sS --max-time 45 -c /tmp/cookie.txt -o /tmp/login.json -w '%{http_code}' -X POST "$PREVIEW_URL/api/auth/login" -H 'content-type: application/json' --data "$login_payload")
          cat /tmp/login.json
          test "$login_code" = "200"
          jq -e '.ok == true and .user.email' /tmp/login.json >/dev/null

          categories=(
            "Communication"
            "Trust"
            "Fun"
            "Intimacy"
            "Money"
            "Future"
            "Conflict"
            "Deep Questions"
            "Digital Communication"
            "Electronic Devices"
            "Social Media"
            "AI Bot Relationships"
          )
          for category in "${categories[@]}"; do
            payload=$(jq -nc --arg relationship "Married" --arg category "$category"               '{relationship:$relationship,category:$category,exclude:[],avoidId:null,language:"en"}')
            code=$(curl -sS --max-time 30 -b /tmp/cookie.txt -o /tmp/card.json -w '%{http_code}'               -X POST "$PREVIEW_URL/api/draw-question"               -H 'content-type: application/json'               --data "$payload")
            cat /tmp/card.json
            test "$code" = "200"
            jq -e --arg category "$category" '.card.id and .card.question and .card.category == $category and .card.language == "en"' /tmp/card.json >/dev/null
          done

          for lang in es fr it de; do
            payload=$(jq -nc --arg lang "$lang" '{relationship:"Married",category:"Communication",exclude:[],avoidId:null,language:$lang}')
            code=$(curl -sS --max-time 45 -b /tmp/cookie.txt -o "/tmp/card-$lang.json" -w '%{http_code}'               -X POST "$PREVIEW_URL/api/draw-question"               -H 'content-type: application/json'               --data "$payload")
            cat "/tmp/card-$lang.json"
            test "$code" = "200"
            jq -e --arg lang "$lang" '.card.id and (.card.question|length>10) and .card.language == $lang' "/tmp/card-$lang.json" >/dev/null
          done

          event='{"eventType":"game_started","gameSessionId":"preview-check","playerCount":1,"relationship":"Married","category":"AI Bot Relationships"}'
          code=$(curl -sS --max-time 20 -b /tmp/cookie.txt -o /tmp/event.json -w '%{http_code}'             -X POST "$PREVIEW_URL/api/analytics/event"             -H 'content-type: application/json'             --data "$event")
          test "$code" = "200"
          jq -e '.ok == true' /tmp/event.json >/dev/null

      - name: Install five-language browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Verify five-language Scratch UI and card flow
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright-core';
          const BASE=process.env.PREVIEW_URL.replace(/\/$/,'');
          const copy={
            en:{home:'Scratch. Share. Grow Closer.',how:'How to Play',players:'How many players?',relationship:'Choose Your Relationship',deck:'Choose a Deck',draw:'Draw'},
            es:{home:'Rasca. Comparte. Acérquense.',how:'Cómo Jugar',players:'¿Cuántos jugadores?',relationship:'Elige Tu Relación',deck:'Elige un Mazo',draw:'Sacar'},
            fr:{home:'Grattez. Partagez. Rapprochez-vous.',how:'Comment Jouer',players:'Combien de joueurs ?',relationship:'Choisissez Votre Relation',deck:'Choisissez un Paquet',draw:'Pioche'},
            it:{home:'Gratta. Condividi. Avvicinatevi.',how:'Come si Gioca',players:'Quanti giocatori?',relationship:'Scegli il Tipo di Relazione',deck:'Scegli un Mazzo',draw:'Pesca'},
            de:{home:'Rubbeln. Teilen. Näher zusammenwachsen.',how:'Spielanleitung',players:'Wie viele Spieler?',relationship:'Wählt Eure Beziehungsform',deck:'Wählt einen Stapel',draw:'Ziehen'}
          };
          function assert(ok,msg){if(!ok) throw new Error(msg);}
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          try{
            for(const lang of Object.keys(copy)){
              const context=await browser.newContext({viewport:{width:390,height:844}});
              const stamp=Date.now()+'-'+lang+'-'+Math.random().toString(36).slice(2,8);
              const email='scratch-lang-'+stamp+'@example.invalid';
              const username=('lang'+lang+Date.now().toString().slice(-8)).slice(0,24);
              const signup=await context.request.post(BASE+'/api/auth/signup',{data:{username,email,password:'Beta9!Pass12',marketingOptIn:false,acceptTerms:true}});
              assert(signup.status()===201,lang+' signup failed '+signup.status()+' '+await signup.text());
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              const res=await page.goto(BASE+'/?lang='+lang,{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#o2olAccountPill').waitFor({state:'visible',timeout:10000});
              assert(res?.status()===200,lang+' page status '+res?.status());
              assert(errors.length===0,lang+' page errors '+errors.join(' | '));
              assert(await page.locator('#o2olAuthOverlay').count()===0,lang+' auth overlay remained after authenticated signup');
              assert(await page.locator('#o2olLanguagePicker select').inputValue()===lang,lang+' picker did not persist');
              assert((await page.locator('#home').innerText()).includes(copy[lang].home),lang+' home copy not translated');
              await page.locator('#howBtn').click();
              await page.waitForTimeout(100);
              const howText=await page.locator('#how').innerText();
              assert(howText.includes(copy[lang].how),lang+' how-to copy not translated');
              if(lang!=='en') {
                assert(!howText.includes('The active player taps the deck'),lang+' English how-to instructions leaked');
                assert(!howText.includes('Play as if your partner is sitting across from you'),lang+' English solo instructions leaked');
              }
              await page.locator('#closeHow').click();
              await page.locator('#startBtn').click();
              await page.waitForTimeout(100);
              const playersText=await page.locator('#players').innerText();
              assert(playersText.includes(copy[lang].players),lang+' player screen not translated');
              if(lang!=='en') assert(!playersText.includes('Play solo for self-evaluation'),lang+' English player instructions leaked');
              await page.locator('[data-players="1"]').click();
              await page.waitForTimeout(100);
              const relationshipText=await page.locator('#relationshipTypes').innerText();
              assert(relationshipText.includes(copy[lang].relationship),lang+' relationship screen not translated');
              if(lang!=='en') assert(!relationshipText.includes('This tailors the questions to where you are together.'),lang+' English relationship instructions leaked');
              await page.locator('[data-relationship="Married"]').click();
              await page.waitForTimeout(150);
              const deckText=await page.locator('#categories').innerText();
              assert(deckText.includes(copy[lang].deck),lang+' deck screen not translated');
              if(lang!=='en') {
                assert(!deckText.includes('Each category has its own colored card back.'),lang+' English deck instructions leaked');
                assert(!deckText.includes('Tap to open deck'),lang+' English category action leaked');
              }
              await page.locator('#catGrid .cat').first().click();
              await page.waitForTimeout(150);
              assert((await page.locator('#tableScreen').innerText()).includes(copy[lang].draw),lang+' table labels not translated');
              const cardResponse=page.waitForResponse(r=>r.url().includes('/api/draw-question')&&r.request().method()==='POST',{timeout:45000});
              await page.locator('#deck').click();
              const cardRes=await cardResponse;
              assert(cardRes.status()===200,lang+' card draw failed '+cardRes.status());
              const payload=await cardRes.json();
              assert(payload?.card?.language===lang,lang+' card language '+payload?.card?.language);
              assert(String(payload?.card?.question||'').length>10,lang+' translated question missing');
              await page.waitForFunction(()=>String(document.querySelector('#question')?.textContent||'').trim().length>10,null,{timeout:5000});
              const visibleQuestion=(await page.locator('#question').innerText()).trim();
              assert(visibleQuestion===String(payload.card.question).trim(),lang+' visible question differs from translated server card');
              if(lang!=='en'){
                const activeText=(await page.locator('#tableScreen').innerText()).replace(/\s+/g,' ');
                for(const englishLeak of ['Tap the deck to draw.','Change Deck','Next Card','Played']){
                  assert(!activeText.includes(englishLeak),lang+' English table copy leaked: '+englishLeak);
                }
              }
              await context.close();
            }
            console.log('SCRATCH_FIVE_LANGUAGE_FLOW=PASS');
          }finally{await browser.close();}
          NODE
