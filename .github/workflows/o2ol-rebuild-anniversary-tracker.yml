name: O2OL Rebuild Anniversary Tracker

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-rebuild-anniversary-tracker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current build branch
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Anniversary Tracker
        shell: bash
        run: |
          cat > src/pages/AnniversaryTracker.jsx <<'EOF'
          import React, { useMemo, useState } from "react";
          import { CalendarHeart, Heart, Loader2, Pencil, Save, Sparkles } from "lucide-react";
          import { Link } from "react-router-dom";
          import { Button } from "@/components/ui/button";
          import { Input } from "@/components/ui/input";
          import { Card, CardContent, CardHeader, CardTitle } from "@/components/ui/card";
          import { useAuth } from "@/contexts/AuthContext";
          import { useLanguage } from "@/Layout";
          import { supabase } from "@/lib/supabase";
          import { toast } from "sonner";

          const translations = {
            en: {
              title: "Anniversary Tracker", subtitle: "Keep one meaningful date visible and make space to celebrate the relationship you are building.",
              signIn: "Sign in to view and manage your anniversary.", signInButton: "Sign In", notSet: "Your anniversary date is not set yet.", setDate: "Set Anniversary Date", editDate: "Edit Date", save: "Save Anniversary", saving: "Saving...", cancel: "Cancel",
              next: "Next anniversary", days: "days to go", today: "Today is your anniversary!", years: "years together", upcoming: "coming up", privacy: "Your anniversary date is stored only on your own One2OneLove account profile. This tracker does not read another member’s private account row.",
              saved: "Anniversary updated.", error: "We could not update your anniversary.", invalid: "Choose a valid anniversary date.", ideas: "Celebrate Intentionally",
              actions: [["Plan a Date Night", "Choose time and budget and create an intentional plan.", "/DateNight"], ["Visit Memory Lane", "Look back at moments you have already created together.", "/MemoryLane"], ["Send a Love Note", "Deliver a private note to your mutually linked partner.", "/LoveNotes"]]
            },
            es: {
              title: "Seguimiento de Aniversario", subtitle: "Mantengan visible una fecha significativa y creen espacio para celebrar la relación que están construyendo.",
              signIn: "Inicia sesión para ver y administrar tu aniversario.", signInButton: "Iniciar Sesión", notSet: "Tu fecha de aniversario todavía no está establecida.", setDate: "Establecer Fecha de Aniversario", editDate: "Editar Fecha", save: "Guardar Aniversario", saving: "Guardando...", cancel: "Cancelar",
              next: "Próximo aniversario", days: "días restantes", today: "¡Hoy es su aniversario!", years: "años juntos", upcoming: "se acerca", privacy: "Tu fecha de aniversario se guarda únicamente en tu propio perfil de One2OneLove. Este seguimiento no lee la cuenta privada de otro miembro.",
              saved: "Aniversario actualizado.", error: "No pudimos actualizar tu aniversario.", invalid: "Elige una fecha de aniversario válida.", ideas: "Celebren con Intención",
              actions: [["Planear una Noche de Cita", "Elijan tiempo y presupuesto y creen un plan intencional.", "/DateNight"], ["Visitar el Carril de Recuerdos", "Miren los momentos que ya han creado juntos.", "/MemoryLane"], ["Enviar una Nota de Amor", "Entrega una nota privada a tu pareja vinculada mutuamente.", "/LoveNotes"]]
            },
            fr: {
              title: "Suivi d’Anniversaire", subtitle: "Gardez une date importante visible et créez un espace pour célébrer la relation que vous construisez.",
              signIn: "Connectez-vous pour voir et gérer votre anniversaire.", signInButton: "Se Connecter", notSet: "Votre date d’anniversaire n’est pas encore définie.", setDate: "Définir la Date d’Anniversaire", editDate: "Modifier la Date", save: "Enregistrer l’Anniversaire", saving: "Enregistrement...", cancel: "Annuler",
              next: "Prochain anniversaire", days: "jours restants", today: "Aujourd’hui, c’est votre anniversaire !", years: "années ensemble", upcoming: "approche", privacy: "Votre date d’anniversaire est enregistrée uniquement dans votre propre profil One2OneLove. Ce suivi ne lit pas la ligne de compte privée d’un autre membre.",
              saved: "Anniversaire mis à jour.", error: "Nous n’avons pas pu mettre à jour votre anniversaire.", invalid: "Choisissez une date d’anniversaire valide.", ideas: "Célébrer avec Intention",
              actions: [["Planifier une Soirée", "Choisissez votre temps et votre budget et créez un plan intentionnel.", "/DateNight"], ["Visiter l’Allée des Souvenirs", "Revenez sur les moments que vous avez déjà créés ensemble.", "/MemoryLane"], ["Envoyer une Note d’Amour", "Envoyez une note privée à votre partenaire lié réciproquement.", "/LoveNotes"]]
            },
            it: {
              title: "Monitoraggio Anniversario", subtitle: "Tenete visibile una data importante e create spazio per celebrare la relazione che state costruendo.",
              signIn: "Accedi per vedere e gestire il tuo anniversario.", signInButton: "Accedi", notSet: "La data del tuo anniversario non è ancora impostata.", setDate: "Imposta Data Anniversario", editDate: "Modifica Data", save: "Salva Anniversario", saving: "Salvataggio...", cancel: "Annulla",
              next: "Prossimo anniversario", days: "giorni rimanenti", today: "Oggi è il vostro anniversario!", years: "anni insieme", upcoming: "si avvicina", privacy: "La data dell’anniversario viene salvata solo nel tuo profilo One2OneLove. Questo strumento non legge la riga privata dell’account di un altro membro.",
              saved: "Anniversario aggiornato.", error: "Non è stato possibile aggiornare l’anniversario.", invalid: "Scegli una data di anniversario valida.", ideas: "Celebrate con Intenzione",
              actions: [["Pianifica una Serata di Coppia", "Scegliete tempo e budget e create un piano intenzionale.", "/DateNight"], ["Visita il Viale dei Ricordi", "Ripercorrete i momenti che avete già creato insieme.", "/MemoryLane"], ["Invia una Nota d’Amore", "Invia una nota privata al partner collegato reciprocamente.", "/LoveNotes"]]
            },
            de: {
              title: "Jahrestags-Tracker", subtitle: "Haltet ein wichtiges Datum sichtbar und schafft Raum, um eure gemeinsame Beziehung bewusst zu feiern.",
              signIn: "Meldet euch an, um euren Jahrestag anzusehen und zu verwalten.", signInButton: "Anmelden", notSet: "Euer Jahrestagsdatum ist noch nicht festgelegt.", setDate: "Jahrestagsdatum Festlegen", editDate: "Datum Bearbeiten", save: "Jahrestag Speichern", saving: "Wird gespeichert...", cancel: "Abbrechen",
              next: "Nächster Jahrestag", days: "Tage verbleibend", today: "Heute ist euer Jahrestag!", years: "Jahre zusammen", upcoming: "steht bevor", privacy: "Euer Jahrestagsdatum wird ausschließlich im eigenen One2OneLove-Profil gespeichert. Dieser Tracker liest keine private Kontenzeile eines anderen Mitglieds.",
              saved: "Jahrestag aktualisiert.", error: "Der Jahrestag konnte nicht aktualisiert werden.", invalid: "Bitte wählt ein gültiges Jahrestagsdatum.", ideas: "Bewusst Feiern",
              actions: [["Date Night Planen", "Wählt Zeit und Budget und erstellt einen bewussten Plan.", "/DateNight"], ["Erinnerungsgasse Besuchen", "Blickt auf Momente zurück, die ihr bereits gemeinsam geschaffen habt.", "/MemoryLane"], ["Liebesbotschaft Senden", "Sendet eine private Nachricht an euren gegenseitig verknüpften Partner.", "/LoveNotes"]]
            }
          };

          const localeMap = { en: "en-US", es: "es", fr: "fr", it: "it", de: "de" };

          function anniversaryMetrics(value) {
            if (!value) return null;
            const original = new Date(`${String(value).slice(0, 10)}T12:00:00`);
            if (Number.isNaN(original.getTime())) return null;
            const today = new Date();
            const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
            let next = new Date(today.getFullYear(), original.getMonth(), original.getDate(), 12);
            if (next < todayOnly) next = new Date(today.getFullYear() + 1, original.getMonth(), original.getDate(), 12);
            const daysUntil = Math.round((next.getTime() - todayOnly.getTime()) / 86400000);
            const yearsAtNext = Math.max(next.getFullYear() - original.getFullYear(), 0);
            return { original, next, daysUntil, yearsAtNext };
          }

          export default function AnniversaryTracker() {
            const { currentLanguage } = useLanguage();
            const t = translations[currentLanguage] || translations.en;
            const locale = localeMap[currentLanguage] || localeMap.en;
            const { user, isLoading, refreshUserProfile } = useAuth();
            const [editing, setEditing] = useState(false);
            const [dateValue, setDateValue] = useState("");
            const [saving, setSaving] = useState(false);
            const metrics = useMemo(() => anniversaryMetrics(user?.anniversary_date), [user?.anniversary_date]);
            const anniversaryLabel = metrics ? new Intl.DateTimeFormat(locale, { month: "long", day: "numeric", year: "numeric" }).format(metrics.original) : null;
            const nextLabel = metrics ? new Intl.DateTimeFormat(locale, { month: "long", day: "numeric", year: "numeric" }).format(metrics.next) : null;

            const openEditor = () => {
              setDateValue(user?.anniversary_date ? String(user.anniversary_date).slice(0, 10) : "");
              setEditing(true);
            };

            const saveDate = async () => {
              if (!user?.id || !/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                toast.error(t.invalid);
                return;
              }
              setSaving(true);
              try {
                const { error } = await supabase.from("users").update({ anniversary_date: dateValue, updated_at: new Date().toISOString() }).eq("id", user.id);
                if (error) throw error;
                await refreshUserProfile();
                setEditing(false);
                toast.success(t.saved);
              } catch {
                toast.error(t.error);
              } finally {
                setSaving(false);
              }
            };

            if (isLoading) return <main className="flex min-h-screen items-center justify-center bg-gradient-to-br from-pink-50 via-rose-50 to-purple-50"><Loader2 className="h-7 w-7 animate-spin text-pink-600" aria-label={t.title} /></main>;
            if (!user) return <main className="flex min-h-screen items-center justify-center bg-gradient-to-br from-pink-50 via-rose-50 to-purple-50 px-4"><div className="max-w-lg text-center"><CalendarHeart className="mx-auto h-14 w-14 text-pink-600" aria-hidden="true" /><h1 className="mt-4 text-3xl font-bold text-slate-900">{t.title}</h1><p className="mt-3 text-slate-600">{t.signIn}</p><Button asChild className="mt-6"><Link to="/SignIn">{t.signInButton}</Link></Button></div></main>;

            return (
              <main className="min-h-screen bg-gradient-to-br from-pink-50 via-rose-50 to-purple-50 px-4 py-10 md:py-16">
                <div className="mx-auto max-w-5xl">
                  <header className="mx-auto max-w-3xl text-center"><div className="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br from-pink-500 to-purple-600 shadow-xl"><CalendarHeart className="h-8 w-8 text-white" aria-hidden="true" /></div><h1 className="mt-5 text-4xl font-bold text-slate-900 md:text-5xl">{t.title}</h1><p className="mt-3 text-lg leading-7 text-slate-600">{t.subtitle}</p></header>

                  <section className="mt-9">
                    {!metrics ? (
                      <Card className="border-dashed border-pink-200 bg-white/90"><CardContent className="p-8 text-center"><Heart className="mx-auto h-10 w-10 text-pink-500" aria-hidden="true" /><h2 className="mt-4 text-xl font-bold text-slate-900">{t.notSet}</h2><Button type="button" onClick={openEditor} className="mt-5 bg-gradient-to-r from-pink-500 to-purple-600"><Pencil className="mr-2 h-4 w-4" aria-hidden="true" />{t.setDate}</Button></CardContent></Card>
                    ) : (
                      <div className="grid gap-5 md:grid-cols-3"><Card><CardHeader><CardTitle className="text-base text-slate-500">{t.next}</CardTitle></CardHeader><CardContent><p className="text-2xl font-bold text-slate-900">{nextLabel}</p><p className="mt-2 text-sm text-pink-700">{metrics.daysUntil === 0 ? t.today : `${metrics.daysUntil} ${t.days}`}</p></CardContent></Card><Card><CardHeader><CardTitle className="text-base text-slate-500">{t.years}</CardTitle></CardHeader><CardContent><p className="text-4xl font-bold text-purple-700">{metrics.yearsAtNext}</p><p className="mt-2 text-sm text-slate-500">{anniversaryLabel}</p></CardContent></Card><Card><CardHeader><CardTitle className="text-base text-slate-500">{t.upcoming}</CardTitle></CardHeader><CardContent><Button type="button" onClick={openEditor} variant="outline" className="w-full"><Pencil className="mr-2 h-4 w-4" aria-hidden="true" />{t.editDate}</Button></CardContent></Card></div>
                    )}
                  </section>

                  {editing && <Card className="mx-auto mt-6 max-w-xl border-pink-200"><CardHeader><CardTitle>{metrics ? t.editDate : t.setDate}</CardTitle></CardHeader><CardContent><Input type="date" value={dateValue} onChange={(event) => setDateValue(event.target.value)} /><div className="mt-4 flex gap-3"><Button type="button" variant="outline" onClick={() => setEditing(false)} disabled={saving} className="flex-1">{t.cancel}</Button><Button type="button" onClick={saveDate} disabled={saving} className="flex-1 bg-gradient-to-r from-pink-500 to-purple-600">{saving ? <><Loader2 className="mr-2 h-4 w-4 animate-spin" aria-hidden="true" />{t.saving}</> : <><Save className="mr-2 h-4 w-4" aria-hidden="true" />{t.save}</>}</Button></div></CardContent></Card>}

                  <aside className="mt-6 rounded-2xl border border-indigo-100 bg-indigo-50 p-5"><div className="flex gap-3"><Sparkles className="mt-0.5 h-5 w-5 shrink-0 text-indigo-700" aria-hidden="true" /><p className="text-sm leading-6 text-indigo-900/80">{t.privacy}</p></div></aside>

                  <section className="mt-10" aria-labelledby="anniversary-actions"><h2 id="anniversary-actions" className="text-2xl font-bold text-slate-900">{t.ideas}</h2><div className="mt-5 grid gap-4 md:grid-cols-3">{t.actions.map(([title, description, href]) => <Link key={href} to={href} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-pink-200 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-pink-500 focus-visible:ring-offset-2"><Heart className="h-5 w-5 text-pink-600" aria-hidden="true" /><h3 className="mt-3 font-bold text-slate-900">{title}</h3><p className="mt-2 text-sm leading-6 text-slate-600">{description}</p></Link>)}</div></section>
                </div>
              </main>
            );
          }
          EOF

      - name: Verify five active languages and privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          for lang in en es fr it de; do grep -q "${lang}:" src/pages/AnniversaryTracker.jsx; done
          grep -q 'Intl.DateTimeFormat' src/pages/AnniversaryTracker.jsx
          grep -q '.eq("id", user.id)' src/pages/AnniversaryTracker.jsx
          grep -q 'does not read another member' src/pages/AnniversaryTracker.jsx
          if grep -Eq 'console\.(log|debug|info|warn|error)' src/pages/AnniversaryTracker.jsx; then exit 1; fi
          if grep -Eq '\.from\(["'"']users["'"']\).*\.select' src/pages/AnniversaryTracker.jsx; then exit 1; fi

      - name: Lint Anniversary Tracker
        run: npx eslint src/pages/AnniversaryTracker.jsx --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build

      - name: Commit verified rebuild and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-rebuild-anniversary-tracker.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/AnniversaryTracker.jsx .github/workflows/o2ol-rebuild-anniversary-tracker.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild Anniversary Tracker as privacy-safe five-language experience'
          git push origin HEAD:o2ol-build-branch-2026-08-18
