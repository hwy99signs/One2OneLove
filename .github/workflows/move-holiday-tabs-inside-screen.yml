name: Move Holiday Tabs Inside Screen

on:
  push:
    branches:
      - love-notes-holiday-tabs-inside-screen
    paths:
      - .github/move-holiday-tabs-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-holiday-tabs-inside-screen
          fetch-depth: 0

      - name: Move Holiday tabs into Holiday content area
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/LoveNotes.jsx')
          text = p.read_text(encoding='utf-8')

          # Use a compact ALL label for the subcategory tab row.
          text = text.replace("  en: 'All Holiday',", "  en: 'All',")
          text = text.replace("  es: 'Todas las Festividades',", "  es: 'Todas',")
          text = text.replace("  fr: 'Toutes les Fêtes',", "  fr: 'Toutes',")
          text = text.replace("  it: 'Tutte le Festività',", "  it: 'Tutte',")
          text = text.replace("  de: 'Alle Feiertage',", "  de: 'Alle',")

          old_block = '''          {selectedCategory === 'holiday' && (\n            <div className="mt-4 flex flex-wrap gap-2 justify-center">\n              {holidaySubcategories.map((subcategory) => (\n                <button\n                  key={subcategory.id}\n                  type="button"\n                  onClick={() => {\n                    setSelectedHolidaySubcategory(subcategory.id);\n                    setSearchQuery('');\n                  }}\n                  className={`px-4 py-2 rounded-full text-sm font-medium transition-all border ${\n                    selectedHolidaySubcategory === subcategory.id\n                      ? 'bg-pink-100 text-pink-700 border-pink-300 shadow-sm'\n                      : 'bg-white text-gray-600 border-gray-200 hover:bg-pink-50 hover:text-pink-700'\n                  }`}\n                >\n                  <span className="mr-2">{subcategory.icon}</span>\n                  {subcategory.name}\n                </button>\n              ))}\n            </div>\n          )}\n'''

          if old_block not in text:
              raise SystemExit('Existing Holiday subcategory block not found')
          text = text.replace(old_block, '', 1)

          marker = '''        <div className="text-center mb-8">\n          <p className="text-gray-600">'''

          new_block = '''        {selectedCategory === 'holiday' && (\n          <div className="mb-5 flex justify-center">\n            <div\n              className="inline-flex flex-wrap items-center justify-center gap-1.5 rounded-xl border border-pink-100 bg-white/80 p-1.5 shadow-sm"\n              role="tablist"\n              aria-label="Holiday note subcategories"\n            >\n              {holidaySubcategories.map((subcategory) => (\n                <button\n                  key={subcategory.id}\n                  type="button"\n                  role="tab"\n                  aria-selected={selectedHolidaySubcategory === subcategory.id}\n                  onClick={() => {\n                    setSelectedHolidaySubcategory(subcategory.id);\n                    setSearchQuery('');\n                  }}\n                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${\n                    selectedHolidaySubcategory === subcategory.id\n                      ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-sm'\n                      : 'bg-transparent text-gray-600 hover:bg-pink-50 hover:text-pink-700'\n                  }`}\n                >\n                  {subcategory.name}\n                </button>\n              ))}\n            </div>\n          </div>\n        )}\n\n        <div className="text-center mb-8">\n          <p className="text-gray-600">'''

          if marker not in text:
              raise SystemExit('Holiday content insertion marker not found')
          text = text.replace(marker, new_block, 1)

          p.write_text(text, encoding='utf-8')

      - name: Verify Holiday tab placement
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/pages/LoveNotes.jsx').read_text(encoding='utf-8')
          required = [
            'role="tablist"',
            'aria-label="Holiday note subcategories"',
            'role="tab"',
            'aria-selected={selectedHolidaySubcategory === subcategory.id}',
            "en: 'All'",
            "note.holidaySubcategory === selectedHolidaySubcategory",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Holiday tab wiring: {missing}')

          category_pos = text.find('{categories.map((category) => (')
          tabs_pos = text.find('aria-label="Holiday note subcategories"')
          count_pos = text.find('{t.showing} <span className="font-bold text-pink-600">{displayedNotes.length}</span>')
          if not (category_pos < tabs_pos < count_pos):
              raise SystemExit('Holiday tabs are not positioned between top-level categories and the Holiday note count/content')

          if 'mt-4 flex flex-wrap gap-2 justify-center' in text and 'holidaySubcategories.map((subcategory)' in text[:tabs_pos]:
              raise SystemExit('Old Holiday subcategory row still present in the top-level category section')

          print('Verified Holiday tabs are compact, inside the Holiday content area, and filter the note cards.')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Holiday tab relocation
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Move Holiday subcategory tabs inside Holiday view"
          git push origin HEAD:love-notes-holiday-tabs-inside-screen
