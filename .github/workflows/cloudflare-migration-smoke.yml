name: One2OneLove Cloudflare Migration Smoke Test

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - "worker/smoke.ts"
      - "cloudflare/wrangler.smoke.jsonc"
      - ".github/workflows/cloudflare-migration-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Verify required migration secrets are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          test -n "$NEON_DATABASE_URL" || (echo "NEON_DATABASE_URL is missing" && exit 1)

      - name: Deploy isolated smoke Worker
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.smoke.jsonc

      - name: Ensure One2OneLove R2 media bucket exists
        shell: bash
        run: |
          npx --yes wrangler@latest r2 bucket list > /tmp/r2-buckets.txt
          cat /tmp/r2-buckets.txt
          if grep -Fq "one2onelove-media" /tmp/r2-buckets.txt; then
            echo "one2onelove-media already exists"
          else
            npx --yes wrangler@latest r2 bucket create one2onelove-media
          fi

      - name: Ensure One2OneLove Hyperdrive exists
        shell: bash
        run: |
          npx --yes wrangler@latest hyperdrive list > /tmp/hyperdrives.txt
          cat /tmp/hyperdrives.txt
          if grep -Fq "one2onelove-neon" /tmp/hyperdrives.txt; then
            echo "one2onelove-neon already exists"
          else
            npx --yes wrangler@latest hyperdrive create one2onelove-neon --connection-string="$NEON_DATABASE_URL" --caching-disabled
          fi

      - name: Show final Hyperdrive inventory
        shell: bash
        run: npx --yes wrangler@latest hyperdrive list
