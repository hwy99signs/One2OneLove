name: O2OL AI Love Note One-Time Migration Fix

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-ai-love-note-migration-fix.yml

permissions:
  contents: write

jobs:
  patch-ai-love-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Connect Love Notes AI personalization to Worker
        env:
          REPLACEMENT_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('src/components/lovenotes/AIPersonalizationModal.jsx')
          text = path.read_text()
          anchor = 'import { motion } from "framer-motion";\n'
          addition = 'import { generateRelationshipContent } from "@/lib/aiService";\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
          text = text.replace('// AI personalization requires legacy backend Edge Functions implementation\n', '', 1)
          start = text.index('  const generatePersonalizedNote = async () => {')
          end = text.index('\n  return (', start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit AI Love Note migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/lovenotes/AIPersonalizationModal.jsx
          git commit -m "Connect Love Notes AI personalization to Cloudflare Worker"
          git push origin HEAD:o2ol-password-reset-preview
