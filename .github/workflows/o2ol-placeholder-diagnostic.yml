name: O2OL Temporary Placeholder Diagnostic

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-placeholder-diagnostic.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan active source for placeholder behavior
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Placeholder markers ==='
          grep -RInEi --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' --exclude='*.sql'             'TODO|FIXME|HACK|not implemented|coming soon|placeholder|mock data|return[[:space:]]+\[\][[:space:]]*;|=>[[:space:]]*\[\][[:space:]]*;'             src worker || true
          echo '=== Hardcoded API-success markers ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist             'return[[:space:]]+\{[[:space:]]*success:[[:space:]]*true[[:space:]]*\}[[:space:]]*;'             src/lib worker || true
