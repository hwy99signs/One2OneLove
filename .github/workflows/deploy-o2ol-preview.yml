name: Deploy O2OL Preview

on:
  push:
    branches:
      - feature/what-should-they-do-voting

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_WSTD_DEMO_MODE: "true"
      PREVIEW_URL: https://one2onelove-preview.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build preview application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Deploy isolated Cloudflare preview
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.preview.jsonc

      - name: Verify preview frontend
        shell: bash
        run: |
          set -euo pipefail
          OK=no
          for attempt in $(seq 1 18); do
            HTML=$(curl -fsS --max-time 20 "$PREVIEW_URL/home" 2>/dev/null || true)
            if printf '%s' "$HTML" | grep -qi '<!doctype html'; then
              OK=yes
              break
            fi
            sleep 5
          done
          test "$OK" = yes
          SCRIPT=$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          curl -fsS --max-time 30 "$PREVIEW_URL$SCRIPT" -o /tmp/preview.js
          grep -F 'What Should They Do?' /tmp/preview.js >/dev/null
          grep -F 'Preview mode:' /tmp/preview.js >/dev/null
          API_CODE=$(curl -sS --max-time 20 -o /tmp/preview-api.json -w '%{http_code}' "$PREVIEW_URL/api/health")
          test "$API_CODE" = "503"
          grep -F 'preview_api_disabled' /tmp/preview-api.json >/dev/null
          echo "O2OL_PREVIEW_VERIFIED=yes"
          echo "O2OL_PREVIEW_URL=$PREVIEW_URL"
