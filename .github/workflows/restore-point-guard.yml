name: One2OneLove Restore Point Guard

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
  pull_request:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905

jobs:
  protect-approved-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require approved restore point in branch history
        shell: bash
        run: |
          BASELINE="b15fcedd04acedfbc6219fd85254533c449e6db0"
          RESTORE_BRANCH="restore/one2onelove-secure-20260907-animation-fixed"
          if ! git merge-base --is-ancestor "$BASELINE" HEAD; then
            echo "::error::One2OneLove has moved behind the admin-approved restore point $BASELINE ($RESTORE_BRANCH). Explicit admin approval is required before any rollback past this point."
            exit 1
          fi
          echo "Approved One2OneLove restore point $BASELINE is preserved in branch history."
