name: Deploy O2OL EPSCIE Prelaunch

on:
  push:
    branches:
      - integration/o2ol-epscie-telemetry-20261003
    paths:
      - "worker/epscie-telemetry.ts"
      - "worker/epscie-prelaunch.ts"
      - "cloudflare/wrangler.epscie-prelaunch.jsonc"
      - ".github/workflows/deploy-o2ol-epscie-prelaunch.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare access
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated EPSCIE connectivity worker
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.epscie-prelaunch.jsonc
      - name: Verify isolated worker
        run: |
          set -euo pipefail
          curl -fsS https://one2onelove-epscie-prelaunch.hwy99signs.workers.dev/ | tee /tmp/o2ol-epscie.json
          grep -F '"production_touched":false' /tmp/o2ol-epscie.json
