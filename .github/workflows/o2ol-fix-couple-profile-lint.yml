name: O2OL Fix Couple Profile Lint

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-fix-couple-profile-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove unused Couple Profile icon import
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/CouplesProfile.jsx')
          s = p.read_text()
          old = 'Heart, User, Mail, Calendar, MapPin, Edit'
          new = 'Heart, User, Mail, MapPin, Edit'
          if old not in s and new not in s:
              raise SystemExit('Expected Couple Profile icon import not found')
          p.write_text(s.replace(old, new, 1))

      - name: Verify Couple Profile privacy
        run: node scripts/audit-user-table-usage.mjs

      - name: Lint Couple Profile surfaces
        run: npx eslint src/pages/CouplesProfile.jsx src/lib/coupleProfileService.js --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build

      - name: Commit verified repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-fix-couple-profile-lint.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/CouplesProfile.jsx .github/workflows/o2ol-fix-couple-profile-lint.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve Couple Profile localization lint'
          git push origin HEAD:o2ol-build-branch-2026-08-18
