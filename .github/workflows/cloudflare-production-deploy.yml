# One2OneLove launch deployment: Cloudflare + Neon runtime
name: One2OneLove Cloudflare Production Worker

on:
  push:
    branches:
      - migration/cloudflare-launch-20260911
    paths:
      - "src/**"
      - "public/**"
      - "worker/**"
      - "package-lock.json"
      - "cloudflare/wrangler.production.jsonc"
      - ".github/workflows/cloudflare-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://one2onelove-launch.hwy99signs.workers.dev
    steps:
      - name: Checkout Cloudflare migration branch
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Verify approved assets exist in repository
        shell: bash
        run: |
          set -euo pipefail
          test -s public/assets/one2onelove-logo.png
          test -s public/assets/one2onelove-home-hero.png

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Build approved launch frontend
        run: npm run build

      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund

      - name: Deploy full-stack production Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          set +e
          npx --yes wrangler@latest deploy --config cloudflare/wrangler.production.jsonc 2>&1 | tee /tmp/wrangler-production.log
          WRANGLER_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$WRANGLER_EXIT" -ne 0 ]; then
            # Wrangler may successfully upload/deploy the Worker and then fail only on
            # custom-domain attachment while DNS is being moved from the previous host.
            if grep -q "Deployed one2onelove-launch triggers" /tmp/wrangler-production.log && \
               grep -Eq 'code: 10083|does not exist on your account|code: 10082|Can.t infer zone|code: 100117|already has externally managed DNS records' /tmp/wrangler-production.log; then
              echo "Worker deployed successfully; custom-domain attachment is waiting on the DNS cutover."
              exit 0
            fi
            exit "$WRANGLER_EXIT"
          fi

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one2onelove-production-wrangler-log
          path: /tmp/wrangler-production.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify production Worker homepage
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --output /tmp/home.html --write-out '%{http_code}' "$PROD_URL/")" && [ "$STATUS" = "200" ] && break
            sleep 2
          done
          test "$STATUS" = "200"
          grep -qi '<html' /tmp/home.html

      - name: Verify production Worker assets and SPA routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/assets/one2onelove-logo.png" --output /tmp/logo.png
          curl --fail --silent --show-error "$PROD_URL/assets/one2onelove-home-hero.png" --output /tmp/hero.png
          test -s /tmp/logo.png
          test -s /tmp/hero.png
          STATUS="$(curl --silent --output /tmp/route.html --write-out '%{http_code}' "$PROD_URL/CooperativeGames")"
          test "$STATUS" = "200"
          grep -qi '<html' /tmp/route.html

      - name: Verify production API and Neon
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error "$PROD_URL/api/health")"
          echo "$BODY"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.ok || d.database!=="one2onelove" || !d.users_ready || !d.love_notes_ready) process.exit(1)' "$BODY"
          STATUS="$(curl --silent --output /tmp/session.json --write-out '%{http_code}' "$PROD_URL/api/auth/get-session")"
          test "$STATUS" -ge 200
          test "$STATUS" -lt 500
