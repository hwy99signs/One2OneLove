name: Count Love Notes

on:
  push:
    branches:
      - love-notes-holiday-religious-service-workplace

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-holiday-religious-service-workplace
      - name: Count stored note objects
        shell: python
        run: |
          from pathlib import Path
          import re
          files = [Path('src/components/lovenotes/LoveNotesData.jsx')] + sorted(Path('src/components/lovenotes/additional').glob('LoveNotesAdditional.*.js'))
          total = 0
          print('LOVE_NOTES_COUNT_START')
          for p in files:
              text = p.read_text(encoding='utf-8')
              count = len(re.findall(r'\{\s*title\s*:', text))
              total += count
              print(f'{p}: {count}')
          print(f'TOTAL_STORED_NOTE_OBJECTS={total}')

          # Count notes included by the current page category order.
          page = Path('src/pages/LoveNotes.jsx').read_text(encoding='utf-8')
          m = re.search(r"const categoryOrder = \[(.*?)\];", page, re.S)
          categories = re.findall(r"'([^']+)'", m.group(1)) if m else []
          print('ACTIVE_CATEGORIES=' + ','.join(categories))

          # Parse each language block and count only active categories in the base data.
          base = Path('src/components/lovenotes/LoveNotesData.jsx').read_text(encoding='utf-8')
          langs = ['en','es','fr','it','de']
          active_base_total = 0
          for i, lang in enumerate(langs):
              start_token = f'  {lang}: {{'
              start = base.find(start_token)
              end = base.find(f'  {langs[i+1]}: {{', start+1) if i+1 < len(langs) else base.rfind('\n};')
              block = base[start:end]
              lang_count = 0
              for cat in categories:
                  mm = re.search(rf'\n    {re.escape(cat)}: \[(.*?)(?=\n    [A-Za-z0-9_]+: \[|\n  \}},)', block, re.S)
                  if mm:
                      lang_count += len(re.findall(r'\{\s*title\s*:', mm.group(1)))
              active_base_total += lang_count
              print(f'ACTIVE_BASE_{lang.upper()}={lang_count}')
          added_total = sum(len(re.findall(r'\{\s*title\s*:', p.read_text(encoding='utf-8'))) for p in files[1:])
          print(f'ACTIVE_SURFACED_TOTAL={active_base_total + added_total}')
          print('LOVE_NOTES_COUNT_END')
