name: Relaunch Branch Build

on:
  push:
    branches:
      - relaunch-homepage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relaunch-homepage-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout relaunch branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Live Community safeguards
        run: |
          node scripts/relaunch-live-community-check.mjs
          node scripts/relaunch-live-room-i18n-check.mjs

      - name: Verify creator programming safeguards
        run: node scripts/relaunch-creator-programming-check.mjs

      - name: Compile relaunch application
        run: npm run build
