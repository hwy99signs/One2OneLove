name: O2OL Profile Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify five-language Profile and real fields
        shell: bash
        run: |
          set -euo pipefail
          for lang in en es fr it de; do grep -q "${lang}:" src/pages/Profile.jsx; done
          for field in name location bio relationship_status love_language anniversary_date; do grep -q "${field}" src/pages/Profile.jsx; done
          grep -q '.from("users").update(payload).eq("id", user.id)' src/pages/Profile.jsx
          grep -q 'Intl.DateTimeFormat' src/pages/Profile.jsx
          grep -q 'createPageUrl("CouplesProfile")' src/pages/Profile.jsx
          grep -q 'createPageUrl("CouplesDashboard")' src/pages/Profile.jsx
          grep -q 'createPageUrl("AnniversaryTracker")' src/pages/Profile.jsx
          grep -q 'createPageUrl("RelationshipGoals")' src/pages/Profile.jsx
          grep -q 'createPageUrl("LoveNotes")' src/pages/Profile.jsx

      - name: Reject fabricated or privacy-leaking Profile behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'quiz.*3|memories.*0|streak|relationship_score|compatibility_score|console\.|first_name|last_name|phone|profile_image_url|date_of_birth|relationship_goals|privacy_settings' src/pages/Profile.jsx; then
            echo 'Profile must remain aligned to verified live account fields without fabricated engagement statistics.'
            exit 1
          fi
          if grep -Eq '\.select\("\*"\)|\.select\('\''\*' src/pages/Profile.jsx; then
            echo 'Profile must not add broad account reads.'
            exit 1
          fi

      - name: Lint Profile
        run: npx eslint src/pages/Profile.jsx --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
