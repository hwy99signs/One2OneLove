name: One-time Send Now Repair

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - .github/workflows/one-time-rewire-send-now.yml

permissions:
  contents: write

jobs:
  repair-send-now:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cloudflare-one2onelove-20260905
          fetch-depth: 0

      - name: Restore proven Love Notes send path
        shell: bash
        run: |
          git show 283faa2c8da36a40979735b515a9e4dd5f2ff763:src/pages/LoveNotes.jsx > src/pages/LoveNotes.jsx

      - name: Rewire Send Now to the proven bottom Send Love Note action
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/LoveNotes.jsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'import React, { useState, useMemo } from "react";',
              'import React, { useState, useMemo, useRef } from "react";',
              1,
          )

          marker = '  const queryClient = useQueryClient();\n'
          if marker not in text:
              raise SystemExit('Query client marker not found')
          text = text.replace(marker, marker + '  const primarySendButtonRef = useRef(null);\n', 1)

          pattern = re.compile(
              r'onClick=\{\(\) => \{\s*setIsScheduling\(false\);\s*handleSendNow\(sendModalNote\);\s*\}\}'
          )
          replacement = '''onClick={() => {
                        setIsScheduling(false);
                        window.requestAnimationFrame(() => {
                          primarySendButtonRef.current?.click();
                        });
                      }}'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Send Now handler, found {count}')

          bottom = '                <Button\n                  onClick={() => isScheduling ? handleScheduleNote() : handleSendNow(sendModalNote)}\n'
          if bottom not in text:
              raise SystemExit('Bottom Send Love Note button marker not found')
          text = text.replace(
              bottom,
              '                <Button\n                  ref={primarySendButtonRef}\n                  onClick={() => isScheduling ? handleScheduleNote() : handleSendNow(sendModalNote)}\n',
              1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit Send Now repair
        shell: bash
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git diff --cached --check
          git commit -m "fix: make Send Now use proven Send Love Note action"
          git push origin HEAD:migration/neon-cloudflare-one2onelove-20260905
