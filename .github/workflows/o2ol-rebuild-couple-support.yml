name: O2OL Rebuild Relationship Support

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-rebuild-couple-support.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild Relationship Support
        shell: bash
        run: |
          cat > src/pages/CoupleSupport.jsx <<'EOF'
          import React from "react";
          import { BookOpen, HeartHandshake, MessageCircle, Radio, RefreshCw, ShieldAlert, Users } from "lucide-react";
          import { Link } from "react-router-dom";
          import { useLanguage } from "@/Layout";

          const translations = {
            en: {
              title: "Relationship Support", subtitle: "Choose the kind of support that fits what you need right now—reflection, communication practice, community perspective, or information about professional help.", disclaimer: "One2OneLove provides education, reflection tools, and community features. It is not therapy, medical care, legal advice, crisis intervention, or emergency services.", safety: "If someone is in immediate danger or there is a medical or safety emergency, use the appropriate local emergency service rather than relying on One2OneLove.",
              items: [["Relationship Reset", "Use a short guided reset when you want to slow down and reconnect before a conversation gets harder.", "/RelationshipReset", "reset"], ["Communication Practice", "Practice softer starts, listening and reflection, repair attempts, and clear requests without storing what you say.", "/CommunicationPractice", "message"], ["Relationship Library", "Browse O2OL tools by what your relationship needs instead of searching the whole platform.", "/RelationshipLibrary", "book"], ["Counseling Support Resources", "Review counseling-support information and options without treating O2OL as a substitute for licensed care.", "/CounselingSupport", "support"], ["Community", "Read and participate in relationship conversations with other members where community features are available.", "/Community", "users"], ["Global Relationship Room", "Watch relationship programming, creator conversations, and replays with clear third-party disclaimers.", "/GlobalRelationshipRoom", "radio"]]
            },
            es: {
              title: "Apoyo para Relaciones", subtitle: "Elige el tipo de apoyo que se ajuste a lo que necesitas ahora: reflexión, práctica de comunicación, perspectiva de la comunidad o información sobre ayuda profesional.", disclaimer: "One2OneLove ofrece educación, herramientas de reflexión y funciones de comunidad. No es terapia, atención médica, asesoramiento legal, intervención en crisis ni servicio de emergencia.", safety: "Si alguien está en peligro inmediato o existe una emergencia médica o de seguridad, utiliza el servicio de emergencia local apropiado en lugar de depender de One2OneLove.",
              items: [["Reinicio de la Relación", "Usen un reinicio guiado breve cuando quieran bajar la intensidad y reconectarse antes de una conversación difícil.", "/RelationshipReset", "reset"], ["Práctica de Comunicación", "Practiquen inicios suaves, escucha, reflexión, reparaciones y peticiones claras sin guardar lo que dicen.", "/CommunicationPractice", "message"], ["Biblioteca de Relaciones", "Exploren herramientas de O2OL según lo que necesita su relación.", "/RelationshipLibrary", "book"], ["Recursos de Apoyo de Consejería", "Revisa información y opciones de apoyo sin tratar a O2OL como sustituto de atención profesional con licencia.", "/CounselingSupport", "support"], ["Comunidad", "Lean y participen en conversaciones sobre relaciones con otros miembros donde las funciones de comunidad estén disponibles.", "/Community", "users"], ["Sala Global de Relaciones", "Vean programación, conversaciones de creadores y repeticiones con avisos claros sobre contenido de terceros.", "/GlobalRelationshipRoom", "radio"]]
            },
            fr: {
              title: "Soutien aux Relations", subtitle: "Choisissez le type de soutien adapté à votre besoin du moment : réflexion, pratique de communication, perspective communautaire ou informations sur l’aide professionnelle.", disclaimer: "One2OneLove propose de l’éducation, des outils de réflexion et des fonctions communautaires. Ce n’est ni une thérapie, ni des soins médicaux, ni un conseil juridique, ni une intervention de crise ou un service d’urgence.", safety: "Si quelqu’un est en danger immédiat ou s’il existe une urgence médicale ou de sécurité, utilisez le service d’urgence local approprié plutôt que de compter sur One2OneLove.",
              items: [["Réinitialisation Relationnelle", "Utilisez une courte réinitialisation guidée pour ralentir et vous reconnecter avant qu’une conversation ne devienne plus difficile.", "/RelationshipReset", "reset"], ["Pratique de Communication", "Entraînez des débuts plus doux, l’écoute, la reformulation, la réparation et les demandes claires sans enregistrer ce que vous dites.", "/CommunicationPractice", "message"], ["Bibliothèque Relationnelle", "Parcourez les outils O2OL selon les besoins de votre relation.", "/RelationshipLibrary", "book"], ["Ressources de Soutien en Conseil", "Consultez des informations et options de soutien sans considérer O2OL comme un substitut aux soins professionnels autorisés.", "/CounselingSupport", "support"], ["Communauté", "Lisez et participez à des conversations relationnelles avec d’autres membres lorsque les fonctions communautaires sont disponibles.", "/Community", "users"], ["Salle Mondiale des Relations", "Regardez des programmes, conversations de créateurs et rediffusions avec des avertissements clairs sur les contenus tiers.", "/GlobalRelationshipRoom", "radio"]]
            },
            it: {
              title: "Supporto per Relazioni", subtitle: "Scegliete il tipo di supporto più adatto a ciò di cui avete bisogno ora: riflessione, pratica di comunicazione, prospettiva della comunità o informazioni sull’aiuto professionale.", disclaimer: "One2OneLove offre educazione, strumenti di riflessione e funzioni di comunità. Non è terapia, assistenza medica, consulenza legale, intervento di crisi o servizio di emergenza.", safety: "Se qualcuno è in pericolo immediato o c’è un’emergenza medica o di sicurezza, usate il servizio di emergenza locale appropriato invece di fare affidamento su One2OneLove.",
              items: [["Reset della Relazione", "Usate un breve reset guidato per rallentare e riconnettervi prima che una conversazione diventi più difficile.", "/RelationshipReset", "reset"], ["Pratica di Comunicazione", "Esercitate inizi più delicati, ascolto, riflessione, tentativi di riparazione e richieste chiare senza salvare ciò che dite.", "/CommunicationPractice", "message"], ["Biblioteca delle Relazioni", "Esplorate gli strumenti O2OL in base a ciò di cui la relazione ha bisogno.", "/RelationshipLibrary", "book"], ["Risorse di Supporto di Consulenza", "Consultate informazioni e opzioni di supporto senza considerare O2OL un sostituto dell’assistenza professionale autorizzata.", "/CounselingSupport", "support"], ["Comunità", "Leggete e partecipate a conversazioni sulle relazioni con altri membri dove le funzioni di comunità sono disponibili.", "/Community", "users"], ["Sala Globale delle Relazioni", "Guardate programmi, conversazioni dei creator e repliche con chiari avvisi sui contenuti di terze parti.", "/GlobalRelationshipRoom", "radio"]]
            },
            de: {
              title: "Beziehungsunterstützung", subtitle: "Wählt die Art von Unterstützung, die gerade passt: Reflexion, Kommunikationsübung, Community-Perspektive oder Informationen zu professioneller Hilfe.", disclaimer: "One2OneLove bietet Bildung, Reflexionswerkzeuge und Community-Funktionen. Es ist keine Therapie, medizinische Versorgung, Rechtsberatung, Krisenintervention oder Notfallversorgung.", safety: "Wenn jemand unmittelbar in Gefahr ist oder ein medizinischer beziehungsweise sicherheitsbezogener Notfall besteht, nutzt den passenden örtlichen Notfalldienst statt euch auf One2OneLove zu verlassen.",
              items: [["Beziehungs-Reset", "Nutzt einen kurzen geführten Reset, um langsamer zu werden und euch wieder zu verbinden, bevor ein Gespräch schwieriger wird.", "/RelationshipReset", "reset"], ["Kommunikationspraxis", "Übt sanftere Einstiege, Zuhören, Spiegeln, Reparaturversuche und klare Bitten, ohne eure Aussagen zu speichern.", "/CommunicationPractice", "message"], ["Beziehungsbibliothek", "Findet O2OL-Werkzeuge nach dem, was eure Beziehung gerade braucht.", "/RelationshipLibrary", "book"], ["Ressourcen zur Beratungsunterstützung", "Seht euch Informationen und Unterstützungsoptionen an, ohne O2OL als Ersatz für professionelle zugelassene Hilfe zu behandeln.", "/CounselingSupport", "support"], ["Community", "Lest und beteiligt euch an Beziehungsgesprächen mit anderen Mitgliedern, wo Community-Funktionen verfügbar sind.", "/Community", "users"], ["Globaler Beziehungsraum", "Seht Programme, Creator-Gespräche und Wiederholungen mit klaren Hinweisen zu Inhalten Dritter.", "/GlobalRelationshipRoom", "radio"]]
            }
          };

          const icons = { reset: RefreshCw, message: MessageCircle, book: BookOpen, support: HeartHandshake, users: Users, radio: Radio };

          export default function CoupleSupport() {
            const { currentLanguage } = useLanguage();
            const t = translations[currentLanguage] || translations.en;
            return <main className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-rose-50 px-4 py-10 md:py-16"><div className="mx-auto max-w-6xl"><header className="mx-auto max-w-3xl text-center"><div className="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-700"><HeartHandshake className="h-8 w-8" aria-hidden="true" /></div><h1 className="mt-5 text-4xl font-bold text-slate-900 md:text-5xl">{t.title}</h1><p className="mt-4 text-lg leading-7 text-slate-600">{t.subtitle}</p></header><section className="mt-10 grid gap-5 md:grid-cols-2 lg:grid-cols-3" aria-label={t.title}>{t.items.map(([title, description, href, iconKey]) => { const Icon = icons[iconKey] || HeartHandshake; return <Link key={href} to={href} className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-indigo-200 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"><Icon className="h-7 w-7 text-indigo-600" aria-hidden="true" /><h2 className="mt-4 text-lg font-bold text-slate-900">{title}</h2><p className="mt-2 text-sm leading-6 text-slate-600">{description}</p></Link>; })}</section><aside className="mt-8 rounded-2xl border border-amber-100 bg-amber-50 p-5"><div className="flex gap-3"><ShieldAlert className="mt-0.5 h-5 w-5 shrink-0 text-amber-700" aria-hidden="true" /><div><p className="text-sm leading-6 text-amber-950">{t.disclaimer}</p><p className="mt-2 text-sm font-semibold leading-6 text-amber-950">{t.safety}</p></div></div></aside></div></main>;
          }
          EOF
      - name: Verify support accuracy and localization
        shell: bash
        run: |
          set -euo pipefail
          for lang in en es fr it de; do grep -q "${lang}:" src/pages/CoupleSupport.jsx; done
          for route in RelationshipReset CommunicationPractice RelationshipLibrary CounselingSupport Community GlobalRelationshipRoom; do grep -q "/${route}" src/pages/CoupleSupport.jsx; grep -q "path=\"/${route}\"" src/pages/index.jsx; done
          grep -q 'not therapy' src/pages/CoupleSupport.jsx
          grep -q 'immediate danger' src/pages/CoupleSupport.jsx
          if grep -Eq 'licensed therapist available|24/7 counselor|guaranteed|console\.' src/pages/CoupleSupport.jsx; then exit 1; fi
      - name: Lint
        run: npx eslint src/pages/CoupleSupport.jsx --rule 'react/prop-types: off'
      - name: Build
        run: npm run build
      - name: Commit verified rebuild and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-rebuild-couple-support.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/CoupleSupport.jsx .github/workflows/o2ol-rebuild-couple-support.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild Relationship Support around accurate five-language pathways'
          git push origin HEAD:o2ol-build-branch-2026-08-18
