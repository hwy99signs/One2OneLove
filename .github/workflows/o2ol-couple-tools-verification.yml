name: O2OL Couple Tools Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-couple-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify files, routes, and five active languages
        shell: bash
        run: |
          set -euo pipefail
          for file in src/pages/AnniversaryTracker.jsx src/pages/CoupleActivities.jsx src/pages/CouplesDashboard.jsx src/pages/CommunicationPractice.jsx; do
            test -f "$file"
            for lang in en es fr it de; do grep -q "${lang}:" "$file"; done
          done
          grep -q 'path="/AnniversaryTracker"' src/pages/index.jsx
          grep -q 'path="/CoupleActivities"' src/pages/index.jsx
          grep -q 'path="/CouplesDashboard"' src/pages/index.jsx
          grep -q 'path="/CommunicationPractice"' src/pages/index.jsx

      - name: Verify Anniversary Tracker privacy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Intl.DateTimeFormat' src/pages/AnniversaryTracker.jsx
          grep -q '.eq("id", user.id)' src/pages/AnniversaryTracker.jsx
          grep -q 'anniversary_date' src/pages/AnniversaryTracker.jsx
          if grep -F '.from("users")' src/pages/AnniversaryTracker.jsx | grep -q '.select'; then
            echo 'Anniversary Tracker must not read another member account row.'
            exit 1
          fi
          if grep -F ".from('users')" src/pages/AnniversaryTracker.jsx | grep -q '.select'; then
            echo 'Anniversary Tracker must not read another member account row.'
            exit 1
          fi
          if grep -Eq 'partner_email|relationship_score|compatibility_score|console\.' src/pages/AnniversaryTracker.jsx; then
            echo 'Anniversary Tracker contains misleading or privacy-sensitive legacy behavior.'
            exit 1
          fi

      - name: Verify hubs use only real tools and no fake stats
        shell: bash
        run: |
          set -euo pipefail
          for route in ConversationCards WeeklyCheckIn RelationshipRituals SharedJournals MemoryLane CouplesCalendar RelationshipGoals CooperativeGames; do
            grep -q "/${route}" src/pages/CoupleActivities.jsx
          done
          for route in CouplesProfile CouplesCalendar AnniversaryTracker LoveNotes SharedJournals MemoryLane RelationshipGoals RelationshipMilestones WeeklyCheckIn; do
            grep -q "/${route}" src/pages/CouplesDashboard.jsx
          done
          if grep -Eq 'supabase|fetch\(|localStorage|sessionStorage|activityProgress|completion_percentage|relationship_score|compatibility_score' src/pages/CoupleActivities.jsx src/pages/CouplesDashboard.jsx; then
            echo 'Couple hubs must not fabricate progress or persist navigation choices.'
            exit 1
          fi

      - name: Verify Communication Practice privacy-first behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Nothing you say or select' src/pages/CommunicationPractice.jsx
          grep -q 'not therapy' src/pages/CommunicationPractice.jsx
          if grep -Eq 'supabase|fetch\(|localStorage|sessionStorage|console\.' src/pages/CommunicationPractice.jsx; then
            echo 'Communication Practice must remain zero-data-retention.'
            exit 1
          fi

      - name: Lint couple tools
        run: >-
          npx eslint
          src/pages/AnniversaryTracker.jsx
          src/pages/CoupleActivities.jsx
          src/pages/CouplesDashboard.jsx
          src/pages/CommunicationPractice.jsx
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
