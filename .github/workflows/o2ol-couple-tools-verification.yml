name: O2OL Couple Tools Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-couple-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify files, routes, and five active languages
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/pages/AnniversaryTracker.jsx \
            src/pages/CoupleActivities.jsx \
            src/pages/CouplesDashboard.jsx \
            src/pages/CommunicationPractice.jsx \
            src/pages/CoupleSupport.jsx \
            src/pages/RelationshipCoach.jsx; do
            test -f "$file"
            for lang in en es fr it de; do grep -q "${lang}:" "$file"; done
          done
          grep -q 'path="/AnniversaryTracker"' src/pages/index.jsx
          grep -q 'path="/CoupleActivities"' src/pages/index.jsx
          grep -q 'path="/CouplesDashboard"' src/pages/index.jsx
          grep -q 'path="/CommunicationPractice"' src/pages/index.jsx
          grep -q 'path="/CoupleSupport"' src/pages/index.jsx
          grep -q 'path="/RelationshipCoach"' src/pages/index.jsx

      - name: Verify Anniversary Tracker privacy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Intl.DateTimeFormat' src/pages/AnniversaryTracker.jsx
          grep -q '.eq("id", user.id)' src/pages/AnniversaryTracker.jsx
          grep -q 'anniversary_date' src/pages/AnniversaryTracker.jsx
          if grep -F '.from("users")' src/pages/AnniversaryTracker.jsx | grep -q '.select'; then
            echo 'Anniversary Tracker must not read another member account row.'
            exit 1
          fi
          if grep -F ".from('users')" src/pages/AnniversaryTracker.jsx | grep -q '.select'; then
            echo 'Anniversary Tracker must not read another member account row.'
            exit 1
          fi
          if grep -Eq 'partner_email|relationship_score|compatibility_score|console\.' src/pages/AnniversaryTracker.jsx; then
            echo 'Anniversary Tracker contains misleading or privacy-sensitive legacy behavior.'
            exit 1
          fi

      - name: Verify hubs use only real tools and no fake stats
        shell: bash
        run: |
          set -euo pipefail
          for route in ConversationCards WeeklyCheckIn RelationshipRituals SharedJournals MemoryLane CouplesCalendar RelationshipGoals CooperativeGames; do
            grep -q "/${route}" src/pages/CoupleActivities.jsx
          done
          for route in CouplesProfile CouplesCalendar AnniversaryTracker LoveNotes SharedJournals MemoryLane RelationshipGoals RelationshipMilestones WeeklyCheckIn; do
            grep -q "/${route}" src/pages/CouplesDashboard.jsx
          done
          if grep -Eq 'supabase|fetch\(|localStorage|sessionStorage|activityProgress|completion_percentage|relationship_score|compatibility_score' src/pages/CoupleActivities.jsx src/pages/CouplesDashboard.jsx; then
            echo 'Couple hubs must not fabricate progress or persist navigation choices.'
            exit 1
          fi

      - name: Verify Communication Practice privacy-first behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Nothing you say or select' src/pages/CommunicationPractice.jsx
          grep -q 'not therapy' src/pages/CommunicationPractice.jsx
          if grep -Eq 'supabase|fetch\(|localStorage|sessionStorage|console\.' src/pages/CommunicationPractice.jsx; then
            echo 'Communication Practice must remain zero-data-retention.'
            exit 1
          fi

      - name: Verify Relationship Support trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'does not provide therapy' src/pages/CoupleSupport.jsx
          grep -q 'crisis care' src/pages/CoupleSupport.jsx
          grep -q '/CommunicationPractice' src/pages/CoupleSupport.jsx
          grep -q '/RelationshipLibrary' src/pages/CoupleSupport.jsx
          if grep -Eq 'licensed professionals|Find a Counselor|therapist_profiles|professional_profiles|supabase|fetch\(' src/pages/CoupleSupport.jsx; then
            echo 'Relationship Support must not imply an unverified professional-referral flow.'
            exit 1
          fi

      - name: Verify AI Coach is a truthful zero-data preview
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Preview' src/pages/RelationshipCoach.jsx
          grep -q 'not available yet' src/pages/RelationshipCoach.jsx
          grep -q 'does not save or transmit' src/pages/RelationshipCoach.jsx
          grep -q 'will not diagnose' src/pages/RelationshipCoach.jsx
          grep -q 'createPageUrl("CommunicationPractice")' src/pages/RelationshipCoach.jsx
          grep -q 'createPageUrl("RelationshipLibrary")' src/pages/RelationshipCoach.jsx
          grep -q 'createPageUrl("WeeklyCheckIn")' src/pages/RelationshipCoach.jsx
          if grep -Eq 'supabase|fetch\(|localStorage|sessionStorage|console\.|<Input|<Textarea|useMutation|useQuery' src/pages/RelationshipCoach.jsx; then
            echo 'AI Coach preview must not collect, store, transmit, or imply live conversational AI.'
            exit 1
          fi

      - name: Verify AuthContext does not expose account diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'console\.(log|debug|info|trace)' src/contexts/AuthContext.jsx; then
            echo 'AuthContext must not log account, profile, or session data to the browser console.'
            exit 1
          fi
          grep -q 'refreshUserProfile' src/contexts/AuthContext.jsx
          grep -q "supabase.auth.onAuthStateChange" src/contexts/AuthContext.jsx

      - name: Lint couple tools and auth context
        run: >-
          npx eslint
          src/pages/AnniversaryTracker.jsx
          src/pages/CoupleActivities.jsx
          src/pages/CouplesDashboard.jsx
          src/pages/CommunicationPractice.jsx
          src/pages/CoupleSupport.jsx
          src/pages/RelationshipCoach.jsx
          src/contexts/AuthContext.jsx
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
