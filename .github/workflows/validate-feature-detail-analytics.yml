name: Validate Feature Detail Analytics

on:
  push:
    branches:
      - feature/feature-detail-analytics-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npx wrangler deploy --dry-run --config ../cloudflare/wrangler.production.jsonc
      - name: Static analytics guards
        run: |
          grep -q "Recent Click Details" src/pages/Analytics.jsx
          grep -q "featureDailyAll" src/pages/Analytics.jsx
          grep -q "featureRankAll" worker/analytics.ts
          grep -q 'data-analytics-id="home-hero-love-notes"' src/pages/Home.jsx
          grep -q "data-analytics-destination" src/lib/interactionAnalytics.js
          grep -q "languageChartMax" src/pages/Analytics.jsx
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify labeled homepage click payload
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > feature-click-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext();
            const page = await context.newPage();
            const events = [];
            const errors = [];
            await page.route('**/api/interaction-events', async route => {
              const req = route.request();
              let body = req.postData();
              try { body = JSON.parse(body || '{}'); } catch {}
              events.push(body);
              await route.fulfill({status:204, body:''});
            });
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(500);
            await page.locator('[data-analytics-id="home-hero-love-notes"]').click();
            await page.waitForTimeout(500);
            const click = events.find(e => e && e.eventType==='click' && e.controlKey==='home-hero-love-notes');
            console.log(JSON.stringify({click,errors}));
            if (errors.length) throw new Error(errors.join(' | '));
            if (!click) throw new Error('Labeled Love Notes click was not emitted');
            if (click.destination !== '/LoveNotes') throw new Error('Wrong click destination: '+click.destination);
            if (click.feature !== 'Love Notes') throw new Error('Wrong click feature: '+click.feature);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node feature-click-audit.cjs
