name: O2OL Profile Label One-Time Fix

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-profile-label-fix.yml

permissions:
  contents: write

jobs:
  patch-profile-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Relabel Relationship Goals quick action
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Profile.jsx')
          text = path.read_text()
          old = '{ icon: Target, label: t.profile.actions.calendar, color: "bg-gradient-to-br from-pink-500 to-rose-500", link: "RelationshipGoals" },'
          new = '{ icon: Target, label: ({ en: "Relationship Goals", es: "Metas de Relación", fr: "Objectifs de Relation", it: "Obiettivi di Relazione", de: "Beziehungsziele", nl: "Relatiedoelen", pt: "Metas de Relacionamento" }[currentLanguage] || "Relationship Goals"), color: "bg-gradient-to-br from-pink-500 to-rose-500", link: "RelationshipGoals" },'
          if old not in text:
              raise SystemExit('Expected RelationshipGoals quick-action line was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit profile label fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Profile.jsx
          git commit -m "Relabel profile quick action as Relationship Goals"
          git push origin HEAD:o2ol-password-reset-preview
