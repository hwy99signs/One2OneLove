name: Validate Free and Paid Signup Paths

on:
  push:
    branches:
      - fix/free-tier-signup-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Static signup contract
        run: |
          grep -q "selectedPlanRaw = clean(body.selectedPlan, 50, false) || 'Basic'" worker/launch-auth.ts
          grep -q "selectedPlan === 'Basic' ? 0" worker/launch-auth.ts
          grep -q "Create Free Account" src/pages/Subscription.jsx
          grep -q "plan=Basic&type=individual" src/pages/Subscription.jsx
          grep -q "const effectivePlan = selectedPlan || 'Basic';" src/pages/SignUp.jsx
          grep -q "Registered Free Accounts" src/pages/Admin.jsx
          grep -q "Pending Verification" src/pages/Admin.jsx
          grep -q "registered_free" worker/admin.ts
          grep -q "pending_verification" worker/admin.ts
          ! grep -q "disabled={Boolean(foundingOffer?.available)}" src/pages/Subscription.jsx

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser verify Free, Premiere and Exclusive paths
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cat > signup-paths.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));

            await page.route('**/api/interaction-events', route=>route.fulfill({status:204,body:''}));
            await page.route('**/api/billing/founding-offer', route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({offer:{available:true,plan:'Exclusive',cohort:'first100',recurringPriceCents:1599}})
            }));
            await page.route('**/api/billing/checkout', route=>route.fulfill({
              status:401,contentType:'application/json',
              body:JSON.stringify({error:{code:'unauthorized',message:'Sign in required'}})
            }));
            await page.route('**/api/launch-signup/readiness', route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({readiness:{publicLaunchIdentityGateReady:true}})
            }));

            await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(400);

            const free=page.getByRole('button',{name:'Create Free Account'});
            const premiere=page.getByRole('button',{name:'Create Account for Premiere'});
            const exclusive=page.getByRole('button',{name:'Create Account for Exclusive'});
            if(await free.isDisabled()) throw new Error('Free signup button is disabled');
            if(await premiere.isDisabled()) throw new Error('Premiere button is disabled');
            if(await exclusive.isDisabled()) throw new Error('Exclusive button is disabled');

            await free.click();
            await page.waitForURL(/\/SignUp\?plan=Basic&type=individual/);
            if(!(await page.getByText(/Registered Free/i).isVisible())) throw new Error('Free signup is not identified as Registered Free');

            await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            await page.getByRole('button',{name:'Create Account for Premiere'}).click();
            await page.waitForURL(/\/SignUp\?plan=Premiere/);

            await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            await page.getByRole('button',{name:'Create Account for Exclusive'}).click();
            await page.waitForURL(/\/SignUp\?plan=Exclusive/);

            if(errors.length) throw new Error(errors.join(' | '));
            console.log('Free, Premiere and Exclusive signup paths passed');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
          node signup-paths.cjs
