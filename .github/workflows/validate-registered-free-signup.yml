name: Validate Registered Free Signup Mode

on:
  push:
    branches:
      - fix/registered-free-schema-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Production pricing guard compatibility
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "['\"]Basic['\"]|subscription_plan.*Basic|STRIPE_PRICE_BASIC" src worker cloudflare/wrangler.production.jsonc 2>/dev/null; then
            echo "Retired Basic tier found" >&2
            exit 1
          fi
          ! grep -RInE 'isFree:[[:space:]]*true|price:[[:space:]]*0([,}]|$)|34\.99' src/components/subscriptions src/pages/Subscription.jsx 2>/dev/null
          grep -q "account=free&type=individual" src/pages/Subscription.jsx
          grep -q "freeAccount" src/pages/SignUp.jsx
          grep -q "freeAccount" src/components/signup/LaunchRegularUserForm.jsx
          grep -q "freeAccount" src/lib/launchSignupService.js
          grep -q "freeAccount = body.freeAccount === true" worker/launch-auth.ts
          grep -q "Registered Free Accounts" src/pages/Admin.jsx
          grep -q "Pending Verification" src/pages/Admin.jsx

      - name: Worker production dry-run
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy --dry-run --config ../cloudflare/wrangler.production.jsonc

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser verify free and paid signup paths
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cat > registered-free-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const page=await context.newPage();
            const errors=[];
            let signupPayload=null;
            page.on('pageerror', e=>errors.push(String(e)));

            await page.route('**/api/interaction-events', route=>route.fulfill({status:204,body:''}));
            await page.route('**/api/billing/founding-offer', route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({offer:{available:true,plan:'Exclusive',cohort:'first100',recurringPriceCents:1599}})
            }));
            await page.route('**/api/billing/checkout', route=>route.fulfill({
              status:401,contentType:'application/json',
              body:JSON.stringify({error:{code:'unauthorized',message:'Sign in required'}})
            }));
            await page.route('**/api/launch-signup/readiness', route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({readiness:{publicLaunchIdentityGateReady:true}})
            }));
            await page.route('**/api/launch-signup', async route=>{
              const req=route.request();
              try{ signupPayload=JSON.parse(req.postData()||'{}'); }catch{}
              await route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({user:{},emailVerificationRequired:true,verificationMethod:'otp',verificationEmailExpected:true,profileReady:true})
              });
            });

            await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(400);

            const free=page.getByRole('button',{name:'Create Free Account'});
            const premiere=page.getByRole('button',{name:'Create Account for Premiere'});
            const exclusive=page.getByRole('button',{name:'Create Account for Exclusive'});
            if(await free.isDisabled()) throw new Error('Free signup button is disabled');
            if(await premiere.isDisabled()) throw new Error('Premiere button is disabled');
            if(await exclusive.isDisabled()) throw new Error('Exclusive button is disabled');

            await free.click();
            await page.waitForURL(/\/SignUp\?account=free&type=individual/);
            await page.getByText(/Registered Free/i).waitFor({state:'visible',timeout:5000});

            await page.fill('#signup-full-name','Browser Audit');
            await page.fill('#signup-email','browser-audit@example.com');
            await page.fill('#signup-password','abcdefgh');
            await page.fill('#signup-confirm-password','abcdefgh');
            await page.selectOption('#signup-country','US');
            await page.selectOption('#signup-language','en');

            await page.getByRole('button',{name:/OPEN TERMS & CONDITIONS/i}).click();
            const termsScroller=page.locator('.max-h-\\[58vh\\].overflow-y-auto');
            await termsScroller.evaluate(node=>{node.scrollTop=node.scrollHeight;node.dispatchEvent(new Event('scroll',{bubbles:true}));});
            const accept=page.getByRole('button',{name:/I Am 18\+ and Accept/i});
            await accept.waitFor({state:'visible'});
            await page.waitForFunction(() => {
              const buttons=[...document.querySelectorAll('button')];
              const b=buttons.find(x=>/I Am 18\+ and Accept/i.test(x.textContent||''));
              return b && !b.disabled;
            });
            await accept.click();
            await page.getByRole('button',{name:'Create Account'}).click();
            await page.waitForTimeout(250);

            if(!signupPayload) throw new Error('Free signup payload was not sent');
            if(signupPayload.freeAccount!==true) throw new Error('Free signup did not send freeAccount=true');
            if(signupPayload.selectedPlan!=='Premiere') throw new Error('Free signup internal plan should remain Premiere for existing schema compatibility');

            await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            await page.getByRole('button',{name:'Create Account for Premiere'}).click();
            await page.waitForURL(/\/SignUp\?plan=Premiere/);
            await page.getByRole('button',{name:'Individual Member'}).click();
            await page.waitForURL(/\/SignUp\?plan=Premiere&type=individual/);
            await page.getByText(/Selected membership: Premiere/i).waitFor({state:'visible'});

            await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            await page.getByRole('button',{name:'Create Account for Exclusive'}).click();
            await page.waitForURL(/\/SignUp\?plan=Exclusive/);
            await page.getByRole('button',{name:'Individual Member'}).click();
            await page.waitForURL(/\/SignUp\?plan=Exclusive&type=individual/);
            await page.getByText(/Selected membership: Exclusive/i).waitFor({state:'visible'});

            if(errors.length) throw new Error(errors.join(' | '));
            console.log(JSON.stringify({freePayload:{freeAccount:signupPayload.freeAccount,selectedPlan:signupPayload.selectedPlan},paidPaths:['Premiere','Exclusive']}));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
          node registered-free-audit.cjs
