name: Deploy O2OL Production Neon

on:
  push:
    branches:
      - master
    paths:
      - .github/deploy-o2ol-production-neon-trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APEX_URL: https://one2onelove.com
      WWW_URL: https://www.one2onelove.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Require verified Production schema preparation
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/o2ol-production-schema-prepared
          grep -Fx 'o2ol-open-house-schema-v1' .github/o2ol-production-schema-prepared >/dev/null
          test -s .github/o2ol-production-token-schema-prepared
          grep -Fx 'o2ol-free-tokens-visitor-schema-v1' .github/o2ol-production-token-schema-prepared >/dev/null
      - name: Build production application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm --prefix worker install --no-audit --no-fund
          if grep -RInEi 'supabase|supabase\.co|@supabase' src worker package.json package-lock.json public 2>/dev/null; then
            echo 'Legacy Supabase reference found in active production application.' >&2
            exit 1
          fi
          if grep -RInEi '@base44|base44\.app|firebaseio\.com|@firebase/' src worker public 2>/dev/null \
             || grep -En '"(firebase|base44|@base44/[^"]+)"[[:space:]]*:' package.json package-lock.json 2>/dev/null; then
            echo 'Legacy Base44/Firebase dependency found in active O2OL application.' >&2
            exit 1
          fi
          if grep -RInEi 'vercel\.app|VERCEL_URL|@vercel/' src worker package.json package-lock.json public 2>/dev/null; then
            echo 'Vercel runtime reference found in active production application.' >&2
            exit 1
          fi

      - name: Verify no stale launch placeholders or legacy pricing assumptions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules 'Promise\.resolve\(|Base44 removed' src worker 2>/dev/null; then
            echo 'Legacy migration placeholder found in active O2OL code.' >&2
            exit 1
          fi
          if grep -RInE 'isFree:[[:space:]]*true|price:[[:space:]]*0([,}]|$)|34\.99' src/components/subscriptions src/pages/Subscription.jsx 2>/dev/null; then
            echo 'Stale O2OL subscription pricing/free-plan assumption found.' >&2
            exit 1
          fi
          if grep -RInE "['\"]Basic['\"]|subscription_plan.*Basic|STRIPE_PRICE_BASIC" src worker cloudflare/wrangler.production.jsonc 2>/dev/null; then
            echo 'Retired O2OL Basic tier found in active runtime code.' >&2
            exit 1
          fi
          if grep -RInF '4.99' src/components/subscriptions src/components/profile src/components/signup src/hooks src/lib/stripeService.js src/pages/Subscription.jsx src/pages/PaymentSuccess.jsx worker cloudflare/wrangler.production.jsonc 2>/dev/null; then
            echo 'Retired O2OL $4.99 pricing found in billing/subscription runtime code.' >&2
            exit 1
          fi
          if grep -RInE '/api/send-credits|sms_send_credit_wallets|sms_send_credit_purchases|2 sends per \$1|includedRemaining|monthlyLimit' src worker 2>/dev/null; then
            echo 'Retired Love Note credit/quota model found in active runtime code.' >&2
            exit 1
          fi
          if grep -InE '3 SMS|limit of 3 SMS|>= 3' src/pages/LoveNotes.jsx 2>/dev/null; then
            echo 'Legacy three-SMS Love Notes client limit found.' >&2
            exit 1
          fi

      - name: Audit shipped frontend dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Report build-tool advisories separately
        shell: bash
        run: |
          set -euo pipefail
          if ! npm audit --audit-level=high; then
            echo 'Non-shipped build-tool advisory detected. Runtime dependency audit remains the Production blocker.'
          fi

      - name: Audit Worker runtime dependencies for high-severity vulnerabilities
        run: npm --prefix worker audit --audit-level=high

      - name: Verify active code has no unsafe HTML execution primitives or plaintext runtime keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'dangerouslySetInnerHTML|new Function\(|(^|[^A-Za-z0-9_])eval\(' src worker 2>/dev/null; then
            echo 'Unsafe dynamic HTML/code execution primitive found in active O2OL code.' >&2
            exit 1
          fi
          if grep -RInE 'sk_(live|test)_[A-Za-z0-9]|sk-proj-[A-Za-z0-9]|whsec_[A-Za-z0-9]|re_[A-Za-z0-9]{20,}' src worker cloudflare/wrangler.production.jsonc 2>/dev/null; then
            echo 'Plaintext runtime credential pattern found in active O2OL code/config.' >&2
            exit 1
          fi

      - name: Verify Free plus Tokens production contract
        shell: bash
        run: |
          set -euo pipefail

          # Core Token economy and routes.
          grep -F "handleO2OLTokenRequest" worker/index-v2.ts >/dev/null
          grep -F "reserveTokenCharge" worker/o2ol-tokens.ts >/dev/null
          grep -F "releaseTokenReservation" worker/o2ol-tokens.ts >/dev/null
          grep -F "maybeAutoReplenish" worker/o2ol-tokens.ts >/dev/null
          grep -F "recordOpenAICostEvent" worker/o2ol-cost-ledger.ts >/dev/null
          grep -F 'path="/Tokens"' src/pages/index.jsx >/dev/null
          grep -F 'path="/Amora"' src/pages/index.jsx >/dev/null
          grep -F '<Navigate to="/Tokens" replace' src/pages/Subscription.jsx >/dev/null
          grep -F 'navigate("/SignUp")' src/pages/Layout.jsx >/dev/null

          # Registered Free identity + visitor stitching.
          grep -F "'Free'" worker/launch-auth.ts >/dev/null
          grep -F "'Free',0,'inactive'" worker/launch-auth.ts >/dev/null
          grep -F "INSERT INTO public.o2ol_token_wallets" worker/launch-auth.ts >/dev/null
          grep -F "visitor_identity_links" worker/launch-auth.ts >/dev/null
          grep -F "marketingEmailOptIn" worker/launch-auth.ts >/dev/null
          grep -F "username_taken" worker/launch-auth.ts >/dev/null
          grep -F "QuickAccountGate" src/components/launch/LaunchAccessGate.jsx >/dev/null
          grep -F "Registered Free is the site access identity." src/components/launch/LaunchAccessGate.jsx >/dev/null
          grep -F "Username" src/components/launch/QuickAccountGate.jsx >/dev/null
          grep -F "marketingEmailOptIn" src/components/launch/QuickAccountGate.jsx >/dev/null

          # Subscription-era access is retired.
          grep -F "legacy_subscription_model_retired" worker/billing.ts src/lib/stripeService.js worker/billing-plan-change.ts >/dev/null
          grep -F "return false;" worker/api-entitlements.ts >/dev/null
          grep -F "accessModel:'free_tokens'" worker/ai.ts >/dev/null
          grep -F "'Free',0,'inactive'" worker/onboarding.ts worker/member-onboarding.ts worker/index.ts >/dev/null
          grep -F "'Free','inactive',0" worker/professional-signup.ts >/dev/null
          if grep -REn 'PLAN_LEVEL|REQUIRED_PLAN|stripe_subscription_id|subscription_status|subscription_plan' src/components/launch/LaunchAccessGate.jsx; then
            echo "Global browser access still depends on a subscription." >&2
            exit 1
          fi
          if grep -REn "canonicalPlan|Premiere|Exclusive|50 AI Relationship Coach|subscription_plan|subscription_status" worker/ai.ts; then
            echo "AI access still contains legacy tier eligibility." >&2
            exit 1
          fi
          if grep -REn "selectedSignupPlan|Choose Premiere or Exclusive|selectedPlan" src/lib/professionalOnboardingService.js src/pages/ProfessionalSignup.jsx worker/professional-signup.ts; then
            echo "Professional onboarding still depends on a paid tier." >&2
            exit 1
          fi

          # Required production migrations are present in source.
          grep -F "o2ol_token_wallets" neon-migrations/2026-10-03-o2ol-token-economy.sql >/dev/null
          grep -F "'item','episode'" neon-migrations/2026-10-03-o2ol-token-economy.sql >/dev/null
          grep -F "o2ol_token_content_unlocks" neon-migrations/2026-10-04-o2ol-token-content-unlocks.sql >/dev/null
          grep -F "visitor_identity_links" neon-migrations/2026-10-09-o2ol-lightweight-visitor-registry.sql >/dev/null
      - name: Verify transactional Token features and payment safety
        shell: bash
        run: |
          set -euo pipefail

          # MyMatchIQ remains free to assess; paid AI uses O2OL Tokens.
          grep -F "Free: { questionCount:225, dimensionCount:15 }" src/lib/mymatchiqAssessment.js >/dev/null
          grep -F "assessment_question_count:225" worker/mymatchiq-ai.ts >/dev/null
          grep -F "access_model:'free_tokens'" worker/mymatchiq-ai.ts >/dev/null
          grep -F "reserveTokenCharge(db,auth.user.id,'bianca_report'" worker/mymatchiq-ai.ts >/dev/null
          grep -F "'bianca_response'" worker/mymatchiq-ai.ts >/dev/null
          grep -F 'to="/Tokens?source=mymatchiq-assessment"' src/pages/MyMatchIQAssessment.jsx >/dev/null

          # Love Notes, Amora and games charge Tokens transactionally.
          grep -F "reserveTokenCharge(db,auth.user.id,'amora_response'" worker/ai.ts >/dev/null
          grep -F "reserveTokenCharge(db,auth.user.id,'love_note_send'" worker/love-note-entitlements.ts >/dev/null
          grep -F "customerTokensCharged:Number(reservation.tokens||0)" worker/love-note-entitlements.ts >/dev/null
          grep -F "plan:'Free'" worker/love-note-entitlements.ts >/dev/null
          grep -F "accessModel:'free_tokens'" worker/love-note-entitlements.ts >/dev/null
          grep -F "LOVE_NOTE_SEND_PRICE_CENTS=0" worker/love-note-billing.ts >/dev/null
          grep -F "legacy_love_note_billing_retired" worker/love-note-billing.ts >/dev/null
          grep -F "reserveTokenCharge(db,auth.user.id,'like_minded_session'" worker/game-access.ts >/dev/null
          grep -F "await consumeTokenReservation(db,reservation.id)" worker/game-access.ts >/dev/null
          grep -F "await releaseTokenReservation(db,reservation.id,'game_pass_creation_failed')" worker/game-access.ts >/dev/null

          # Payment + auto-replenish safety.
          grep -F "'metadata[idempotency_key]':marker" worker/o2ol-tokens.ts >/dev/null
          grep -F 'idempotencyKey:meta.idempotency_key||`stripe_auto:' worker/o2ol-tokens.ts >/dev/null
          grep -F "payment_method_saved:Boolean(state.settings?.payment_method_reference)" worker/o2ol-tokens.ts >/dev/null
          grep -F "trigger>Number(pkg.tokens||0)" worker/o2ol-tokens.ts >/dev/null
          grep -F "max={maxAutoTrigger||undefined}" src/pages/Tokens.jsx >/dev/null
          grep -F "settings?.payment_method_saved" src/pages/Tokens.jsx >/dev/null
          if grep -F "settings?.payment_method_reference" src/pages/Tokens.jsx; then
            echo "Raw Stripe payment method reference is exposed to the browser." >&2
            exit 1
          fi
          if grep -REn 'Premiere|Exclusive|stripe_subscription_id|subscription_status' worker/game-access.ts worker/like-minded.ts; then
            echo "Game access still contains subscription-era gating." >&2
            exit 1
          fi
          if grep -REn "'Premiere'|9\.99|effectivePlan|stripe_subscription_id" worker/love-note-entitlements.ts; then
            echo "Love Notes still contains subscription-derived access." >&2
            exit 1
          fi
      - name: Verify Admin audience intelligence and final UX contract
        shell: bash
        run: |
          set -euo pipefail

          # Audience intelligence / presence / support.
          grep -F "Visitor Registry / Audience Intelligence" src/pages/Admin.jsx >/dev/null
          grep -F "Anonymous Visitors" src/pages/Admin.jsx >/dev/null
          grep -F "Registered Free" src/pages/Admin.jsx >/dev/null
          grep -F "Token Buyers" src/pages/Admin.jsx >/dev/null
          grep -F "async function visitorRegistry(db)" worker/admin.ts >/dev/null
          grep -F "marketing_email_opt_in" worker/admin.ts >/dev/null
          grep -F "visitor_identity_links" worker/admin.ts >/dev/null
          grep -F "America/Chicago" worker/admin.ts >/dev/null
          grep -F "online_now" worker/admin.ts >/dev/null
          grep -F "Support & Problem Reports" src/pages/Admin.jsx >/dev/null

          # Separate MFA-protected Token admin.
          grep -F "Token System Dashboard" src/pages/TokenSystemDashboard.jsx >/dev/null
          grep -F "handleTokenAdminRequest" worker/token-admin.ts worker/index-v2.ts >/dev/null
          grep -F 'path="/TokenSystemDashboard"' src/pages/index.jsx >/dev/null
          grep -F "<AdminMfaGate><TokenSystemDashboard /></AdminMfaGate>" src/pages/index.jsx >/dev/null

          # Approved UX cleanup.
          test -s public/assets/amora-relationship-coach-official.webp
          test "$(wc -c < public/assets/amora-relationship-coach-official.webp)" -gt 12000
          grep -F 'src="/assets/amora-relationship-coach-official.webp"' src/pages/Home.jsx >/dev/null
          grep -F "data-desktop-action-trigger" src/pages/Layout.jsx >/dev/null
          grep -F "aria-expanded={desktopActionOpen}" src/pages/Layout.jsx >/dev/null
          grep -F "/Suggestions?mode=problem" src/pages/Layout.jsx >/dev/null
          grep -F "'/suggestions'" src/components/launch/LaunchAccessGate.jsx >/dev/null
          grep -F 'path="*" element={<NotFound />}' src/pages/index.jsx >/dev/null
          grep -F 'FeatureUnavailable feature="Win a Cruise"' src/pages/index.jsx >/dev/null
          grep -F 'preload="auto"' src/pages/O2OLStudio.jsx >/dev/null
          if grep -F "technicalsupport@erantpropertyservices.com" src/pages/Layout.jsx; then
            echo "ERANT technical-support address is still exposed publicly." >&2
            exit 1
          fi
          if grep -F "not available from media storage yet" src/pages/O2OLStudio.jsx; then
            echo "Public Studio staging sentence survived." >&2
            exit 1
          fi
          if grep -E "Vote now|Vota ahora|Votez maintenant|Vota ora|Jetzt abstimmen|Oct 9|9 octobre|9 ottobre|9\. Oktober" src/pages/Chat.jsx; then
            echo "Stale voting/date copy survived." >&2
            exit 1
          fi
          ACTIVE_TOKEN_SURFACES=(
            src/pages/Home.jsx src/pages/Layout.jsx src/pages/O2OLStudio.jsx src/pages/Amora.jsx
            src/pages/LoveNotes.jsx src/pages/DateIdeas.jsx src/pages/MyMatchIQ.jsx
            src/pages/MyMatchIQBianca.jsx src/pages/MyMatchIQAssessment.jsx src/pages/LikeMinded.jsx
          )
          if grep -RInE '\bCredit\b|\bCrédito(s)?\b|\bCrédit(s)?\b|\bCredito\b' "${ACTIVE_TOKEN_SURFACES[@]}" 2>/dev/null; then
            echo "Credit-era customer copy remains on an active Token surface." >&2
            exit 1
          fi

      - name: Verify production deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"name": "one2onelove-launch"' cloudflare/wrangler.production.jsonc >/dev/null
          grep -F '"pattern": "one2onelove.com/*"' cloudflare/wrangler.production.jsonc >/dev/null
          grep -F '"pattern": "www.one2onelove.com/*"' cloudflare/wrangler.production.jsonc >/dev/null
          npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.production.jsonc

      - name: Verify production Worker runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_OUT=$(npx --yes wrangler@latest secret list --name one2onelove-launch 2>&1)
          for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
            if ! printf '%s\n' "$SECRETS_OUT" | grep -F "$REQUIRED" >/dev/null; then
              echo "Missing required production Worker secret: $REQUIRED" >&2
              exit 1
            fi
          done
          if printf '%s\n' "$SECRETS_OUT" | grep -F 'OPENAI_API_KEY' >/dev/null; then
            echo "Optional AI provider: configured"
          else
            echo "Optional AI provider: not configured; AI Coach/Content Creator will remain unavailable until OPENAI_API_KEY is added."
          fi

      - name: Verify Cloudflare O2OL zone and routes access
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" 'https://api.cloudflare.com/client/v4/zones?name=one2onelove.com' -o /tmp/zones.json
          jq -e '.success == true and (.result | length) == 1' /tmp/zones.json >/dev/null
          ZONE_ID=$(jq -r '.result[0].id' /tmp/zones.json)
          test -n "$ZONE_ID"
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" -o /tmp/routes.json
          jq -e '.success == true' /tmp/routes.json >/dev/null

      - name: Trace production Hyperdrive target
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/ef44564dbfca4e1bb13176ee568aaddf" -o /tmp/hyperdrive.json
          jq -e '.success == true' /tmp/hyperdrive.json >/dev/null
          echo "O2OL_HYPERDRIVE_HOST=$(jq -r '.result.origin.host // .result.origin.hostname // "unknown"' /tmp/hyperdrive.json)"
          echo "O2OL_HYPERDRIVE_DATABASE=$(jq -r '.result.origin.database // "unknown"' /tmp/hyperdrive.json)"

      - name: Trace recent signup requests from Workers Logs
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          NOW_MS=$(( $(date +%s) * 1000 ))
          FROM_MS=$(( NOW_MS - 7*24*60*60*1000 ))
          cat >/tmp/o2ol-observability-query.json <<JSON
          {
            "queryId":"o2ol-signup-debug",
            "timeframe":{"from":$FROM_MS,"to":$NOW_MS},
            "limit":200,
            "parameters":{
              "datasets":[],
              "filterCombination":"and",
              "filters":[
                {"key":"\$metadata.service","operation":"eq","type":"string","value":"one2onelove-launch"}
              ],
              "needle":{"value":"launch-signup","isRegex":false,"matchCase":false},
              "view":"events"
            }
          }
          JSON
          CODE=$(curl -sS -o /tmp/o2ol-observability.json -w '%{http_code}'             -H "$AUTH" -H 'Content-Type: application/json'             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query"             --data-binary @/tmp/o2ol-observability-query.json || true)
          echo "O2OL_OBSERVABILITY_HTTP=$CODE"
          if [ "$CODE" = "200" ]; then
            jq -c '{
              success,
              errors,
              count:(.result.events.count // 0),
              events:[(.result.events.events // [])[] | {
                ts:(."$metadata".timestamp // .timestamp // null),
                status:(."$metadata".statusCode // null),
                method:(."$metadata".request.method // .request.method // null),
                url:(."$metadata".request.url // .request.url // null),
                message:(."$metadata".message // .message // null),
                error:(."$metadata".error // null)
              }]
            }' /tmp/o2ol-observability.json
          else
            jq -c '{success,errors,messages}' /tmp/o2ol-observability.json 2>/dev/null || cat /tmp/o2ol-observability.json
          fi

      - name: Deploy Cloudflare Worker to production domains
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.production.jsonc

      - name: Verify production frontend on custom domains
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_JS=$(grep -oE 'src="[^"]+\.js"' dist/index.html | head -1 | sed 's/src="//;s/"//')
          echo "Expected production bundle: $LOCAL_JS"
          verify_frontend() {
            BASE="$1"
            OK=no
            for attempt in $(seq 1 24); do
              HTML=$(curl -fsS --max-time 20 "$BASE/" 2>/dev/null || true)
              REMOTE_JS=$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//' || true)
              echo "$BASE attempt $attempt remote=$REMOTE_JS"
              if [ "$REMOTE_JS" = "$LOCAL_JS" ]; then
                OK=yes
                break
              fi
              sleep 5
            done
            test "$OK" = yes
            curl -fsS --max-time 20 "$BASE/VerifyPhone" -o /tmp/verify-phone.html
            grep -F "$LOCAL_JS" /tmp/verify-phone.html >/dev/null
            curl -fsS --max-time 20 "$BASE$LOCAL_JS" -o /tmp/app.js
            test -s /tmp/app.js
            if grep -Fi 'supabase' /tmp/app.js; then
              echo 'Legacy Supabase marker found in deployed bundle.' >&2
              exit 1
            fi
          }
          verify_frontend "$APEX_URL"
          verify_frontend "$WWW_URL"

      - name: Verify production Neon API routing
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            URL="$1"; EXPECT="$2"; OUT="$3"
            CODE=$(curl -sS --max-time 20 -o "$OUT" -w '%{http_code}' "$URL")
            echo "$URL -> HTTP $CODE"
            cat "$OUT"
            test "$CODE" = "$EXPECT"
            grep -qi '^{' "$OUT"
            ! grep -qi '<!doctype html' "$OUT"
          }
          for BASE in "$APEX_URL" "$WWW_URL"; do
            PASS=no
            for attempt in $(seq 1 24); do
              CODE=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)
              echo "$BASE/api/health attempt $attempt -> $CODE"
              if [ "$CODE" = "200" ] && grep -F '"service":"one2onelove-api"' /tmp/health.json >/dev/null 2>&1; then
                PASS=yes
                break
              fi
              sleep 5
            done
            test "$PASS" = yes
            check_json "$BASE/api/reviews" 200 /tmp/reviews.json
            jq -e 'all(.reviews[]?; (has("user_id") | not) and (has("email") | not))' /tmp/reviews.json >/dev/null
            check_json "$BASE/api/stories" 200 /tmp/stories.json
            jq -e 'all(.stories[]?; (has("user_id") | not) and (has("moderation_notes") | not) and (has("moderated_by") | not))' /tmp/stories.json >/dev/null
            check_json "$BASE/api/contests/leaderboard?type=monthly_love_notes&period=2026-09&limit=1" 200 /tmp/contest.json
            jq -e 'all(.participants[]?; (has("user_email") | not) and (has("email") | not))' /tmp/contest.json >/dev/null
            check_json "$BASE/api/memories" 401 /tmp/memories.json
            check_json "$BASE/api/consents/adult-sensitive" 401 /tmp/consent.json
            check_json "$BASE/api/phone-verification/send" 401 /tmp/phone-send.json
            check_json "$BASE/api/phone-verification/verify" 401 /tmp/phone-verify.json
            ANALYTICS_CODE=$(curl -sS --max-time 20 -o /tmp/analytics-smoke.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'x-o2ol-analytics-smoke: schema' \
              -X POST "$BASE/api/interaction-events" \
              --data '{"visitorId":"analytics-smoke-visitor","sessionId":"analytics-smoke-session","eventType":"page_view","route":"/__analytics-smoke"}')
            echo "$BASE/api/interaction-events smoke -> HTTP $ANALYTICS_CODE"
            cat /tmp/analytics-smoke.json
            test "$ANALYTICS_CODE" = "200"
            jq -e '.ok == true and .smoke == true and .storageReady == true' /tmp/analytics-smoke.json >/dev/null
          done
          echo 'O2OL_PRODUCTION_NEON_VERIFIED=yes'
          echo 'O2OL_MEMBER_AUDIT_BEGIN'
          curl -fsS --max-time 20 "$APEX_URL/api/launch-readiness" | jq -c '.readiness.memberAudit'
          echo 'O2OL_MEMBER_AUDIT_END'
          echo 'O2OL_AUTH_POLICY_BEGIN'
          curl -fsS --max-time 20 "$APEX_URL/api/launch-readiness" | jq -c '.readiness.identity'
          echo 'O2OL_AUTH_POLICY_END'
          echo 'O2OL_SIGNUP_READINESS_BEGIN'
          curl -fsS --max-time 20 "$APEX_URL/api/launch-signup/readiness" | jq -c '.readiness'
          echo 'O2OL_SIGNUP_READINESS_END'
