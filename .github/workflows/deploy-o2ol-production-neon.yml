name: Deploy O2OL Production Neon

on:
  push:
    branches:
      - master
    paths:
      - .github/deploy-o2ol-production-neon-trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APEX_URL: https://one2onelove.com
      WWW_URL: https://www.one2onelove.com
      PRELAUNCH_URL: https://one2onelove-prelaunch.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build production application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm --prefix worker install --no-audit --no-fund
          if grep -RInEi 'supabase|supabase\.co|@supabase' src worker package.json package-lock.json public 2>/dev/null; then
            echo 'Legacy Supabase reference found in active production application.' >&2
            exit 1
          fi
          if grep -RInEi '@base44|base44\.app|firebaseio\.com|@firebase/' src worker public 2>/dev/null \
             || grep -En '"(firebase|base44|@base44/[^"]+)"[[:space:]]*:' package.json package-lock.json 2>/dev/null; then
            echo 'Legacy Base44/Firebase dependency found in active O2OL application.' >&2
            exit 1
          fi
          if grep -RInEi 'vercel\.app|VERCEL_URL|@vercel/' src worker package.json package-lock.json public 2>/dev/null; then
            echo 'Vercel runtime reference found in active production application.' >&2
            exit 1
          fi

      - name: Verify no stale launch placeholders or legacy pricing assumptions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules 'Promise\.resolve\(|Base44 removed' src worker 2>/dev/null; then
            echo 'Legacy migration placeholder found in active O2OL code.' >&2
            exit 1
          fi
          if grep -RInE 'isFree:[[:space:]]*true|price:[[:space:]]*0([,}]|$)|34\.99' src/components/subscriptions src/pages/Subscription.jsx 2>/dev/null; then
            echo 'Stale O2OL subscription pricing/free-plan assumption found.' >&2
            exit 1
          fi
          if grep -RInE "['\"]Basic['\"]|subscription_plan.*Basic|STRIPE_PRICE_BASIC" src worker cloudflare/wrangler.production.jsonc wrangler.toml 2>/dev/null; then
            echo 'Retired O2OL Basic tier found in active runtime code.' >&2
            exit 1
          fi
          if grep -RInF '4.99' src/components/subscriptions src/components/profile src/components/signup src/hooks src/lib/stripeService.js src/pages/Subscription.jsx src/pages/PaymentSuccess.jsx worker cloudflare/wrangler.production.jsonc wrangler.toml 2>/dev/null; then
            echo 'Retired O2OL $4.99 pricing found in billing/subscription runtime code.' >&2
            exit 1
          fi
          if grep -RInE '/api/send-credits|sms_send_credit_wallets|sms_send_credit_purchases|2 sends per \$1|includedRemaining|monthlyLimit' src worker 2>/dev/null; then
            echo 'Retired Love Note credit/quota model found in active runtime code.' >&2
            exit 1
          fi
          if grep -InE '3 SMS|limit of 3 SMS|>= 3' src/pages/LoveNotes.jsx 2>/dev/null; then
            echo 'Legacy three-SMS Love Notes client limit found.' >&2
            exit 1
          fi

      - name: Audit frontend dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit Worker dependencies for high-severity vulnerabilities
        run: npm --prefix worker audit --audit-level=high

      - name: Verify active code has no unsafe HTML execution primitives or plaintext runtime keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'dangerouslySetInnerHTML|new Function\(|(^|[^A-Za-z0-9_])eval\(' src worker 2>/dev/null; then
            echo 'Unsafe dynamic HTML/code execution primitive found in active O2OL code.' >&2
            exit 1
          fi
          if grep -RInE 'sk_(live|test)_[A-Za-z0-9]|sk-proj-[A-Za-z0-9]|whsec_[A-Za-z0-9]|re_[A-Za-z0-9]{20,}' src worker wrangler.toml cloudflare/wrangler.production.jsonc 2>/dev/null; then
            echo 'Plaintext runtime credential pattern found in active O2OL code/config.' >&2
            exit 1
          fi

      - name: Verify Love Notes launch entitlements are present
        shell: bash
        run: |
          set -euo pipefail
          grep -F "/api/love-notes/categories" worker/love-note-entitlements.ts >/dev/null
          grep -F "/api/love-notes/send-sms" worker/love-note-entitlements.ts >/dev/null
          grep -F "function categoryLimit(plan)" worker/love-note-entitlements.ts >/dev/null
          grep -F "return 18;" worker/love-note-entitlements.ts >/dev/null
          grep -F "export const LOVE_NOTE_SEND_PRICE_CENTS = 29;" worker/love-note-billing.ts >/dev/null
          grep -F "export const CUSTOM_LOVE_NOTE_MAX_CHARACTERS = 171;" worker/love-note-billing.ts >/dev/null
          grep -F "Trial members are intentionally allowed to send:" worker/love-note-billing.ts >/dev/null
          grep -F "trialSendsAllowed: true" worker/love-note-entitlements.ts >/dev/null
          grep -F "firstTrialSendFree: true" worker/love-note-entitlements.ts >/dev/null
          grep -F "sendLoveNoteSms" src/pages/LoveNotes.jsx >/dev/null
          grep -F "aiPersonalizationReady" src/pages/LoveNotes.jsx >/dev/null
          grep -F "effectivePlan === 'Exclusive'" src/pages/LoveNotes.jsx >/dev/null
          grep -F "const plan = ['trial', 'trialing'].includes(status) ? 'Exclusive' : storedPlan;" worker/ai.ts >/dev/null
          grep -F "guest_preview_expires_at" worker/billing.ts >/dev/null
          grep -F "formatPreviewTime" src/pages/Subscription.jsx >/dev/null
          grep -F "GuestPreviewTimer" src/pages/Subscription.jsx >/dev/null
          grep -F "guest_preview_read_only" worker/api-entitlements.ts >/dev/null
          grep -F "PreviewReadOnly" src/components/launch/LaunchAccessGate.jsx >/dev/null

      - name: Verify production deployment isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name = "one2onelove-prelaunch"$' wrangler.toml
          grep -F '"name": "one2onelove-launch"' cloudflare/wrangler.production.jsonc >/dev/null
          ! grep -Eq '^name = "one2onelove-launch"$' wrangler.toml
          npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.production.jsonc

      - name: Verify production Worker runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_OUT=$(npx --yes wrangler@latest secret list --name one2onelove-launch 2>&1)
          for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
            if ! printf '%s\n' "$SECRETS_OUT" | grep -F "$REQUIRED" >/dev/null; then
              echo "Missing required production Worker secret: $REQUIRED" >&2
              exit 1
            fi
          done
          if printf '%s\n' "$SECRETS_OUT" | grep -F 'OPENAI_API_KEY' >/dev/null; then
            echo "Optional AI provider: configured"
          else
            echo "Optional AI provider: not configured; AI Coach/Content Creator will remain unavailable until OPENAI_API_KEY is added."
          fi

      - name: Verify Cloudflare O2OL zone and routes access
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" 'https://api.cloudflare.com/client/v4/zones?name=one2onelove.com' -o /tmp/zones.json
          jq -e '.success == true and (.result | length) == 1' /tmp/zones.json >/dev/null
          ZONE_ID=$(jq -r '.result[0].id' /tmp/zones.json)
          test -n "$ZONE_ID"
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" -o /tmp/routes.json
          jq -e '.success == true' /tmp/routes.json >/dev/null

      - name: Verify public-launch identity gate in prelaunch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PRELAUNCH_URL/api/launch-signup/readiness" -o /tmp/readiness.json
          cat /tmp/readiness.json
          jq -e '
            .ok == true and
            .readiness.consentTableReady == true and
            .readiness.emailVerificationReady == true and
            .readiness.emailDeliveryReady == true and
            .readiness.phoneVerificationReady == true and
            .readiness.publicLaunchIdentityGateReady == true and
            .readiness.billingDataReady == true and
            .readiness.billingDefaultsReady == true and
            (.readiness.legacyEntitlementRows | type == "number")
          ' /tmp/readiness.json >/dev/null

      - name: Verify canonical O2OL launch readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PRELAUNCH_URL/api/launch-readiness" -o /tmp/o2ol-launch-readiness.json
          cat /tmp/o2ol-launch-readiness.json
          jq -e '
            .ok == true and
            .readiness.productionPromotionReady == true and
            .readiness.database.requiredDatabaseReady == true and
            .readiness.identity.requiredIdentityReady == true and
            .readiness.billing.billingProviderReady == true
          ' /tmp/o2ol-launch-readiness.json >/dev/null

      - name: Verify Suggestions storage is launch-ready
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PRELAUNCH_URL/api/suggestions/readiness" -o /tmp/suggestions-readiness.json
          cat /tmp/suggestions-readiness.json
          jq -e '.ok == true and .ready == true' /tmp/suggestions-readiness.json >/dev/null

      - name: Deploy Cloudflare Worker to production domains
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.production.jsonc

      - name: Execute one-time O2OL launch zero reset
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -X POST --max-time 45 -o /tmp/launch-zero-reset.json -w '%{http_code}' "$APEX_URL/api/internal/launch-zero-reset-20260925-c2a8f49e7d6b4a1f")
          cat /tmp/launch-zero-reset.json
          test "$CODE" = "200"
          jq -e '.ok == true and (.reset == true or .alreadyReset == true)' /tmp/launch-zero-reset.json >/dev/null

      - name: Verify production frontend on custom domains
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_JS=$(grep -oE 'src="[^"]+\.js"' dist/index.html | head -1 | sed 's/src="//;s/"//')
          echo "Expected production bundle: $LOCAL_JS"
          verify_frontend() {
            BASE="$1"
            OK=no
            for attempt in $(seq 1 24); do
              HTML=$(curl -fsS --max-time 20 "$BASE/" 2>/dev/null || true)
              REMOTE_JS=$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//' || true)
              echo "$BASE attempt $attempt remote=$REMOTE_JS"
              if [ "$REMOTE_JS" = "$LOCAL_JS" ]; then
                OK=yes
                break
              fi
              sleep 5
            done
            test "$OK" = yes
            curl -fsS --max-time 20 "$BASE/VerifyPhone" -o /tmp/verify-phone.html
            grep -F "$LOCAL_JS" /tmp/verify-phone.html >/dev/null
            curl -fsS --max-time 20 "$BASE$LOCAL_JS" -o /tmp/app.js
            test -s /tmp/app.js
            if grep -Fi 'supabase' /tmp/app.js; then
              echo 'Legacy Supabase marker found in deployed bundle.' >&2
              exit 1
            fi
          }
          verify_frontend "$APEX_URL"
          verify_frontend "$WWW_URL"

      - name: Verify production Neon API routing
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            URL="$1"; EXPECT="$2"; OUT="$3"
            CODE=$(curl -sS --max-time 20 -o "$OUT" -w '%{http_code}' "$URL")
            echo "$URL -> HTTP $CODE"
            cat "$OUT"
            test "$CODE" = "$EXPECT"
            grep -qi '^{' "$OUT"
            ! grep -qi '<!doctype html' "$OUT"
          }
          for BASE in "$APEX_URL" "$WWW_URL"; do
            PASS=no
            for attempt in $(seq 1 24); do
              CODE=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)
              echo "$BASE/api/health attempt $attempt -> $CODE"
              if [ "$CODE" = "200" ] && grep -F '"service":"one2onelove-api"' /tmp/health.json >/dev/null 2>&1; then
                PASS=yes
                break
              fi
              sleep 5
            done
            test "$PASS" = yes
            check_json "$BASE/api/reviews" 200 /tmp/reviews.json
            jq -e 'all(.reviews[]?; (has("user_id") | not) and (has("email") | not))' /tmp/reviews.json >/dev/null
            check_json "$BASE/api/stories" 200 /tmp/stories.json
            jq -e 'all(.stories[]?; (has("user_id") | not) and (has("moderation_notes") | not) and (has("moderated_by") | not))' /tmp/stories.json >/dev/null
            check_json "$BASE/api/contests/leaderboard?type=monthly_love_notes&period=2026-09&limit=1" 200 /tmp/contest.json
            jq -e 'all(.participants[]?; (has("user_email") | not) and (has("email") | not))' /tmp/contest.json >/dev/null
            check_json "$BASE/api/memories" 401 /tmp/memories.json
            check_json "$BASE/api/consents/adult-sensitive" 401 /tmp/consent.json
            check_json "$BASE/api/phone-verification/send" 401 /tmp/phone-send.json
            check_json "$BASE/api/phone-verification/verify" 401 /tmp/phone-verify.json
          done
          echo 'O2OL_PRODUCTION_NEON_VERIFIED=yes'
