name: Verify Date Ideas Functional Actions

on:
  push:
    branches:
      - verify-missing-you-worker-2026-09-13
    paths:
      - .github/verify-date-ideas-functional-actions-trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Date Ideas API is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://one2onelove-launch.hwy99signs.workers.dev/api/date-ideas"
          STATUS=$(curl --silent --show-error --output /tmp/date-ideas-api.json --write-out '%{http_code}' "$URL")
          cat /tmp/date-ideas-api.json
          test "$STATUS" = "401"
          grep -F 'Authentication required' /tmp/date-ideas-api.json >/dev/null
          echo "DATE_IDEAS_API_LIVE=yes"

      - name: Verify deployed frontend has new action services
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://one2onelove-launch.hwy99signs.workers.dev"
          curl --fail --silent --show-error "$ROOT/" -o /tmp/index.html
          JS=$(grep -oE 'src="[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"//')
          test -n "$JS"
          curl --fail --silent --show-error "$ROOT$JS" -o /tmp/app.js
          grep -F 'o2ol_date_ideas_local_v1' /tmp/app.js >/dev/null
          grep -F 'o2ol_calendar_events_local_v1' /tmp/app.js >/dev/null
          grep -F '/api/date-ideas' /tmp/app.js >/dev/null
          grep -F '/api/calendar-events' /tmp/app.js >/dev/null
          echo "DATE_IDEAS_FRONTEND_ACTION_SERVICES_DEPLOYED=yes"
