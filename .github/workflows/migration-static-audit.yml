name: One2OneLove Migration Static Audit

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - "src/**"
      - ".github/workflows/migration-static-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Report remaining legacy Supabase references in frontend source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Legacy Supabase imports/usages under src/ ==="
          grep -RInE "(@supabase/supabase-js|[/']supabase['\"]|\bsupabase\.(auth|from|rpc|storage|channel|functions|removeChannel))" src \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude='supabase.js' || true

          echo "=== Old Supabase project/storage URLs under src/ ==="
          grep -RInE "supabase\.co|hphhmjcutesqsdnubnnw" src \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' || true

          echo "=== VITE_SUPABASE references under src/ ==="
          grep -RIn "VITE_SUPABASE" src \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' || true
