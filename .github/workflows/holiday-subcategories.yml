name: Add Holiday Love Notes Subcategories

on:
  push:
    branches:
      - love-notes-holiday-subcategories
    paths:
      - .github/holiday-subcategories-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-holiday-subcategories
          fetch-depth: 0

      - name: Add Holiday subcategory behavior
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/LoveNotes.jsx')
          text = p.read_text(encoding='utf-8')

          # Stable classification for the current 20 merged Holiday notes:
          # 5 base Holiday notes followed by 15 supplemental Holiday notes.
          marker = "const generateNotes = (lang) => {"
          constants = """const allHolidayLabels = {\n  en: 'All Holiday',\n  es: 'Todas las Festividades',\n  fr: 'Toutes les Fêtes',\n  it: 'Tutte le Festività',\n  de: 'Alle Feiertage',\n};\n\nconst holidaySubcategoryAssignments = [\n  'romantic', 'romantic', 'romantic', 'family', 'family',\n  'romantic', 'romantic', 'family', 'friends', 'romantic',\n  'romantic', 'romantic', 'friends', 'family', 'friends',\n  'romantic', 'family', 'friends', 'family', 'romantic',\n];\n\n"""
          if 'const holidaySubcategoryAssignments = [' not in text:
              if marker not in text:
                  raise SystemExit('generateNotes marker not found')
              text = text.replace(marker, constants + marker, 1)

          old_loop = """      data[category].forEach(note => {\n        notes.push({ id: id++, ...note, category: category });\n      });"""
          new_loop = """      data[category].forEach((note, noteIndex) => {\n        const holidaySubcategory = category === 'holiday'\n          ? holidaySubcategoryAssignments[noteIndex]\n          : undefined;\n        notes.push({\n          id: id++,\n          ...note,\n          category: category,\n          ...(holidaySubcategory ? { holidaySubcategory } : {})\n        });\n      });"""
          if 'holidaySubcategoryAssignments[noteIndex]' not in text:
              if old_loop not in text:
                  raise SystemExit('note generation loop not found')
              text = text.replace(old_loop, new_loop, 1)

          old_component = """  const categories = getCategoriesForLanguage(t, currentLanguage);\n  const queryClient = useQueryClient();"""
          new_component = """  const categories = getCategoriesForLanguage(t, currentLanguage);\n  const holidaySubcategories = [\n    { id: 'all', name: allHolidayLabels[currentLanguage] || allHolidayLabels.en, icon: '🎉' },\n    { id: 'romantic', name: t.categories.romantic, icon: '🌹' },\n    { id: 'family', name: t.categories.family, icon: '👨‍👩‍👧‍👦' },\n    { id: 'friends', name: t.categories.friends, icon: '👫' },\n  ];\n  const queryClient = useQueryClient();"""
          if 'const holidaySubcategories = [' not in text:
              if old_component not in text:
                  raise SystemExit('component categories block not found')
              text = text.replace(old_component, new_component, 1)

          old_state = "  const [selectedCategory, setSelectedCategory] = useState('all');"
          new_state = old_state + "\n  const [selectedHolidaySubcategory, setSelectedHolidaySubcategory] = useState('all');"
          if 'selectedHolidaySubcategory' not in text:
              if old_state not in text:
                  raise SystemExit('selectedCategory state not found')
              text = text.replace(old_state, new_state, 1)

          old_filter = """    if (selectedCategory !== 'all') {\n      filtered = filtered.filter(note => note.category === selectedCategory);\n    }\n\n    const personalizedNotes = filtered.map(note => personalizeNote(note));"""
          new_filter = """    if (selectedCategory !== 'all') {\n      filtered = filtered.filter(note => note.category === selectedCategory);\n    }\n\n    if (selectedCategory === 'holiday' && selectedHolidaySubcategory !== 'all') {\n      filtered = filtered.filter(note => note.holidaySubcategory === selectedHolidaySubcategory);\n    }\n\n    const personalizedNotes = filtered.map(note => personalizeNote(note));"""
          if "note.holidaySubcategory === selectedHolidaySubcategory" not in text:
              if old_filter not in text:
                  raise SystemExit('display filter block not found')
              text = text.replace(old_filter, new_filter, 1)

          old_deps = "  }, [selectedCategory, searchQuery, partnerName, petName, specialPlace, allNotes]);"
          new_deps = "  }, [selectedCategory, selectedHolidaySubcategory, searchQuery, partnerName, petName, specialPlace, allNotes]);"
          if new_deps not in text:
              if old_deps not in text:
                  raise SystemExit('display useMemo dependencies not found')
              text = text.replace(old_deps, new_deps, 1)

          # Reset Holiday subcategory whenever a top-level category is selected.
          random_select = """    setSelectedCategory(categoryId);\n    setSearchQuery('');"""
          random_replacement = """    setSelectedCategory(categoryId);\n    setSelectedHolidaySubcategory('all');\n    setSearchQuery('');"""
          if random_replacement not in text:
              if random_select not in text:
                  raise SystemExit('random category selection block not found')
              text = text.replace(random_select, random_replacement, 1)

          click_select = """                  setSelectedCategory(category.id);\n                  setSearchQuery('');"""
          click_replacement = """                  setSelectedCategory(category.id);\n                  setSelectedHolidaySubcategory('all');\n                  setSearchQuery('');"""
          if click_replacement not in text:
              if click_select not in text:
                  raise SystemExit('category click block not found')
              text = text.replace(click_select, click_replacement, 1)

          ui_marker = """                <span className=\"mr-2\">{category.icon}</span>\n                {category.name}\n              </button>\n            ))}\n          </div>\n        </div>\n\n        <div className=\"text-center mb-8\">"""
          ui_replacement = """                <span className=\"mr-2\">{category.icon}</span>\n                {category.name}\n              </button>\n            ))}\n          </div>\n\n          {selectedCategory === 'holiday' && (\n            <div className=\"mt-4 flex flex-wrap gap-2 justify-center\">\n              {holidaySubcategories.map((subcategory) => (\n                <button\n                  key={subcategory.id}\n                  type=\"button\"\n                  onClick={() => {\n                    setSelectedHolidaySubcategory(subcategory.id);\n                    setSearchQuery('');\n                  }}\n                  className={`px-4 py-2 rounded-full text-sm font-medium transition-all border ${\n                    selectedHolidaySubcategory === subcategory.id\n                      ? 'bg-pink-100 text-pink-700 border-pink-300 shadow-sm'\n                      : 'bg-white text-gray-600 border-gray-200 hover:bg-pink-50 hover:text-pink-700'\n                  }`}\n                >\n                  <span className=\"mr-2\">{subcategory.icon}</span>\n                  {subcategory.name}\n                </button>\n              ))}\n            </div>\n          )}\n        </div>\n\n        <div className=\"text-center mb-8\">"""
          if "holidaySubcategories.map((subcategory)" not in text:
              if ui_marker not in text:
                  raise SystemExit('category UI insertion marker not found')
              text = text.replace(ui_marker, ui_replacement, 1)

          p.write_text(text, encoding='utf-8')

      - name: Verify Holiday subcategories
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('src/pages/LoveNotes.jsx').read_text(encoding='utf-8')
          required = [
            "const holidaySubcategoryAssignments = [",
            "const holidaySubcategories = [",
            "note.holidaySubcategory === selectedHolidaySubcategory",
            "holidaySubcategories.map((subcategory)",
            "setSelectedHolidaySubcategory('all')",
          ]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit(f'Missing Holiday subcategory wiring: {missing}')

          m = re.search(r"const holidaySubcategoryAssignments = \[(.*?)\];", page, re.S)
          if not m:
              raise SystemExit('Assignment array not found')
          values = re.findall(r"'(romantic|family|friends)'", m.group(1))
          if len(values) != 20:
              raise SystemExit(f'Expected 20 Holiday assignments, found {len(values)}')
          expected = {'romantic': 10, 'family': 6, 'friends': 4}
          actual = {key: values.count(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'Holiday assignment counts incorrect: {actual}')

          base = Path('src/components/lovenotes/LoveNotesData.jsx').read_text(encoding='utf-8')
          en_start = base.find('  en: {')
          en_end = base.find('  es: {', en_start)
          en = base[en_start:en_end]
          hm = re.search(r'\n    holiday: \[\n(.*?)\n    \],', en, re.S)
          if not hm:
              raise SystemExit('English base Holiday block not found')
          base_count = len(re.findall(r'\{\s*title\s*:', hm.group(1)))
          if base_count != 5:
              raise SystemExit(f'Expected 5 base Holiday notes, found {base_count}')

          additional = Path('src/components/lovenotes/additional/LoveNotesAdditional.en.js').read_text(encoding='utf-8')
          holiday_start = additional.find('holiday: makeNotes([')
          religious_start = additional.find('\n  religious:', holiday_start)
          holiday_chunk = additional[holiday_start:religious_start]
          supplemental_count = holiday_chunk.count('],["') + 1
          if supplemental_count != 15:
              raise SystemExit(f'Expected 15 supplemental Holiday notes, found {supplemental_count}')

          print('Verified 20 Holiday notes: Romantic 10, Family 6, Friends 4')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Holiday subcategories
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git commit -m "Add Holiday Love Notes subcategories"
          git push origin HEAD:love-notes-holiday-subcategories
