name: O2OL Fix Chat Lint

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-fix-chat-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove chat lint regressions
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/Chat.jsx')
          s = p.read_text()
          s = s.replace("import { useLanguage } from '@/Layout';\n", '')
          s = s.replace("  const { currentLanguage } = useLanguage();\n", '')
          s = s.replace("  const { data: conversations = [], isLoading: conversationsLoading } = useQuery({", "  const { data: conversations = [] } = useQuery({")
          s = s.replace("  const handleSendFile = async (file, type, duration) => {\n", "  const handleSendFile = async (file, type, duration) => {\n    void duration;\n")
          s = s.replace("  const handleMarkAsUnread = (chatId) => {\n", "  const handleMarkAsUnread = (chatId) => {\n    void chatId;\n")
          s = s.replace("  const handleDeleteMessage = async (messageId, deleteType) => {\n", "  const handleDeleteMessage = async (messageId, deleteType) => {\n    void deleteType;\n")
          s = s.replace("  const handleClearChat = async (chatId) => {\n", "  const handleClearChat = async (chatId) => {\n    void chatId;\n")
          p.write_text(s)
      - name: Verify chat and social invariants
        run: |
          node scripts/verify-o2ol-chat-security.mjs
          node scripts/verify-o2ol-social-privacy.mjs
      - name: Lint chat surfaces
        run: npx eslint src/lib/chatService.js src/lib/buddyService.js src/pages/Chat.jsx src/pages/FindFriends.jsx src/pages/FriendRequests.jsx --rule 'react/prop-types: off'
      - name: Production build
        run: npm run build
      - name: Commit chat lint repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/pages/Chat.jsx; then exit 0; fi
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/Chat.jsx
          git commit -m 'Resolve O2OL chat lint regressions'
          git push origin HEAD:o2ol-build-branch-2026-08-18
