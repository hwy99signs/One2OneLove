name: Love Language Quiz 100 Randomized

on:
  push:
    branches:
      - love-language-quiz-100-randomized
    paths:
      - .github/love-language-quiz-100-randomized-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-language-quiz-100-randomized
          fetch-depth: 0

      - name: Apply Love Language quiz patch
        run: python scripts/patch_love_language_quiz_randomization.py

      - name: Verify question bank and shuffle behavior
        run: |
          node --input-type=module <<'NODE'
          import { buildLoveLanguageQuestionBank, buildLoveLanguageQuizSession } from './src/components/lovelanguage/LoveLanguageQuestionBank.js';
          const langs = ['en','es','fr','it','de','nl','pt'];
          const ids = ['words','quality','gifts','service','touch'];
          const base = Array.from({length: 15}, (_, q) => ({
            question: `Base ${q + 1}`,
            options: ids.map(id => `${id}-${q + 1}`)
          }));

          for (const lang of langs) {
            const bank = buildLoveLanguageQuestionBank(base, lang);
            if (bank.length !== 100) throw new Error(`${lang}: expected 100 bank questions, got ${bank.length}`);
            if (new Set(bank.map(q => q.id)).size !== 100) throw new Error(`${lang}: duplicate bank question ids`);

            const session = buildLoveLanguageQuizSession(base, lang, 15);
            if (session.length !== 15) throw new Error(`${lang}: expected 15 session questions, got ${session.length}`);
            if (new Set(session.map(q => q.id)).size !== 15) throw new Error(`${lang}: duplicate question in session`);
            for (const q of session) {
              const values = q.options.map(o => o.value);
              if (values.length !== 5 || new Set(values).size !== 5 || !ids.every(id => values.includes(id))) {
                throw new Error(`${lang}: invalid answer/value mapping`);
              }
            }
          }

          const positions = new Set();
          for (let run = 0; run < 30; run += 1) {
            const fullSession = buildLoveLanguageQuizSession(base, 'en', 100);
            const question = fullSession.find(q => q.id === 'base-8');
            if (!question) throw new Error('Expected base-8 in full-bank shuffle audit');
            positions.add(question.options.findIndex(o => o.value === 'quality'));
          }
          if (positions.size < 3) throw new Error(`Quality Time answer only appeared in ${positions.size} position(s) during shuffle audit`);

          const firstSessions = new Set();
          for (let run = 0; run < 12; run += 1) {
            firstSessions.add(buildLoveLanguageQuizSession(base, 'en', 15).map(q => q.id).join('|'));
          }
          if (firstSessions.size < 2) throw new Error('Random question selection did not vary across session audit');

          console.log('100-question banks, 15-question random sessions, and answer-position shuffling verified.');
          NODE

      - name: Verify page wiring
        run: |
          grep -q 'buildLoveLanguageQuizSession(t.questions, currentLanguage, 15)' src/pages/LoveLanguageQuiz.jsx
          grep -q 'useState, useMemo' src/pages/LoveLanguageQuiz.jsx
          grep -q 'setQuizSeed(seed => seed + 1)' src/pages/LoveLanguageQuiz.jsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Love Language quiz update
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveLanguageQuiz.jsx
          git commit -m "Randomize Love Language quiz from 100-question bank"
          git push origin HEAD:love-language-quiz-100-randomized
