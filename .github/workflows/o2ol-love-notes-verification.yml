name: O2OL Love Notes Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-love-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Love Notes delivery invariants
        run: node scripts/verify-o2ol-love-notes.mjs

      - name: Lint Love Notes surfaces
        run: >-
          npx eslint
          src/pages/LoveNotes.jsx
          src/components/love-notes/LoveNoteCard.jsx
          src/lib/loveNotesService.js
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
