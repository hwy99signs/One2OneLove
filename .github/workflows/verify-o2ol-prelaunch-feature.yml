name: Verify O2OL Prelaunch Feature Build

on:
  push:
    branches:
      - o2ol-password-reset-preview
      - feature/bianca-conversation-intelligence-20260930
      - qa/o2ol-combined-prelaunch-20260930
    paths:
      - "src/**"
      - "worker/**"
      - "neon-migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-o2ol-prelaunch-feature.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

      - name: Verify consolidated Like Minded routes
        shell: bash
        run: |
          set -euo pipefail
          grep -F "LikeMinded" src/pages/index.jsx
          grep -F 'path="/LikeMinded"' src/pages/index.jsx

      - name: Verify production remains an explicit separate workflow target
        shell: bash
        run: |
          set -euo pipefail
          grep -F "branches:" .github/workflows/deploy-o2ol-production-neon.yml
          grep -F "master" .github/workflows/deploy-o2ol-production-neon.yml
          ! grep -F "o2ol-password-reset-preview" .github/workflows/deploy-o2ol-production-neon.yml
