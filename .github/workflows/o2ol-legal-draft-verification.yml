name: O2OL Legal Draft Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legal-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legal-review status and five languages
        shell: bash
        run: |
          set -euo pipefail
          for file in src/pages/PrivacyPolicy.jsx src/pages/TermsOfService.jsx; do
            for lang in en es fr it de; do grep -q "${lang}:" "$file"; done
            grep -q 'Legal review required' "$file"
            grep -q 'ContactUs' "$file"
          done
          grep -q 'AI Relationship Coach' src/pages/PrivacyPolicy.jsx
          grep -q 'Paid membership checkout is not open at launch' src/pages/PrivacyPolicy.jsx
          grep -q 'educational and supportive' src/pages/TermsOfService.jsx
          grep -q 'Third-party creators' src/pages/TermsOfService.jsx
          grep -q 'Launch legal review — required before public launch' docs/O2OL_APPROVAL_BATCH.md

      - name: Reject stale generic legal template markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'November 15, 2025|legal@one2onelove\.com|Children under 13|children under 13|limitation of liability|Limitation of Liability|we use cookies|We use cookies' src/pages/PrivacyPolicy.jsx src/pages/TermsOfService.jsx; then
            echo 'Stale generic legal-template language must not return without final legal review.'
            exit 1
          fi

      - name: Lint legal draft pages
        run: npx eslint src/pages/PrivacyPolicy.jsx src/pages/TermsOfService.jsx --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
