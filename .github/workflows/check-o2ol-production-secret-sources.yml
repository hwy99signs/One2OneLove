name: Check O2OL Production Secret Sources

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-o2ol-production-secret-sources.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Report availability only
        shell: bash
        run: |
          set -euo pipefail
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OPENAI_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name=AVAILABLE"
            else
              echo "$name=MISSING"
            fi
          done
