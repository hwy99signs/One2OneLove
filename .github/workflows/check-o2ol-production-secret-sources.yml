name: Check O2OL Live Health

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-o2ol-production-secret-sources.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check current public and prelaunch health
        shell: bash
        run: |
          set -euo pipefail
          for url in             https://one2onelove.com/api/health             https://www.one2onelove.com/api/health             https://one2onelove-prelaunch.hwy99signs.workers.dev/api/health; do
            code=$(curl -sS --max-time 20 -o /tmp/health.txt -w '%{http_code}' "$url" || true)
            body=$(cat /tmp/health.txt 2>/dev/null || true)
            echo "$url -> $code $body"
          done
