name: Inspect O2OL Worker Secret Names

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-o2ol-production-secret-sources.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List secret names only
        shell: bash
        run: |
          set -euo pipefail
          for worker in one2onelove-launch one2onelove-prelaunch; do
            echo "=== $worker ==="
            npx --yes wrangler@latest secret list --name "$worker" 2>/dev/null               | grep -E 'STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|OPENAI_API_KEY|TWILIO|RESEND|NEON|DATABASE'               | sed -E 's/[[:space:]]+/ /g' || true
          done
