name: O2OL Release Candidate Task Certification

on:
  push:
    branches:
      - qa/o2ol-combined-prelaunch-20260930
    paths:
      - "src/**"
      - "qa/o2ol-release-candidate-certification.mjs"
      - ".github/workflows/o2ol-release-candidate-task-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_URL: https://one2onelove-prelaunch.hwy99signs.workers.dev
      TASKS_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run task-only certification
        shell: bash
        run: |
          set -euo pipefail
          node qa/o2ol-release-candidate-certification.mjs | tee /tmp/o2ol-release-candidate-task-certification.txt
      - name: Upload task report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2ol-release-candidate-task-certification
          path: /tmp/o2ol-release-candidate-task-certification.txt
          if-no-files-found: warn
