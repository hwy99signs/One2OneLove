name: Love Notes Missing You Search Fix

on:
  push:
    branches:
      - love-notes-missing-you-search-fix
    paths:
      - .github/love-notes-missing-you-search-trigger

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-missing-you-search-fix
          fetch-depth: 0
      - name: Tighten search generator
        run: node scripts/patch_missing_you_search_generator.cjs
      - name: Apply Missing You category and search fix
        run: node scripts/add_missing_you_search_fix.cjs
      - name: Verify Missing You counts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const lang of ['en','es','fr','it','de']) {
            let src = fs.readFileSync(`src/components/lovenotes/additional/LoveNotesAdditional.${lang}.js`, 'utf8');
            src = src.replace('export default', 'globalThis.additional =');
            const ctx = { globalThis: {} };
            vm.createContext(ctx);
            vm.runInContext(src, ctx);
            const notes = ctx.globalThis.additional.missingYou || [];
            if (notes.length !== 15) throw new Error(`${lang}: expected 15 Missing You notes, got ${notes.length}`);
            const counts = notes.reduce((out, note) => {
              const relation = ['romantic','family','friends'].find(tag => note.tags.includes(tag));
              out[relation] = (out[relation] || 0) + 1;
              return out;
            }, {});
            if (counts.romantic !== 5 || counts.family !== 5 || counts.friends !== 5) {
              throw new Error(`${lang}: bad relation counts ${JSON.stringify(counts)}`);
            }
            console.log(lang, notes.length, counts);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit only Love Notes changes
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx src/components/lovenotes/additional/LoveNotesAdditional.en.js src/components/lovenotes/additional/LoveNotesAdditional.es.js src/components/lovenotes/additional/LoveNotesAdditional.fr.js src/components/lovenotes/additional/LoveNotesAdditional.it.js src/components/lovenotes/additional/LoveNotesAdditional.de.js
          git commit -m "Fix Love Notes search and add Missing You category"
          git push origin HEAD:love-notes-missing-you-search-fix
