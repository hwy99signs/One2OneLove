name: Deploy O2OL All-Free Preview

# Deploys the all-free prelaunch branch to the isolated, frontend-only
# preview Worker (one2onelove-preview). The preview Worker's API is
# disabled (503 preview_api_disabled), so a preview can never touch
# production data. Production is never deployed by this workflow.

on:
  push:
    branches:
      - prelaunch/o2ol-all-free-20261125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://one2onelove-preview.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build preview application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          BUNDLE=$(basename "$(ls dist/assets/index-*.js | head -1)")
          test -n "$BUNDLE"
          echo "BUILT_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "Built bundle: $BUNDLE"

      - name: Deploy isolated Cloudflare preview
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.preview.jsonc

      - name: Verify all-free preview
        shell: bash
        run: |
          set -euo pipefail

          # The preview must serve THIS run's bundle (identity check).
          SERVED=""
          for attempt in $(seq 1 24); do
            HTML=$(curl -fsSL --max-time 20 "$PREVIEW_URL/" 2>/dev/null || true)
            if printf '%s' "$HTML" | grep -q "$BUILT_BUNDLE"; then
              SERVED=yes
              break
            fi
            sleep 5
          done
          test "$SERVED" = yes
          echo "Preview serves built bundle $BUILT_BUNDLE"

          curl -fsSL --max-time 30 "$PREVIEW_URL/assets/$BUILT_BUNDLE" -o /tmp/preview.js
          grep -F 'Like Minded?' /tmp/preview.js >/dev/null
          # All-free markers: no legacy prices, no giveaway Credit wording.
          ! grep -F '$0.49' /tmp/preview.js >/dev/null
          ! grep -F 'in Game Credit' /tmp/preview.js >/dev/null
          grep -F 'No Purchases' /tmp/preview.js >/dev/null

          # Scrabluko fix: Player 1 name must not be prefilled.
          curl -fsSL --max-time 20 "$PREVIEW_URL/games-src/scrabluko.html" -o /tmp/scrabluko.html
          ! grep -F 'value = "Eisenhower"' /tmp/scrabluko.html >/dev/null

          # Preview API stays disabled by design.
          API_CODE=$(curl -sS --max-time 20 -o /tmp/preview-api.json -w '%{http_code}' "$PREVIEW_URL/api/health")
          test "$API_CODE" = "503"
          grep -F 'preview_api_disabled' /tmp/preview-api.json >/dev/null

          echo "ALL_FREE_PREVIEW_VERIFIED=yes"
          echo "ALL_FREE_PREVIEW_URL=$PREVIEW_URL"
