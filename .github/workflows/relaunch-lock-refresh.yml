name: Relaunch Dependency Lock Refresh

on:
  push:
    branches:
      - relaunch-homepage
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: relaunch-homepage-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout relaunch branch
        uses: actions/checkout@v4
        with:
          ref: relaunch-homepage

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify controlled dependency versions
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            'node_modules/vite': '6.4.3',
            'node_modules/postcss': '8.5.23',
            'node_modules/rollup': '4.59.0',
            'node_modules/react-router': '7.18.0',
            'node_modules/react-router-dom': '7.18.0'
          };
          for (const [key, version] of Object.entries(expected)) {
            const actual = lock.packages?.[key]?.version;
            if (actual !== version) {
              throw new Error(`${key} expected ${version}, found ${actual ?? 'missing'}`);
            }
          }
          console.log('Controlled dependency versions verified.');
          EOF

      - name: Ensure package manifest was not rewritten
        run: git diff --exit-code -- package.json

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(relaunch): refresh controlled dependency lock"
          git push origin HEAD:relaunch-homepage
