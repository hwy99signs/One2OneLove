name: O2OL Preview Secret Presence Audit

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-preview-secret-audit.yml

permissions:
  contents: read

jobs:
  audit-secret-names:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Audit configured Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --config wrangler.toml --format json > /tmp/secrets.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/secrets.json', 'utf8'));
          const entries = Array.isArray(raw) ? raw : (raw.secrets || []);
          const names = new Set(entries.map(x => typeof x === 'string' ? x : x.name).filter(Boolean));
          const wanted = [
            'STRIPE_SECRET_KEY',
            'STRIPE_WEBHOOK_SECRET',
            'SMS_PROVIDER_ACCOUNT_ID',
            'SMS_PROVIDER_AUTH_TOKEN',
            'SMS_PROVIDER_FROM_NUMBER',
            'OPENAI_API_KEY',
            'ANTHROPIC_API_KEY'
          ];
          for (const name of wanted) console.log(`${name}=${names.has(name) ? 'present' : 'missing'}`);
          NODE
