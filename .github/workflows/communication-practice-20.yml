name: Communication Practice 20 Scenarios

on:
  push:
    branches:
      - communication-practice-20-scenarios
    paths:
      - .github/communication-practice-20-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: communication-practice-20-scenarios
          fetch-depth: 0

      - name: Integrate scenario library
        run: node scripts/expand_communication_practice_to_20.cjs

      - name: Verify 20 scenarios in all five languages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          let src = fs.readFileSync('src/components/communication/CommunicationPracticeScenarios.js','utf8');
          src = src
            .replace('export const communicationPracticeScenarios =', 'globalThis.communicationPracticeScenarios =')
            .replace('export default communicationPracticeScenarios;', '');
          const ctx = { globalThis: {} };
          vm.createContext(ctx);
          vm.runInContext(src, ctx);
          const data = ctx.globalThis.communicationPracticeScenarios;
          const required = ['conflict','needs','listening','appreciation','apology','boundaries','finances','chores','familyBoundaries','privacy','jealousy','space','repair','textTone','decision','punctuality','stressSupport','affection','parenting','recurringIssue'];
          for (const lang of ['en','es','fr','it','de']) {
            const scenarios = data[lang];
            const keys = Object.keys(scenarios || {});
            if (keys.length !== 20) throw new Error(`${lang}: expected 20 scenarios, got ${keys.length}`);
            for (const id of required) {
              const s = scenarios[id];
              if (!s) throw new Error(`${lang}: missing ${id}`);
              if (!s.title || !s.situation) throw new Error(`${lang}/${id}: missing title/situation`);
              if (!Array.isArray(s.options) || s.options.length !== 4) throw new Error(`${lang}/${id}: expected 4 options`);
              const types = s.options.map(o => o.type);
              if (types.filter(t => t === 'excellent').length !== 1) throw new Error(`${lang}/${id}: expected one excellent option`);
              if (types.filter(t => t === 'good').length !== 1) throw new Error(`${lang}/${id}: expected one good option`);
              if (types.filter(t => t === 'poor').length !== 2) throw new Error(`${lang}/${id}: expected two poor options`);
              for (const o of s.options) if (!o.text || !o.feedback) throw new Error(`${lang}/${id}: incomplete option`);
            }
            console.log(`${lang}: 20 scenarios verified`);
          }
          const page = fs.readFileSync('src/pages/CommunicationPractice.jsx','utf8');
          if (!page.includes('communicationPracticeScenarios[currentLanguage]')) throw new Error('Page is not wired to new scenario library');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify only intended files changed
        run: |
          node <<'NODE'
          const { execSync } = require('child_process');
          const files = execSync('git diff --name-only origin/master...HEAD', {encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowed = new Set([
            'src/pages/CommunicationPractice.jsx',
            'src/components/communication/CommunicationPracticeScenarios.js',
            'scripts/expand_communication_practice_to_20.cjs',
            '.github/workflows/communication-practice-20.yml',
            '.github/communication-practice-20-trigger'
          ]);
          for (const file of files) if (!allowed.has(file)) throw new Error(`Unexpected changed file: ${file}`);
          console.log(files.join('\n'));
          NODE

      - name: Commit generated page integration
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/CommunicationPractice.jsx
          git commit -m "Expand Communication Practice Simulator to 20 scenarios"
          git push origin HEAD:communication-practice-20-scenarios
