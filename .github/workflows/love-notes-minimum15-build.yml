name: Love Notes Minimum 15 Build

on:
  push:
    branches:
      - love-notes-minimum-15
    paths:
      - .github/love-notes-minimum15-trigger

permissions:
  contents: write

jobs:
  expand-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: love-notes-minimum-15
          fetch-depth: 0
      - name: Expand Love Notes data only
        run: node scripts/expand_love_notes_minimum15.js
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit expanded Love Notes data
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/components/lovenotes/LoveNotesData.jsx src/components/lovenotes/additional/LoveNotesAdditional.en.js src/components/lovenotes/additional/LoveNotesAdditional.es.js src/components/lovenotes/additional/LoveNotesAdditional.fr.js src/components/lovenotes/additional/LoveNotesAdditional.it.js src/components/lovenotes/additional/LoveNotesAdditional.de.js src/pages/LoveNotes.jsx
          git commit -m "Expand Love Notes categories and Holiday subcategories to minimum 15"
          git push origin HEAD:love-notes-minimum-15
