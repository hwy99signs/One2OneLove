name: O2OL Quiz Privacy

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-quiz-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quiz truth and privacy invariants
        run: node scripts/verify-o2ol-quiz-truth.mjs

      - name: Lint quiz surfaces
        run: >-
          npx eslint
          src/pages/RelationshipQuizzes.jsx
          src/pages/LoveLanguageQuiz.jsx
          src/lib/loveLanguageService.js
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
