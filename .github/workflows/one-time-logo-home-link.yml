name: One-time Header Logo Home Link

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - .github/workflows/one-time-logo-home-link.yml

permissions:
  contents: write

jobs:
  fix-logo-home-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cloudflare-one2onelove-20260905
          fetch-depth: 0

      - name: Make header logo return to canonical home page
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/Layout.jsx')
          text = path.read_text(encoding='utf-8')
          old = '<Link to={createPageUrl("Home")} className="flex items-center gap-0 hover:opacity-90 transition-opacity flex-shrink-0">'
          new = '''<Link
              to="/"
              className="flex items-center gap-0 hover:opacity-90 transition-opacity flex-shrink-0"
              aria-label="Go to One2One Love home page"
              onClick={() => {
                setMobileMenuOpen(false);
                setMobileActionOpen(false);
                setActionOpen(false);
              }}
            >'''
          if old not in text:
              raise SystemExit('Header logo link marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit header logo home-link fix
        shell: bash
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/Layout.jsx
          git diff --cached --check
          git commit -m "fix: make header logo return to home page"
          git push origin HEAD:migration/neon-cloudflare-one2onelove-20260905
