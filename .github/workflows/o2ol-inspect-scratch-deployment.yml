name: Inspect O2OL Scratch Deployment
on:
  push:
    branches: [o2ol-password-reset-preview]
    paths: [".github/workflows/o2ol-inspect-scratch-deployment.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
      - name: Inspect Cloudflare scripts and domains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/scratch-deployment
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" > tools/scratch-deployment/scripts.json
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > tools/scratch-deployment/domains.json || true
      - name: Commit inspection evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/scratch-deployment
          git commit -m "Capture scratch deployment metadata" || exit 0
          git push origin HEAD:o2ol-password-reset-preview
