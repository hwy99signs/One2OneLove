name: O2OL Remove Unused Fly Tool

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-remove-unused-fly-tool.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-unused-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current O2OL branch
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused Fly Dockerfile dev helper
        run: npm uninstall --save-dev @flydotio/dockerfile

      - name: Confirm package removal
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"@flydotio/dockerfile"' package.json package-lock.json; then
            echo 'Unused Fly Dockerfile package remains in package metadata.'
            exit 1
          fi

      - name: Reinstall from updated lockfile
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit full dependency tree
        run: npm audit --audit-level=low

      - name: Production build
        run: npm run build

      - name: Commit verified dependency cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-remove-unused-fly-tool.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/o2ol-remove-unused-fly-tool.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove unused vulnerable Fly Dockerfile dev tool'
          git push origin HEAD:o2ol-build-branch-2026-08-18
