name: Date Ideas Actions and Schedule

on:
  push:
    branches:
      - date-ideas-actions-schedule
    paths:
      - .github/date-ideas-actions-schedule-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: date-ideas-actions-schedule
          fetch-depth: 0

      - name: Fix patch replacement escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_date_ideas_actions_schedule.py')
          s = p.read_text()
          s = s.replace('handlers_pattern.subn(handlers_replacement, s, count=1)', 'handlers_pattern.subn(lambda _: handlers_replacement, s, count=1)')
          s = s.replace('footer_pattern.subn(footer_replacement, s, count=1)', 'footer_pattern.subn(lambda _: footer_replacement, s, count=1)')
          p.write_text(s)
          PY

      - name: Apply Date Ideas actions and schedule patch
        run: python scripts/patch_date_ideas_actions_schedule.py

      - name: Verify action wiring
        run: |
          grep -q 'createCalendarEvent' src/pages/DateIdeas.jsx
          grep -q 'handleScheduleDate' src/pages/DateIdeas.jsx
          grep -q 'handleShareScheduledDate' src/pages/DateIdeas.jsx
          grep -q 'is_completed' src/pages/DateIdeas.jsx
          grep -q '__o2ol_builtin_date__:' src/pages/DateIdeas.jsx
          grep -q 'Save' src/components/dateideas/dateIdeasUiCopy.js
          node --input-type=module <<'NODE'
          import { DATE_IDEAS_UI } from './src/components/dateideas/dateIdeasUiCopy.js';
          for (const lang of ['en','es','fr','it','de','nl','pt']) {
            for (const key of ['schedule','scheduleTitle','scheduleDate','scheduleTime','scheduleAction','shareSchedule','signInRequired','done']) {
              if (!DATE_IDEAS_UI[lang]?.[key]) throw new Error(`${lang}: missing ${key}`);
            }
          }
          console.log('Seven-language Date Ideas action/schedule copy verified.');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Date Ideas action update
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/DateIdeas.jsx src/components/dateideas/dateIdeasUiCopy.js
          git commit -m "Make Date Ideas actions functional and add scheduling"
          git push origin HEAD:date-ideas-actions-schedule
