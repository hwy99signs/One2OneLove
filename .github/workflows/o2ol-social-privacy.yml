name: O2OL Social Privacy

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-social-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify social privacy invariants
        run: node scripts/verify-o2ol-social-privacy.mjs

      - name: Lint social privacy surfaces
        run: >-
          npx eslint
          src/lib/buddyService.js
          src/lib/chatService.js
          src/pages/FindFriends.jsx
          src/pages/FriendRequests.jsx
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
