name: O2OL Layout Verification

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify five-language global navigation
        shell: bash
        run: |
          set -euo pipefail
          for lang in en es fr it de; do grep -q "${lang}:" src/pages/Layout.jsx; done
          grep -q 'GlobalRelationshipRoom' src/pages/Layout.jsx
          grep -q 'RelationshipLibrary' src/pages/Layout.jsx
          grep -q 'CouplesDashboard' src/pages/Layout.jsx
          grep -q 'RelationshipCoach' src/pages/Layout.jsx
          grep -q 'aria-expanded={mobileOpen}' src/pages/Layout.jsx
          grep -q 'preferredLanguage' src/pages/Layout.jsx
          grep -q 'activeCodes.has' src/pages/Layout.jsx

      - name: Reject shell privacy and trust regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'console\.|Developer|AI Relationship Coach</|nl:|pt:' src/pages/Layout.jsx; then
            echo 'Global Layout restored debug, developer, hard-coded AI Coach, or disabled-language UI.'
            exit 1
          fi
          if grep -Eq 'supabase\.channel|postgres_changes|removeChannel' src/pages/Layout.jsx; then
            echo 'Global Layout must keep realtime chat complexity out of the navigation shell.'
            exit 1
          fi

      - name: Lint Layout
        run: npx eslint src/pages/Layout.jsx --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
