name: O2OL Amora Token Prelaunch Deploy

on:
  push:
    branches:
      - integration/o2ol-github-reconciliation-20261006
    paths:
      - ".github/workflows/o2ol-amora-token-prelaunch-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2ol-amora-token-prelaunch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      OPENAI_API_KEY: ${{ secrets.TOKEN_PRELAUNCH_OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.TOKEN_PRELAUNCH_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.TOKEN_PRELAUNCH_STRIPE_WEBHOOK_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TOKEN_PRELAUNCH_TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TOKEN_PRELAUNCH_TWILIO_AUTH_TOKEN }}
      TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TOKEN_PRELAUNCH_TWILIO_VERIFY_SERVICE_SID }}

      WORKER_NAME: one2onelove-token-prelaunch
      PREVIEW_URL: https://one2onelove-token-prelaunch.hwy99signs.workers.dev
      TOKEN_MEDIA_BUCKET: one2onelove-token-prelaunch-media
      TOKEN_HYPERDRIVE_ID: 1df7ab3207264d608ca0045462c08bf5
      NEON_AUTH_BASE_URL: https://ep-super-silence-arbl98ls.neonauth.c-4.us-west-2.aws.neon.tech/one2onelove/auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Amora page + approved photo before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -s public/assets/amora-relationship-coach-official.webp
          test "$(git rev-parse HEAD:public/assets/amora-relationship-coach-official.webp)" = "706a5ed18086a9789268276067b5d55ca0583fb5"
          grep -F '<Route path="/Amora" element={<Amora />} />' src/pages/index.jsx
          grep -F '<Route path="/RelationshipCoach" element={<Navigate to="/Amora" replace />} />' src/pages/index.jsx
          grep -F '/assets/amora-relationship-coach-official.webp?v=20261006-portrait' src/pages/RelationshipCoach.jsx
          grep -F '/assets/amora-relationship-coach-official.webp?v=20261006-portrait' src/pages/Home.jsx
          grep -F "/assets/amora-relationship-coach-official.webp?v=20261006-portrait" src/pages/CoupleSupport.jsx
          if grep -F '/assets/amora-relationship-coach-official.jpg' src/pages/RelationshipCoach.jsx src/pages/Home.jsx src/pages/CoupleSupport.jsx; then
            echo "Blank Amora JPG placeholder is still referenced." >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html

      - name: Bundle-check Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.10 worker/index-v2.ts \
            --bundle \
            --platform=browser \
            --format=esm \
            --external:pg \
            --outfile=/tmp/o2ol-amora-worker.mjs
          test -s /tmp/o2ol-amora-worker.mjs

      - name: Verify required Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Generate isolated token-prelaunch Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrangler.amora-token-prelaunch.jsonc <<EOF
          {
            "name": "$WORKER_NAME",
            "main": "$GITHUB_WORKSPACE/worker/index-v2.ts",
            "compatibility_date": "2026-09-11",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": true,
            "assets": {
              "directory": "$GITHUB_WORKSPACE/dist",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*", "/studio-media/*"]
            },
            "vars": {
              "NEON_AUTH_BASE_URL": "$NEON_AUTH_BASE_URL",
              "PRELAUNCH_ENVIRONMENT": "true",
              "SCHEDULED_SMS_ENABLED": "false",
              "O2OL_RELEASE_VERSION": "token-functional-prelaunch"
            },
            "services": [
              {
                "binding": "EPSCIE_SERVICE",
                "service": "epscie-core"
              }
            ],
            "triggers": {
              "crons": ["*/5 * * * *"]
            },
            "hyperdrive": [
              {
                "binding": "HYPERDRIVE",
                "id": "$TOKEN_HYPERDRIVE_ID"
              }
            ],
            "r2_buckets": [
              {
                "binding": "MEDIA",
                "bucket_name": "$TOKEN_MEDIA_BUCKET"
              }
            ]
          }
          EOF
          npx --yes wrangler@4.147.0 deploy --dry-run --config /tmp/wrangler.amora-token-prelaunch.jsonc

      - name: Deploy to isolated token prelaunch Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.147.0 deploy --config /tmp/wrangler.amora-token-prelaunch.jsonc

      - name: Reinstall available token-prelaunch provider secrets
        shell: bash
        run: |
          set -euo pipefail
          install_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.147.0 secret put "$name" --name "$WORKER_NAME"
            fi
          }
          install_secret "OPENAI_API_KEY" "${OPENAI_API_KEY:-}"
          install_secret "STRIPE_SECRET_KEY" "${STRIPE_SECRET_KEY:-}"
          install_secret "STRIPE_WEBHOOK_SECRET" "${STRIPE_WEBHOOK_SECRET:-}"
          install_secret "TWILIO_ACCOUNT_SID" "${TWILIO_ACCOUNT_SID:-}"
          install_secret "TWILIO_AUTH_TOKEN" "${TWILIO_AUTH_TOKEN:-}"
          install_secret "TWILIO_VERIFY_SERVICE_SID" "${TWILIO_VERIFY_SERVICE_SID:-}"

      - name: Verify protected EPSCIE bindings were preserved
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(npx --yes wrangler@4.147.0 secret list --name "$WORKER_NAME" 2>&1)
          printf '%s\n' "$OUT" | grep -F 'O2OL_EPSCIE_ENABLED'
          printf '%s\n' "$OUT" | grep -F 'O2OL_EPSCIE_KEY_ID'
          printf '%s\n' "$OUT" | grep -F 'O2OL_EPSCIE_SECRET'

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url = 'https://one2onelove-token-prelaunch.hwy99signs.workers.dev/api/health';
          const response = await fetch(url, { redirect: 'manual' });
          const body = await response.text();
          if (!response.ok) throw new Error('Health failed: ' + response.status + ' ' + body);
          const json = JSON.parse(body);
          if (json?.environment !== 'token-prelaunch') throw new Error('Wrong environment: ' + body);
          if (json?.production !== false) throw new Error('Production flag unsafe: ' + body);
          console.log(body);
          NODE
