name: O2OL Amora Token Prelaunch Deploy

on:
  push:
    branches:
      - integration/o2ol-github-reconciliation-20261006
    paths:
      - ".github/workflows/o2ol-amora-token-prelaunch-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2ol-amora-token-prelaunch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      O2OL_EPSCIE_ENABLED: ${{ secrets.O2OL_EPSCIE_ENABLED }}
      O2OL_EPSCIE_KEY_ID: ${{ secrets.O2OL_EPSCIE_KEY_ID }}
      O2OL_EPSCIE_SECRET: ${{ secrets.O2OL_EPSCIE_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Amora page + approved photo before deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum public/assets/amora-relationship-coach-official.jpg | awk '{print $1}')" = "b8cf5575719b244b62ac6b4e7f42cf632d503339f5a5e9b0e1567263a0f4c0df"
          grep -F '<Route path="/Amora" element={<Amora />} />' src/pages/index.jsx
          grep -F '<Route path="/RelationshipCoach" element={<Navigate to="/Amora" replace />} />' src/pages/index.jsx
          grep -F '/assets/amora-relationship-coach-official.jpg?v=20261006' src/pages/RelationshipCoach.jsx

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html

      - name: Bundle-check Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.10 worker/index-v2.ts \
            --bundle \
            --platform=browser \
            --format=esm \
            --external:pg \
            --outfile=/tmp/o2ol-amora-worker.mjs
          test -s /tmp/o2ol-amora-worker.mjs

      - name: Verify required Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy to isolated token prelaunch Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.147.0 deploy \
            --config wrangler.deploy.functional-prelaunch-epscie.jsonc

      - name: Reinstall protected provider and EPSCIE secrets
        shell: bash
        run: |
          set -euo pipefail
          install_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.147.0 secret put "$name" \
                --config wrangler.deploy.functional-prelaunch-epscie.jsonc
            fi
          }
          install_secret "O2OL_EPSCIE_ENABLED" "${O2OL_EPSCIE_ENABLED:-}"
          install_secret "O2OL_EPSCIE_KEY_ID" "${O2OL_EPSCIE_KEY_ID:-}"
          install_secret "O2OL_EPSCIE_SECRET" "${O2OL_EPSCIE_SECRET:-}"
          install_secret "OPENAI_API_KEY" "${OPENAI_API_KEY:-}"
          install_secret "STRIPE_SECRET_KEY" "${STRIPE_SECRET_KEY:-}"
          install_secret "STRIPE_WEBHOOK_SECRET" "${STRIPE_WEBHOOK_SECRET:-}"
          install_secret "TWILIO_ACCOUNT_SID" "${TWILIO_ACCOUNT_SID:-}"
          install_secret "TWILIO_AUTH_TOKEN" "${TWILIO_AUTH_TOKEN:-}"
          install_secret "TWILIO_VERIFY_SERVICE_SID" "${TWILIO_VERIFY_SERVICE_SID:-}"

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url = 'https://one2onelove-token-prelaunch.hwy99signs.workers.dev/api/health';
          const response = await fetch(url, { redirect: 'manual' });
          const body = await response.text();
          if (!response.ok) throw new Error('Health failed: ' + response.status + ' ' + body);
          const json = JSON.parse(body);
          if (json?.environment !== 'token-prelaunch') throw new Error('Wrong environment: ' + body);
          if (json?.production !== false) throw new Error('Production flag unsafe: ' + body);
          console.log(body);
          NODE
