name: O2OL Anniversary Tracker One-Time Migration Fix

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-anniversary-migration-fix.yml

permissions:
  contents: write

jobs:
  patch-anniversary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Connect Anniversary Tracker to Neon milestones
        env:
          LOGIC_B64: ""
          HANDLERS_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          path = Path('src/pages/AnniversaryTracker.jsx')
          text = path.read_text()
          anchor = 'import { useLanguage } from "@/Layout";\n'
          addition = 'import { useAuth } from "@/contexts/AuthContext";\nimport { getMilestones, createMilestone, updateMilestone, deleteMilestone } from "@/lib/milestonesService";\n'
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)

          start = text.index('  const [milestones, setMilestones] = useState(() => {')
          end = text.index('  const milestoneTypes = [', start)
          text = text[:start] + base64.b64decode(os.environ['LOGIC_B64']).decode() + text[end:]

          text = text.replace("{ id: 'first-date'", "{ id: 'first_date'", 1)
          text = text.replace("{ id: 'first-kiss'", "{ id: 'first_kiss'", 1)

          start = text.index('  const handleSubmit = (e) => {')
          end = text.index('  const sortedMilestones =', start)
          text = text[:start] + base64.b64decode(os.environ['HANDLERS_B64']).decode() + text[end:]
          text = text.replace('const typeInfo = milestoneTypes.find(t => t.id === milestone.type);', "const typeInfo = milestoneTypes.find(t => t.id === milestone.type) || milestoneTypes[milestoneTypes.length - 1];", 1)
          path.write_text(text)

          worker = Path('worker/milestones.ts')
          wtext = worker.read_text()
          old = "const TYPES = new Set(['first_date', 'first_kiss', 'first_love', 'moving_in', 'engagement', 'wedding', 'anniversary', 'first_vacation', 'met_family', 'custom']);"
          new = "const TYPES = new Set(['first_date', 'first_kiss', 'first_love', 'moving_in', 'engagement', 'wedding', 'anniversary', 'birthday', 'special', 'first_vacation', 'met_family', 'custom']);"
          if old not in wtext:
              raise SystemExit('Milestone type list anchor not found')
          worker.write_text(wtext.replace(old, new, 1))
          PY

      - name: Commit Anniversary Tracker migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnniversaryTracker.jsx worker/milestones.ts
          git commit -m "Migrate Anniversary Tracker to Neon milestones"
          git push origin HEAD:o2ol-password-reset-preview
