name: One2OneLove Full-Stack Auth Smoke

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - ".github/workflows/fullstack-auth-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://one2onelove-preview-migration.hwy99signs.workers.dev
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Create temporary test identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="o2ol-migration-${GITHUB_RUN_ID}@example.com"
          PASSWORD="O2OL-Test-${GITHUB_RUN_ID}-Aa9!"
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Sign up through Neon Auth proxy
        shell: bash
        env:
          EMAIL: ${{ steps.identity.outputs.email }}
          PASSWORD: ${{ steps.identity.outputs.password }}
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --cookie-jar /tmp/o2ol.cookies --output /tmp/signup.json --write-out '%{http_code}' \
            -X POST "$PREVIEW_URL/api/auth/sign-up/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"name\":\"O2OL Migration Test\"}")"
          cat /tmp/signup.json
          test "$STATUS" -ge 200
          test "$STATUS" -lt 300

      - name: Verify authenticated session
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies "$PREVIEW_URL/api/auth/get-session" -o /tmp/session.json
          cat /tmp/session.json
          node -e 'const d=require("/tmp/session.json"); const u=d.user||d.data?.user; if(!u?.id) process.exit(1)'

      - name: Create member profile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies \
            -X POST "$PREVIEW_URL/api/onboarding/member" \
            -H 'content-type: application/json' \
            -d '{"name":"O2OL Migration Test","relationshipStatus":"dating","subscriptionPlan":"Basis","subscriptionPrice":0}' \
            -o /tmp/member.json
          cat /tmp/member.json
          node -e 'const d=require("/tmp/member.json"); if(!d.ok||d.profile?.relationship_status!=="dating") process.exit(1)'

      - name: Verify profile API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies "$PREVIEW_URL/api/profile" -o /tmp/profile.json
          cat /tmp/profile.json
          node -e 'const d=require("/tmp/profile.json"); if(!d.ok||!d.profile?.id) process.exit(1)'

      - name: Record and read Love Note
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies \
            -X POST "$PREVIEW_URL/api/love-notes/sent" \
            -H 'content-type: application/json' \
            -d '{"note_title":"Migration Test","note_content":"Testing the new One2OneLove backend.","recipient_type":"other","recipient_identifier":"test"}' \
            -o /tmp/sent.json
          cat /tmp/sent.json
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies "$PREVIEW_URL/api/love-notes/sent" -o /tmp/sent-list.json
          node -e 'const d=require("/tmp/sent-list.json"); if(!d.ok||!Array.isArray(d.notes)||d.notes.length<1) process.exit(1)'

      - name: Schedule and cancel Love Note
        id: scheduled
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u -d '+1 day' +%F)"
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies \
            -X POST "$PREVIEW_URL/api/love-notes/scheduled" \
            -H 'content-type: application/json' \
            -d "{\"note_title\":\"Scheduled Test\",\"note_content\":\"Testing scheduled notes.\",\"scheduled_date\":\"$DATE\",\"scheduled_time\":\"12:00\",\"scheduled_timezone\":\"UTC\",\"recipient_phone\":\"5555550100\",\"delivery_method\":\"sms\",\"note_language\":\"en\"}" \
            -o /tmp/scheduled.json
          cat /tmp/scheduled.json
          NOTE_ID="$(node -e 'const d=require("/tmp/scheduled.json"); if(!d.note?.id) process.exit(1); process.stdout.write(d.note.id)')"
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies \
            -X PATCH "$PREVIEW_URL/api/love-notes/scheduled/$NOTE_ID/cancel" \
            -H 'content-type: application/json' -d '{}' -o /tmp/cancelled.json
          node -e 'const d=require("/tmp/cancelled.json"); if(!d.ok||d.note?.status!=="cancelled") process.exit(1)'

      - name: Upload and serve profile photo through R2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/avatar.png
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies \
            -X PUT "$PREVIEW_URL/api/profile/photo" \
            -H 'content-type: image/png' --data-binary @/tmp/avatar.png -o /tmp/avatar.json
          cat /tmp/avatar.json
          AVATAR_PATH="$(node -e 'const d=require("/tmp/avatar.json"); if(!d.avatar_url) process.exit(1); process.stdout.write(d.avatar_url)')"
          curl --fail --silent --show-error "$PREVIEW_URL$AVATAR_PATH" -o /tmp/avatar-out.png
          test -s /tmp/avatar-out.png
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies -X DELETE "$PREVIEW_URL/api/profile/photo" -o /tmp/avatar-delete.json

      - name: Sign out
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --cookie /tmp/o2ol.cookies -X POST \
            -H 'content-type: application/json' -d '{}' "$PREVIEW_URL/api/auth/sign-out" -o /tmp/signout.json
          cat /tmp/signout.json

      - name: Clean temporary test identity
        if: always()
        shell: bash
        env:
          EMAIL: ${{ steps.identity.outputs.email }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -v email="$EMAIL" \
            -c 'DELETE FROM neon_auth."user" WHERE email = :'"'"'email'"'"';'
