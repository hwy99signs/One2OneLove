name: Diagnose O2OL Prelaunch Readiness

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/o2ol-diagnose-prelaunch-readiness.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Capture Worker exception and readiness responses
        shell: bash
        run: |
          set -u
          rm -f /tmp/tail.log /tmp/health.txt /tmp/readiness.txt /tmp/launchreadiness.txt
          timeout 25s npx --yes wrangler@latest tail one2onelove-prelaunch --format=json > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 6

          for path in /api/health /api/launch-signup/readiness /api/launch-readiness; do
            safe=$(printf '%s' "$path" | tr '/' '_')
            code=$(curl -sS --max-time 20 -o "/tmp${safe}.txt" -w '%{http_code}' "https://one2onelove-prelaunch.hwy99signs.workers.dev$path" || true)
            echo "=== $path HTTP=$code ==="
            cat "/tmp${safe}.txt" || true
            echo
          done

          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          echo "=== WORKER TAIL ==="
          cat /tmp/tail.log || true
          exit 0
