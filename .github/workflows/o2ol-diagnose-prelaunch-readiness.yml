name: Diagnose O2OL Prelaunch Readiness

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/o2ol-diagnose-prelaunch-readiness.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Capture Worker exception and endpoint responses
        shell: bash
        run: |
          set -u
          rm -f ./tail.log
          timeout 40s npx --yes wrangler@latest tail one2onelove-prelaunch --format=json > ./tail.log 2>&1 &
          TAIL_PID=$!
          sleep 12

          echo "=== HEALTH ==="
          curl -sS -i --max-time 20 "https://one2onelove-prelaunch.hwy99signs.workers.dev/api/health" || true
          echo
          echo "=== SIGNUP READINESS ==="
          curl -sS -i --max-time 20 "https://one2onelove-prelaunch.hwy99signs.workers.dev/api/launch-signup/readiness" || true
          echo
          echo "=== CANONICAL READINESS ==="
          curl -sS -i --max-time 20 "https://one2onelove-prelaunch.hwy99signs.workers.dev/api/launch-readiness" || true
          echo

          sleep 8
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          echo "=== WORKER TAIL ==="
          cat ./tail.log || true
          exit 0
