name: O2OL Chat Diagnostics Cleanup

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-chat-diagnostics-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-chat-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove browser diagnostics and third-party avatar fallback
        shell: node {0}
        run: |
          const fs = require('fs');

          function stripConsoleStatements(source) {
            let output = '';
            let cursor = 0;
            const marker = /console\.(?:log|debug|info|warn|error|trace)\s*\(/g;
            while (true) {
              marker.lastIndex = cursor;
              const match = marker.exec(source);
              if (!match) {
                output += source.slice(cursor);
                break;
              }

              let start = match.index;
              const lineStart = source.lastIndexOf('\n', start - 1) + 1;
              const prefix = source.slice(lineStart, start);
              if (/^\s*$/.test(prefix)) start = lineStart;

              let i = source.indexOf('(', match.index);
              let depth = 0;
              let quote = null;
              let escaped = false;
              for (; i < source.length; i += 1) {
                const ch = source[i];
                if (quote) {
                  if (escaped) escaped = false;
                  else if (ch === '\\') escaped = true;
                  else if (ch === quote) quote = null;
                  continue;
                }
                if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
                if (ch === '(') depth += 1;
                else if (ch === ')') {
                  depth -= 1;
                  if (depth === 0) { i += 1; break; }
                }
              }
              while (i < source.length && /[ \t]/.test(source[i])) i += 1;
              if (source[i] === ';') i += 1;
              if (source[i] === '\r') i += 1;
              if (source[i] === '\n' && start === lineStart) i += 1;

              output += source.slice(cursor, start);
              cursor = i;
            }
            return output;
          }

          const chatPage = 'src/pages/Chat.jsx';
          const chatService = 'src/lib/chatService.js';
          fs.writeFileSync(chatPage, stripConsoleStatements(fs.readFileSync(chatPage, 'utf8')));

          let service = stripConsoleStatements(fs.readFileSync(chatService, 'utf8'));
          service = service.replace(
            /const safeAvatar = \(profile, userId\) => profile\?\.avatar_url \|\| `https:\/\/api\.dicebear\.com\/7\.x\/initials\/svg\?seed=\$\{encodeURIComponent\(profile\?\.name \|\| userId \|\| 'O2OL'\)\}`;/,
            "const safeAvatar = (profile) => profile?.avatar_url || '';"
          );
          fs.writeFileSync(chatService, service);

      - name: Verify privacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'console\.(log|debug|info|warn|error|trace)' src/pages/Chat.jsx src/lib/chatService.js; then
            echo 'Chat browser diagnostics remain.'
            exit 1
          fi
          if grep -q 'api.dicebear.com' src/pages/Chat.jsx src/lib/chatService.js; then
            echo 'Third-party generated chat avatar remains.'
            exit 1
          fi
          grep -q "const safeAvatar = (profile) => profile?.avatar_url || '';" src/lib/chatService.js

      - name: Install dependencies
        run: npm ci

      - name: Lint chat service
        run: npx eslint src/lib/chatService.js --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-chat-diagnostics-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Chat.jsx src/lib/chatService.js .github/workflows/o2ol-chat-diagnostics-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove chat browser diagnostics and external avatar fallback"
          git push origin HEAD:o2ol-build-branch-2026-08-18
