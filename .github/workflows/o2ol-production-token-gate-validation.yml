name: O2OL Production Token Gate Validation

on:
  push:
    branches:
      - fix/production-token-deploy-gate-20261009
    paths:
      - ".github/workflows/o2ol-production-token-gate-validation.yml"
      - ".github/workflows/deploy-o2ol-production-neon.yml"
      - "neon-migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm --prefix worker install --no-audit --no-fund

      - name: Audit shipped runtimes
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm --prefix worker audit --audit-level=high

      - name: Verify repaired production migrations
        run: |
          set -euo pipefail
          grep -F "pricing_unit IN ('action','response','session','minute','send','report','item','episode')" neon-migrations/2026-10-03-o2ol-token-economy.sql
          grep -F "DROP CONSTRAINT IF EXISTS o2ol_token_feature_prices_pricing_unit_check" neon-migrations/2026-10-04-o2ol-token-content-unlocks.sql
          grep -F "('date_idea_unlock','Date Idea unlock',1,'item'" neon-migrations/2026-10-04-o2ol-token-content-unlocks.sql
          grep -F "('podcast_episode_unlock','Podcast episode unlock',1,'episode'" neon-migrations/2026-10-04-o2ol-token-content-unlocks.sql
          grep -F "visitor_identity_links" neon-migrations/2026-10-09-o2ol-lightweight-visitor-registry.sql

      - name: Verify Free plus Tokens contract
        run: |
          set -euo pipefail
          grep -F "handleO2OLTokenRequest" worker/index-v2.ts
          grep -F "reserveTokenCharge" worker/o2ol-tokens.ts
          grep -F "maybeAutoReplenish" worker/o2ol-tokens.ts
          grep -F 'path="/Tokens"' src/pages/index.jsx
          grep -F 'path="/Amora"' src/pages/index.jsx
          grep -F '<Navigate to="/Tokens" replace' src/pages/Subscription.jsx
          grep -F "Registered Free is the site access identity." src/components/launch/LaunchAccessGate.jsx
          grep -F "marketingEmailOptIn" src/components/launch/QuickAccountGate.jsx worker/launch-auth.ts
          grep -F "visitor_identity_links" worker/launch-auth.ts worker/admin.ts
          grep -F "reserveTokenCharge(db,auth.user.id,'bianca_report'" worker/mymatchiq-ai.ts
          grep -F "reserveTokenCharge(db,auth.user.id,'amora_response'" worker/ai.ts
          grep -F "reserveTokenCharge(db,auth.user.id,'love_note_send'" worker/love-note-entitlements.ts
          grep -F "reserveTokenCharge(db,auth.user.id,'like_minded_session'" worker/game-access.ts
          grep -F "payment_method_saved:Boolean(state.settings?.payment_method_reference)" worker/o2ol-tokens.ts
          grep -F "Visitor Registry / Audience Intelligence" src/pages/Admin.jsx
          grep -F "Token System Dashboard" src/pages/TokenSystemDashboard.jsx
          grep -F "data-desktop-action-trigger" src/pages/Layout.jsx
          grep -F 'path="*" element={<NotFound />}' src/pages/index.jsx

      - name: Verify legacy access is retired
        run: |
          set -euo pipefail
          if grep -REn 'PLAN_LEVEL|REQUIRED_PLAN|stripe_subscription_id|subscription_status|subscription_plan' src/components/launch/LaunchAccessGate.jsx; then exit 1; fi
          if grep -REn "canonicalPlan|Premiere|Exclusive|50 AI Relationship Coach|subscription_plan|subscription_status" worker/ai.ts; then exit 1; fi
          if grep -REn "'Premiere'|9\.99|effectivePlan|stripe_subscription_id" worker/love-note-entitlements.ts; then exit 1; fi
          if grep -REn 'Premiere|Exclusive|stripe_subscription_id|subscription_status' worker/game-access.ts worker/like-minded.ts; then exit 1; fi

      - name: Dry-run production Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.production.jsonc
