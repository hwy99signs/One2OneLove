name: Validate Auth Signup UX

on:
  push:
    branches:
      - feature/auth-signup-ux-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Static UX guards
        run: |
          grep -q "OPEN TERMS & CONDITIONS TO REVIEW AND ACCEPT" src/components/signup/LaunchRegularUserForm.jsx
          grep -q "Use 8 or more characters" src/components/signup/LaunchRegularUserForm.jsx
          grep -q "Create Account unlocks after you read and accept" src/components/signup/LaunchRegularUserForm.jsx
          grep -q "Your One2OneLove password is at least 8 characters" src/pages/SignIn.jsx
          grep -q "disabled={!termsScrolled}" src/components/signup/LaunchRegularUserForm.jsx

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser verify password and Terms flow
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cat > auth-ux-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));

            await page.route('**/api/launch-signup/readiness', route => route.fulfill({
              status:200,
              contentType:'application/json',
              body:JSON.stringify({success:true,ready:true})
            }));

            await page.goto('http://127.0.0.1:4173/SignUp?plan=Premiere&type=individual', {waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(400);

            const help=page.locator('#signup-password-help');
            if(!(await help.textContent()).includes('8 or more characters')) throw new Error('Signup password guidance missing');

            const create=page.getByRole('button',{name:'Create Account'});
            if(!(await create.isDisabled())) throw new Error('Create Account should be disabled before Terms acceptance');

            const termsButton=page.getByRole('button',{name:/OPEN TERMS & CONDITIONS/i});
            await termsButton.click();

            const accept=page.getByRole('button',{name:/I Am 18\+ and Accept/i});
            if(!(await accept.isDisabled())) throw new Error('Terms Accept should be disabled before scrolling');

            const termsScroller=page.locator('.max-h-\\[58vh\\].overflow-y-auto');
            await termsScroller.evaluate(node => { node.scrollTop=node.scrollHeight; node.dispatchEvent(new Event('scroll',{bubbles:true})); });
            await page.waitForTimeout(150);
            if(await accept.isDisabled()) throw new Error('Terms Accept did not enable after reaching bottom');
            await accept.click();

            if(!(await page.getByText('Terms of Service accepted',{exact:true}).isVisible())) throw new Error('Accepted state not visible');

            await page.fill('#signup-full-name','Test User');
            await page.fill('#signup-email','test@example.com');
            await page.fill('#signup-password','abcdefgh');
            await page.fill('#signup-confirm-password','abcdefgh');
            await page.selectOption('#signup-country','US');
            await page.selectOption('#signup-language','en');
            await page.waitForTimeout(100);
            if(await create.isDisabled()) throw new Error('Create Account did not unlock after valid form + Terms acceptance');

            await page.goto('http://127.0.0.1:4173/SignIn',{waitUntil:'domcontentloaded',timeout:60000});
            if(!(await page.locator('#signin-password-help').textContent()).includes('at least 8 characters')) throw new Error('Sign-in password guidance missing');

            if(errors.length) throw new Error(errors.join(' | '));
            console.log('Auth/signup UX flow passed');
            await browser.close();
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE
          node auth-ux-audit.cjs
