name: Date Ideas Neon Actions Build

on:
  push:
    branches:
      - date-ideas-functional-actions-neon
    paths:
      - .github/date-ideas-neon-actions-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: date-ideas-functional-actions-neon
          fetch-depth: 0

      - name: Apply Date Ideas Neon action patch
        run: python scripts/patch_date_ideas_neon_actions.py

      - name: Verify no direct Supabase Date Ideas calls remain
        run: |
          ! grep -q 'from "@/lib/supabase"' src/pages/DateIdeas.jsx
          ! grep -q "\.from('custom_date_ideas')" src/pages/DateIdeas.jsx
          grep -q 'listDateIdeas' src/pages/DateIdeas.jsx
          grep -q 'createDateIdea' src/pages/DateIdeas.jsx
          grep -q 'updateDateIdea' src/pages/DateIdeas.jsx
          grep -q 'createCalendarEvent(dateIdeasUserKey' src/pages/DateIdeas.jsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit functional Date Ideas actions
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/DateIdeas.jsx
          git commit -m "Wire Date Ideas actions to Neon services"
          git push origin HEAD:date-ideas-functional-actions-neon
