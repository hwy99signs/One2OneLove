name: O2OL Account Privacy Report

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - 'src/**'
      - 'scripts/audit-user-table-usage.mjs'
      - '.github/workflows/o2ol-account-privacy-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout active build branch
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate private-account usage report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/generated
          {
            echo '# Direct public.users references'
            echo
            echo 'Generated by O2OL Account Privacy Report.'
            echo
            grep -RInE "\.from\([[:space:]]*['\"]users['\"][[:space:]]*\)" src --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' || true
          } > docs/generated/O2OL_USER_TABLE_USAGE.md

      - name: Commit changed report
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/generated/O2OL_USER_TABLE_USAGE.md; then
            echo 'Account usage report is unchanged.'
            exit 0
          fi
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/generated/O2OL_USER_TABLE_USAGE.md
          git commit -m 'Update O2OL private account usage report'
          git push origin HEAD:o2ol-build-branch-2026-08-18
