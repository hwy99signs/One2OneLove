name: O2OL GitHub Reconciliation QA

on:
  push:
    branches:
      - integration/o2ol-github-reconciliation-20261006
    paths:
      - ".github/workflows/o2ol-github-reconciliation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove application source is unchanged from deployed commit
        shell: bash
        run: |
          set -euo pipefail
          BASE="509cc0b1901713a33e72c0379397ed20d9b24144"

          git diff --exit-code "$BASE"..HEAD -- \
            src \
            worker \
            public \
            neon-migrations \
            package.json \
            package-lock.json

          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/o2ol-github-reconciliation-qa.yml' \
            '.github/workflows/o2ol-token-prelaunch-studio-media-sync.yml' | sort)"

          test "$CHANGED" = "$EXPECTED"
          echo "Application/source tree is unchanged from $BASE."

      - name: Build token source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

          test -s dist/index.html
          test -s dist/assets/index-BKdxG-Rx.js
          test -s dist/assets/index-DsQpSHnc.css

          grep -F '/assets/index-BKdxG-Rx.js' dist/index.html
          grep -F '/assets/index-DsQpSHnc.css' dist/index.html
          grep -F '<title>One 2 One Love</title>' dist/index.html

          echo "Built JS bytes: $(stat -c%s dist/assets/index-BKdxG-Rx.js)"
          echo "Built JS sha256: $(sha256sum dist/assets/index-BKdxG-Rx.js | awk '{print $1}')"
          echo "Built CSS bytes: $(stat -c%s dist/assets/index-DsQpSHnc.css)"
          echo "Built CSS sha256: $(sha256sum dist/assets/index-DsQpSHnc.css | awk '{print $1}')"

      - name: Bundle-check Worker source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.10 worker/index-v2.ts \
            --bundle \
            --platform=browser \
            --format=esm \
            --external:pg \
            --outfile=/tmp/o2ol-token-worker.mjs
          test -s /tmp/o2ol-token-worker.mjs

      - name: Verify token-era source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Amora — Relationship Coach' src/pages/RelationshipCoach.jsx
          grep -F '/assets/amora-relationship-coach-official.jpg' src/pages/RelationshipCoach.jsx
          grep -F 'path="/RelationshipCoach" element={<RelationshipCoach />}' src/pages/index.jsx

          grep -F 'path="/TokenSystemDashboard"' src/pages/index.jsx
          grep -F 'Token System Dashboard' src/pages/TokenSystemDashboard.jsx
          grep -F 'path="/Tokens"' src/pages/index.jsx
          grep -F 'BUY TOKENS' src/pages/Layout.jsx

          grep -F "access_model: 'free_tokens'" worker/epscie-telemetry.ts
          grep -F 'binding": "EPSCIE_SERVICE"' .github/workflows/deploy-o2ol-functional-prelaunch-epscie-integration.yml
          grep -F 'service": "epscie-core"' .github/workflows/deploy-o2ol-functional-prelaunch-epscie-integration.yml

          grep -F "studio/season-1/episode-1-who-should-apologize-first.mp4" worker/studio-media.ts
          grep -F "PUBLIC_DELAY_MS=7*24*60*60*1000" worker/studio-media.ts

      - name: Verify Production branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          MASTER_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$MASTER_SHA" = "cd35aec4dbcf643cfcf03bfb30966100eda26ec9"
          echo "Production master remains $MASTER_SHA."
