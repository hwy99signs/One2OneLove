name: Custom Date and Memory Functional Fix

on:
  push:
    branches:
      - custom-date-memory-functional-fix
    paths:
      - .github/custom-date-memory-functional-fix-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-date-memory-functional-fix
          fetch-depth: 0

      - name: Apply Custom Date and Memory patch
        run: python scripts/patch_custom_date_memory_fix.py

      - name: Verify legacy Supabase writes are removed
        run: |
          ! grep -q 'from "@/lib/supabase"' src/pages/MemoryLane.jsx
          ! grep -q "\.from('memories')" src/pages/MemoryLane.jsx
          grep -q 'listMemories' src/pages/MemoryLane.jsx
          grep -q 'createMemory' src/pages/MemoryLane.jsx
          grep -q 'setQueryData' src/pages/DateIdeas.jsx
          grep -q 'isLoading={createDateMutation.isPending}' src/pages/DateIdeas.jsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit functional fixes
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/MemoryLane.jsx src/pages/DateIdeas.jsx src/components/dateideas/CustomDateForm.jsx src/components/memories/MemoryForm.jsx
          git commit -m "Fix Custom Date and Memory save actions"
          git push origin HEAD:custom-date-memory-functional-fix
