name: One2OneLove R2 Runtime Debug

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - "worker/r2-debug.ts"
      - "cloudflare/wrangler.r2-debug.jsonc"
      - ".github/workflows/r2-runtime-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r2-runtime:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEBUG_URL: https://one2onelove-r2-debug.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy R2 runtime debug Worker
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.r2-debug.jsonc
      - name: Read brand keys through Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            BODY="$(curl --fail --silent --show-error "$DEBUG_URL")" && break
            sleep 2
          done
          echo "$BODY"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.keys.includes("brand/one2onelove-logo.png")) process.exit(1)' "$BODY"
