name: Validate Admin Auto Refresh

on:
  push:
    branches:
      - feature/admin-auto-refresh-15m-20261003

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify 15 minute refresh guardrails
        run: |
          grep -q "const AUTO_REFRESH_MS = 15 \* 60 \* 1000;" src/pages/Admin.jsx
          grep -q "Auto-refresh · 15 min" src/pages/Admin.jsx
          grep -q "visibilitychange" src/pages/Admin.jsx
          grep -q "loadInFlightRef" src/pages/Admin.jsx
