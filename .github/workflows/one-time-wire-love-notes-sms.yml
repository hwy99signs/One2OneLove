name: One-time Love Notes SMS Wiring

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - .github/workflows/one-time-wire-love-notes-sms.yml

permissions:
  contents: write

jobs:
  wire-love-notes-sms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cloudflare-one2onelove-20260905

      - name: Wire Send Now to server-side SMS route
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/LoveNotes.jsx')
          text = path.read_text(encoding='utf-8')

          import_old = 'import { loveNotesApi, one2OneLogoUrl } from "@/lib/one2oneApi";\n'
          import_new = import_old + 'import { sendLoveNoteSms } from "@/lib/loveNotesSmsApi";\n'
          if 'sendLoveNoteSms' not in text:
              if import_old not in text:
                  raise SystemExit('Love Notes API import marker not found')
              text = text.replace(import_old, import_new, 1)

          state_old = "  const [isScheduling, setIsScheduling] = useState(false);\n"
          state_new = state_old + "  const [isSendingNow, setIsSendingNow] = useState(false);\n"
          if 'const [isSendingNow' not in text:
              if state_old not in text:
                  raise SystemExit('Scheduling state marker not found')
              text = text.replace(state_old, state_new, 1)

          translations = {
              '    pleaseEnterPhone: "Please enter recipient phone number",\n': '    pleaseEnterPhone: "Please enter recipient phone number",\n    sendSuccess: "Love note sent successfully! 💕",\n    smsNotConfigured: "Live text-message delivery is not active yet.",\n    sendFailed: "The love note could not be sent. Please try again.",\n',
              '    pleaseEnterPhone: "Por favor ingresa el número de teléfono del destinatario",\n': '    pleaseEnterPhone: "Por favor ingresa el número de teléfono del destinatario",\n    sendSuccess: "¡Nota de amor enviada con éxito! 💕",\n    smsNotConfigured: "El envío de mensajes de texto en vivo aún no está activo.",\n    sendFailed: "No se pudo enviar la nota de amor. Inténtalo de nuevo.",\n',
              '    pleaseEnterPhone: "Veuillez entrer le numéro de téléphone du destinataire",\n': '    pleaseEnterPhone: "Veuillez entrer le numéro de téléphone du destinataire",\n    sendSuccess: "Note d’amour envoyée avec succès ! 💕",\n    smsNotConfigured: "L’envoi de SMS en direct n’est pas encore activé.",\n    sendFailed: "La note d’amour n’a pas pu être envoyée. Veuillez réessayer.",\n',
              '    pleaseEnterPhone: "Inserisci il numero di telefono del destinatario",\n': '    pleaseEnterPhone: "Inserisci il numero di telefono del destinatario",\n    sendSuccess: "Nota d’amore inviata con successo! 💕",\n    smsNotConfigured: "L’invio di SMS dal vivo non è ancora attivo.",\n    sendFailed: "Non è stato possibile inviare la nota d’amore. Riprova.",\n',
              '    pleaseEnterPhone: "Bitte gib die Telefonnummer des Empfängers ein",\n': '    pleaseEnterPhone: "Bitte gib die Telefonnummer des Empfängers ein",\n    sendSuccess: "Liebesbotschaft erfolgreich gesendet! 💕",\n    smsNotConfigured: "Der direkte SMS-Versand ist noch nicht aktiviert.",\n    sendFailed: "Die Liebesbotschaft konnte nicht gesendet werden. Bitte versuche es erneut.",\n',
          }
          if 'smsNotConfigured:' not in text:
              for old, new in translations.items():
                  if old not in text:
                      raise SystemExit(f'Translation marker not found: {old.strip()}')
                  text = text.replace(old, new, 1)

          start = text.find('  const handleSendNow = (note) => {')
          end = text.find('  const handleSendVia = async (note, method) => {')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Send Now handler markers not found')

          lines = [
              '  const handleSendNow = async (note) => {',
              '    if (!note || isSendingNow) return;',
              '',
              '    const targetPhone = recipientPhone.trim();',
              '    if (!targetPhone) {',
              '      toast.error(t.pleaseEnterPhone);',
              '      return;',
              '    }',
              '',
              "    const limitCheckResult = checkLimitBeforeSend('text', targetPhone, 'text');",
              '    if (limitCheckResult === null) return;',
              '',
              "    if (!currentUser?.id) {",
              '      const messageText = `${note.title}\\n\\n${note.content}\\n\\n❤️ From One2One Love`;',
              '      window.location.href = `sms:${targetPhone}?body=${encodeURIComponent(messageText)}`;',
              '      toast.success(t.openingText);',
              '      setSendModalNote(null);',
              "      setRecipientPhone('');",
              '      setIsScheduling(false);',
              '      return;',
              '    }',
              '',
              '    setIsSendingNow(true);',
              '    try {',
              '      await sendLoveNoteSms({',
              '        recipient_phone: targetPhone,',
              '        note_title: note.title,',
              '        note_content: note.content,',
              '        note_language: currentLanguage,',
              '      });',
              '',
              '      try {',
              '        await sendNoteMutation.mutateAsync({',
              '          note_title: note.title,',
              '          note_content: note.content,',
              '          recipient_type: limitCheckResult.type,',
              '          recipient_identifier: limitCheckResult.identifier,',
              '          social_platform: limitCheckResult.social_platform,',
              '          sent_date: new Date().toISOString(),',
              '          created_by: currentUser.id,',
              '        });',
              '      } catch (recordError) {',
              "        console.error('Love note was sent but could not be recorded:', recordError);",
              '      }',
              '',
              '      toast.success(t.sendSuccess);',
              '      setSendModalNote(null);',
              "      setRecipientPhone('');",
              '      setIsScheduling(false);',
              '    } catch (error) {',
              "      console.error('Unable to send Love Note SMS:', error);",
              "      if (error?.code === 'sms_not_configured') {",
              '        toast.error(t.smsNotConfigured);',
              '      } else {',
              '        toast.error(t.sendFailed);',
              '      }',
              '    } finally {',
              '      setIsSendingNow(false);',
              '    }',
              '  };',
              '',
          ]
          replacement = '\n'.join(lines) + '\n'
          text = text[:start] + replacement + text[end:]

          text = text.replace('                  disabled={scheduleMutation.isPending}\n', '                  disabled={scheduleMutation.isPending || isSendingNow}\n', 1)
          text = text.replace('                  {scheduleMutation.isPending ? (\n', '                  {(scheduleMutation.isPending || isSendingNow) ? (\n', 1)
          text = text.replace('                      {isScheduling ? t.scheduleNote : t.sendLoveNote}\n', '                      {isScheduling ? t.scheduleNote : t.sendNow}\n', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit Love Notes SMS wiring
        shell: bash
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/LoveNotes.jsx
          git diff --cached --check
          git commit -m "fix: route Love Notes Send Now through SMS service"
          git push origin HEAD:migration/neon-cloudflare-one2onelove-20260905
