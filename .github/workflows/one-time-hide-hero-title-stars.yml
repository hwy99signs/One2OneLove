name: One-time Hide Hero Title and Stars

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - .github/workflows/one-time-hide-hero-title-stars.yml

permissions:
  contents: write

jobs:
  hide-hero-title-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cloudflare-one2onelove-20260905
          fetch-depth: 0

      - name: Hide hero title and decorative stars without deleting them
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/home/HeroSection.jsx')
          text = path.read_text(encoding='utf-8')
          old = '<h1 className="text-6xl sm:text-7xl md:text-8xl font-bold text-white mb-3 tracking-tight drop-shadow-2xl">'
          new = '<h1 className="hidden text-6xl sm:text-7xl md:text-8xl font-bold text-white mb-3 tracking-tight drop-shadow-2xl" aria-hidden="true">'
          if old not in text:
              raise SystemExit('Hero title marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit hidden hero title and stars
        shell: bash
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/components/home/HeroSection.jsx
          git diff --cached --check
          git commit -m "ui: hide hero title and decorative stars"
          git push origin HEAD:migration/neon-cloudflare-one2onelove-20260905
