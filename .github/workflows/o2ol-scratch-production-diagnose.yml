name: Repair O2OL Hyperdrive Credentials

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - ".github/workflows/o2ol-scratch-production-diagnose.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      HYPERDRIVE_ID: ef44564dbfca4e1bb13176ee568aaddf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-scratch-game-pwa

      - name: Verify current Neon credential directly
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"
          npm --prefix scratch-game/worker install --no-audit --no-fund
          cd scratch-game/worker
          node --input-type=module -e 'import pg from "pg"; const {Client}=pg; const url=new URL(process.env.NEON_DATABASE_URL); if(url.hostname!=="ep-shiny-truth-ar740o0s-pooler.c-4.us-west-2.aws.neon.tech") throw new Error("NEON_DATABASE_URL host does not match certified O2OL Hyperdrive origin"); url.pathname="/one2onelove"; const client=new Client({connectionString:url.toString()}); try { await client.connect(); const r=await client.query("SELECT current_database() AS db, count(*)::int AS cards FROM public.o2ol_scratch_questions WHERE active = TRUE"); if(r.rows[0]?.db!=="one2onelove") throw new Error("Unexpected Neon database"); if(Number(r.rows[0]?.cards)!==4800) throw new Error("Expected 4800 active Scratch cards, found "+r.rows[0]?.cards); console.log("DIRECT_NEON=PASS database=one2onelove cards=4800"); } finally { await client.end().catch(()=>{}); }'

      - name: Rotate Hyperdrive to current Neon credential
        shell: bash
        run: |
          set -euo pipefail
          CONN=$(node -e 'const u=new URL(process.env.NEON_DATABASE_URL); u.pathname="/one2onelove"; process.stdout.write(u.toString())')
          echo "::add-mask::$CONN"
          npx --yes wrangler@latest hyperdrive update "$HYPERDRIVE_ID" --connection-string="$CONN"
          echo "HYPERDRIVE_CREDENTIAL_ROTATION=PASS"

      - name: Restart Hyperdrive connection pool
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/restart.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$HYPERDRIVE_ID/restart"             --data '{}')
          cat /tmp/restart.json | jq '{success,errors,result:{id:.result.id,name:.result.name,restarted_on:.result.restarted_on}}'
          test "$code" = "200"
          jq -e '.success == true' /tmp/restart.json >/dev/null

      - name: Verify preview and production Scratch health recovered
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            "https://one2onelove-scratch-game-launch-preview.hwy99signs.workers.dev/api/health"
            "https://one2onelove-scratch-game.hwy99signs.workers.dev/api/health"
            "https://play.one2onelove.com/api/health"
          )
          for url in "${targets[@]}"; do
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && jq -e '.ok == true and .questionCount == 4800' /tmp/health.json >/dev/null 2>&1; then
                echo "$url -> PASS"
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "$url did not recover" >&2
              cat /tmp/health.json >&2 || true
              exit 1
            fi
          done
