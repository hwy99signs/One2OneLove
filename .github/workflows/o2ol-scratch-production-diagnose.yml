name: Inspect O2OL Neon Quota

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - ".github/workflows/o2ol-scratch-production-diagnose.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: red-feather-80645172
    steps:
      - name: Inspect quota without changing billing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY=MISSING"
            exit 0
          fi
          echo "NEON_API_KEY=AVAILABLE"
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}'             -H "Authorization: Bearer $NEON_API_KEY"             "https://console.neon.tech/api/v2/projects/$PROJECT_ID")
          echo "PROJECT_HTTP=$code"
          test "$code" = "200"
          jq '{
            id:.project.id,
            name:.project.name,
            region_id:.project.region_id,
            platform_id:.project.platform_id,
            settings:.project.settings,
            synthetic_storage_size:.project.synthetic_storage_size,
            data_storage_bytes_hour:.project.data_storage_bytes_hour,
            data_transfer_bytes:.project.data_transfer_bytes,
            written_data_bytes:.project.written_data_bytes,
            compute_time_seconds:.project.compute_time_seconds,
            active_time_seconds:.project.active_time_seconds,
            creation_source:.project.creation_source,
            owner_id:.project.owner_id,
            org_id:.project.org_id,
            quota_reset_at:.project.quota_reset_at
          }' /tmp/project.json
