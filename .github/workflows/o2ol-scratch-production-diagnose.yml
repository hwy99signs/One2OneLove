name: Diagnose Scratch Hyperdrive Config

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - ".github/workflows/o2ol-scratch-production-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      O2OL_DATABASE_URL: ${{ secrets.O2OL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-scratch-game-pwa
      - name: Inspect non-secret Hyperdrive metadata and credential sources
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL NEON_DATABASE_URL O2OL_DATABASE_URL; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; else echo "$name=MISSING"; fi
          done
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/ef44564dbfca4e1bb13176ee568aaddf"             -o /tmp/hyperdrive.json
          jq '.result | del(.origin.password,.origin.user,.origin.access_client_secret,.origin.access_client_id)' /tmp/hyperdrive.json
