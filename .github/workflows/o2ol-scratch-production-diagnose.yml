name: Diagnose Scratch Production Hyperdrive

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - ".github/workflows/o2ol-scratch-production-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-scratch-game-pwa
      - name: Compare production and preview health
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            "https://play.one2onelove.com/api/health"
            "https://one2onelove-scratch-game.hwy99signs.workers.dev/api/health"
            "https://one2onelove-scratch-game-launch-preview.hwy99signs.workers.dev/api/health"
          )
          for attempt in $(seq 1 8); do
            echo "=== attempt $attempt ==="
            for url in "${targets[@]}"; do
              code=$(curl -sS --max-time 20 -o /tmp/health.txt -w '%{http_code}' "$url" || true)
              body=$(cat /tmp/health.txt 2>/dev/null || true)
              echo "$url -> $code $body"
            done
            sleep 5
          done
