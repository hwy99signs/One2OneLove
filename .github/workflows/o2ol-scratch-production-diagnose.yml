name: Retry O2OL Production Gates

on:
  push:
    branches:
      - o2ol-scratch-game-pwa
    paths:
      - ".github/workflows/o2ol-scratch-production-diagnose.yml"

permissions:
  contents: read

jobs:
  retry-gates:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-scratch-game-pwa

      - name: Recheck production Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          SECRETS=$(npx --yes wrangler@latest secret list --name one2onelove-launch 2>&1 || true)
          for REQUIRED in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID; do
            if printf '%s\n' "$SECRETS" | grep -F "$REQUIRED" >/dev/null; then
              echo "$REQUIRED=AVAILABLE"
            else
              echo "$REQUIRED=MISSING"
            fi
          done
          if printf '%s\n' "$SECRETS" | grep -F OPENAI_API_KEY >/dev/null; then
            echo "OPENAI_API_KEY=AVAILABLE"
          else
            echo "OPENAI_API_KEY=MISSING_OPTIONAL"
          fi

      - name: Recheck Neon quota directly
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix scratch-game/worker install --no-audit --no-fund >/dev/null
          cd scratch-game/worker
          node --input-type=module -e 'import pg from "pg"; const {Client}=pg; const url=new URL(process.env.NEON_DATABASE_URL); url.pathname="/one2onelove"; const client=new Client({connectionString:url.toString()}); try { await client.connect(); const r=await client.query("SELECT current_database() AS db, count(*)::int AS cards FROM public.o2ol_scratch_questions WHERE active=TRUE"); console.log("NEON=AVAILABLE database="+r.rows[0].db+" cards="+r.rows[0].cards); } catch(e) { console.log("NEON=BLOCKED "+String(e.message||e)); process.exit(2); } finally { await client.end().catch(()=>{}); }'

      - name: Recheck live endpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for url in             https://one2onelove-prelaunch.hwy99signs.workers.dev/api/health             https://play.one2onelove.com/api/health             https://one2onelove-scratch-game-launch-preview.hwy99signs.workers.dev/api/health; do
            code=$(curl -sS --max-time 20 -o /tmp/body.txt -w '%{http_code}' "$url" || true)
            body=$(cat /tmp/body.txt 2>/dev/null || true)
            echo "$url -> $code $body"
          done
