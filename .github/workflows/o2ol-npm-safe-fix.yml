name: O2OL NPM Safe Security Fix

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-npm-safe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
      - name: Apply nonbreaking npm audit fixes
        shell: bash
        run: |
          npm ci
          npm audit fix || true
          npm run build
          npm audit --audit-level=critical || true
      - name: Commit safe dependency updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Apply nonbreaking dependency security updates'
          git push origin HEAD:o2ol-password-reset-preview
