name: O2OL Clean Milestone Lint

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-clean-milestone-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove milestone lint and browser-log debt
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/RelationshipMilestones.jsx')
          s = p.read_text()
          replacements = {
            'Plus, Heart, Calendar, Sparkles, Gift, Link as LinkIcon, ArrowLeft': 'Plus, Heart, Calendar, Sparkles, Gift, ArrowLeft',
            'const { data: milestones = [], isLoading } = useQuery({': 'const { data: milestones = [] } = useQuery({',
            "    onError: (error) => {\n      console.error('Create error:', error);\n      toast.error(t.errorAdding);\n    }": "    onError: () => {\n      toast.error(t.errorAdding);\n    }",
            "    onError: (error) => {\n      console.error('Update error:', error);\n      toast.error(t.errorUpdating);\n    }": "    onError: () => {\n      toast.error(t.errorUpdating);\n    }",
            "    onError: (error) => {\n      console.error('Delete error:', error);\n      toast.error(t.errorDeleting);\n    }": "    onError: () => {\n      toast.error(t.errorDeleting);\n    }",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected milestone source pattern not found: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Verify milestone source
        run: |
          ! grep -q 'Link as LinkIcon' src/pages/RelationshipMilestones.jsx
          ! grep -q 'isLoading } = useQuery' src/pages/RelationshipMilestones.jsx
          ! grep -Eq 'console\.(log|debug|info|warn|error)' src/pages/RelationshipMilestones.jsx

      - name: Lint milestone surfaces
        run: npx eslint src/pages/RelationshipMilestones.jsx src/components/milestones/MilestoneCard.jsx src/components/milestones/CelebrationIdeas.jsx src/lib/milestoneCelebrationFallbacks.js --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build

      - name: Commit verified cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-clean-milestone-lint.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/RelationshipMilestones.jsx .github/workflows/o2ol-clean-milestone-lint.yml
          git commit -m 'Clean Relationship Milestones lint and diagnostics'
          git push origin HEAD:o2ol-build-branch-2026-08-18
