name: O2OL Token Infrastructure Readiness

on:
  push:
    branches:
      - prelaunch/o2ol-token-economy-20261003
    paths:
      - ".github/workflows/o2ol-token-infra-readiness.yml"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      TOKEN_PRELAUNCH_HYPERDRIVE_ID_SECRET: ${{ secrets.TOKEN_PRELAUNCH_HYPERDRIVE_ID }}
      TOKEN_PRELAUNCH_HYPERDRIVE_ID_VAR: ${{ vars.TOKEN_PRELAUNCH_HYPERDRIVE_ID }}
      TOKEN_PRELAUNCH_DATABASE_URL: ${{ secrets.TOKEN_PRELAUNCH_DATABASE_URL }}
      TOKEN_PRELAUNCH_OPENAI_API_KEY: ${{ secrets.TOKEN_PRELAUNCH_OPENAI_API_KEY }}
      TOKEN_PRELAUNCH_STRIPE_SECRET_KEY: ${{ secrets.TOKEN_PRELAUNCH_STRIPE_SECRET_KEY }}
      TOKEN_PRELAUNCH_STRIPE_WEBHOOK_SECRET: ${{ secrets.TOKEN_PRELAUNCH_STRIPE_WEBHOOK_SECRET }}
      TOKEN_PRELAUNCH_TWILIO_ACCOUNT_SID: ${{ secrets.TOKEN_PRELAUNCH_TWILIO_ACCOUNT_SID }}
      TOKEN_PRELAUNCH_TWILIO_AUTH_TOKEN: ${{ secrets.TOKEN_PRELAUNCH_TWILIO_AUTH_TOKEN }}
      TOKEN_PRELAUNCH_TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TOKEN_PRELAUNCH_TWILIO_VERIFY_SERVICE_SID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Report isolated Prelaunch capability flags
        shell: bash
        run: |
          set -euo pipefail
          present() {
            local NAME="$1"
            local VALUE="$2"
            if [ -n "$VALUE" ]; then
              echo "$NAME=present"
            else
              echo "$NAME=missing"
            fi
          }

          HYPERDRIVE_ID="${TOKEN_PRELAUNCH_HYPERDRIVE_ID_SECRET:-${TOKEN_PRELAUNCH_HYPERDRIVE_ID_VAR:-}}"
          present TOKEN_PRELAUNCH_HYPERDRIVE_ID "$HYPERDRIVE_ID"
          present TOKEN_PRELAUNCH_DATABASE_URL "$TOKEN_PRELAUNCH_DATABASE_URL"
          present TOKEN_PRELAUNCH_OPENAI_API_KEY "$TOKEN_PRELAUNCH_OPENAI_API_KEY"
          present TOKEN_PRELAUNCH_STRIPE_SECRET_KEY "$TOKEN_PRELAUNCH_STRIPE_SECRET_KEY"
          present TOKEN_PRELAUNCH_STRIPE_WEBHOOK_SECRET "$TOKEN_PRELAUNCH_STRIPE_WEBHOOK_SECRET"
          present TOKEN_PRELAUNCH_TWILIO_ACCOUNT_SID "$TOKEN_PRELAUNCH_TWILIO_ACCOUNT_SID"
          present TOKEN_PRELAUNCH_TWILIO_AUTH_TOKEN "$TOKEN_PRELAUNCH_TWILIO_AUTH_TOKEN"
          present TOKEN_PRELAUNCH_TWILIO_VERIFY_SERVICE_SID "$TOKEN_PRELAUNCH_TWILIO_VERIFY_SERVICE_SID"
          present CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          present CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"

          echo "No secret values were printed."
