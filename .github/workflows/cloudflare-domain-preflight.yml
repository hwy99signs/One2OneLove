name: One2OneLove Cloudflare Domain Preflight

on:
  push:
    branches:
      - migration/cloudflare-launch-20260911
    paths:
      - ".github/workflows/cloudflare-domain-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-domain:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare zone and existing root/www DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl --fail --silent --show-error "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=one2onelove.com" > /tmp/zones.json
          python - <<'PY'
          import json
          z=json.load(open('/tmp/zones.json'))
          if not z.get('success') or not z.get('result'):
              raise SystemExit('one2onelove.com is not visible as a Cloudflare zone to this token')
          zone=z['result'][0]
          open('/tmp/zone_id','w').write(zone['id'])
          print('Zone found:', zone.get('name'), 'status=', zone.get('status'))
          PY
          ZONE_ID="$(cat /tmp/zone_id)"
          curl --fail --silent --show-error "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=one2onelove.com" > /tmp/root.json
          curl --fail --silent --show-error "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.one2onelove.com" > /tmp/www.json
          python - <<'PY'
          import json
          zone=json.load(open('/tmp/zones.json'))['result'][0]
          root=json.load(open('/tmp/root.json')).get('result',[])
          www=json.load(open('/tmp/www.json')).get('result',[])
          safe=lambda r: {k:r.get(k) for k in ('id','type','name','content','proxied')}
          report={
            'zone': {'id':zone['id'],'name':zone['name'],'status':zone.get('status'),'name_servers':zone.get('name_servers')},
            'root_records':[safe(r) for r in root],
            'www_records':[safe(r) for r in www],
          }
          json.dump(report,open('/tmp/domain-preflight.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          PY

      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: one2onelove-domain-preflight
          path: /tmp/domain-preflight.json
          if-no-files-found: error
          retention-days: 1
