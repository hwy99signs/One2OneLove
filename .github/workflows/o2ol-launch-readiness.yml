name: O2OL Launch Readiness

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify locked dependency audit
        run: npm audit --audit-level=low

      - name: Verify current launch routes and trust surfaces
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/pages/SignIn.jsx \
            src/pages/SignUp.jsx \
            src/components/signup/RegularUserForm.jsx \
            src/pages/ForgotPassword.jsx \
            src/pages/ResetPassword.jsx \
            src/pages/Profile.jsx \
            src/pages/CouplesProfile.jsx \
            src/pages/LoveNotes.jsx \
            src/pages/SharedJournals.jsx \
            src/pages/MemoryLane.jsx \
            src/pages/RelationshipGoals.jsx \
            src/pages/RelationshipMilestones.jsx \
            src/pages/AnniversaryTracker.jsx \
            src/pages/CouplesCalendar.jsx \
            src/pages/DateNight.jsx \
            src/pages/DateIdeas.jsx \
            src/pages/DailyQuestion.jsx \
            src/pages/MarriageMatters.jsx \
            src/pages/ConversationCards.jsx \
            src/pages/WeeklyCheckIn.jsx \
            src/pages/RelationshipRituals.jsx \
            src/pages/RelationshipReset.jsx \
            src/pages/CommunicationPractice.jsx \
            src/pages/RelationshipLibrary.jsx \
            src/pages/CouplesChallenges.jsx \
            src/pages/CoupleActivities.jsx \
            src/pages/CouplesDashboard.jsx \
            src/pages/Community.jsx \
            src/pages/FindFriends.jsx \
            src/pages/FriendRequests.jsx \
            src/pages/Chat.jsx \
            src/pages/GlobalRelationshipRoom.jsx \
            src/pages/RoomCreatorAccess.jsx \
            src/pages/RoomModeration.jsx \
            src/pages/RoomReportQueue.jsx \
            src/pages/RoomCancellationQueue.jsx \
            src/pages/RoomOpsDashboard.jsx \
            src/pages/ContactUs.jsx \
            src/pages/HelpCenter.jsx \
            src/pages/AboutUs.jsx \
            src/pages/InfluencerSignup.jsx \
            src/pages/ProfessionalSignup.jsx \
            src/pages/TherapistSignup.jsx \
            src/pages/Subscription.jsx \
            src/pages/PaymentSuccess.jsx; do
            test -f "$file"
          done
          for route in SignIn SignUp Profile CouplesProfile LoveNotes SharedJournals MemoryLane RelationshipGoals RelationshipMilestones AnniversaryTracker CouplesCalendar DateNight DateIdeas DailyQuestion MarriageMatters ConversationCards WeeklyCheckIn RelationshipRituals RelationshipReset CommunicationPractice RelationshipLibrary CouplesChallenges CoupleActivities CouplesDashboard Community FindFriends FriendRequests Chat GlobalRelationshipRoom RoomCreatorAccess ContactUs HelpCenter AboutUs; do
            grep -q "path=\"/${route}\"" src/pages/index.jsx
          done
          grep -q 'path="*"' src/pages/index.jsx
          if grep -Eq 'love-notes-stats|123456|tempPassword' src/pages/Home.jsx src/pages/InfluencerSignup.jsx src/pages/ProfessionalSignup.jsx src/pages/TherapistSignup.jsx; then
            echo 'Legacy fake launch behavior detected.'
            exit 1
          fi

      - name: Verify current launch source
        run: node scripts/verify-o2ol-launch-current.mjs

      - name: Verify current security invariants
        run: node scripts/verify-o2ol-security-current.mjs

      - name: Verify social privacy
        run: node scripts/verify-o2ol-social-privacy.mjs

      - name: Verify chat security
        run: node scripts/verify-o2ol-chat-security.mjs

      - name: Lint launch shell and newly rebuilt public surfaces
        run: >-
          npx eslint
          src/pages/Home.jsx
          src/pages/Layout.jsx
          src/pages/Profile.jsx
          src/pages/Community.jsx
          src/pages/FindFriends.jsx
          src/pages/FriendRequests.jsx
          src/pages/ContactUs.jsx
          src/pages/HelpCenter.jsx
          src/pages/AboutUs.jsx
          src/pages/InfluencerSignup.jsx
          src/pages/ProfessionalSignup.jsx
          src/pages/TherapistSignup.jsx
          src/pages/Subscription.jsx
          src/pages/PaymentSuccess.jsx
          src/lib/buddyService.js
          src/lib/chatService.js
          src/lib/successStoriesService.js
          --rule 'react/prop-types: off'

      - name: Production build
        run: npm run build
