name: Communication Practice 100 Random Rounds

on:
  push:
    branches:
      - communication-practice-100-random-rounds
    paths:
      - .github/communication-practice-100-random-rounds-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: communication-practice-100-random-rounds
          fetch-depth: 0

      - name: Repair temporary expansion script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/expand_communication_practice_to_100.cjs')
          s = p.read_text()
          s = s.replace("expanded[\\`${id}_variant_\\${index + 1}\\`] = {", "expanded[id + '_variant_' + (index + 1)] = {")
          s = s.replace("title: \\`\\${scenario.title} — \\${suffix}\\`,", "title: scenario.title + ' — ' + suffix,")
          s = s.replace("situation: \\`\\${scenario.situation} \\${localized.situations[index]}\\`,", "situation: scenario.situation + ' ' + localized.situations[index],")
          p.write_text(s)
          PY

      - name: Apply 100-scenario randomized rounds
        run: node scripts/expand_communication_practice_to_100.cjs

      - name: Verify scenario bank and scoring behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          let src = fs.readFileSync('src/components/communication/CommunicationPracticeScenarios.js','utf8');
          src = src
            .replace('export const communicationPracticeScenarios =', 'globalThis.communicationPracticeScenarios =')
            .replace('export default communicationPracticeScenarios;', '');
          const ctx = { globalThis: {} };
          vm.createContext(ctx);
          vm.runInContext(src, ctx);
          const bank = ctx.globalThis.communicationPracticeScenarios;
          for (const lang of ['en','es','fr','it','de']) {
            const scenarios = bank[lang];
            const ids = Object.keys(scenarios || {});
            if (ids.length !== 100) throw new Error(`${lang}: expected 100 scenarios, got ${ids.length}`);
            if (new Set(ids).size !== 100) throw new Error(`${lang}: duplicate scenario IDs`);
            for (const id of ids) {
              const s = scenarios[id];
              if (!s.title || !s.situation) throw new Error(`${lang}/${id}: missing title or situation`);
              if (!Array.isArray(s.options) || s.options.length !== 4) throw new Error(`${lang}/${id}: expected 4 options`);
              const types = s.options.map(o => o.type);
              if (types.filter(t => t === 'excellent').length !== 1) throw new Error(`${lang}/${id}: expected one excellent answer`);
              if (types.filter(t => t === 'good').length !== 1) throw new Error(`${lang}/${id}: expected one good answer`);
              if (types.filter(t => t === 'poor').length !== 2) throw new Error(`${lang}/${id}: expected two poor answers`);
            }
            console.log(`${lang}: 100 scenarios verified`);
          }

          const page = fs.readFileSync('src/pages/CommunicationPractice.jsx','utf8');
          const required = [
            'const ROUND_SIZE = 20',
            'pickRoundIds',
            'roundScenarioIds',
            'correctAnswers',
            'wrongAnswers',
            'percentageScore',
            'roundComplete',
            'handleNewRound',
            't.correctAnswers',
            't.wrongAnswers',
            't.percentageScore',
            'options: [...scenarios[key].options].sort'
          ];
          for (const marker of required) if (!page.includes(marker)) throw new Error(`Missing page marker: ${marker}`);
          console.log('20-question randomized round + scoring markers verified');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify only intended files changed
        run: |
          node <<'NODE'
          const { execSync } = require('child_process');
          const files = execSync('git diff --name-only origin/master...HEAD', {encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowed = new Set([
            'src/pages/CommunicationPractice.jsx',
            'src/components/communication/CommunicationPracticeScenarios.js',
            'scripts/expand_communication_practice_to_100.cjs',
            '.github/workflows/communication-practice-100-random-rounds.yml',
            '.github/communication-practice-100-random-rounds-trigger'
          ]);
          for (const file of files) if (!allowed.has(file)) throw new Error(`Unexpected changed file: ${file}`);
          console.log(files.join('\n'));
          NODE

      - name: Commit generated simulator changes
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/CommunicationPractice.jsx src/components/communication/CommunicationPracticeScenarios.js
          git commit -m "Add randomized 20-question rounds with scoring to Communication Practice"
          git push origin HEAD:communication-practice-100-random-rounds
