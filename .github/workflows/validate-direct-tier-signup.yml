name: Validate Direct Tier Signup

on:
  push:
    branches:
      - fix/tier-direct-signup-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Static direct-signup guards
        run: |
          grep -q "type=individual&source=subscription-plan" src/pages/Subscription.jsx
          grep -q "type=individual&founding=1&source=founding-offer" src/pages/Subscription.jsx
          ! grep -q "authLoading" src/pages/Subscription.jsx
          grep -q "role||''" src/pages/Subscription.jsx

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser verify slow-auth and admin cases
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/o2ol-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cat > direct-tier-signup.cjs <<'NODE'
          const { chromium } = require('playwright');

          async function assertForm(page, plan) {
            await page.waitForURL(new RegExp('/SignUp\\?plan='+plan+'.*type=individual'),{timeout:5000});
            await page.locator('#signup-full-name').waitFor({state:'visible',timeout:5000});
            await page.locator('#signup-email').waitFor({state:'visible',timeout:5000});
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});

            // Case 1: auth request is deliberately slow. Public buttons must still work immediately.
            {
              const context=await browser.newContext();
              const page=await context.newPage();
              await page.route('**/api/auth/get-session', async route=>{
                await new Promise(r=>setTimeout(r,15000));
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({user:null,session:null})});
              });
              await page.route('**/api/billing/founding-offer', route=>route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({offer:{available:true,plan:'Exclusive',cohort:'first100',recurringPriceCents:1599}})
              }));
              await page.route('**/api/launch-signup/readiness', route=>route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({readiness:{publicLaunchIdentityGateReady:true}})
              }));
              await page.route('**/api/interaction-events', route=>route.fulfill({status:204,body:''}));

              await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded',timeout:60000});
              const premiere=page.getByRole('button',{name:'Create Account for Premiere'});
              if(await premiere.isDisabled()) throw new Error('Premiere disabled while auth is loading');
              await premiere.click();
              await assertForm(page,'Premiere');
              await context.close();
            }

            // Case 2: admin QA session. Admin must test public signup path, never billing.
            {
              const context=await browser.newContext();
              const page=await context.newPage();
              let checkoutCalls=0;
              await page.route('**/api/auth/get-session', route=>route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({user:{id:'00000000-0000-0000-0000-000000000001',email:'admin@example.com',emailVerified:true,role:'admin'},session:{id:'qa'}})
              }));
              await page.route('**/api/profile', route=>route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({profile:{id:'00000000-0000-0000-0000-000000000001',role:'admin'}})
              }));
              await page.route('**/api/billing/founding-offer', route=>route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({offer:{available:true,plan:'Exclusive',cohort:'first100',recurringPriceCents:1599}})
              }));
              await page.route('**/api/billing/checkout', route=>{
                checkoutCalls++;
                return route.fulfill({status:500,body:'{}'});
              });
              await page.route('**/api/launch-signup/readiness', route=>route.fulfill({
                status:200,contentType:'application/json',
                body:JSON.stringify({readiness:{publicLaunchIdentityGateReady:true}})
              }));
              await page.route('**/api/interaction-events', route=>route.fulfill({status:204,body:''}));

              await page.goto('http://127.0.0.1:4173/Subscription',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(300);
              await page.getByRole('button',{name:'Create Account for Exclusive'}).click();
              await assertForm(page,'Exclusive');
              if(checkoutCalls!==0) throw new Error('Admin QA tier click incorrectly called billing checkout');
              await context.close();
            }

            console.log('DIRECT TIER SIGNUP QA PASSED');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
          node direct-tier-signup.cjs
