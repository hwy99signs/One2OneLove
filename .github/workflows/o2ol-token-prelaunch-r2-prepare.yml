name: O2OL Token Prelaunch R2 Prepare

on:
  push:
    branches:
      - prelaunch/o2ol-token-economy-20261003
    paths:
      - ".github/workflows/o2ol-token-prelaunch-r2-prepare.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_MEDIA_BUCKET: one2onelove-token-prelaunch-media
    steps:
      - name: Require Cloudflare management credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Create isolated Token Prelaunch R2 bucket if missing
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx --yes wrangler@latest r2 bucket list 2>&1)
          if ! printf '%s\n' "$LIST" | grep -F "$TOKEN_MEDIA_BUCKET" >/dev/null; then
            npx --yes wrangler@latest r2 bucket create "$TOKEN_MEDIA_BUCKET"
          fi
          npx --yes wrangler@latest r2 bucket list | grep -F "$TOKEN_MEDIA_BUCKET"
          echo "TOKEN_PRELAUNCH_R2_READY=$TOKEN_MEDIA_BUCKET"
