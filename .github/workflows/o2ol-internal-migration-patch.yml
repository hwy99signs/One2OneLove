name: O2OL Internal Migration Completion Patch

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-internal-migration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Complete internal migration wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected block in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Couple Activities: derive progress/preferences from migrated Neon-backed APIs.
          replace('src/pages/CoupleActivities.jsx',
                  'import { motion } from "framer-motion";\n',
                  'import { motion } from "framer-motion";\nimport { getActivityProgress, getActivityPreferences } from "@/lib/activityService";\n')
          replace('src/pages/CoupleActivities.jsx',
                  """    queryFn: async () => {\n      if (!user?.id) return [];\n      // TODO: Implement activity progress service\n      return [];\n    },""",
                  """    queryFn: async () => user?.id ? getActivityProgress() : [],""")
          replace('src/pages/CoupleActivities.jsx',
                  """    queryFn: async () => {\n      if (!user?.id) return null;\n      // TODO: Implement user preferences service\n      return null;\n    },""",
                  """    queryFn: async () => user?.id ? getActivityPreferences() : null,""")

          # Couples Dashboard: use same migrated activity data and derived game history.
          replace('src/pages/CouplesDashboard.jsx',
                  'import { getEngagementBadges } from "@/lib/engagementService";\n',
                  'import { getEngagementBadges } from "@/lib/engagementService";\nimport { getActivityProgress, getCooperativeGameHistory } from "@/lib/activityService";\n')
          replace('src/pages/CouplesDashboard.jsx',
                  """    queryFn: async () => {\n      // TODO: Implement activity progress service\n      return [];\n    },""",
                  """    queryFn: async () => user?.id ? getActivityProgress() : [],\n    enabled: !!user?.id,""")
          replace('src/pages/CouplesDashboard.jsx',
                  """    queryFn: async () => {\n      // TODO: Implement cooperative games service\n      return [];\n    },""",
                  """    queryFn: async () => user?.id ? getCooperativeGameHistory() : [],\n    enabled: !!user?.id,""")

          # Cooperative Games: stats now come from migrated engagement records.
          replace('src/pages/CooperativeGames.jsx',
                  'import GameCard from "../components/activities/GameCard";\n',
                  'import GameCard from "../components/activities/GameCard";\nimport { getCooperativeGameHistory } from "@/lib/activityService";\n')
          replace('src/pages/CooperativeGames.jsx',
                  """    queryFn: async () => {\n      if (!user?.id) return [];\n      // TODO: Implement cooperative games service\n      return [];\n    },""",
                  """    queryFn: async () => user?.id ? getCooperativeGameHistory() : [],""")

          # Premium feature unlocking already has points/level rules; remove dead reward-table placeholder.
          p = Path('src/pages/PremiumFeatures.jsx')
          text = p.read_text()
          start = text.index("  const { data: unlockedRewards = [] } = useQuery({")
          end_marker = "  const totalPoints = userPoints.reduce"
          end = text.index(end_marker, start)
          text = text[:start] + "  const unlockedRewards = [];\n\n" + text[end:]
          p.write_text(text)

          # Invite: use the actual current One2OneLove host and do not claim email was sent when no mail service exists.
          replace('src/pages/Invite.jsx',
                  '  const inviteLink = "https://lovenotes.app/invite";\n',
                  "  const inviteLink = typeof window !== 'undefined' ? `${window.location.origin}/Invite` : 'https://one2onelove.com/Invite';\n")
          replace('src/pages/Invite.jsx', 'I\'ve been using One 2 One Love', 'I\'ve been using One2OneLove')
          replace('src/pages/Invite.jsx',
                  """    toast.success(`Invitation sent to ${email}! 💌`);\n    setEmail(\"\");""",
                  """    const subject = encodeURIComponent('Join me on One2OneLove');\n    const body = encodeURIComponent(`${inviteMessage}\\n\\n${inviteLink}`);\n    window.location.href = `mailto:${encodeURIComponent(email.trim())}?subject=${subject}&body=${body}`;\n    toast.info('Opening your email app...');\n    setEmail(\"\");""")

          # Chat page: wire existing backend operations that were still placeholders.
          replace('src/pages/Chat.jsx',
                  """  deleteConversation,\n  subscribeToMessages,""",
                  """  deleteConversation,\n  clearConversation,\n  markConversationUnread,\n  subscribeToMessages,""")
          replace('src/pages/Chat.jsx',
                  "import { pinMessage, unpinMessage } from '@/lib/chatFeaturesService';",
                  "import { pinMessage, unpinMessage, forwardMessage } from '@/lib/chatFeaturesService';")
          replace('src/pages/Chat.jsx',
                  """    mutationFn: async ({ conversationId, receiverId, content, type }) => {\n      return await sendMessage(conversationId, receiverId, content, type);\n    },""",
                  """    mutationFn: async ({ conversationId, receiverId, content, type, replyToId }) => {\n      return await sendMessage(conversationId, receiverId, content, type, replyToId);\n    },""")
          replace('src/pages/Chat.jsx',
                  """  const handleSendMessage = async (text) => {\n    if (!selectedChatId || !selectedChat) return;\n\n    await sendMessageMutation.mutateAsync({\n      conversationId: selectedChatId,\n      receiverId: selectedChat.otherUserId,\n      content: text,\n      type: 'text',\n    });\n  };""",
                  """  const handleSendMessage = async (text, replyToId = null) => {\n    if (!selectedChatId || !selectedChat) return;\n\n    await sendMessageMutation.mutateAsync({\n      conversationId: selectedChatId,\n      receiverId: selectedChat.otherUserId,\n      content: text,\n      type: 'text',\n      replyToId,\n    });\n  };""")
          replace('src/pages/Chat.jsx',
                  """  const handleMarkAsUnread = (chatId) => {\n    // This would require a backend update to set unread count\n    toast.success('Marked as unread');\n  };""",
                  """  const handleMarkAsUnread = async (chatId) => {\n    try {\n      await markConversationUnread(chatId);\n      queryClient.invalidateQueries({ queryKey: ['conversations'] });\n      toast.success('Marked as unread');\n    } catch (error) {\n      toast.error(error?.message || 'Failed to mark chat as unread');\n    }\n  };""")
          replace('src/pages/Chat.jsx',
                  """  const handleClearChat = async (chatId) => {\n    // This would require deleting all messages in the conversation\n    toast.info('Clear chat feature coming soon');\n  };""",
                  """  const handleClearChat = async (chatId) => {\n    try {\n      await clearConversation(chatId);\n      queryClient.invalidateQueries({ queryKey: ['messages', chatId] });\n      queryClient.invalidateQueries({ queryKey: ['conversations'] });\n      toast.success('Messages cleared');\n    } catch (error) {\n      toast.error(error?.message || 'Failed to clear messages');\n    }\n  };\n\n  const handleForwardMessage = async (message) => {\n    const candidates = conversations.filter((conversation) => conversation.id !== selectedChatId);\n    if (!message?.id || candidates.length === 0) {\n      toast.info('No other chat is available to forward this message to.');\n      return;\n    }\n    const choices = candidates.map((conversation, index) => `${index + 1}. ${conversation.name || 'Conversation'}`).join('\\n');\n    const answer = window.prompt(`Forward to which chat?\\n\\n${choices}\\n\\nEnter a number:`);\n    if (!answer) return;\n    const index = Number(answer) - 1;\n    const target = candidates[index];\n    if (!target) {\n      toast.error('Please choose a valid chat number.');\n      return;\n    }\n    try {\n      await forwardMessage(message.id, target.id, target.otherUserId);\n      queryClient.invalidateQueries({ queryKey: ['conversations'] });\n      toast.success(`Forwarded to ${target.name || 'chat'}`);\n    } catch (error) {\n      toast.error(error?.message || 'Failed to forward message');\n    }\n  };""")
          replace('src/pages/Chat.jsx',
                  """          onDeleteMessage={handleDeleteMessage}\n          onMarkAsUnread={handleMarkAsUnread}""",
                  """          onDeleteMessage={handleDeleteMessage}\n          onForwardMessage={handleForwardMessage}\n          onMarkAsUnread={handleMarkAsUnread}""")

          # Chat window: wire reply/star/reaction/share/copy through existing migrated APIs.
          replace('src/components/chat/ChatWindow.jsx',
                  "import { getPinnedMessages } from '@/lib/chatFeaturesService';",
                  "import { getPinnedMessages, toggleReaction, toggleStarMessage } from '@/lib/chatFeaturesService';")
          replace('src/components/chat/ChatWindow.jsx',
                  """  onEditMessage,\n  onDeleteMessage,\n  isLoading = false""",
                  """  onEditMessage,\n  onDeleteMessage,\n  onForwardMessage,\n  isLoading = false""")
          replace('src/components/chat/ChatWindow.jsx',
                  "  const [showProfile, setShowProfile] = useState(false);\n",
                  "  const [showProfile, setShowProfile] = useState(false);\n  const [replyingTo, setReplyingTo] = useState(null);\n")
          replace('src/components/chat/ChatWindow.jsx',
                  """  const handleSendMessage = (text) => {\n    if (onSendMessage && text.trim()) {\n      onSendMessage(text);\n    }\n  };""",
                  """  const handleSendMessage = (text) => {\n    if (onSendMessage && text.trim()) {\n      onSendMessage(text, replyingTo?.id || null);\n      setReplyingTo(null);\n    }\n  };""")
          replace('src/components/chat/ChatWindow.jsx',
                  """                      onReply={(msg) => {\n                        // TODO: Implement reply functionality\n                        console.log('Reply to:', msg);\n                      }}\n                      onForward={(msg) => {\n                        // TODO: Implement forward functionality\n                        console.log('Forward:', msg);\n                      }}\n                      onStar={(msg, isStarred) => {\n                        // TODO: Implement star functionality\n                        console.log('Star:', msg, isStarred);\n                      }}""",
                  """                      onReply={(msg) => setReplyingTo(msg)}\n                      onForward={(msg) => onForwardMessage?.(msg)}\n                      onStar={async (msg) => {\n                        try {\n                          await toggleStarMessage(msg.id);\n                          queryClient.invalidateQueries({ queryKey: ['messages', chat?.id] });\n                        } catch (error) {\n                          toast.error(error?.message || 'Failed to update starred message');\n                        }\n                      }}""")
          replace('src/components/chat/ChatWindow.jsx',
                  """                      onShare={(msg) => {\n                        // TODO: Implement share functionality\n                        console.log('Share:', msg);\n                      }}\n                      onReact={(msg, emoji) => {\n                        // TODO: Implement reaction functionality\n                        console.log('React:', msg, emoji);\n                      }}\n                      onCopy={(msg) => {\n                        // TODO: Implement copy functionality\n                        console.log('Copy:', msg);\n                      }}""",
                  """                      onShare={async (msg) => {\n                        const content = msg?.text || msg?.content || msg?.fileUrl || '';\n                        if (content) {\n                          await navigator.clipboard.writeText(content);\n                          toast.success('Message copied for sharing');\n                        }\n                      }}\n                      onReact={async (msg, emoji) => {\n                        try {\n                          await toggleReaction(msg.id, emoji);\n                          queryClient.invalidateQueries({ queryKey: ['messages', chat?.id] });\n                        } catch (error) {\n                          toast.error(error?.message || 'Failed to update reaction');\n                        }\n                      }}""")
          replace('src/components/chat/ChatWindow.jsx',
                  """      {/* Chat Input */}\n      <ChatInput""",
                  """      {replyingTo && (\n        <div className=\"border-t border-gray-200 bg-gray-50 px-4 py-2 flex items-center justify-between gap-3\">\n          <div className=\"min-w-0\">\n            <p className=\"text-xs font-semibold text-gray-600\">Replying to {replyingTo.senderName || 'message'}</p>\n            <p className=\"text-sm text-gray-500 truncate\">{replyingTo.text || replyingTo.content || replyingTo.fileName || 'Attachment'}</p>\n          </div>\n          <button type=\"button\" onClick={() => setReplyingTo(null)} className=\"p-1 rounded-full hover:bg-gray-200\" aria-label=\"Cancel reply\">\n            <X className=\"w-4 h-4\" />\n          </button>\n        </div>\n      )}\n\n      {/* Chat Input */}\n      <ChatInput""")

          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit migration fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CoupleActivities.jsx src/pages/CouplesDashboard.jsx src/pages/CooperativeGames.jsx src/pages/PremiumFeatures.jsx src/pages/Invite.jsx src/pages/Chat.jsx src/components/chat/ChatWindow.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Complete remaining migrated feature wiring'
          git push origin HEAD:o2ol-password-reset-preview
