name: O2OL Rebuild Communication Practice

on:
  push:
    branches:
      - o2ol-build-branch-2026-08-18
    paths:
      - .github/workflows/o2ol-rebuild-communication-practice.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-build-branch-2026-08-18
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild Communication Practice
        shell: bash
        run: |
          cat > src/pages/CommunicationPractice.jsx <<'EOF'
          import React, { useState } from "react";
          import { ArrowRight, HeartHandshake, MessageCircle, RefreshCw, ShieldCheck, Sparkles } from "lucide-react";
          import { Button } from "@/components/ui/button";
          import { useLanguage } from "@/Layout";

          const translations = {
            en: {
              title: "Communication Practice", subtitle: "Practice a healthier conversation before you need it in a hard moment.", privacy: "Nothing you say or select on this page is saved or transmitted. Practice together, then close the page when you are done.", disclaimer: "This educational exercise is not therapy, crisis support, medical advice, or legal advice.", choose: "Choose a practice", next: "Next Step", restart: "Start Over", listener: "Listener reminder", speaker: "Speaker reminder",
              practices: [
                ["Soft Start", "Begin a difficult topic without blame.", [["Pause before starting", "Choose one issue, not every issue at once."], ["Describe the situation", "Use what happened, not a character judgment."], ["Name your feeling", "Try: “I feel ___ when ___.”"], ["Make a specific request", "Ask for one realistic action: “Would you be willing to ___?”"]]],
                ["Listen & Reflect", "Slow the conversation down enough to understand before answering.", [["Speaker shares", "Speak for about two minutes without attacking or mind-reading."], ["Listener reflects", "Summarize what you heard before defending your side."], ["Speaker corrects", "Clarify what was missed without escalating."], ["Switch roles", "Repeat the process so both people are heard."]]],
                ["Repair the Moment", "Interrupt escalation and return to the issue with more care.", [["Name the temperature", "Say that the conversation is becoming unproductive."], ["Choose a short pause", "Agree when you will return instead of walking away indefinitely."], ["Regulate first", "Use the pause to settle, not build a stronger argument."], ["Return with one repair", "Try: “I want us to solve this together. Can we restart more gently?”"]]],
                ["Ask for a Need", "Turn a complaint into a clear request your partner can understand.", [["Name the need", "Ask yourself what you are actually needing: reassurance, help, time, affection, clarity, rest, or something else."], ["Remove the accusation", "Replace “you never” with a description of the moment."], ["Make it concrete", "Ask for a behavior that can actually happen."], ["Invite collaboration", "End with room for your partner to respond or suggest another workable option."]]]
              ],
              speakerTip: "Speak from your own experience. Describe feelings and needs without diagnosing your partner’s motives.", listenerTip: "Understanding is not the same as agreeing. Reflect first; respond second."
            },
            es: {
              title: "Práctica de Comunicación", subtitle: "Practiquen una conversación más saludable antes de necesitarla en un momento difícil.", privacy: "Nada de lo que digan o seleccionen en esta página se guarda ni se transmite. Practiquen juntos y cierren la página cuando terminen.", disclaimer: "Este ejercicio educativo no es terapia, apoyo de crisis, consejo médico ni asesoramiento legal.", choose: "Elige una práctica", next: "Siguiente Paso", restart: "Empezar de Nuevo", listener: "Recordatorio para quien escucha", speaker: "Recordatorio para quien habla",
              practices: [
                ["Inicio Suave", "Comiencen un tema difícil sin culpar.", [["Pausa antes de empezar", "Elijan un solo tema, no todos los problemas a la vez."], ["Describe la situación", "Habla de lo que ocurrió, no de un juicio sobre el carácter."], ["Nombra tu emoción", "Prueba: “Me siento ___ cuando ___.”"], ["Haz una petición específica", "Pide una acción realista: “¿Estarías dispuesto/a a ___?”"]]],
                ["Escuchar y Reflejar", "Reduzcan la velocidad de la conversación para comprender antes de responder.", [["Habla una persona", "Comparte durante unos dos minutos sin atacar ni adivinar intenciones."], ["La otra refleja", "Resume lo que escuchaste antes de defender tu punto."], ["La primera aclara", "Corrige lo que faltó sin aumentar el conflicto."], ["Cambien roles", "Repitan para que ambos sean escuchados."]]],
                ["Reparar el Momento", "Detengan la escalada y vuelvan al tema con más cuidado.", [["Nombra la intensidad", "Reconozcan que la conversación está dejando de ser productiva."], ["Elijan una pausa breve", "Acuerden cuándo volverán en vez de alejarse sin plazo."], ["Regúlense primero", "Usen la pausa para calmarse, no para construir un argumento más fuerte."], ["Vuelvan con una reparación", "Prueben: “Quiero que resolvamos esto juntos. ¿Podemos empezar de nuevo con más calma?”"]]],
                ["Pedir una Necesidad", "Transformen una queja en una petición clara que la pareja pueda entender.", [["Nombra la necesidad", "Identifica si necesitas tranquilidad, ayuda, tiempo, afecto, claridad, descanso u otra cosa."], ["Quita la acusación", "Cambia “tú nunca” por una descripción del momento."], ["Hazlo concreto", "Pide una conducta que realmente pueda realizarse."], ["Invita a colaborar", "Deja espacio para que tu pareja responda o proponga otra opción viable."]]]
              ],
              speakerTip: "Habla desde tu propia experiencia. Describe sentimientos y necesidades sin diagnosticar las intenciones de tu pareja.", listenerTip: "Comprender no es lo mismo que estar de acuerdo. Refleja primero; responde después."
            },
            fr: {
              title: "Pratique de Communication", subtitle: "Entraînez-vous à une conversation plus saine avant d’en avoir besoin dans un moment difficile.", privacy: "Rien de ce que vous dites ou sélectionnez sur cette page n’est enregistré ou transmis. Pratiquez ensemble puis fermez la page.", disclaimer: "Cet exercice éducatif ne remplace ni une thérapie, ni un soutien de crise, ni un avis médical ou juridique.", choose: "Choisissez une pratique", next: "Étape Suivante", restart: "Recommencer", listener: "Rappel pour la personne qui écoute", speaker: "Rappel pour la personne qui parle",
              practices: [
                ["Démarrage en Douceur", "Abordez un sujet difficile sans accusation.", [["Faites une pause avant", "Choisissez un seul sujet plutôt que tous les problèmes à la fois."], ["Décrivez la situation", "Parlez de ce qui s’est passé plutôt que de juger le caractère."], ["Nommez votre émotion", "Essayez : « Je me sens ___ quand ___. »"], ["Faites une demande précise", "Demandez une action réaliste : « Serais-tu d’accord pour ___ ? »"]]],
                ["Écouter et Reformuler", "Ralentissez suffisamment pour comprendre avant de répondre.", [["Une personne parle", "Parlez environ deux minutes sans attaquer ni deviner les intentions."], ["L’autre reformule", "Résumez ce que vous avez entendu avant de défendre votre point de vue."], ["La première clarifie", "Corrigez ce qui manque sans faire monter la tension."], ["Inversez les rôles", "Répétez pour que chacun soit entendu."]]],
                ["Réparer le Moment", "Interrompez l’escalade et revenez au sujet avec plus de soin.", [["Nommez la tension", "Reconnaissez que la conversation devient improductive."], ["Choisissez une courte pause", "Décidez quand reprendre plutôt que de partir sans limite."], ["Retrouvez votre calme", "Utilisez la pause pour vous réguler, pas pour renforcer votre argument."], ["Revenez avec une réparation", "Essayez : « Je veux qu’on résolve ça ensemble. Peut-on recommencer plus doucement ? »"]]],
                ["Exprimer un Besoin", "Transformez une plainte en demande claire et compréhensible.", [["Nommez le besoin", "Identifiez si vous avez besoin de réassurance, d’aide, de temps, d’affection, de clarté, de repos ou autre chose."], ["Retirez l’accusation", "Remplacez « tu ne fais jamais » par une description du moment."], ["Soyez concret", "Demandez un comportement réellement possible."], ["Invitez à collaborer", "Laissez à votre partenaire la possibilité de répondre ou de proposer une autre solution viable."]]]
              ],
              speakerTip: "Parlez de votre propre expérience. Décrivez vos émotions et besoins sans diagnostiquer les intentions de votre partenaire.", listenerTip: "Comprendre ne signifie pas être d’accord. Reformulez d’abord ; répondez ensuite."
            },
            it: {
              title: "Pratica di Comunicazione", subtitle: "Allenate una conversazione più sana prima di averne bisogno in un momento difficile.", privacy: "Nulla di ciò che dite o selezionate in questa pagina viene salvato o trasmesso. Esercitatevi insieme e chiudete la pagina quando avete finito.", disclaimer: "Questo esercizio educativo non sostituisce terapia, supporto nelle crisi, consulenza medica o legale.", choose: "Scegli una pratica", next: "Passo Successivo", restart: "Ricomincia", listener: "Promemoria per chi ascolta", speaker: "Promemoria per chi parla",
              practices: [
                ["Inizio Delicato", "Iniziate un tema difficile senza colpevolizzare.", [["Fermatevi prima di iniziare", "Scegliete un solo problema, non tutti insieme."], ["Descrivete la situazione", "Parlate di ciò che è successo, non del carattere della persona."], ["Nominate l’emozione", "Provate: “Mi sento ___ quando ___.”"], ["Fate una richiesta specifica", "Chiedete un’azione realistica: “Saresti disposto/a a ___?”"]]],
                ["Ascoltare e Riflettere", "Rallentate abbastanza da capire prima di rispondere.", [["Una persona parla", "Parla per circa due minuti senza attaccare o attribuire intenzioni."], ["L’altra riflette", "Riassumi ciò che hai sentito prima di difendere il tuo punto."], ["La prima chiarisce", "Correggi ciò che manca senza aumentare la tensione."], ["Invertite i ruoli", "Ripetete affinché entrambi siano ascoltati."]]],
                ["Riparare il Momento", "Interrompete l’escalation e tornate al tema con maggiore cura.", [["Nominate la tensione", "Riconoscete che la conversazione sta diventando improduttiva."], ["Scegliete una breve pausa", "Stabilite quando tornare invece di allontanarvi senza limite."], ["Calmatevi prima", "Usate la pausa per regolarvi, non per costruire un argomento più forte."], ["Tornate con una riparazione", "Provate: “Voglio che risolviamo questo insieme. Possiamo ricominciare con più calma?”"]]],
                ["Chiedere un Bisogno", "Trasformate una lamentela in una richiesta chiara.", [["Nominate il bisogno", "Capite se avete bisogno di rassicurazione, aiuto, tempo, affetto, chiarezza, riposo o altro."], ["Togliete l’accusa", "Sostituite “tu non fai mai” con una descrizione del momento."], ["Siate concreti", "Chiedete un comportamento che possa davvero essere realizzato."], ["Invitate alla collaborazione", "Lasciate spazio al partner per rispondere o proporre un’alternativa praticabile."]]]
              ],
              speakerTip: "Parla dalla tua esperienza. Descrivi sentimenti e bisogni senza diagnosticare le intenzioni del partner.", listenerTip: "Capire non significa essere d’accordo. Rifletti prima; rispondi dopo."
            },
            de: {
              title: "Kommunikationspraxis", subtitle: "Übt ein gesünderes Gespräch, bevor ihr es in einem schwierigen Moment braucht.", privacy: "Nichts, was ihr auf dieser Seite sagt oder auswählt, wird gespeichert oder übertragen. Übt gemeinsam und schließt die Seite danach.", disclaimer: "Diese Übung ist keine Therapie, Krisenhilfe, medizinische oder rechtliche Beratung.", choose: "Übung Wählen", next: "Nächster Schritt", restart: "Neu Starten", listener: "Hinweis für die zuhörende Person", speaker: "Hinweis für die sprechende Person",
              practices: [
                ["Sanfter Einstieg", "Beginnt ein schwieriges Thema ohne Schuldzuweisung.", [["Vorher kurz pausieren", "Wählt ein Thema statt alle Probleme gleichzeitig."], ["Situation beschreiben", "Beschreibt, was passiert ist, statt den Charakter zu beurteilen."], ["Gefühl benennen", "Versucht: „Ich fühle mich ___, wenn ___.“"], ["Konkrete Bitte formulieren", "Bittet um eine realistische Handlung: „Wärst du bereit, ___?“"]]],
                ["Zuhören & Spiegeln", "Verlangsamt das Gespräch, um erst zu verstehen und dann zu antworten.", [["Eine Person spricht", "Sprecht etwa zwei Minuten ohne Angriff oder Gedankenlesen."], ["Die andere spiegelt", "Fasst zusammen, was ihr gehört habt, bevor ihr eure Sicht verteidigt."], ["Die erste Person klärt", "Korrigiert fehlende Punkte ohne Eskalation."], ["Rollen wechseln", "Wiederholt den Ablauf, damit beide gehört werden."]]],
                ["Den Moment Reparieren", "Unterbrecht die Eskalation und kehrt mit mehr Sorgfalt zum Thema zurück.", [["Temperatur benennen", "Sagt, dass das Gespräch unproduktiv wird."], ["Kurze Pause vereinbaren", "Legt fest, wann ihr zurückkehrt, statt unbegrenzt wegzugehen."], ["Erst regulieren", "Nutzt die Pause zum Beruhigen, nicht zum Aufbau eines stärkeren Arguments."], ["Mit Reparatur zurückkehren", "Versucht: „Ich möchte, dass wir das gemeinsam lösen. Können wir ruhiger neu anfangen?“"]]],
                ["Ein Bedürfnis Äußern", "Macht aus einer Beschwerde eine klare Bitte.", [["Bedürfnis benennen", "Klärt, ob ihr Bestätigung, Hilfe, Zeit, Zuneigung, Klarheit, Ruhe oder etwas anderes braucht."], ["Anschuldigung entfernen", "Ersetzt „du machst nie“ durch eine Beschreibung des Moments."], ["Konkret werden", "Bittet um ein Verhalten, das tatsächlich möglich ist."], ["Zusammenarbeit einladen", "Lasst Raum für eine Antwort oder einen anderen praktikablen Vorschlag."]]]
              ],
              speakerTip: "Sprecht aus eurer eigenen Erfahrung. Beschreibt Gefühle und Bedürfnisse, ohne die Motive des Partners zu diagnostizieren.", listenerTip: "Verstehen ist nicht dasselbe wie zustimmen. Erst spiegeln, dann antworten."
            }
          };

          export default function CommunicationPractice() {
            const { currentLanguage } = useLanguage();
            const t = translations[currentLanguage] || translations.en;
            const [practiceIndex, setPracticeIndex] = useState(0);
            const [stepIndex, setStepIndex] = useState(0);
            const practice = t.practices[practiceIndex];
            const step = practice[2][stepIndex];
            const choosePractice = (index) => { setPracticeIndex(index); setStepIndex(0); };
            const nextStep = () => setStepIndex((current) => Math.min(current + 1, practice[2].length - 1));
            const restart = () => setStepIndex(0);

            return <main className="min-h-screen bg-gradient-to-br from-sky-50 via-white to-rose-50 px-4 py-10 md:py-16"><div className="mx-auto max-w-5xl"><header className="mx-auto max-w-3xl text-center"><div className="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-sky-100 text-sky-700"><MessageCircle className="h-8 w-8" aria-hidden="true" /></div><h1 className="mt-5 text-4xl font-bold text-slate-900 md:text-5xl">{t.title}</h1><p className="mt-4 text-lg leading-7 text-slate-600">{t.subtitle}</p><div className="mx-auto mt-4 max-w-2xl rounded-2xl border border-emerald-100 bg-emerald-50 p-4 text-left"><p className="flex gap-2 text-sm leading-6 text-emerald-900"><ShieldCheck className="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true" />{t.privacy}</p></div></header><section className="mt-9"><h2 className="text-center text-sm font-bold uppercase tracking-wide text-slate-500">{t.choose}</h2><div className="mt-4 flex flex-wrap justify-center gap-2">{t.practices.map(([title], index) => <button key={title} type="button" onClick={() => choosePractice(index)} aria-pressed={practiceIndex === index} className={`rounded-full px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 ${practiceIndex === index ? 'bg-sky-600 text-white' : 'border border-slate-200 bg-white text-slate-700'}`}>{title}</button>)}</div></section><section className="mx-auto mt-8 max-w-3xl rounded-3xl border border-slate-200 bg-white p-7 shadow-lg md:p-9"><p className="text-sm font-semibold text-sky-700">{practice[0]}</p><h2 className="mt-2 text-2xl font-bold text-slate-900">{step[0]}</h2><p className="mt-4 text-base leading-7 text-slate-700">{step[1]}</p><div className="mt-7 flex gap-3"><Button type="button" variant="outline" onClick={restart}><RefreshCw className="mr-2 h-4 w-4" aria-hidden="true" />{t.restart}</Button><Button type="button" onClick={nextStep} disabled={stepIndex >= practice[2].length - 1} className="ml-auto bg-sky-600 hover:bg-sky-700">{t.next}<ArrowRight className="ml-2 h-4 w-4" aria-hidden="true" /></Button></div></section><section className="mx-auto mt-6 grid max-w-3xl gap-4 md:grid-cols-2"><div className="rounded-2xl border border-rose-100 bg-rose-50 p-5"><h2 className="flex items-center gap-2 font-bold text-rose-950"><Sparkles className="h-5 w-5" aria-hidden="true" />{t.speaker}</h2><p className="mt-2 text-sm leading-6 text-rose-900/80">{t.speakerTip}</p></div><div className="rounded-2xl border border-indigo-100 bg-indigo-50 p-5"><h2 className="flex items-center gap-2 font-bold text-indigo-950"><HeartHandshake className="h-5 w-5" aria-hidden="true" />{t.listener}</h2><p className="mt-2 text-sm leading-6 text-indigo-900/80">{t.listenerTip}</p></div></section><p className="mx-auto mt-7 max-w-3xl text-center text-xs leading-5 text-slate-500">{t.disclaimer}</p></div></main>;
          }
          EOF
      - name: Verify privacy-first five-language surface
        shell: bash
        run: |
          set -euo pipefail
          for lang in en es fr it de; do grep -q "${lang}:" src/pages/CommunicationPractice.jsx; done
          grep -q 'Nothing you say or select' src/pages/CommunicationPractice.jsx
          if grep -Eq 'supabase|fetch\(|localStorage|sessionStorage|console\.' src/pages/CommunicationPractice.jsx; then exit 1; fi
      - name: Lint
        run: npx eslint src/pages/CommunicationPractice.jsx --rule 'react/prop-types: off'
      - name: Build
        run: npm run build
      - name: Commit verified rebuild and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/o2ol-rebuild-communication-practice.yml
          git config user.name 'O2OL Build Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/CommunicationPractice.jsx .github/workflows/o2ol-rebuild-communication-practice.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild Communication Practice as privacy-first five-language tool'
          git push origin HEAD:o2ol-build-branch-2026-08-18
