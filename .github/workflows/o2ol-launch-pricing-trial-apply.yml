name: O2OL Launch Pricing Trial Apply

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-launch-pricing-trial-apply.yml

permissions:
  contents: write

jobs:
  apply-launch-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0

      - name: Apply locked pricing, trial, and Love Note limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Expected at least {count} occurrence(s) in {path}, found {actual}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Cloudflare preview and production-cutover configs (configuration only; no custom-domain deploy here).
          replace('wrangler.toml',
              'STRIPE_PRICE_PREMIERE = "price_1UFRtxCoKDheG1ASx5KCJPxb"\nSTRIPE_PRICE_EXCLUSIVE = "price_1UFRu3CoKDheG1AS4aE2zahQ"',
              'STRIPE_PRICE_BASIC = "price_1UFUS7CoKDheG1ASULR2gdsn"\nSTRIPE_PRICE_PREMIERE = "price_1UFUSDCoKDheG1AS2AgFooh0"\nSTRIPE_PRICE_EXCLUSIVE = "price_1UFUSKCoKDheG1ASG5zk97Ph"')

          replace('cloudflare/wrangler.production.jsonc',
              '"STRIPE_PRICE_PREMIERE": "price_1UCYBNCoKDheG1ASmUs8STHT",\n    "STRIPE_PRICE_EXCLUSIVE": "price_1UCYBUCoKDheG1ASN0Y58Ye5"',
              '"STRIPE_PRICE_BASIC": "price_1UFUS7CoKDheG1ASULR2gdsn",\n    "STRIPE_PRICE_PREMIERE": "price_1UFUSDCoKDheG1AS2AgFooh0",\n    "STRIPE_PRICE_EXCLUSIVE": "price_1UFUSKCoKDheG1ASG5zk97Ph"')

          # Billing worker: all three plans are paid; Basic is the post-trial default.
          replace('worker/billing.ts',
              "const PAID_PLANS = new Set(['Premiere', 'Exclusive']);",
              "const PAID_PLANS = new Set(['Basis', 'Premiere', 'Exclusive']);")
          replace('worker/billing.ts',
              "function stripePriceForPlan(env, plan) {\n  if (plan === 'Premiere') return env.STRIPE_PRICE_PREMIERE || null;\n  if (plan === 'Exclusive') return env.STRIPE_PRICE_EXCLUSIVE || null;\n  return null;\n}",
              "function stripePriceForPlan(env, plan) {\n  if (plan === 'Basis') return env.STRIPE_PRICE_BASIC || null;\n  if (plan === 'Premiere') return env.STRIPE_PRICE_PREMIERE || null;\n  if (plan === 'Exclusive') return env.STRIPE_PRICE_EXCLUSIVE || null;\n  return null;\n}\nfunction planMonthlyPrice(plan) {\n  if (plan === 'Basis') return 4.99;\n  if (plan === 'Premiere') return 9.99;\n  if (plan === 'Exclusive') return 19.99;\n  return 0;\n}\nfunction planUsage(plan) {\n  if (plan === 'Exclusive') return { smsLoveNotesMonthly: 60, smsLoveNotesDaily: 2, dateIdeasMonthly: null, loveNoteCategories: 29 };\n  if (plan === 'Premiere') return { smsLoveNotesMonthly: 30, smsLoveNotesDaily: 1, dateIdeasMonthly: 8, loveNoteCategories: 18 };\n  return { smsLoveNotesMonthly: 8, smsLoveNotesDaily: null, dateIdeasMonthly: 1, loveNoteCategories: 6 };\n}\nfunction decorateSubscription(user) {\n  const storedPlan = canonicalPlan(user?.subscription_plan) || 'Basis';\n  const effectivePlan = user?.subscription_status === 'trial' ? 'Premiere' : storedPlan;\n  return {\n    ...user,\n    effective_plan: effectivePlan,\n    trial_entitlement: user?.subscription_status === 'trial' ? 'Premiere' : null,\n    usage_limits: planUsage(effectivePlan),\n  };\n}")

          old_update = """async function updateFromSubscription(db, userId, subscription, planOverride = null, priceOverride = null) {
  const plan = canonicalPlan(planOverride || subscription?.metadata?.plan_name);
  const status = normalizedSubscriptionStatus(subscription?.status);
  const period = subscriptionPeriod(subscription);
  const fields = [
    'subscription_status=$1',
    'stripe_subscription_id=$2',
    'subscription_current_period_start=$3',
    'subscription_current_period_end=$4',
    'cancel_at_period_end=$5',
    'updated_at=now()',
  ];
  const values = [status, subscription?.id || null, period.start, period.end, Boolean(subscription?.cancel_at_period_end)];
  if (plan && ALL_PLANS.has(plan)) {
    values.push(plan);
    fields.push(`subscription_plan=$${values.length}`);
  }
  if (Number.isFinite(Number(priceOverride)) && Number(priceOverride) >= 0) {
    values.push(Number(priceOverride));
    fields.push(`subscription_price=$${values.length}`);
  }
  values.push(userId);
  await db.query(`UPDATE public.users SET ${fields.join(',')} WHERE id=$${values.length}::uuid`, values);
}"""
          new_update = """async function updateFromSubscription(db, userId, subscription, planOverride = null, priceOverride = null) {
  const plan = canonicalPlan(planOverride || subscription?.metadata?.plan_name);
  const status = normalizedSubscriptionStatus(subscription?.status);
  const period = subscriptionPeriod(subscription);
  const trialEnd = safeUnixDate(subscription?.trial_end);
  const itemPriceCents = Number(subscription?.items?.data?.[0]?.price?.unit_amount);
  const derivedPrice = Number.isFinite(Number(priceOverride))
    ? Number(priceOverride)
    : Number.isFinite(itemPriceCents)
      ? itemPriceCents / 100
      : planMonthlyPrice(plan);
  const fields = [
    'subscription_status=$1',
    'stripe_subscription_id=$2',
    'subscription_current_period_start=$3',
    'subscription_current_period_end=$4',
    'cancel_at_period_end=$5',
    'trial_end_date=$6',
    'updated_at=now()',
  ];
  const values = [status, subscription?.id || null, period.start, period.end, Boolean(subscription?.cancel_at_period_end), trialEnd];
  if (plan && ALL_PLANS.has(plan)) {
    values.push(plan);
    fields.push(`subscription_plan=$${values.length}`);
  }
  if (Number.isFinite(derivedPrice) && derivedPrice >= 0) {
    values.push(derivedPrice);
    fields.push(`subscription_price=$${values.length}`);
  }
  values.push(userId);
  await db.query(`UPDATE public.users SET ${fields.join(',')} WHERE id=$${values.length}::uuid`, values);
}"""
          replace('worker/billing.ts', old_update, new_update)

          old_checkout = """async function checkout(db, env, request, auth, input) {
  const plan = canonicalPlan(input?.planName || input?.plan_name || input?.plan);
  if (!PAID_PLANS.has(plan)) return fail('Choose Premiere or Exclusive for paid checkout.');
  const priceId = stripePriceForPlan(env, plan);
  if (!priceId) return fail(`Stripe price is not configured for ${plan}.`, 503, 'billing_not_configured');

  const billingUser = await getBillingUser(db, auth.user.id);
  if (billingUser.stripe_subscription_id && ['active', 'trial'].includes(billingUser.subscription_status)) {
    return fail('An active paid subscription already exists. Manage that subscription before starting another checkout.', 409, 'subscription_exists');
  }
  const customerId = await getOrCreateCustomer(db, env, auth, billingUser);
  const origin = new URL(request.url).origin;
  const params = new URLSearchParams();
  params.set('customer', customerId);
  params.set('mode', 'subscription');
  params.set('payment_method_types[0]', 'card');
  params.set('line_items[0][price]', priceId);
  params.set('line_items[0][quantity]', '1');
  params.set('success_url', `${origin}/payment-success?session_id={CHECKOUT_SESSION_ID}`);
  params.set('cancel_url', `${origin}/subscription?canceled=true`);
  params.set('client_reference_id', auth.user.id);
  params.set('metadata[user_id]', auth.user.id);
  params.set('metadata[plan_name]', plan);
  params.set('subscription_data[metadata][user_id]', auth.user.id);
  params.set('subscription_data[metadata][plan_name]', plan);
  const checkoutSession = await stripeRequest(env, 'POST', '/checkout/sessions', params);
  return json({ ok: true, sessionId: checkoutSession.id, url: checkoutSession.url, plan });
}"""
          new_checkout = """async function checkout(db, env, request, auth, input) {
  const startTrial = Boolean(input?.startTrial || input?.start_trial);
  const requestedPlan = canonicalPlan(input?.planName || input?.plan_name || input?.plan);
  const plan = startTrial ? 'Basis' : requestedPlan;
  if (!PAID_PLANS.has(plan)) return fail('Choose Basic, Premier, or Exclusive for paid checkout.');
  const priceId = stripePriceForPlan(env, plan);
  if (!priceId) return fail(`Stripe price is not configured for ${plan}.`, 503, 'billing_not_configured');

  const billingUser = await getBillingUser(db, auth.user.id);
  if (billingUser.stripe_subscription_id && ['active', 'trial'].includes(billingUser.subscription_status)) {
    return fail('An active subscription already exists. Manage that subscription before starting another checkout.', 409, 'subscription_exists');
  }
  const customerId = await getOrCreateCustomer(db, env, auth, billingUser);
  const origin = new URL(request.url).origin;
  const params = new URLSearchParams();
  params.set('customer', customerId);
  params.set('mode', 'subscription');
  params.set('payment_method_types[0]', 'card');
  params.set('payment_method_collection', 'always');
  params.set('line_items[0][price]', priceId);
  params.set('line_items[0][quantity]', '1');
  params.set('success_url', `${origin}/payment-success?session_id={CHECKOUT_SESSION_ID}`);
  params.set('cancel_url', `${origin}/subscription?canceled=true`);
  params.set('client_reference_id', auth.user.id);
  params.set('metadata[user_id]', auth.user.id);
  params.set('metadata[plan_name]', plan);
  params.set('subscription_data[metadata][user_id]', auth.user.id);
  params.set('subscription_data[metadata][plan_name]', plan);
  if (startTrial) {
    params.set('subscription_data[trial_period_days]', '7');
    params.set('metadata[trial_entitlement]', 'Premiere');
    params.set('subscription_data[metadata][trial_entitlement]', 'Premiere');
  }
  const checkoutSession = await stripeRequest(env, 'POST', '/checkout/sessions', params);
  return json({ ok: true, sessionId: checkoutSession.id, url: checkoutSession.url, plan, trial: startTrial });
}"""
          replace('worker/billing.ts', old_checkout, new_checkout)

          # Disable legacy free-Basic mutation now that Basic is paid.
          import re
          p = Path('worker/billing.ts')
          text = p.read_text()
          pattern = re.compile(r"async function switchToBasis\(db, userId\) \{.*?\n\}\nasync function cancelSubscription", re.S)
          if not pattern.search(text):
              raise SystemExit('Could not locate switchToBasis block')
          text = pattern.sub("async function switchToBasis() {\n  return fail('Basic is now a paid plan. Use subscription checkout.', 410, 'paid_plan_required');\n}\nasync function cancelSubscription", text, count=1)
          p.write_text(text)

          replace('worker/billing.ts',
              "await updateFromSubscription(db, userId, subscription, plan, Number(object.amount_total || 0) / 100);",
              "await updateFromSubscription(db, userId, subscription, plan, planMonthlyPrice(plan));")
          replace('worker/billing.ts',
              "subscription_plan='Basis',subscription_price=0,subscription_status='cancelled'",
              "subscription_plan='Basis',subscription_price=4.99,subscription_status='cancelled'")
          replace('worker/billing.ts',
              "return json({ ok: true, subscription: await getBillingUser(db, auth.user.id) });",
              "return json({ ok: true, subscription: decorateSubscription(await getBillingUser(db, auth.user.id)) });",
              1)
          replace('worker/billing.ts',
              "if (url.pathname === '/api/billing/basis' && request.method === 'POST') {\n        return switchToBasis(db, auth.user.id);\n      }\n      if (url.pathname === '/api/billing/checkout' && request.method === 'POST') {",
              "if (url.pathname === '/api/billing/basis' && request.method === 'POST') {\n        return switchToBasis();\n      }\n      if (url.pathname === '/api/billing/trial' && request.method === 'POST') {\n        return checkout(db, env, request, auth, { planName: 'Basis', startTrial: true });\n      }\n      if (url.pathname === '/api/billing/checkout' && request.method === 'POST') {")
          replace('worker/billing.ts',
              "paid_checkout_ready: Boolean(env.STRIPE_SECRET_KEY && env.STRIPE_PRICE_PREMIERE && env.STRIPE_PRICE_EXCLUSIVE)",
              "paid_checkout_ready: Boolean(env.STRIPE_SECRET_KEY && env.STRIPE_PRICE_BASIC && env.STRIPE_PRICE_PREMIERE && env.STRIPE_PRICE_EXCLUSIVE)")

          # Frontend billing service: no free Basic; add 7-day Premier trial checkout.
          replace('src/lib/stripeService.js',
              "export const redirectToCheckout = async (sessionIdOrUrl) => {",
              "export const startPremierTrial = async () => {\n  try {\n    const payload = await apiRequest('/api/billing/trial', { method: 'POST', body: {} });\n    if (!payload?.url) throw new Error('No checkout URL received.');\n    window.location.href = payload.url;\n    return { success: true };\n  } catch (error) {\n    return { success: false, error: error?.message || 'Failed to start Premier trial' };\n  }\n};\n\nexport const redirectToCheckout = async (sessionIdOrUrl) => {")
          replace('src/lib/stripeService.js',
              "    const planName = plan?.name === 'Basic' ? 'Basis' : plan?.name;\n    if (Number(plan?.price || 0) === 0 || planName === 'Basis') {\n      await apiRequest('/api/billing/basis', { method: 'POST', body: {} });\n      return { success: true };\n    }\n    const result = await createCheckoutSession(plan?.priceId, planName, plan?.price);",
              "    const planName = plan?.name === 'Basic' ? 'Basis' : plan?.name;\n    const result = await createCheckoutSession(plan?.priceId, planName, plan?.price);")
          replace('src/lib/stripeService.js',
              "  const rawPlan = user.subscription_plan === 'Basic' ? 'Basis' : user.subscription_plan;\n  if (user.subscription_status && !['active', 'trial'].includes(user.subscription_status)) {\n    return rawPlan === 'Basis' && featureAccess.Basis.includes(feature);\n  }\n  return featureAccess[rawPlan]?.includes(feature) || false;",
              "  const storedPlan = user.subscription_plan === 'Basic' ? 'Basis' : user.subscription_plan;\n  if (user.subscription_status && !['active', 'trial'].includes(user.subscription_status)) return false;\n  const effectivePlan = user.subscription_status === 'trial' ? 'Premiere' : storedPlan;\n  return featureAccess[effectivePlan]?.includes(feature) || false;")

          # Subscription page: launch prices are visible and checkout-enabled; trial CTA is explicit.
          replace('src/pages/Subscription.jsx',
              "import { getUserSubscription, getPaymentHistory } from '@/lib/stripeService';",
              "import { getUserSubscription, getPaymentHistory, startPremierTrial } from '@/lib/stripeService';")
          marker = "};\n\nconst tierBase = {"
          trial_copy = """};

const TRIAL_COPY = {
  en: { title: '7 Days of Premier Free', body: 'Add a credit or debit card to start. You will not be charged today. After 7 days, your membership continues on Basic at $4.99/month unless you choose Premier, Exclusive, or cancel.', start: 'Start 7-Day Premier Trial', starting: 'Opening secure checkout...', active: 'Your Premier trial is active.' },
  es: { title: '7 Días de Premier Gratis', body: 'Agrega una tarjeta de crédito o débito para comenzar. No se te cobrará hoy. Después de 7 días, tu membresía continúa en Básico por $4.99/mes a menos que elijas Premier, Exclusive o canceles.', start: 'Comenzar Prueba Premier de 7 Días', starting: 'Abriendo pago seguro...', active: 'Tu prueba Premier está activa.' },
  fr: { title: '7 Jours de Premier Gratuits', body: 'Ajoutez une carte de crédit ou de débit pour commencer. Aucun prélèvement aujourd’hui. Après 7 jours, votre abonnement continue en Basic à 4,99 $/mois sauf si vous choisissez Premier, Exclusive ou annulez.', start: 'Commencer l’Essai Premier de 7 Jours', starting: 'Ouverture du paiement sécurisé...', active: 'Votre essai Premier est actif.' },
  it: { title: '7 Giorni di Premier Gratis', body: 'Aggiungi una carta di credito o debito per iniziare. Oggi non verrà addebitato nulla. Dopo 7 giorni, l’abbonamento continua con Basic a $4,99/mese salvo scelta di Premier, Exclusive o annullamento.', start: 'Inizia la Prova Premier di 7 Giorni', starting: 'Apertura del pagamento sicuro...', active: 'La tua prova Premier è attiva.' },
  de: { title: '7 Tage Premier Kostenlos', body: 'Fügen Sie zum Start eine Kredit- oder Debitkarte hinzu. Heute erfolgt keine Belastung. Nach 7 Tagen läuft Ihre Mitgliedschaft mit Basic für 4,99 $/Monat weiter, sofern Sie nicht Premier, Exclusive wählen oder kündigen.', start: '7-Tage-Premier-Test Starten', starting: 'Sicherer Checkout wird geöffnet...', active: 'Ihr Premier-Test ist aktiv.' },
  nl: { title: '7 Dagen Premier Gratis', body: 'Voeg een creditcard of betaalpas toe om te starten. Vandaag wordt niets afgeschreven. Na 7 dagen gaat je lidmaatschap verder met Basic voor $4,99/maand, tenzij je Premier, Exclusive kiest of opzegt.', start: 'Start 7-Daagse Premier Proefperiode', starting: 'Beveiligde checkout openen...', active: 'Je Premier-proefperiode is actief.' },
  pt: { title: '7 Dias de Premier Grátis', body: 'Adicione um cartão de crédito ou débito para começar. Nada será cobrado hoje. Após 7 dias, sua assinatura continua no Basic por US$ 4,99/mês, a menos que escolha Premier, Exclusive ou cancele.', start: 'Iniciar Teste Premier de 7 Dias', starting: 'Abrindo checkout seguro...', active: 'Seu teste Premier está ativo.' },
};

const tierBase = {"""
          replace('src/pages/Subscription.jsx', marker, trial_copy)
          replace('src/pages/Subscription.jsx',
              "const tierBase = {\n  Basic: { name: 'Basic', price: null, icon: '💝', gradient: 'from-blue-400 to-blue-600', popular: false, isFree: false, checkoutDisabled: true },\n  Premiere: { name: 'Premiere', price: null, icon: '💖', gradient: 'from-purple-400 to-pink-500', popular: true, priceId: import.meta.env.VITE_STRIPE_PRICE_PREMIERE || 'price_premiere', checkoutDisabled: true },\n  Exclusive: { name: 'Exclusive', price: null, icon: '👑', gradient: 'from-yellow-400 to-orange-500', popular: false, priceId: import.meta.env.VITE_STRIPE_PRICE_EXCLUSIVE || 'price_exclusive', checkoutDisabled: true }\n};",
              "const tierBase = {\n  Basic: { name: 'Basic', price: 4.99, icon: '💝', gradient: 'from-blue-400 to-blue-600', popular: false, isFree: false, priceId: import.meta.env.VITE_STRIPE_PRICE_BASIC || 'price_1UFUS7CoKDheG1ASULR2gdsn', checkoutDisabled: false },\n  Premiere: { name: 'Premiere', price: 9.99, icon: '💖', gradient: 'from-purple-400 to-pink-500', popular: true, priceId: import.meta.env.VITE_STRIPE_PRICE_PREMIERE || 'price_1UFUSDCoKDheG1AS2AgFooh0', checkoutDisabled: false },\n  Exclusive: { name: 'Exclusive', price: 19.99, icon: '👑', gradient: 'from-yellow-400 to-orange-500', popular: false, priceId: import.meta.env.VITE_STRIPE_PRICE_EXCLUSIVE || 'price_1UFUSKCoKDheG1ASG5zk97Ph', checkoutDisabled: false }\n};")
          replace('src/pages/Subscription.jsx',
              "  const t = { ...baseTranslation, ...planTranslation, plans: planTranslation.plans };\n  const [currentSubscription, setCurrentSubscription] = useState(null);\n  const [paymentHistory, setPaymentHistory] = useState([]);",
              "  const t = { ...baseTranslation, ...planTranslation, plans: planTranslation.plans };\n  const trialCopy = TRIAL_COPY[currentLanguage] || TRIAL_COPY.en;\n  const [currentSubscription, setCurrentSubscription] = useState(null);\n  const [paymentHistory, setPaymentHistory] = useState([]);\n  const [trialLoading, setTrialLoading] = useState(false);")
          replace('src/pages/Subscription.jsx',
              "  const currentPlanRaw = user?.subscription_plan || 'Basic';\n  const currentPlan = currentPlanRaw === 'Basis' ? 'Basic' : currentPlanRaw;",
              "  const currentPlanRaw = currentSubscription?.effective_plan || user?.subscription_plan || 'Basic';\n  const currentPlan = currentPlanRaw === 'Basis' ? 'Basic' : currentPlanRaw;")
          replace('src/pages/Subscription.jsx',
              "  const statusLabel = (status) => t.statuses[status] || status;\n\n  return (",
              "  const statusLabel = (status) => t.statuses[status] || status;\n  const needsBillingSetup = Boolean(user && currentSubscription && !currentSubscription.stripe_subscription_id);\n  const trialActive = currentSubscription?.subscription_status === 'trial';\n\n  const handleStartTrial = async () => {\n    setTrialLoading(true);\n    const result = await startPremierTrial();\n    if (!result.success) {\n      toast.error(result.error || 'Unable to start the Premier trial.');\n      setTrialLoading(false);\n    }\n  };\n\n  return (")
          replace('src/pages/Subscription.jsx',
              "        {currentSubscription && currentSubscription.subscription_status === 'active' && currentPlan !== 'Basic' && (",
              "        {(needsBillingSetup || trialActive) && (\n          <Card className=\"mb-8 border-2 border-pink-300 bg-gradient-to-r from-pink-50 to-purple-50\">\n            <CardContent className=\"p-6 md:p-8\">\n              <div className=\"flex flex-col md:flex-row md:items-center md:justify-between gap-5\">\n                <div>\n                  <h2 className=\"text-2xl font-black text-gray-900 mb-2\">{trialCopy.title}</h2>\n                  <p className=\"text-gray-700 max-w-3xl\">{trialActive ? trialCopy.active : trialCopy.body}</p>\n                </div>\n                {needsBillingSetup && (\n                  <Button onClick={handleStartTrial} disabled={trialLoading} className=\"bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold px-7 py-6 whitespace-nowrap\">\n                    {trialLoading ? trialCopy.starting : trialCopy.start}\n                  </Button>\n                )}\n              </div>\n            </CardContent>\n          </Card>\n        )}\n\n        {currentSubscription && ['active', 'trial'].includes(currentSubscription.subscription_status) && currentPlan !== 'Basic' && (")

          # Signup messaging and first-login routing into billing setup.
          replace('src/pages/SignIn.jsx',
              "        window.location.replace(createPageUrl(\"Profile\"));",
              "        const needsBillingSetup = !result?.user?.stripe_subscription_id || !['active', 'trial'].includes(result?.user?.subscription_status);\n        window.location.replace(createPageUrl(needsBillingSetup ? \"Subscription\" : \"Profile\"));")

          replacements = {
            'Your account will not be approved for access until the email address is verified.': 'After verification, sign in to add a credit or debit card and activate your 7-day Premier trial. You will not be charged today.',
            'Tu cuenta no será aprobada para el acceso hasta que se verifique el correo electrónico.': 'Después de verificar tu correo, inicia sesión para agregar una tarjeta de crédito o débito y activar tu prueba Premier de 7 días. No se te cobrará hoy.',
            'Votre compte ne sera pas approuvé pour l’accès tant que l’adresse e-mail n’aura pas été vérifiée.': 'Après vérification, connectez-vous pour ajouter une carte de crédit ou de débit et activer votre essai Premier de 7 jours. Aucun prélèvement aujourd’hui.',
            'Il tuo account non sarà approvato per l’accesso finché l’indirizzo e-mail non sarà verificato.': 'Dopo la verifica, accedi per aggiungere una carta di credito o debito e attivare la prova Premier di 7 giorni. Oggi non verrà addebitato nulla.',
            'Ihr Konto wird erst für den Zugriff freigegeben, nachdem die E-Mail-Adresse bestätigt wurde.': 'Nach der Bestätigung melden Sie sich an, um eine Kredit- oder Debitkarte hinzuzufügen und den 7-tägigen Premier-Test zu aktivieren. Heute erfolgt keine Belastung.'
          }
          for old, new in replacements.items():
              replace('src/components/signup/LaunchRegularUserForm.jsx', old, new)

          # Marketing feature copy: SMS limits and 8 Premier date ideas.
          copy_replacements = {
            '8 Love Notes per month': '8 SMS Love Notes per month',
            '16 Love Notes per month': '30 SMS Love Notes per month — up to 1 per day',
            '4 Date Ideas per month': '8 Date Ideas per month',
            'Unlimited Love Notes': '60 SMS Love Notes per month — up to 2 per day',
            '8 Notas de Amor al mes': '8 Notas de Amor por SMS al mes',
            '16 Notas de Amor al mes': '30 Notas de Amor por SMS al mes — hasta 1 por día',
            '4 Ideas de Cita al mes': '8 Ideas de Cita al mes',
            'Notas de Amor ilimitadas': '60 Notas de Amor por SMS al mes — hasta 2 por día',
            '8 Notes d’Amour par mois': '8 Notes d’Amour par SMS par mois',
            '16 Notes d’Amour par mois': '30 Notes d’Amour par SMS par mois — jusqu’à 1 par jour',
            '4 Idées de Rendez-vous par mois': '8 Idées de Rendez-vous par mois',
            'Notes d’Amour illimitées': '60 Notes d’Amour par SMS par mois — jusqu’à 2 par jour',
