name: O2OL Profile Operational Pass

on:
  push:
    branches:
      - o2ol/launch-hardening-20260906
    paths:
      - .github/workflows/o2ol-profile-operational-pass.yml

permissions:
  contents: write

jobs:
  profile-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: o2ol/launch-hardening-20260906

      - name: Stop profile refresh loop
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Profile.jsx')
          text = path.read_text()
          old = "  }, [user?.id, queryClient, refreshUserProfile]);"
          new = "  }, [user?.id, queryClient]);"
          if old not in text:
              raise SystemExit('Expected Profile refresh dependency block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build operational preview
        env:
          VITE_NEON_AUTH_URL: https://ep-snowy-field-arynp1lg.neonauth.c-4.us-west-2.aws.neon.tech/one2onelove/auth
          VITE_NEON_DATA_API_URL: https://ep-snowy-field-arynp1lg.apirest.c-4.us-west-2.aws.neon.tech/one2onelove/rest/v1
        run: npm run build

      - name: Deploy operational preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc

      - name: Commit profile operational fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Profile.jsx
          git commit -m "Stabilize profile refresh on Neon"
          git push origin HEAD:o2ol/launch-hardening-20260906
