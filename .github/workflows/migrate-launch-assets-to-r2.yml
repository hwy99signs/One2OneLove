name: One2OneLove Launch Assets to Cloudflare R2

on:
  push:
    branches:
      - migration/cloudflare-launch-20260911
    paths:
      - ".github/workflows/migrate-launch-assets-to-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-assets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: one2onelove-media-migration
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Download exact approved launch assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/19ffc2fa2_ONE2ONELOVELOGO.png" \
            --output /tmp/one2onelove-logo.png
          curl --fail --location --silent --show-error \
            "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/691277042e7df273d4135492/bd7450758_-appbackgroundphoto.png" \
            --output /tmp/one2onelove-hero.png
          test -s /tmp/one2onelove-logo.png
          test -s /tmp/one2onelove-hero.png
          sha256sum /tmp/one2onelove-logo.png | tee /tmp/logo-source.sha256
          sha256sum /tmp/one2onelove-hero.png | tee /tmp/hero-source.sha256

      - name: Upload approved launch assets to R2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest r2 object put \
            "$BUCKET/brand/one2onelove-logo.png" \
            --file=/tmp/one2onelove-logo.png \
            --content-type=image/png \
            --remote
          npx --yes wrangler@latest r2 object put \
            "$BUCKET/brand/one2onelove-home-hero.png" \
            --file=/tmp/one2onelove-hero.png \
            --content-type=image/png \
            --remote

      - name: Verify byte-for-byte R2 copies
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest r2 object get "$BUCKET/brand/one2onelove-logo.png" --file=/tmp/logo-r2.png --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/brand/one2onelove-home-hero.png" --file=/tmp/hero-r2.png --remote
          test "$(cut -d' ' -f1 /tmp/logo-source.sha256)" = "$(sha256sum /tmp/logo-r2.png | cut -d' ' -f1)"
          test "$(cut -d' ' -f1 /tmp/hero-source.sha256)" = "$(sha256sum /tmp/hero-r2.png | cut -d' ' -f1)"
          echo "Approved launch logo and hero background copied byte-for-byte to Cloudflare R2."
