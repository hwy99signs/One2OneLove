name: O2OL Consolidation Live Check

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-consolidation-live-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0
      - name: Check live consolidated routes
        shell: bash
        run: |
          set -u
          rm -rf tools/prelaunch-live-check
          mkdir -p tools/prelaunch-live-check
          base=https://one2onelove-prelaunch.hwy99signs.workers.dev
          for path in / /Games /Games/ /Games/index.html /Games/assets/index-ulfuWNhj.js; do
            safe=$(printf '%s' "$path" | sed 's#^/##; s#[/]#_#g; s#^$#root#')
            curl -sS -L --connect-timeout 10 --max-time 20 -D "tools/prelaunch-live-check/$safe.headers" -o "tools/prelaunch-live-check/$safe.body" -w '%{http_code}\n%{url_effective}\n%{content_type}\n' "$base$path" > "tools/prelaunch-live-check/$safe.meta" || true
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("tools/prelaunch-live-check")
          out={}
          for meta in root.glob("*.meta"):
              vals=meta.read_text(errors="ignore").splitlines()
              body=(root/(meta.stem+".body")).read_text(errors="ignore")
              out[meta.stem]={
                  "status": vals[0] if vals else "",
                  "effective_url": vals[1] if len(vals)>1 else "",
                  "content_type": vals[2] if len(vals)>2 else "",
                  "has_game_marker": "What Should They Do" in body,
                  "has_games_asset_ref": "/Games/assets/" in body,
                  "has_relationship_games": "Relationship Games" in body,
                  "body_head": body[:500]
              }
          (root/"summary.json").write_text(json.dumps(out,indent=2))
          PY
      - name: Commit live check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prelaunch-live-check
          git commit -m "Capture O2OL consolidation live check" || exit 0
          git push origin HEAD:o2ol-password-reset-preview
