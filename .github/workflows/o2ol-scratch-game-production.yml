name: O2OL Scratch Game Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2ol-scratch-game-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_URL: https://play.one2onelove.com
    defaults:
      run:
        working-directory: scratch-game
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Verify player bundle, password rule, and solo mode
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "const questionBank" public worker 2>/dev/null
          grep -Fq 'data-players="1"' public/index.html
          grep -Fq 'Self Evaluation' public/index.html
          grep -Fq 'maxlength="12"' public/auth-gate.js
      - name: Dry run production custom domain
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.production.toml
      - name: Deploy production custom domain
        run: npx --yes wrangler@latest deploy --config wrangler.production.toml
      - name: Verify production database, auth gate, analytics, and all 12 categories
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/live-health.json -w '%{http_code}' "$LIVE_URL/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .questionCount == 4800 and .accountGate == "required" and .analytics == "enabled"' /tmp/live-health.json >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          cat /tmp/live-health.json
          jq -e '.ok == true and .questionCount == 4800 and .accountGate == "required" and .analytics == "enabled"' /tmp/live-health.json >/dev/null

          unauth_code=$(curl -sS --max-time 20 -o /tmp/unauth.json -w '%{http_code}'             -X POST "$LIVE_URL/api/draw-question"             -H 'content-type: application/json'             --data '{"relationship":"Married","category":"Communication","exclude":[],"avoidId":null}')
          test "$unauth_code" = "401"

          stamp=$(date +%s)-$RANDOM
          test_email="launch-check-$stamp@example.invalid"
          test_user="launchcheck$RANDOM"
          test_pass="Live9!Pass12"
          signup_payload=$(jq -nc --arg username "$test_user" --arg email "$test_email" --arg password "$test_pass"             '{username:$username,email:$email,password:$password,marketingOptIn:false,acceptTerms:true}')
          signup_code=$(curl -sS --max-time 45 -c /tmp/o2ol-cookie.txt -o /tmp/signup.json -w '%{http_code}'             -X POST "$LIVE_URL/api/auth/signup"             -H 'content-type: application/json'             --data "$signup_payload")
          cat /tmp/signup.json
          test "$signup_code" = "201"
          jq -e '.ok == true and .user.email' /tmp/signup.json >/dev/null

          me_code=$(curl -sS --max-time 20 -b /tmp/o2ol-cookie.txt -o /tmp/me.json -w '%{http_code}' "$LIVE_URL/api/auth/me")
          test "$me_code" = "200"
          jq -e '.authenticated == true and .user.email' /tmp/me.json >/dev/null

          logout_before_login=$(curl -sS --max-time 20 -b /tmp/o2ol-cookie.txt -o /tmp/logout-before-login.json -w '%{http_code}' -X POST "$LIVE_URL/api/auth/logout")
          test "$logout_before_login" = "200"

          login_payload=$(jq -nc --arg email "$test_email" --arg password "$test_pass" '{email:$email,password:$password}')
          login_code=$(curl -sS --max-time 45 -c /tmp/o2ol-cookie.txt -o /tmp/login.json -w '%{http_code}' -X POST "$LIVE_URL/api/auth/login" -H 'content-type: application/json' --data "$login_payload")
          cat /tmp/login.json
          test "$login_code" = "200"
          jq -e '.ok == true and .user.email' /tmp/login.json >/dev/null

          categories=(
            "Communication"
            "Trust"
            "Fun"
            "Intimacy"
            "Money"
            "Future"
            "Conflict"
            "Deep Questions"
            "Digital Communication"
            "Electronic Devices"
            "Social Media"
            "AI Bot Relationships"
          )

          for category in "${categories[@]}"; do
            payload=$(jq -nc --arg relationship "Married" --arg category "$category"               '{relationship:$relationship,category:$category,exclude:[],avoidId:null}')
            code=$(curl -sS --max-time 30 -b /tmp/o2ol-cookie.txt -o /tmp/live-card.json -w '%{http_code}'               -X POST "$LIVE_URL/api/draw-question"               -H 'content-type: application/json'               --data "$payload")
            cat /tmp/live-card.json
            test "$code" = "200"
            jq -e --arg category "$category" '.card.id and .card.question and .card.category == $category' /tmp/live-card.json >/dev/null
          done

          analytics_payload=$(jq -nc '{eventType:"game_started",gameSessionId:"launch-check",playerCount:1,relationship:"Married",category:"Digital Communication"}')
          analytics_code=$(curl -sS --max-time 20 -b /tmp/o2ol-cookie.txt -o /tmp/analytics.json -w '%{http_code}'             -X POST "$LIVE_URL/api/analytics/event"             -H 'content-type: application/json'             --data "$analytics_payload")
          test "$analytics_code" = "200"
          jq -e '.ok == true' /tmp/analytics.json >/dev/null

          logout_code=$(curl -sS --max-time 20 -b /tmp/o2ol-cookie.txt -o /tmp/logout.json -w '%{http_code}'             -X POST "$LIVE_URL/api/auth/logout")
          test "$logout_code" = "200"
