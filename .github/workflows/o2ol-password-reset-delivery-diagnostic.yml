name: O2OL Password Reset Delivery Diagnostic

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-password-reset-delivery-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://one2onelove-launch.hwy99signs.workers.dev
    steps:
      - name: Request reset for existing test-only account
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/reset.json -w '%{http_code}' \
            -X POST "$PREVIEW_URL/api/auth/request-password-reset" \
            -H 'content-type: application/json' \
            -H "origin: $PREVIEW_URL" \
            --data '{"email":"newtestjumat4@gmail.com","redirectTo":"https://one2onelove-launch.hwy99signs.workers.dev/ForgotPassword"}')
          echo "RESET_HTTP_CODE=$code"
          if [[ "$code" != 2* ]]; then
            cat /tmp/reset.json
            exit 1
          fi
          echo "RESET_PROVIDER_ACCEPTED=yes"
