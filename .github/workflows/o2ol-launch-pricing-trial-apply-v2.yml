name: O2OL Launch Pricing Trial Apply V2

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - .github/workflows/o2ol-launch-pricing-trial-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview
          fetch-depth: 0
      - name: Apply launch pricing patch
        run: python .github/scripts/apply_o2ol_launch_pricing.py
      - name: Validate diff
        run: git diff --check && git diff --stat
      - name: Commit preview implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/billing.ts wrangler.toml cloudflare/wrangler.production.jsonc src/lib/stripeService.js src/pages/Subscription.jsx src/pages/SignIn.jsx src/data/subscriptionPlanCopy.js
          git commit -m "Implement locked launch pricing and Premier trial"
          git push origin HEAD:o2ol-password-reset-preview
