name: O2OL Migrated Games Smoke

on:
  push:
    branches:
      - o2ol-password-reset-preview
    paths:
      - ".github/workflows/o2ol-migrated-games-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://one2onelove-prelaunch.hwy99signs.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o2ol-password-reset-preview

      - name: Confirm recovered question bank
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('src/data/whatShouldTheyDoQuestions.json','utf8'));
          if(q.length!==150) throw new Error('Expected 150 recovered questions, found '+q.length);
          const counts={};
          for(const row of q) counts[row[0]]=(counts[row[0]]||0)+1;
          if(Object.keys(counts).length!==10) throw new Error('Expected 10 categories');
          if(Object.values(counts).some(n=>n!==15)) throw new Error('Expected 15 questions in every category: '+JSON.stringify(counts));
          console.log(JSON.stringify({questions:q.length,categories:counts},null,2));
          NODE

      - name: Install focused browser runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Verify migrated game live
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const BASE=process.env.PREVIEW_URL.replace(/\/$/,'');
          function assert(ok,msg){ if(!ok) throw new Error(msg); }

          async function installMember(context, plan='Exclusive'){
            const user={
              id:'game-smoke-user',email:'game-smoke@example.invalid',emailVerified:true,email_verified:true,name:'Game Smoke',role:'user',
              subscription_plan:plan,subscription_status:'active',subscription_price:19.99,
              stripe_customer_id:'cus_game_smoke',stripe_subscription_id:'sub_game_smoke',
              phone_number_verified:true,phoneNumberVerified:true,phone_verification_required:true,preferred_language:'en'
            };
            const profile={...user};
            await context.route('**/api/auth/get-session', r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({user,session:{id:'game-smoke-session',userId:user.id}})}));
            await context.route('**/api/profile', async r=>{
              if(r.request().method()==='GET') return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profile})});
              return r.fulfill({status:403,contentType:'application/json',body:JSON.stringify({error:{code:'read_only'}})});
            });
          }

          async function openMember(browser,route,viewport){
            const context=await browser.newContext({viewport});
            await installMember(context);
            await context.addInitScript(()=>localStorage.setItem('preferredLanguage','en'));
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            const res=await page.goto(BASE+route,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(900);
            assert(res && res.status()===200, route+' did not return 200');
            assert(new URL(page.url()).pathname.toLowerCase()===route.toLowerCase(), route+' redirected unexpectedly to '+page.url());
            assert(errors.length===0, route+' page errors: '+errors.join(' | '));
            return {context,page};
          }

          const browser=await chromium.launch({headless:true});
          try{
            for(const route of ['/WhatShouldTheyDo','/Games']){
              const {context,page}=await openMember(browser,route,{width:1366,height:900});
              const body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
              assert(body.includes('What Should They Do?'), route+' missing game title');
              assert(body.includes('150 recovered launch questions'), route+' missing 150-question marker');
              const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth);
              assert(overflow<=4, route+' desktop horizontal overflow '+overflow);
              await context.close();
            }

            const {context,page}=await openMember(browser,'/WhatShouldTheyDo',{width:390,height:844});
            let body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            assert(body.includes('What Should They Do?'),'mobile missing game title');

            await page.getByRole('button',{name:/Agree on healthy ways to provide reassurance/i}).click();
            await page.getByRole('button',{name:/Cast Your Vote/i}).click();
            await page.waitForTimeout(250);
            body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            assert(body.includes('The World Voted'),'world-results heading not restored');
            assert(body.includes('Worldwide'),'worldwide results label missing');

            await page.getByRole('button',{name:/US/}).click();
            await page.waitForTimeout(150);
            body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            assert(body.includes('By Country'),'country-results heading not restored');
            assert(body.includes('Country results appear after at least 5 votes in a country.'),'5-vote country threshold text missing');

            await page.getByRole('button',{name:/Another Question/i}).click();
            await page.waitForTimeout(150);
            const seeAll=page.getByRole('button',{name:/See All/i});
            assert(await seeAll.count()===1,'See All shortcut missing');
            await seeAll.click();
            await page.waitForTimeout(150);
            body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            assert(body.includes('Question Browser'),'question browser did not open');
            assert(body.includes('150 questions'),'question browser count missing');

            const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth);
            assert(overflow<=4,'mobile horizontal overflow '+overflow);
            await context.close();

            for (const route of ['/WhatShouldTheyDo','/Games']) {
              const basicContext=await browser.newContext({viewport:{width:390,height:844}});
              await installMember(basicContext,'Basic');
              await basicContext.addInitScript(()=>localStorage.setItem('preferredLanguage','en'));
              const basicPage=await basicContext.newPage();
              await basicPage.goto(BASE+route,{waitUntil:'domcontentloaded',timeout:30000});
              await basicPage.waitForTimeout(700);
              const u=new URL(basicPage.url());
              assert(u.pathname.toLowerCase()==='/subscription',route+' did not enforce Premier access for Basic member: '+basicPage.url());
              assert(u.searchParams.get('required')==='Premier',route+' did not identify Premier as required plan');
              await basicContext.close();
            }

            console.log('MIGRATED_GAMES_SMOKE=PASS');
          } finally {
            await browser.close();
          }
          NODE
