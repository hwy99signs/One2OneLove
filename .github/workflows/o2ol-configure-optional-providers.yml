name: Configure O2OL Optional Providers

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/o2ol-configure-optional-providers.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
    steps:
      - name: Configure optional production secrets when available
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@latest secret put OPENAI_API_KEY --name one2onelove-launch >/dev/null
            echo "OPENAI_API_KEY=COPIED"
          else
            echo "OPENAI_API_KEY=MISSING"
          fi

          if [ -n "${TWILIO_MESSAGING_SERVICE_SID:-}" ]; then
            printf '%s' "$TWILIO_MESSAGING_SERVICE_SID" | npx --yes wrangler@latest secret put TWILIO_MESSAGING_SERVICE_SID --name one2onelove-launch >/dev/null
            echo "TWILIO_MESSAGING_SERVICE_SID=COPIED"
          else
            echo "TWILIO_MESSAGING_SERVICE_SID=MISSING"
          fi

          if [ -n "${TWILIO_FROM_NUMBER:-}" ]; then
            printf '%s' "$TWILIO_FROM_NUMBER" | npx --yes wrangler@latest secret put TWILIO_FROM_NUMBER --name one2onelove-launch >/dev/null
            echo "TWILIO_FROM_NUMBER=COPIED"
          else
            echo "TWILIO_FROM_NUMBER=MISSING"
          fi

          echo "SCHEDULED_SMS_ENABLED remains unchanged."
