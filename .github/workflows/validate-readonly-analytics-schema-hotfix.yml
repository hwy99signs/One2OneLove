name: Validate Readonly Analytics Schema Hotfix

on:
  push:
    branches:
      - fix/admin-analytics-readonly-schema-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npx wrangler deploy --dry-run --config ../cloudflare/wrangler.production.jsonc
      - name: Verify request path is read-only
        run: |
          grep -q "Interaction analytics schema is not prepared" worker/feature-usage.ts
          grep -q "to_regclass('public.interaction_events')" worker/feature-usage.ts
          ! grep -q "ALTER TABLE public.interaction_events" worker/feature-usage.ts
          ! grep -q "CREATE TABLE IF NOT EXISTS public.interaction_events" worker/feature-usage.ts
