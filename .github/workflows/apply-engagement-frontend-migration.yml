name: Apply One2OneLove Engagement Frontend Migration

on:
  push:
    branches:
      - migration/neon-cloudflare-one2onelove-20260905
    paths:
      - "scripts/migrate-engagement-frontends.mjs"
      - ".github/workflows/apply-engagement-frontend-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cloudflare-one2onelove-20260905

      - name: Apply deterministic frontend migration
        run: node scripts/migrate-engagement-frontends.mjs

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Commit verified conversion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "migration: move engagement screens to Worker API"
          git push origin HEAD:migration/neon-cloudflare-one2onelove-20260905
