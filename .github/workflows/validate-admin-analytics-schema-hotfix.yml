name: Validate Admin Analytics Schema Hotfix

on:
  push:
    branches:
      - fix/admin-analytics-action-schema-hotfix-20261003

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npx wrangler deploy --dry-run --config ../cloudflare/wrangler.production.jsonc
      - name: Verify safe constraint migration
        run: |
          grep -q "pg_get_constraintdef" worker/feature-usage.ts
          grep -q "event_type IN ('click','page_view','action')" worker/feature-usage.ts
          ! grep -q "DO \\$" worker/feature-usage.ts
