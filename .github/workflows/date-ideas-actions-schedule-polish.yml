name: Date Ideas Actions Schedule Polish

on:
  push:
    branches:
      - date-ideas-actions-schedule
    paths:
      - .github/date-ideas-actions-schedule-polish-trigger

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: date-ideas-actions-schedule
          fetch-depth: 0
      - name: Apply count polish
        run: python scripts/fix_date_ideas_action_counts.py
      - name: Verify hidden state records stay out of custom list
        run: grep -q '{t.myCustomDates} ({customOnlyDates.length})' src/pages/DateIdeas.jsx
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit polish
        run: |
          git config user.name "hwy99signs"
          git config user.email "hwy99signs@gmail.com"
          git add src/pages/DateIdeas.jsx
          git commit -m "Keep built-in Date Ideas state out of custom count"
          git push origin HEAD:date-ideas-actions-schedule
