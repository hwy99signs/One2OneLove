<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One2One Love</title>
    <style>
      header > div[class*="max-w-7xl"] > div[class*="h-16"] {
        height: 6rem !important;
        min-height: 6rem !important;
      }
      header img[alt="One2One Love Logo"] {
        height: 2.5rem !important;
        width: auto !important;
        max-height: none !important;
        max-width: none !important;
        zoom: 1.75 !important;
      }
      header img[alt="One2One Love Logo"] + div {
        margin-left: -0.85rem !important;
      }
      header img[alt="One2One Love Logo"] + div > div {
        font-size: 0 !important;
        line-height: 1 !important;
        letter-spacing: 0 !important;
        white-space: nowrap !important;
      }
      header img[alt="One2One Love Logo"] + div > div::after {
        content: "One2One Love";
        font-size: 2.35rem !important;
        font-weight: 800 !important;
        line-height: 1 !important;
        letter-spacing: -0.055em !important;
        white-space: nowrap !important;
        color: white !important;
      }
      header a:has(> img[alt="One2One Love Logo"]) {
        gap: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const menuSelector = 'header > div[class*="max-w-7xl"] > div[class*="lg:hidden"][class*="overflow-y-auto"]';
        const toggleSelector = 'header button[class*="lg:hidden"]';
        const logoSelector = 'header img[alt="One2One Love Logo"]';
        let inactivityTimer = null;
        let observedMenu = null;

        const getMenu = () => document.querySelector(menuSelector);
        const getToggle = () => document.querySelector(toggleSelector);

        const applyHeaderBranding = () => {
          const logo = document.querySelector(logoSelector);
          if (!logo) return;

          logo.style.setProperty('height', '2.5rem', 'important');
          logo.style.setProperty('width', 'auto', 'important');
          logo.style.setProperty('max-height', 'none', 'important');
          logo.style.setProperty('max-width', 'none', 'important');
          logo.style.setProperty('zoom', '1.75', 'important');

          const headerRow = logo.closest('header')?.querySelector('div[class*="h-16"]');
          if (headerRow) {
            headerRow.style.setProperty('height', '6rem', 'important');
            headerRow.style.setProperty('min-height', '6rem', 'important');
          }

          const brandLink = logo.closest('a');
          if (brandLink) {
            brandLink.style.setProperty('gap', '0', 'important');
          }

          const brandWrapper = logo.nextElementSibling;
          if (brandWrapper) {
            brandWrapper.style.setProperty('margin-left', '-0.85rem', 'important');
          }

          const brandName = brandWrapper?.querySelector('div');
          if (brandName && brandName.textContent !== 'One2One Love') {
            brandName.textContent = 'One2One Love';
          }
        };

        const clearTimer = () => {
          if (inactivityTimer) {
            window.clearTimeout(inactivityTimer);
            inactivityTimer = null;
          }
        };

        const closeMenu = () => {
          const menu = getMenu();
          if (!menu) return;
          const toggle = getToggle();
          if (toggle) toggle.click();
          clearTimer();
        };

        const armTimer = () => {
          clearTimer();
          if (!getMenu()) return;
          inactivityTimer = window.setTimeout(closeMenu, 5000);
        };

        const syncMenuState = () => {
          applyHeaderBranding();
          const menu = getMenu();
          if (menu && menu !== observedMenu) {
            observedMenu = menu;
            armTimer();
          } else if (!menu) {
            observedMenu = null;
            clearTimer();
          }
        };

        document.addEventListener('pointerdown', (event) => {
          const menu = getMenu();
          if (!menu) return;
          const toggle = getToggle();

          if (menu.contains(event.target)) {
            armTimer();
            return;
          }

          if (toggle && toggle.contains(event.target)) {
            clearTimer();
            return;
          }

          closeMenu();
        }, true);

        document.addEventListener('keydown', (event) => {
          if (!getMenu()) return;
          if (event.key === 'Escape') {
            closeMenu();
          } else {
            armTimer();
          }
        });

        document.addEventListener('focusin', () => {
          if (getMenu()) armTimer();
        });

        window.addEventListener('DOMContentLoaded', () => {
          const observer = new MutationObserver(syncMenuState);
          observer.observe(document.body, { childList: true, characterData: true, subtree: true });
          applyHeaderBranding();
          syncMenuState();
        });
      })();
    </script>
  </body>
</html>
