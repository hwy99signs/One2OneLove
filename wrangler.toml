name = "one2onelove-launch"
main = "./worker/index-v2.ts"
compatibility_date = "2026-09-11"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true
preview_urls = true

# Preview Worker only. Production custom-domain routes remain isolated in
# cloudflare/wrangler.production.jsonc and are not attached by this config.

[build]
command = "npm --prefix worker install --no-audit --no-fund"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
NEON_AUTH_BASE_URL = "https://ep-shiny-truth-ar740o0s.neonauth.c-4.us-west-2.aws.neon.tech/one2onelove/auth"
STRIPE_PRICE_PREMIERE = "price_1UCYBNCoKDheG1ASmUs8STHT"
STRIPE_PRICE_EXCLUSIVE = "price_1UCYBUCoKDheG1ASN0Y58Ye5"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ef44564dbfca4e1bb13176ee568aaddf"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "one2onelove-media"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
