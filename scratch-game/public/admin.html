<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One2OneLove Game Analytics</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f8;color:#183047}.wrap{max-width:1100px;margin:0 auto;padding:24px}h1{color:#0a3f72}.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.metric b{font-size:28px;color:#0a3f72;display:block}.metric span{font-size:12px;color:#667684}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e9eef1;font-size:13px}button,a.btn{border:0;background:#0a3f72;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.keybox{max-width:500px;margin:90px auto}.keybox input{width:100%;box-sizing:border-box;margin:8px 0 12px;padding:13px;border:1px solid #cbd6dc;border-radius:12px;font-size:16px}.error{color:#b4232d;font-weight:700}.muted{color:#667684;font-size:13px}.bar{height:10px;background:#e8eef2;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#3a86c8}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="/admin.js"></script>
</body>
</html>
