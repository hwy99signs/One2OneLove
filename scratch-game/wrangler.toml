name = "one2onelove-scratch-game-launch-preview"
main = "./worker/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
[build]
command = "npm --prefix worker install --no-audit --no-fund"
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
