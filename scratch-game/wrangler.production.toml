name = "one2onelove-scratch-game"
main = "./worker/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[build]
command = "npm --prefix worker install --no-audit --no-fund"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ef44564dbfca4e1bb13176ee568aaddf"

[[routes]]
pattern = "play.one2onelove.com"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
